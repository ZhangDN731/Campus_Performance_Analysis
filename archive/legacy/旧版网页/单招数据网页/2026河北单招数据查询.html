<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年河北省高职单招数据查询系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e3a5f'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-weight='bold'>单</text></svg>">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#1e3a5f;--primary-light:#2d5a8e;--accent:#0891b2;--accent-light:#06b6d4;
  --bg:#f0f4f8;--card:#ffffff;--text:#1a202c;--text-secondary:#64748b;--border:#e2e8f0;
  --success:#059669;--warning:#d97706;--danger:#dc2626;--purple:#7c3aed;
}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 60%,var(--accent) 100%);color:#fff;padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);border-radius:50%}
.header h1{font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:6px;position:relative}
.header p{font-size:13px;opacity:0.85;position:relative}
.header .year-badge{display:inline-block;background:rgba(255,255,255,0.18);padding:4px 16px;border-radius:20px;font-size:12px;margin-bottom:10px;letter-spacing:3px;position:relative}
.container{max-width:1440px;margin:0 auto;padding:16px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:12px;padding:16px 12px;text-align:center;box-shadow:0 2px 12px rgba(30,58,95,0.06);border-top:3px solid var(--accent);transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-card:nth-child(2){border-top-color:var(--success)}
.stat-card:nth-child(3){border-top-color:var(--warning)}
.stat-card:nth-child(4){border-top-color:var(--purple)}
.stat-card:nth-child(5){border-top-color:var(--danger)}
.stat-card .num{font-size:24px;font-weight:800;color:var(--primary)}
.stat-card:nth-child(2) .num{color:var(--success)}
.stat-card:nth-child(3) .num{color:var(--warning)}
.stat-card:nth-child(4) .num{color:var(--purple)}
.stat-card:nth-child(5) .num{color:var(--danger)}
.stat-card .label{font-size:12px;color:var(--text-secondary);margin-top:4px;font-weight:500}
.controls{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px rgba(30,58,95,0.06)}
.cat-section{margin-bottom:14px}
.cat-label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
.cat-buttons{display:flex;flex-wrap:wrap;gap:6px}
.cat-btn{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;transition:all .2s;color:var(--text-secondary)}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(30,58,95,0.25)}
.type-tabs{display:flex;flex-wrap:wrap;gap:4px;background:#f1f5f9;padding:4px;border-radius:10px;margin-bottom:14px}
.type-tab{flex:1;min-width:80px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:all .2s;color:var(--text-secondary)}
.type-tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;transition:all .2s}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(8,145,178,0.1)}
.search-box::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:0.5}
.result-count{font-size:13px;color:var(--text-secondary);white-space:nowrap}
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:16px}
.table-panel{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(30,58,95,0.06)}
.table-wrapper{overflow-x:auto;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;background:#f8fafc;z-index:10}
th{padding:11px 10px;text-align:left;font-weight:700;color:var(--primary);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:12px;background:#f8fafc}
th:hover{background:#eef2f7}
th .sort-icon{font-size:10px;margin-left:4px;opacity:0.4}
th.sorted .sort-icon{opacity:1;color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
tr:nth-child(even){background:#fafbfc}
tr:nth-child(even):hover{background:#f1f5f9}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-public{background:#dcfce7;color:#15803d}
.badge-private{background:#fef3c7;color:#b45309}
.score-high{color:var(--danger);font-weight:700}
.score-mid{color:var(--warning);font-weight:700}
.score-low{color:var(--success);font-weight:700}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:14px;flex-wrap:wrap;background:#f8fafc;border-top:1px solid var(--border)}
.page-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:#fff;transition:all .2s;font-weight:500}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--primary);color:#fff;border-color:transparent}
.page-btn:disabled{opacity:0.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--text-secondary);margin:0 8px}
.chart-panel{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 2px 12px rgba(30,58,95,0.06);height:fit-content;position:sticky;top:16px}
.chart-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.chart-box{width:100%;height:280px;margin-bottom:14px}
.chart-box:last-child{margin-bottom:0}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.footer{text-align:center;padding:20px;color:var(--text-secondary);font-size:12px}
@media(max-width:1024px){.stats{grid-template-columns:repeat(3,1fr)}.main-grid{grid-template-columns:1fr}.chart-panel{position:static}}
@media(max-width:640px){.header h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.stat-card .num{font-size:18px}.type-tab{font-size:12px;padding:8px 4px;min-width:60px}th,td{padding:7px 6px;font-size:11px}}
</style>
</head>
<body>

<div class="header">
  <div class="year-badge">HEBEI DANZHAO · 2026</div>
  <h1>河北省高职单招数据查询系统</h1>
  <p>十大考试类别 · 分数线 · 招生计划 · 院校详情 · 一分一档 · 专业计划及学费</p>
</div>

<div class="container">
  <!-- 统计卡片 -->
  <div class="stats" id="statsBar"></div>

  <!-- 控制区 -->
  <div class="controls">
    <div class="cat-section">
      <div class="cat-label">选择考试类别</div>
      <div class="cat-buttons" id="catButtons"></div>
    </div>
    <div class="type-tabs" id="typeTabs">
      <div class="type-tab active" data-type="scoreLines">录取分数线</div>
      <div class="type-tab" data-type="plans">招生计划</div>
      <div class="type-tab" data-type="schools">院校详情</div>
      <div class="type-tab" data-type="yifenyidang">一分一档</div>
      <div class="type-tab" data-type="majors">专业计划及学费</div>
    </div>
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索院校名称、专业名称、地区...">
      </div>
      <div class="result-count" id="resultCount"></div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main-grid">
    <div class="table-panel">
      <div class="table-wrapper">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div class="chart-panel">
      <div class="chart-title" id="chartTitle">数据可视化</div>
      <div class="chart-box" id="chart1"></div>
      <div class="chart-box" id="chart2"></div>
    </div>
  </div>
</div>

<div class="footer">
  数据来源：河北省教育考试院 | 提取自河北单招网(hbdzxx.com) | 仅供参考，以官方公布为准
</div>

<script>
// ===== 全局状态 =====
const DATA = DANZHAO_DATA_2026;
let currentCat = '1';
let currentType = 'scoreLines';
let currentPage = 1;
let pageSize = 20;
let sortKey = null;
let sortAsc = true;
let searchText = '';
let chart1 = null, chart2 = null;

// 列配置
const COLUMNS = {
  scoreLines: [
    {key:'院校名称',label:'院校名称',width:''},
    {key:'专业名称',label:'专业名称',width:''},
    {key:'考试类',label:'考试类',width:''},
    {key:'录取投档分',label:'录取投档分',width:'',sortable:true},
  ],
  plans: [
    {key:'院校名称',label:'院校名称',width:''},
    {key:'专业名称',label:'专业名称',width:''},
    {key:'考试类',label:'考试类',width:''},
    {key:'计划数',label:'计划数',width:'',sortable:true},
    {key:'学制',label:'学制',width:''},
    {key:'学费(元/年)',label:'学费(元/年)',width:'',sortable:true},
  ],
  schools: [
    {key:'序号',label:'序号',width:'',sortable:true},
    {key:'院校名称',label:'院校名称',width:''},
    {key:'所在地区',label:'所在地区',width:''},
    {key:'办学性质',label:'办学性质',width:''},
  ],
  yifenyidang: [
    {key:'分数',label:'分数',width:'',sortable:true},
    {key:'本段人数',label:'本段人数',width:'',sortable:true},
    {key:'累计人数',label:'累计人数',width:'',sortable:true},
    {key:'累计占比',label:'累计占比',width:''},
  ],
  majors: [
    {key:'序号',label:'序号',width:'',sortable:true},
    {key:'院校名称',label:'院校名称',width:''},
    {key:'院校地址',label:'院校地址',width:''},
    {key:'专业名称',label:'专业名称',width:''},
    {key:'计划数',label:'计划数',width:'',sortable:true},
    {key:'学制',label:'学制',width:''},
    {key:'学费(元/年)',label:'学费(元/年)',width:'',sortable:true},
    {key:'2026投档最低分',label:'投档最低分',width:'',sortable:true},
  ],
};

// ===== 初始化 =====
function init(){
  renderCatButtons();
  bindEvents();
  updateAll();
}

function renderCatButtons(){
  const container = document.getElementById('catButtons');
  container.innerHTML = '';
  Object.values(DATA).forEach(cat => {
    const btn = document.createElement('div');
    btn.className = 'cat-btn' + (cat.id === currentCat ? ' active' : '');
    btn.textContent = cat.name;
    btn.dataset.id = cat.id;
    btn.onclick = () => { currentCat = cat.id; currentPage = 1; updateAll(); };
    container.appendChild(btn);
  });
}

function bindEvents(){
  document.querySelectorAll('.type-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentType = tab.dataset.type;
      currentPage = 1;
      sortKey = null;
      updateAll();
    };
  });
  document.getElementById('searchInput').addEventListener('input', e => {
    searchText = e.target.value.trim();
    currentPage = 1;
    renderTable();
  });
}

// ===== 更新全部 =====
function updateAll(){
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === currentCat);
  });
  renderStats();
  renderTable();
  renderCharts();
}

// ===== 统计卡片 =====
function renderStats(){
  const cat = DATA[currentCat];
  const totalSchools = cat.schools.length;
  const totalMajors = cat.plans.length;
  let totalPlan = 0;
  cat.plans.forEach(p => { const n = parseInt(p['计划数']); if(!isNaN(n)) totalPlan += n; });
  const scores = cat.scoreLines.map(s => parseInt(s['录取投档分'])).filter(n => !isNaN(n));
  const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const maxScore = scores.length ? Math.max(...scores) : 0;

  const stats = [
    {num: totalSchools, label:'招生院校'},
    {num: totalMajors, label:'招生专业'},
    {num: totalPlan.toLocaleString(), label:'计划总数'},
    {num: avgScore, label:'平均投档分'},
    {num: maxScore, label:'最高投档分'},
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`
  ).join('');
}

// ===== 获取过滤排序后的数据 =====
function getFilteredData(){
  const cat = DATA[currentCat];
  let data = [...cat[currentType]];
  // 搜索
  if(searchText){
    const keys = COLUMNS[currentType].map(c => c.key);
    data = data.filter(row => keys.some(k => String(row[k]||'').toLowerCase().includes(searchText.toLowerCase())));
  }
  // 排序
  if(sortKey){
    data.sort((a,b) => {
      let va = a[sortKey], vb = b[sortKey];
      const na = parseFloat(va), nb = parseFloat(vb);
      if(!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
      return sortAsc ? String(va).localeCompare(String(vb),'zh') : String(vb).localeCompare(String(va),'zh');
    });
  }
  return data;
}

// ===== 渲染表格 =====
function renderTable(){
  const cols = COLUMNS[currentType];
  const data = getFilteredData();
  const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const pageData = data.slice(start, start + pageSize);

  // 表头
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '<tr>' + cols.map(c => {
    const sorted = sortKey === c.key ? ' sorted' : '';
    const icon = sortKey === c.key ? (sortAsc ? '▲' : '▼') : '⇅';
    return `<th class="${sorted}" data-key="${c.key}">${c.label}<span class="sort-icon">${icon}</span></th>`;
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if(sortKey === key) sortAsc = !sortAsc;
      else { sortKey = key; sortAsc = true; }
      renderTable();
    };
  });

  // 表体
  const tbody = document.getElementById('tableBody');
  if(pageData.length === 0){
    tbody.innerHTML = `<tr><td colspan="${cols.length}" class="empty-state"><div class="icon">📋</div>暂无匹配数据</td></tr>`;
  } else {
    tbody.innerHTML = pageData.map(row => {
      return '<tr>' + cols.map(c => {
        let val = row[c.key] || '';
        // 特殊格式化
        if(c.key === '办学性质'){
          const cls = String(val).includes('公办') ? 'badge-public' : 'badge-private';
          val = `<span class="badge ${cls}">${val}</span>`;
        }
        if(c.key === '录取投档分' || c.key === '2026投档最低分'){
          const n = parseFloat(val);
          if(!isNaN(n)){
            const cat = DATA[currentCat];
            const scores = cat.scoreLines.map(s => parseFloat(s['录取投档分'])).filter(x=>!isNaN(x));
            const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
            const cls = n > avg * 1.15 ? 'score-high' : n > avg * 0.9 ? 'score-mid' : 'score-low';
            val = `<span class="${cls}">${val}</span>`;
          }
        }
        return `<td>${val}</td>`;
      }).join('') + '</tr>';
    }).join('');
  }

  // 结果计数
  document.getElementById('resultCount').textContent = `共 ${data.length} 条记录`;

  // 分页
  renderPagination(data.length, totalPages);
}

function renderPagination(total, totalPages){
  const container = document.getElementById('pagination');
  let html = `<span class="page-info">第 ${currentPage}/${totalPages} 页 · 共 ${total} 条</span>`;
  html += `<button class="page-btn" ${currentPage<=1?'disabled':''} onclick="goPage(1)">首页</button>`;
  html += `<button class="page-btn" ${currentPage<=1?'disabled':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  // 页码
  let startP = Math.max(1, currentPage - 2);
  let endP = Math.min(totalPages, startP + 4);
  if(endP - startP < 4) startP = Math.max(1, endP - 4);
  for(let i = startP; i <= endP; i++){
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" ${currentPage>=totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  html += `<button class="page-btn" ${currentPage>=totalPages?'disabled':''} onclick="goPage(${totalPages})">末页</button>`;
  container.innerHTML = html;
}

function goPage(p){ currentPage = p; renderTable(); }

// ===== 图表 =====
function renderCharts(){
  if(!chart1) chart1 = echarts.init(document.getElementById('chart1'));
  if(!chart2) chart2 = echarts.init(document.getElementById('chart2'));
  const cat = DATA[currentCat];

  if(currentType === 'scoreLines'){
    // 分数线分布直方图
    const scores = cat.scoreLines.map(s => parseInt(s['录取投档分'])).filter(n=>!isNaN(n));
    const min = Math.min(...scores), max = Math.max(...scores);
    const binSize = Math.ceil((max - min) / 12);
    const bins = {}, labels = [];
    for(let i = min; i <= max; i += binSize){
      const label = `${i}-${Math.min(i+binSize-1, max)}`;
      labels.push(label);
      bins[label] = 0;
    }
    scores.forEach(s => {
      const idx = Math.min(Math.floor((s - min) / binSize), labels.length - 1);
      bins[labels[idx]]++;
    });
    chart1.setOption({
      title:{text:'投档分数分布',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis'},
      grid:{left:40,right:20,top:40,bottom:30},
      xAxis:{type:'category',data:labels,axisLabel:{fontSize:10,rotate:30}},
      yAxis:{type:'value',name:'专业数'},
      series:[{type:'bar',data:labels.map(l=>bins[l]),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#0891b2'},{offset:1,color:'#06b6d4'}]),borderRadius:[4,4,0,0]}}]
    }, true);
    // 院校投档分TOP10
    const schoolScores = {};
    cat.scoreLines.forEach(s => {
      const n = parseInt(s['录取投档分']);
      if(!isNaN(n)){
        if(!schoolScores[s['院校名称']]) schoolScores[s['院校名称']] = [];
        schoolScores[s['院校名称']].push(n);
      }
    });
    const topSchools = Object.entries(schoolScores).map(([name, arr]) => ({name, avg: arr.reduce((a,b)=>a+b,0)/arr.length, max: Math.max(...arr)})).sort((a,b)=>b.avg-a.avg).slice(0,10);
    chart2.setOption({
      title:{text:'院校平均投档分 TOP10',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis'},
      grid:{left:100,right:20,top:40,bottom:20},
      xAxis:{type:'value'},
      yAxis:{type:'category',data:topSchools.map(s=>s.name).reverse(),axisLabel:{fontSize:10}},
      series:[{type:'bar',data:topSchools.map(s=>Math.round(s.avg)).reverse(),itemStyle:{color:'#1e3a5f',borderRadius:[0,4,4,0]},label:{show:true,position:'right',fontSize:10}}]
    }, true);

  } else if(currentType === 'plans'){
    // 招生计划院校TOP10
    const schoolPlans = {};
    cat.plans.forEach(p => {
      const n = parseInt(p['计划数']);
      if(!isNaN(n)) schoolPlans[p['院校名称']] = (schoolPlans[p['院校名称']]||0) + n;
    });
    const top10 = Object.entries(schoolPlans).sort((a,b)=>b[1]-a[1]).slice(0,10);
    chart1.setOption({
      title:{text:'院校招生计划 TOP10',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis'},
      grid:{left:100,right:20,top:40,bottom:20},
      xAxis:{type:'value'},
      yAxis:{type:'category',data:top10.map(s=>s[0]).reverse(),axisLabel:{fontSize:10}},
      series:[{type:'bar',data:top10.map(s=>s[1]).reverse(),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#059669'},{offset:1,color:'#10b981'}]),borderRadius:[0,4,4,0]},label:{show:true,position:'right',fontSize:10}}]
    }, true);
    // 学费分布
    const fees = cat.plans.map(p => parseInt(p['学费(元/年)'])).filter(n=>!isNaN(n) && n > 0);
    const feeRanges = {'5000以下':0,'5000-8000':0,'8000-12000':0,'12000-18000':0,'18000以上':0};
    fees.forEach(f => {
      if(f < 5000) feeRanges['5000以下']++;
      else if(f < 8000) feeRanges['5000-8000']++;
      else if(f < 12000) feeRanges['8000-12000']++;
      else if(f < 18000) feeRanges['12000-18000']++;
      else feeRanges['18000以上']++;
    });
    chart2.setOption({
      title:{text:'学费区间分布',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'item',formatter:'{b}: {c}个专业 ({d}%)'},
      legend:{bottom:0,textStyle:{fontSize:10}},
      series:[{type:'pie',radius:['35%','65%'],center:['50%','45%'],data:Object.entries(feeRanges).map(([name,value])=>({name,value})),itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2},label:{fontSize:10}}]
    }, true);

  } else if(currentType === 'schools'){
    // 地区分布
    const regionCount = {};
    cat.schools.forEach(s => { regionCount[s['所在地区']] = (regionCount[s['所在地区']]||0) + 1; });
    const regions = Object.entries(regionCount).sort((a,b)=>b[1]-a[1]);
    chart1.setOption({
      title:{text:'院校地区分布',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'item',formatter:'{b}: {c}所 ({d}%)'},
      legend:{bottom:0,textStyle:{fontSize:10},type:'scroll'},
      series:[{type:'pie',radius:['35%','65%'],center:['50%','45%'],data:regions.map(([name,value])=>({name,value})),itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2},label:{fontSize:10}}]
    }, true);
    // 公办民办占比
    const natureCount = {};
    cat.schools.forEach(s => { natureCount[s['办学性质']] = (natureCount[s['办学性质']]||0) + 1; });
    chart2.setOption({
      title:{text:'办学性质占比',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'item',formatter:'{b}: {c}所 ({d}%)'},
      legend:{bottom:0,textStyle:{fontSize:10}},
      series:[{type:'pie',radius:['40%','70%'],center:['50%','45%'],data:Object.entries(natureCount).map(([name,value])=>({name,value,itemStyle:{color:name.includes('公办')?'#059669':'#d97706'}})),label:{fontSize:11,formatter:'{b}\n{c}所'}}]
    }, true);

  } else if(currentType === 'yifenyidang'){
    // 累计人数曲线
    const yfyd = cat.yifenyidang;
    const xData = yfyd.map(d => String(d['分数'])).reverse();
    const cumData = yfyd.map(d => parseInt(d['累计人数'])).reverse();
    const segData = yfyd.map(d => parseInt(d['本段人数'])).reverse();
    chart1.setOption({
      title:{text:'一分一档 · 累计人数曲线',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis'},
      grid:{left:50,right:20,top:40,bottom:40},
      xAxis:{type:'category',data:xData,axisLabel:{fontSize:9,interval:Math.floor(xData.length/10)}},
      yAxis:{type:'value',name:'累计人数'},
      dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:5}],
      series:[{type:'line',data:cumData,smooth:true,areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(8,145,178,0.4)'},{offset:1,color:'rgba(8,145,178,0.05)'}])},lineStyle:{color:'#0891b2',width:2},symbol:'none'}]
    }, true);
    // 本段人数分布
    chart2.setOption({
      title:{text:'一分一档 · 本段人数分布',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis'},
      grid:{left:50,right:20,top:40,bottom:40},
      xAxis:{type:'category',data:xData,axisLabel:{fontSize:9,interval:Math.floor(xData.length/10)}},
      yAxis:{type:'value',name:'本段人数'},
      dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:5}],
      series:[{type:'bar',data:segData,itemStyle:{color:'#7c3aed'},barWidth:'60%'}]
    }, true);

  } else if(currentType === 'majors'){
    // 专业计划数TOP10
    const majorPlans = cat.majors.map(m => ({name:m['专业名称'], plan:parseInt(m['计划数'])||0, school:m['院校名称']})).filter(m=>m.plan>0).sort((a,b)=>b.plan-a.plan).slice(0,10);
    chart1.setOption({
      title:{text:'专业招生计划 TOP10',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{trigger:'axis',formatter:p => `${p[0].name}<br/>计划数: ${p[0].value}`},
      grid:{left:120,right:20,top:40,bottom:20},
      xAxis:{type:'value'},
      yAxis:{type:'category',data:majorPlans.map(m=>m.name.length>12?m.name.slice(0,12)+'…':m.name).reverse(),axisLabel:{fontSize:9}},
      series:[{type:'bar',data:majorPlans.map(m=>m.plan).reverse(),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#7c3aed'},{offset:1,color:'#a78bfa'}]),borderRadius:[0,4,4,0]},label:{show:true,position:'right',fontSize:10}}]
    }, true);
    // 投档分vs计划数散点
    const scatterData = cat.majors.filter(m => {
      const s = parseFloat(m['2026投档最低分']);
      const p = parseInt(m['计划数']);
      return !isNaN(s) && !isNaN(p) && p > 0;
    }).map(m => [parseFloat(m['2026投档最低分']), parseInt(m['计划数']), m['院校名称'], m['专业名称']]);
    chart2.setOption({
      title:{text:'投档分 vs 计划数 分布',left:'center',textStyle:{fontSize:13,color:'#1e3a5f'}},
      tooltip:{formatter:p => `${p.data[2]} - ${p.data[3]}<br/>投档分: ${p.data[0]}<br/>计划数: ${p.data[1]}`},
      grid:{left:50,right:20,top:40,bottom:30},
      xAxis:{type:'value',name:'投档分',nameLocation:'middle',nameGap:25},
      yAxis:{type:'value',name:'计划数'},
      series:[{type:'scatter',data:scatterData,symbolSize:8,itemStyle:{color:'rgba(220,38,38,0.6)',borderColor:'#dc2626',borderWidth:1}}]
    }, true);
  }
}

window.addEventListener('resize', () => { chart1 && chart1.resize(); chart2 && chart2.resize(); });
init();
</script>
</body>
</html>
