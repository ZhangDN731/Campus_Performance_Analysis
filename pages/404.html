<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>页面未找到 · 河北尚学单招校区成绩分析</title>
<meta name="description" content="页面未找到或数据加载失败，返回首页选择其他校区。">
<style>
:root{
  --primary:#4f46e5;--primary-dark:#4338ca;--primary-darker:#3730a3;
  --accent:#06b6d4;--accent-dark:#0891b2;
  --text-main:#0f172a;--text-sub:#334155;--text-muted:#64748b;
  --warn:#d97706;--danger:#dc2626;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  --stroke:rgba(255,255,255,.72);
  --stroke-soft:rgba(15,23,42,.07);
  --shadow-s:0 2px 10px rgba(15,23,42,.05);
  --shadow-m:0 8px 30px rgba(15,23,42,.08);
  --shadow-l:0 18px 50px rgba(15,23,42,.12);
  --radius:20px;--radius-s:14px;
  --blur:saturate(180%) blur(20px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-main);background:#eef2f9;line-height:1.6;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% 8%, rgba(99,102,241,.20), transparent 62%),
    radial-gradient(820px 560px at 88% 12%, rgba(6,182,212,.18), transparent 60%),
    radial-gradient(760px 700px at 70% 92%, rgba(168,85,247,.14), transparent 62%),
    radial-gradient(700px 520px at 20% 88%, rgba(59,130,246,.14), transparent 60%),
    linear-gradient(160deg,#f4f7fd 0%,#eaeff8 45%,#f2f5fb 100%);
  background-attachment:fixed;
}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.34}

.stage{
  position:relative;z-index:1;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2vh,18px);
  padding:clamp(20px,4vh,40px) clamp(16px,4vw,32px);
}
.content{
  width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:clamp(10px,1.8vh,16px);
}

/* 品牌 */
.brand{
  display:inline-flex;align-items:center;gap:9px;
  padding:6px 16px 6px 12px;border-radius:99px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--shadow-s);
  font-size:.72rem;font-weight:800;letter-spacing:1.6px;color:var(--primary-dark);
  white-space:nowrap;
}
.brand .dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);flex:0 0 auto;animation:pulse 1.9s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.72)}}

/* 404 */
.code{
  position:relative;font-size:clamp(4rem,13vw,7.5rem);font-weight:800;line-height:.9;
  letter-spacing:-.05em;user-select:none;white-space:nowrap;
  background:linear-gradient(160deg,var(--primary) 0%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(79,70,229,.20));
}

h1{font-size:clamp(1rem,2.6vw,1.3rem);font-weight:800;letter-spacing:-.3px;color:var(--text-main);line-height:1.35}
.desc{font-size:clamp(.8rem,1.5vw,.88rem);line-height:1.85;color:var(--text-sub);max-width:440px}
.desc b{color:var(--primary-darker);font-weight:800}

/* 原因卡片 */
.reasons{
  width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.reason{
  padding:10px 8px;border-radius:10px;background:var(--glass-strong);
  border:1px solid var(--stroke-soft);box-shadow:var(--shadow-s);
}
.reason .icon{font-size:18px;margin-bottom:4px}
.reason .label{font-size:.68rem;font-weight:700;color:var(--text-sub);line-height:1.3}

/* 可用校区 */
.alts-title{
  font-size:.72rem;font-weight:800;letter-spacing:1.2px;color:var(--text-muted);
  text-transform:uppercase;margin-top:4px;
}
.alts{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.alt{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--radius-s);
  text-decoration:none;color:inherit;text-align:left;
  background:var(--glass-strong);border:1px solid var(--stroke-soft);box-shadow:var(--shadow-s);
  transition:transform .22s,box-shadow .22s,border-color .22s;min-width:0;
}
.alt:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:rgba(79,70,229,.30)}
.alt i{
  font-style:normal;width:32px;height:32px;flex:0 0 auto;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(6,182,212,.14));
  border:1px solid var(--stroke);
}
.alt-t{min-width:0}
.alt-n{font-size:.84rem;font-weight:800;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt-s{font-size:.64rem;font-weight:700;letter-spacing:.6px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 按钮 */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 22px;border-radius:12px;
  font-size:.86rem;font-weight:800;letter-spacing:.3px;
  cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap;
  border:1px solid transparent;transition:all .22s cubic-bezier(.4,0,.2,1);
}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,#6366f1,#4338ca);
  box-shadow:0 6px 20px rgba(79,70,229,.30);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(79,70,229,.40)}
.btn-ghost{
  color:var(--text-sub);background:var(--glass-strong);
  border-color:var(--stroke-soft);box-shadow:var(--shadow-s);
}
.btn-ghost:hover{transform:translateY(-2px);color:var(--primary-dark);border-color:rgba(79,70,229,.32);background:#fff}

/* 页脚 */
.foot{
  font-size:clamp(.6rem,1.1vw,.68rem);letter-spacing:1px;color:var(--text-muted);
  text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;font-weight:600;margin-top:8px;
}
.foot b{color:var(--text-sub);font-weight:800}

@media (max-width:520px){
  .alts{grid-template-columns:1fr}
  .reasons{grid-template-columns:1fr}
}
@media (max-height:600px){
  .stage{gap:8px}
  .code{font-size:clamp(3rem,10vw,5rem)}
  .reasons{display:none}
}
@media (hover:none){#particles{opacity:.2}}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="stage">
  <div class="content">

    <div class="brand">
      <span class="dot"></span>
      河北尚学单招 · 成绩分析
    </div>

    <div class="code">404</div>

    <h1>页面未找到或数据加载失败</h1>

    <p class="desc">
      可能是<b>校区尚未启用</b>、<b>成绩文件未上传</b>，或<b>网络超时</b>导致数据无法加载。
      请选择下方已启用的校区，或返回首页。
    </p>

    <div class="reasons">
      <div class="reason">
        <div class="icon">🏫</div>
        <div class="label">校区未启用</div>
      </div>
      <div class="reason">
        <div class="icon">📁</div>
        <div class="label">文件未上传</div>
      </div>
      <div class="reason">
        <div class="icon">📶</div>
        <div class="label">网络超时</div>
      </div>
    </div>

    <div class="alts-title">选择已启用校区</div>
    <div class="alts">
      <a href="龙泉校区.html" class="alt">
        <i>🏫</i>
        <span class="alt-t">
          <span class="alt-n">龙泉校区</span>
          <span class="alt-s">LONGQUAN · 数据已就绪</span>
        </span>
      </a>
      <a href="星耀校区.html" class="alt">
        <i>🏫</i>
        <span class="alt-t">
          <span class="alt-n">星耀校区</span>
          <span class="alt-s">XINGYAO · 数据已就绪</span>
        </span>
      </a>
      <a href="睿智校区.html" class="alt">
        <i>🏫</i>
        <span class="alt-t">
          <span class="alt-n">睿智校区</span>
          <span class="alt-s">RUIZHI · 数据已就绪</span>
        </span>
      </a>
      <a href="通用成绩分析.html" class="alt">
        <i>📊</i>
        <span class="alt-t">
          <span class="alt-n">通用分析</span>
          <span class="alt-s">GENERIC · 手动上传</span>
        </span>
      </a>
    </div>

    <div class="actions">
      <a href="../index.html" class="btn btn-primary">&larr; 返回首页</a>
      <a href="javascript:location.reload()" class="btn btn-ghost">刷新重试</a>
    </div>

  </div>

  <div class="foot">制作者：<b>ZhangD!n@mnmnmnmnm</b> · 成绩数据仅在浏览器本地解析，不上传服务器</div>
</div>

<script>
/* 轻量粒子背景 */
(function(){
  const canvas=document.getElementById('particles');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  if(!ctx)return;
  let w=0,h=0,dpr=Math.min(window.devicePixelRatio||1,2),ps=[],raf=null;
  function build(){
    w=canvas.width=window.innerWidth*dpr;
    h=canvas.height=window.innerHeight*dpr;
    canvas.style.width=window.innerWidth+'px';
    canvas.style.height=window.innerHeight+'px';
    const count=Math.min(Math.floor(window.innerWidth*window.innerHeight/22000),50);
    ps=[];
    for(let i=0;i<count;i++){
      ps.push({
        x:Math.random()*w,y:Math.random()*h,
        r:(Math.random()*1.7+0.5)*dpr,
        vx:(Math.random()-0.5)*0.28*dpr,
        vy:(Math.random()-0.5)*0.28*dpr,
        a:Math.random()*0.3+0.1,
        hue:Math.random()<0.6?230:190,
        ph:Math.random()*Math.PI*2
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const p of ps){
      p.ph+=0.012;
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;
      if(p.y<0||p.y>h)p.vy*=-1;
      const a=p.a*(0.65+Math.sin(p.ph)*0.35);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',80%,60%,'+a+')';
      ctx.fill();
    }
    raf=requestAnimationFrame(draw);
  }
  let t=null;
  window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(build,180);});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null;}
    else if(!raf)draw();
  });
  build();draw();
})();
</script>
</body>
</html>
