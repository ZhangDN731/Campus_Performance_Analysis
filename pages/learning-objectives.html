<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>学习目标 · 成绩与目标院校查询</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/learning-objectives.css">
</head>
<body>

  <!-- ===== 粒子背景 ===== -->
  <canvas id="particleCanvas"></canvas>

  <!-- ===== 窄屏竖屏提示（3 秒自动消失） ===== -->
  <div id="rotateTip" class="rotate-tip" role="status">
    <span class="rt-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8h13a3 3 0 013 3v5a3 3 0 01-3 3H8a3 3 0 01-3-3V8z"/>
        <path d="M16 4l3 3-3 3"/>
      </svg>
    </span>
    <div class="rt-text"><b>竖屏显示效果不佳</b><span>建议使用电脑等大屏设备，或横屏手机使用</span></div>
  </div>

  <!-- ===== 顶部导航 ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l7-3.82z"/></svg>
        </span>
        <span>学习目标 · 成绩查询平台
          <small>2027 届单招 · 默认龙泉校区</small>
        </span>
      </div>
      <div class="topbar-actions" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <a class="btn sm gray" href="../index.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m6 7l-7-7 7-7"/></svg>
          首页
        </a>
        <a class="btn sm light" href="../assets/templates/目标院校填写模板.xlsx" download>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          目标模板
        </a>
        <button class="btn sm" id="btnDataTop" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          数据管理
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ===== 筛选与数据管理 ===== -->
    <section class="card filter-card">
      <div class="filter-head">
        <div class="data-status" id="dataStatus">正在加载数据…</div>
        <div class="filter-actions">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="edSearch" placeholder="输入姓名快速定位…">
          </div>
        </div>
      </div>

      <!-- 数据管理（默认收起，供教师使用） -->
      <div id="dataPanel" class="data-panel" style="display:none">
        <div class="grid grid-2">
          <div>
            <label class="upload-zone" for="fileGrades">
              <span class="uz-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
              </span>
              <span class="uz-body">
                <span class="uz-title">上传 / 替换成绩表（xlsx）</span>
                <span class="uz-meta" id="metaGrades">正在加载…</span>
              </span>
              <input type="file" id="fileGrades" accept=".xlsx,.xls">
            </label>
            <div class="uz-actions">
              <button class="btn sm gray" id="btnResetGrades" type="button">恢复内置默认成绩</button>
            </div>
          </div>
          <div>
            <label class="upload-zone" for="fileTargets">
              <span class="uz-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
              </span>
              <span class="uz-body">
                <span class="uz-title">上传 / 替换目标院校表（xlsx）</span>
                <span class="uz-meta" id="metaTargets">尚未上传</span>
              </span>
              <input type="file" id="fileTargets" accept=".xlsx,.xls">
            </label>
            <div class="uz-actions">
              <button class="btn sm danger-ghost" id="btnClearTargets" type="button">清除目标院校数据</button>
            </div>
          </div>
        </div>
        <div class="panel-note">学生无需上传：选择班级、考试后，点击表格中的姓名即可查看个人情况。</div>
      </div>

      <!-- 班级选择 -->
      <div class="chip-row">
        <span class="chip-label">选择班级</span>
        <div class="chips" id="classChips"></div>
      </div>
      <!-- 考试选择 -->
      <div class="chip-row">
        <span class="chip-label">选择考试</span>
        <div class="chips" id="examChips"></div>
      </div>
    </section>

    <!-- ===== 统计条 ===== -->
    <div class="stat-bar" id="statBar"></div>

    <!-- ===== 班级总览表 ===== -->
    <div class="card table-card">
      <div class="card-title">
        <span class="bar"></span>全班成绩总览
        <span class="tag"><span class="badge indigo">点击姓名可查看个人详情</span></span>
      </div>
      <div class="table-wrap" id="tableWrap"></div>
      <div class="empty-state" id="emptyTip" style="display:none">
        <div class="es-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
        </div>
        <h3>暂无成绩数据</h3>
        <p>请由老师通过“数据管理”上传成绩表</p>
      </div>
    </div>

  </main>

  <footer class="footer">
    学习目标成绩查询平台 · 数据仅保存在本机浏览器中，不会上传至服务器
  </footer>

  <!-- ===== 学生详情弹窗 ===== -->
  <div class="modal-mask" id="studentMask">
    <div class="modal student-modal" id="studentModal"></div>
  </div>

  <!-- 依赖：SheetJS（解析 xlsx）、招生数据与各模块脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../assets/data/data_2026.js"></script>
  <script>window.DANZHAO_DATA_2026 = DANZHAO_DATA_2026;</script>
  <script src="../assets/js/default-grades.js"></script>
  <script src="../assets/js/particles.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/data-store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/learning-app.js"></script>
</body>
</html>
