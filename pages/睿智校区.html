};
/* ==========================================================================
 * F10 座位表：上传 Word 座位表 → 识别姓名 → 把本科目本次成绩写到姓名下方 → 导出 docx
 * 思路：不做图像识别，直接解压 docx 读 word/document.xml，用名册做精确姓名比对，
 *      只在命中姓名的段落后面插入一行小字成绩，其它版式、图片、字体全部原样保留。
 * ========================================================================== */
const SEAT_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const SEAT_MC = 'http://schemas.openxmlformats.org/markup-compatibility/2006';
const seatState = {
  fileName: '', parts: null, docXml: '', xmlDecl: '', docRoot: null,
  cls: '', sub: '', exam: '', ready: false, guess: '', error: '',
  entries: [], unmatched: [], matchedNames: [], noSeat: [], manual: {}, notes: [],
  dup: 0, ambiguous: [], clsEdit: false, detail: 'brief'
};

function seatNorm(s) {
  return String(s == null ? '' : s)
    .replace(/[（(【\[][^）)】\]]*[）)】\]]/g, '')
    .replace(/[\s\u3000\u00a0]/g, '')
    .replace(/[，,。.、：:；;（）()【】\[\]]/g, '');
}
/* 姓名可能带序号、括号备注、尾随数字：给出几种候选写法，按名册精确比对 */
function seatCandidates(text) {
  const out = [];
  const push = function (s) {
    const v = seatNorm(s);
    if (v && out.indexOf(v) < 0) out.push(v);
  };
  push(text);
  push(String(text).replace(/[（(【\[][^）)】\]]*[）)】\]]/g, ''));
  push(String(text).replace(/^[0-9零一二三四五六七八九十]+[、.．,，:：)）]?/, ''));
  push(String(text).replace(/[0-9]+$/, ''));
  return out;
}
function seatCnDigits(s) {
  const d = '零一二三四五六七八九';
  return String(s).replace(/\d+/g, function (m) {
    let n = parseInt(m, 10);
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  });
}
/* 班级名可能写成「9类2」「九类二」「九类2」，统一给出几种写法 */
function seatClassVariants(cls) {
  const s = String(cls);
  return [s, s.replace(/类/g, '类'), seatCnDigits(s), s.replace(/(\d)/g, function (m) { return seatCnDigits(m); })];
}
function seatAllText(root) {
  const ts = root.getElementsByTagNameNS(SEAT_W, 't');
  let t = '';
  for (let i = 0; i < ts.length; i++) t += (ts[i].textContent || '');
  return seatNorm(t);
}
function seatInFallback(node) {
  let p = node.parentNode;
  while (p) {
    if (p.localName === 'Fallback' && p.namespaceURI === SEAT_MC) return true;
    p = p.parentNode;
  }
  return false;
}
/* 文档里所有有文字的段落（跳过 mc:Fallback，避免同一内容重复一次） */
function seatParagraphs(root) {
  const out = [];
  const ps = root.getElementsByTagNameNS(SEAT_W, 'p');
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (seatInFallback(p)) continue;
    const ts = p.getElementsByTagNameNS(SEAT_W, 't');
    let text = '';
    for (let j = 0; j < ts.length; j++) text += (ts[j].textContent || '');
    text = seatNorm(text);
    if (text) out.push({ node: p, text: text });
  }
  return out;
}
function seatRoster(cls) {
  const c = state.classes && state.classes[cls];
  return c && c.students ? Object.keys(c.students) : [];
}
function seatScoreOf(cls, name, exam, sub) {
  const c = state.classes && state.classes[cls];
  const stu = c && c.students ? c.students[name] : null;
  const v = stu && stu[exam] ? stu[exam][sub] : null;
  return (typeof v === 'number' && !isNaN(v)) ? v : null;
}
function seatNumText(v) {
  if (v == null) return '';
  return String(Math.round(Number(v) * 100) / 100);
}
/* 上一次考试：取考试列表里当前考试的前一个，没有就是空 */
function seatPrevExam(exam) {
  const i = state.examList.indexOf(exam);
  return i > 0 ? state.examList[i - 1] : '';
}
/* 单科班内排名：同分并列（1、2、2、4），只算本次考试本科目有分数的人 */
function seatRankOf(cls, name, exam, sub) {
  const mine = seatScoreOf(cls, name, exam, sub);
  if (mine == null) return null;
  let better = 0;
  seatRoster(cls).forEach(function (n) {
    const v = seatScoreOf(cls, n, exam, sub);
    if (v != null && v > mine) better++;
  });
  return better + 1;
}
/* 写在姓名下面的那一行：本次成绩(本次排名)-上次成绩+变化
   简洁模式只写「本次成绩+增减」，去掉排名括号、箭头前留空，格子不挤 */
function seatScoreParts(cls, name, exam, sub) {
  const cur = seatScoreOf(cls, name, exam, sub);
  const rank = seatRankOf(cls, name, exam, sub);
  const prevExam = seatPrevExam(exam);
  const prev = prevExam ? seatScoreOf(cls, name, prevExam, sub) : null;
  const curTxt = cur == null ? '缺考' : seatNumText(cur);
  const prevTxt = prev == null ? '—' : seatNumText(prev);
  const fullMain = curTxt + '(' + (rank == null ? '—' : String(rank)) + ')-' + prevTxt;
  const briefMain = curTxt;
  const rankTxt = rank == null ? '' : String(rank);
  let chg = '', delta = null, up = false;
  if (cur != null && prev != null) {
    delta = Math.round((cur - prev) * 100) / 100;
    up = delta > 0;
    chg = delta === 0 ? '持平' : (up ? '↑' : '↓') + seatNumText(Math.abs(delta));
  }
  return { main: seatState.detail === 'full' ? fullMain : briefMain, fullMain: fullMain, briefMain: briefMain, rankTxt: rankTxt, chg: chg, delta: delta, up: up };
}
function seatScoreLine(cls, name, exam, sub) {
  const p = seatScoreParts(cls, name, exam, sub);
  return p.chg ? p.main + p.chg : p.main;
}
/* 段落里可能挤着多个姓名（同桌两人一个格子）：按名册姓名从长到短找 */
function seatFindNames(text, map) {
  const keys = Object.keys(map).sort(function (a, b) { return b.length - a.length; });
  const found = [];
  let rest = text;
  keys.forEach(function (k) {
    if (!k) return;
    while (rest.indexOf(k) >= 0) {
      if (found.indexOf(map[k]) < 0) found.push(map[k]);
      rest = rest.replace(k, '|');
    }
  });
  return found;
}
/* 未匹配姓名给一个「同音/差一字」建议，只提示不自动采用 */
function seatSuggest(text, names) {
  let best = '', bestD = 99;
  names.forEach(function (n) {
    const a = text, b = n;
    if (Math.abs(a.length - b.length) > 1) return;
    let d = 0;
    const la = a.length, lb = b.length;
    if (la === lb) {
      for (let i = 0; i < la; i++) if (a[i] !== b[i]) d++;
    } else d = 2;
    if (d < bestD) { bestD = d; best = n; }
  });
  return bestD <= 1 ? best : '';
}
/* 判断这份座位表是哪一班：先看文档里的「班级：九类二」，再看哪个班名册命中最多
   候选班优先取当前登录人本科目的班级，再兜底全部班；命中差距太小就报歧义让人确认 */
function seatDetect(root) {
  const paras = seatParagraphs(root);
  const mine = (window.Auth && Auth.myClasses && Auth.myClasses()) ? Auth.myClasses() : [];
  const cands = mine.length ? mine.slice() : state.classList.slice();
  mine.forEach(function (c) { if (cands.indexOf(c) < 0) cands.unshift(c); });
  const allText = seatAllText(root);
  let labelCls = '';
  cands.forEach(function (c) {
    if (labelCls) return;
    if (seatClassVariants(c).some(function (v) { return allText.indexOf(seatNorm(v)) >= 0; })) labelCls = c;
  });
  const ranked = cands.map(function (c) {
    const map = {};
    seatRoster(c).forEach(function (n) { map[seatNorm(n)] = n; });
    const hitSet = {}, scored = {};
    paras.forEach(function (p) {
      const ca = seatCandidates(p.text);
      for (let i = 0; i < ca.length; i++) {
        if (map[ca[i]]) {
          hitSet[map[ca[i]]] = 1;
          if (seatScoreOf(c, map[ca[i]], seatState.exam, seatState.sub) != null) scored[map[ca[i]]] = 1;
          break;
        }
      }
    });
    return {
      cls: c, map: map,
      hits: Object.keys(hitSet).length,
      scored: Object.keys(scored).length,
      roster: Object.keys(map).length,
      mine: mine.indexOf(c) >= 0
    };
  }).sort(function (a, b) {
    return (b.hits - a.hits) || (b.scored - a.scored) || ((b.mine ? 1 : 0) - (a.mine ? 1 : 0));
  });
  const top = ranked[0] || { cls: '', map: {}, hits: 0, roster: 0 };
  let cls = top.cls, how = '按名册比对';
  if (labelCls) { cls = labelCls; how = '按文档里的班级标注'; }
  /* 命中太少就不算认出来了，宁可报错也不乱写 */
  const minHit = Math.min(6, Math.max(2, Math.round((top.roster || 0) * 0.15)));
  if (!labelCls && top.hits < minHit) { cls = ''; how = ''; }
  let ambiguous = [];
  if (!labelCls && cls && top.hits > 0) {
    const second = ranked[1];
    if (second && second.hits >= top.hits - 1) ambiguous = [top.cls, second.cls];
  }
  return { cls: cls, how: how, top: top, ranked: ranked, ambiguous: ambiguous, minHit: minHit };
}
/* 根据文档 + 班级，扫描出「姓名段落」/未匹配姓名/无座位学生（不改动状态，导出时也用它） */
function seatScan(root, cls) {
  const entries = [], unmatched = [], matched = [], noSeat = [], seen = {};
  let dup = 0;
  const map = {};
  seatRoster(cls).forEach(function (n) { map[seatNorm(n)] = n; });
  const paras = seatParagraphs(root);

  /* 第一遍：整段就是一个人名（最常见的格子版式），先占位；
     第二遍再处理「一个格子里挤两个名字」，避免重叠文本框的粘连段先抢走人名 */
  for (let phase = 0; phase < 2; phase++) {
    paras.forEach(function (p) {
      let hit = '';
      const ca = seatCandidates(p.text);
      for (let i = 0; i < ca.length; i++) { if (map[ca[i]]) { hit = map[ca[i]]; break; } }
      if (phase === 0) {
        if (!hit) return;
        if (seen[hit]) { seen[hit]++; dup++; return; }
        seen[hit] = 1; matched.push(hit);
        entries.push({ node: p.node, names: [hit], text: p.text });
        return;
      }
      if (hit) return;
      const multi = seatFindNames(ca[0], map);
      if (multi.length) {
        const fresh = multi.filter(function (n) {
          if (seen[n]) { seen[n]++; dup++; return false; }
          seen[n] = 1; matched.push(n); return true;
        });
        if (fresh.length) entries.push({ node: p.node, names: fresh, text: p.text });
        return;
      }
      if (/^[\u4e00-\u9fa5]{2,4}$/.test(p.text) && !/^(班级|座位|讲台|教师|科目|姓名)/.test(p.text)) {
        if (!unmatched.some(function (u) { return u.text === p.text; })) {
          unmatched.push({
            node: p.node, text: p.text,
            suggest: seatSuggest(p.text, Object.keys(map).map(function (k) { return map[k]; })),
            options: seatRoster(cls)
          });
        }
      }
    });
  }
  const all = seatRoster(cls);
  all.forEach(function (n) { if (!seen[n]) noSeat.push(n); });
  return { entries: entries, unmatched: unmatched, matched: matched, noSeat: noSeat, dup: dup };
}
function seatBuild(root, cls) {
  const res = seatScan(root, cls);
  seatState.entries = res.entries;
  seatState.unmatched = res.unmatched;
  seatState.matchedNames = res.matched;
  seatState.noSeat = res.noSeat;
  seatState.dup = res.dup;
  return res;
}
/* 手动绑定：把未匹配的段落改成写某位名册学生的成绩 */
function seatManualEntries(unmatched, manual) {
  const out = [];
  Object.keys(manual || {}).forEach(function (k) {
    const target = manual[k];
    if (!target) return;
    const u = (unmatched || []).filter(function (x) { return x.text === k; })[0];
    if (u) out.push({ node: u.node, names: [target], text: k, manual: true });
  });
  return out;
}

/* ---------- 往段落下面插一行小字（复制原段落/字体属性，只改字号和颜色） ---------- */
function seatFirstChild(node, local) {
  for (let c = node.firstChild; c; c = c.nextSibling) {
    if (c.nodeType === 1 && c.localName === local) return c;
  }
  return null;
}
function seatFirstRun(node) {
  for (let c = node.firstChild; c; c = c.nextSibling) {
    if (c.nodeType === 1 && c.localName === 'r') return c;
  }
  const rs = node.getElementsByTagNameNS(SEAT_W, 'r');
  return rs.length ? rs[0] : null;
}
function seatDropChild(node, local) {
  const kill = [];
  for (let c = node.firstChild; c; c = c.nextSibling) {
    if (c.nodeType === 1 && c.localName === local) kill.push(c);
  }
  kill.forEach(function (c) { if (c.parentNode === node) node.removeChild(c); });
}
function seatSmallRPr(rPr, doc) {
  seatDropChild(rPr, 'sz');
  seatDropChild(rPr, 'szCs');
  seatDropChild(rPr, 'b');
  seatDropChild(rPr, 'bCs');
  seatDropChild(rPr, 'i');
  seatDropChild(rPr, 'iCs');
  seatDropChild(rPr, 'color');
  seatDropChild(rPr, 'spacing');
  /* 字符间距略微收紧，让「104(15)-126↓22」这种长串在小格子里不折行 */
  const spc = doc.createElementNS(SEAT_W, 'w:spacing');
  spc.setAttributeNS(SEAT_W, 'w:val', '-2');
  rPr.appendChild(spc);
  const color = doc.createElementNS(SEAT_W, 'w:color');
  color.setAttributeNS(SEAT_W, 'w:val', '404040');
  rPr.appendChild(color);
  const sz = doc.createElementNS(SEAT_W, 'w:sz');
  sz.setAttributeNS(SEAT_W, 'w:val', String(seatState.detail === 'full' ? 16 : 20));   /* 简洁 10pt+排名9pt / 完整 8pt */
  const szCs = doc.createElementNS(SEAT_W, 'w:szCs');
  szCs.setAttributeNS(SEAT_W, 'w:val', String(seatState.detail === 'full' ? 16 : 20));
  rPr.appendChild(sz);
  rPr.appendChild(szCs);
}
/* 成绩行：固定行距，段前段后 0，尽量不改变原表格行高 */
function seatTightSpacing(pPr, doc) {
  seatDropChild(pPr, 'spacing');
  const sp = doc.createElementNS(SEAT_W, 'w:spacing');
  sp.setAttributeNS(SEAT_W, 'w:before', '0');
  sp.setAttributeNS(SEAT_W, 'w:after', '0');
  sp.setAttributeNS(SEAT_W, 'w:line', seatState.detail === 'full' ? '190' : '200');
  sp.setAttributeNS(SEAT_W, 'w:lineRule', 'exact');
  const after = ['jc', 'textDirection', 'textAlignment', 'textboxTightWrap', 'outlineLvl', 'divId', 'cnfStyle', 'rPr', 'sectPr', 'pPrChange'];
  let anchor = null;
  for (let c = pPr.firstChild; c; c = c.nextSibling) {
    if (c.nodeType === 1 && after.indexOf(c.localName) >= 0) { anchor = c; break; }
  }
  if (anchor) pPr.insertBefore(sp, anchor); else pPr.appendChild(sp);
}
function seatMakeLine(doc, srcP, text, chgText, up, rankTxt) {
  const p = doc.createElementNS(SEAT_W, 'w:p');
  const srcPPr = seatFirstChild(srcP, 'pPr');
  if (srcPPr) {
    const pPr = srcPPr.cloneNode(true);
    seatTightSpacing(pPr, doc);
    p.appendChild(pPr);
  } else {
    const pPr = doc.createElementNS(SEAT_W, 'w:pPr');
    seatTightSpacing(pPr, doc);
    p.appendChild(pPr);
  }
  const srcRun = seatFirstRun(srcP);
  const srcRPr = srcRun ? seatFirstChild(srcRun, 'rPr') : null;
  const mkRun = function (txt, color, sizePar) {
    const r = doc.createElementNS(SEAT_W, 'w:r');
    const rPr = srcRPr ? srcRPr.cloneNode(true) : doc.createElementNS(SEAT_W, 'w:rPr');
    seatSmallRPr(rPr, doc);
    if (sizePar) {
      const szEl = seatFirstChild(rPr, 'sz'), szCs = seatFirstChild(rPr, 'szCs');
      if (szEl) szEl.setAttributeNS(SEAT_W, 'w:val', String(sizePar));
      if (szCs) szCs.setAttributeNS(SEAT_W, 'w:val', String(sizePar));
    }
    if (color) {
      const c = seatFirstChild(rPr, 'color');
      if (c) c.setAttributeNS(SEAT_W, 'w:val', color);
    }
    r.appendChild(rPr);
    const t = doc.createElementNS(SEAT_W, 'w:t');
    t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
    t.textContent = txt;
    r.appendChild(t);
    p.appendChild(r);
  };
  mkRun(text, '');
  if (rankTxt && seatState.detail !== 'full') mkRun('(' + rankTxt + ')', '808080', 18);
  if (chgText) mkRun((seatState.detail === 'full' ? '' : ' ') + chgText, up ? 'C0392B' : '1E7D4F');
  return p;
}
function seatWrite(root, cls, sub, exam, manual) {
  const doc = root.nodeType === 9 ? root : root.ownerDocument;
  const scan = seatScan(root, cls);
  const plan = scan.entries.concat(seatManualEntries(scan.unmatched, manual));
  let written = 0, absent = 0;
  plan.forEach(function (e) {
    let anchor = e.node;
    if (!anchor || !anchor.parentNode) return;
    e.names.forEach(function (n) {
      const v = seatScoreOf(cls, n, exam, sub);
      const parts = seatScoreParts(cls, n, exam, sub);
      const line = seatMakeLine(doc, anchor, parts.main, parts.chg, parts.up, parts.rankTxt);
      if (v == null) absent++;
      anchor.parentNode.insertBefore(line, anchor.nextSibling);
      anchor = line;
      written++;
    });
  });
  return { written: written, absent: absent };
}

/* ---------- 解析上传的 docx ---------- */
function seatParseXml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const err = doc.getElementsByTagName('parsererror');
  if (err && err.length) return null;
  return doc;
}
async function seatLoadFile(file) {
  if (!file) return;
  if (!/\.docx$/i.test(file.name)) {
    seatState.ready = false;
    seatState.error = '只支持 .docx（Word 2007 及以上）。如果是 .doc 或扫描图片，请先用 Word 另存为 .docx，或换成电子版座位表。';
    renderCurrentPage();
    return;
  }
  seatState.ready = false;
  seatState.error = '';
  seatState.fileName = file.name;
  seatState.manual = {};
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const parts = fflate.unzipSync(buf);
    if (!parts['word/document.xml']) throw new Error('这个文件里没有 word/document.xml，不是标准 docx');
    const xmlBytes = parts['word/document.xml'];
    const xml = new TextDecoder('utf-8').decode(xmlBytes);
    const declMatch = xml.match(/^<\?xml[^>]*\?>/);
    seatState.xmlDecl = declMatch ? declMatch[0] : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const root = seatParseXml(xml);
    if (!root) throw new Error('document.xml 解析失败');
    seatState.parts = parts;
    seatState.docXml = xml;
    seatState.docRoot = root;
    const det = seatDetect(root);
    seatState.guess = det.cls;
    seatState.cls = det.cls;
    seatState.ambiguous = det.ambiguous || [];
    seatState.clsEdit = false;
    if (!det.cls || !det.top.hits) {
      seatState.ready = false;
      seatState.error = '没认出这是哪个班：最多只匹配到 ' + (det.top.hits || 0) + ' 个姓名，至少要 ' + (det.minHit || 2) +
        ' 个才算认出来。当前科目「' + seatState.sub + '」的班级：' +
        ((window.Auth && Auth.myClasses && Auth.myClasses().join('、')) || '全部') +
        '。请确认座位表里写的是你班上学生的名字；错字多的先在文档里改对再上传。';
    } else {
      seatBuild(root, det.cls);
      seatState.ready = true;
      seatState.notes = ['识别方式：' + det.how];
    }
  } catch (e) {
    seatState.ready = false;
    seatState.error = '读取失败：' + (e && e.message ? e.message : e);
  }
  renderCurrentPage();
}

/* ---------- 导出 ---------- */
function seatExport(btn) {
  if (!seatState.ready || !seatState.parts) return;
  try {
    const root = seatParseXml(seatState.docXml);
    if (!root) throw new Error('重新解析 document.xml 失败');
    const res = seatWrite(root, seatState.cls, seatState.sub, seatState.exam, seatState.manual);
    const ser = new XMLSerializer().serializeToString(root);
    const outXml = seatState.xmlDecl + '\n' + ser.replace(/^<\?xml[^>]*\?>/, '');
    const files = {};
    Object.keys(seatState.parts).forEach(function (k) { files[k] = seatState.parts[k]; });
    files['word/document.xml'] = new TextEncoder().encode(outXml);
    const zipped = fflate.zipSync(files, { level: 6 });
    const base = seatState.fileName.replace(/\.docx$/i, '');
    const name = base + '_' + seatState.exam + '_' + seatState.sub + '成绩.docx';
    const blob = new Blob([zipped], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    const hint = document.getElementById('seatHint');
    if (hint) hint.textContent = '已写入 ' + res.written + ' 人（缺考 ' + res.absent + ' 人），文件已开始下载：' + name;
  } catch (e) {
    const hint = document.getElementById('seatHint');
    if (hint) hint.textContent = '导出失败：' + (e && e.message ? e.message : e);
  }
}

function setCheckboxSelection(wrapId, values) {
  const set = new Set(values);
  document.querySelectorAll('#' + wrapId + ' input[type="checkbox"]').forEach(cb => {
    cb.checked = set.has(cb.value);
    cb.closest('.checkbox-item')?.classList.toggle('checked', cb.checked);

async function exportBatch(pageId, mode, labelPrefix) {
  closeExportMenu();
  if (!hasData()) { alert('暂无数据'); return; }
  const savedPage = state.currentPage;
  const savedClasses = getGlobalClasses();
  const savedSubjects = getGlobalSubjects();
  const allClasses = Array.from(document.querySelectorAll('#globalClassWrap input[type="checkbox"]')).map(i => i.value);
  const allSubjects = Array.from(document.querySelectorAll('#globalSubjectWrap input[type="checkbox"]')).map(i => i.value);
  const items = (mode === 'class') ? allClasses : allSubjects;
  if (!items.length) { alert('没有可导出的' + (mode === 'class' ? '班级' : '学科')); return; }
  const btn = $('exportBtn');
  const oldText = btn.textContent;
  btn.disabled = true;
  try {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      btn.textContent = '导出中 ' + (i + 1) + '/' + items.length + '：' + item;
      if (mode === 'subject') {
        setCheckboxSelection('globalSubjectWrap', [item]);
        setCheckboxSelection('globalClassWrap', allClasses);
      } else {
        setCheckboxSelection('globalClassWrap', [item]);
        setCheckboxSelection('globalSubjectWrap', allSubjects);
      }
      state.currentPage = pageId;
      renderTabs();
      renderCurrentPage();
      await new Promise(r => setTimeout(r, 250));
      const fileName = sanitizeFileName(labelPrefix + '-' + item) + '.pdf';
      await exportReport(fileName);
      await new Promise(r => setTimeout(r, 600));
    }
    btn.textContent = '批量导出完成 ✓';
    setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 2500);
  } catch (e) {
    console.error(e);
    alert('批量导出失败：' + e.message);
    btn.textContent = oldText;
    btn.disabled = false;
  } finally {
    setCheckboxSelection('globalClassWrap', savedClasses);
    setCheckboxSelection('globalSubjectWrap', savedSubjects);
    state.currentPage = savedPage;
    renderTabs();
    renderCurrentPage();
  }
}

/* ============ 文件上传 ============ */
function readOneFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        ingestPart(wb);
        LAST_WORKBOOK = wb;
        resolve();
      } catch (err) { reject(new Error('【' + file.name + '】解析失败：' + err.message)); }
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsArrayBuffer(file);
  });
}
async function handleFileUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  if (typeof XLSX === 'undefined') { alert('Excel 解析库尚未加载完成，请刷新页面后重试。'); return; }
  showLoading('正在读取文件，请稍候...');
  $('uploadBtn').disabled = true;
  try {
    resetAll();
    let success = 0;
    for (const f of files) {
      const ext = f.name.split('.').pop().toLowerCase();
      if (ext !== 'xlsx' && ext !== 'xls') { alert('不支持的文件格式：' + f.name + '（仅支持 .xlsx / .xls）'); continue; }
      await readOneFile(f);
      success++;
    }
    if (!success) { alert('未成功读取任何文件，请检查文件格式。'); return; }
    sortSubjects();
    snapshotRaw();
    rebuildScores();
    finishLoad(files.length > 1 ? files.length + ' 个文件' : files[0].name);
  } catch (err) {
    console.error(err);
    showToast('上传失败', err.message, 'error');
  } finally {
    event.target.value = '';
    $('uploadBtn').disabled = false;
    hideLoading();
  }
}

/* ============================================================
 *  导出 PDF —— 校区-功能-科目-班级-姓名-考试-时间.pdf（校区名取自 CAMPUS_CONFIG）
 * ============================================================ */
function sanitizeFileName(s) {
  return String(s == null ? '' : s)
    .replace(/[\\/:*?"<>|\r\n\t]/g, '-')
    .replace(/\s+/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 80);
}
/* 导出文件名：功能-班级/姓名（合并页取当前子功能名） */
function getExportPageName() {
  const page = state.currentPage;
  const cfg = MERGED_PAGES[page];
  if (cfg) {
    const seg = cfg.segments.find(s => s.id === state.mergedSeg[page]);
    if (seg) return seg.label;
  }
  return PAGE_NAMES[page] || '成绩分析';
}
function buildExportFileName(ext) {
  ext = ext || 'pdf';
  const parts = [getExportPageName()];

  // 只有个人类功能（个人趋势）才把姓名写入文件名，其余按班级
  const stuEl = $('studentSelect');
  if (state.currentPage === 'f8' && repState.cls) {
    parts.push(repState.cls);
    if (repState.sub) parts.push(repState.sub);
  } else if (state.currentPage === 'f1a' && stuEl && stuEl.value) {
    parts.push(stuEl.value);
  } else {
    const clsList = getGlobalClasses();
    if (clsList.length === 1) parts.push(clsList[0]);
    else if (clsList.length > 1) {
      parts.push(clsList.slice(0, 3).join('+') + (clsList.length > 3 ? '等' + clsList.length + '班' : ''));
    }
  }

  const name = parts.filter(Boolean).map(sanitizeFileName).filter(Boolean).join('-');
  return (name || '成绩分析') + '.' + ext;
}

/* Excel 导出：把当前页面上的表格原样导出，便于二次加工 */
const SORT_GLYPH_RE = /[\u21c5\u25b2\u25bc]/g;
const PURE_NUM_RE = /^-?\d+(\.\d+)?$/;
function cellToValue(text) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  return PURE_NUM_RE.test(t) ? parseFloat(t) : t;
}
function exportExcel() {
  closeExportMenu();
  /* 学习目标标签下，Excel 导出走目标模块 */
  if (state.topTab === 'goals') {
    if (!goalsInstance || !goalsInstance.hasData || !goalsInstance.hasData()) { alert('暂无目标数据可导出'); return; }
    goalsInstance.exportExcel();
    return;
  }
  if (!hasData()) { alert('暂无数据'); return; }
  const tables = $('contentArea').querySelectorAll('table.data-table');
  if (!tables.length) { alert('当前功能没有表格可导出，请改用「导出 PDF」。'); return; }
  try {
    const wb = XLSX.utils.book_new();
    let idx = 0;
    tables.forEach(tb => {
      idx++;
      const aoa = [];
      const head = Array.from(tb.querySelectorAll('thead th'))
        .map(th => th.textContent.replace(SORT_GLYPH_RE, '').trim());
      if (head.length) aoa.push(head);
      tb.querySelectorAll('tbody tr').forEach(tr => {
        const cells = Array.from(tr.querySelectorAll('td'));
        if (!cells.length) return;
        if (cells[0].classList.contains('grid-empty')) return;
        aoa.push(cells.map(td => cellToValue(td.textContent)));
      });
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, ('数据' + idx).slice(0, 28));
    });
    XLSX.writeFile(wb, buildExportFileName('xlsx'));
  } catch (e) {
    console.error(e);
    alert('Excel 导出失败：' + e.message);
  }
}

}

const EXPORT_BLOCK_SEL = ['.export-header', '.analysis-panel', '.card', '.chart-card', '.stu-row-card', '.grid-table-scroll'];

/* 收集内容块：只保留最外层，避免卡片与其内部图表卡重复计数 */
function blockRects(area) {
  const base = area.getBoundingClientRect();
  const els = [];
  EXPORT_BLOCK_SEL.forEach(s => area.querySelectorAll(s).forEach(el => els.push(el)));
  /* 去重：同一元素可能匹配多个选择器（如同时有 .card 和 .analysis-panel），必须先去重，否则会重复导出 */
  const uniqueEls = Array.from(new Set(els));
  const outer = uniqueEls.filter(el => !uniqueEls.some(o => o !== el && o.contains(el)));
  return outer.map(el => {
    const r = el.getBoundingClientRect();
    return { el: el, top: r.top - base.top, height: r.height };
  }).filter(r => r.height > 0).sort((a, b) => a.top - b.top);
}

/* 递归把过高的块按子元素边界摊平成「不超过一页」的小段 */
function flattenRect(rect, usablePx) {
  if (rect.height <= usablePx) return [rect];
  const parentTop = rect.top;
  const kids = Array.from(rect.el.children)
    .filter(el => { const t = el.tagName; return t !== 'COLGROUP' && t !== 'COL'; })  /* 隐藏的列占位元素会误报整表高度，跳过 */
    .map(el => {
      const r = el.getBoundingClientRect();
      const b = rect.el.getBoundingClientRect();
      return { el: el, top: (r.top - b.top) + parentTop, height: r.height };
    })
    .filter(k => k.height > 0);
  if (!kids.length) return [rect];          // 原子块（如单个画布），无法再切
  const flat = [];
  kids.forEach(k => flattenRect(k, usablePx).forEach(u => flat.push(u)));
  return flat;
}

/* 纯函数：把摊平后的小段装箱，每箱不超过一页（用于测试） */
function binUnits(flat, usablePx) {
  const bins = [];
  let cur = null, curSpan = 0, curBottom = 0;
  flat.forEach(u => {
    const gap = cur ? Math.max(0, u.top - curBottom) : 0;
    const nextSpan = curSpan + u.height + gap;
    if (cur && nextSpan <= usablePx) { cur.push(u); curSpan = nextSpan; curBottom = u.top + u.height; }
    else { cur = [u]; curSpan = u.height; curBottom = u.top + u.height; bins.push(cur); }
  });
  return bins.map(b => {
    const top = b[0].top;
    const bottom = b[b.length - 1].top + b[b.length - 1].height;
    return { el: b[0].el, top: top, height: bottom - top, parts: b.length };
  });
}

/* 纯函数：把单元顺序排到页上，页内放不下就开新页。
   用「页首元素 top → 当前元素 bottom」的实际跨度判断，避免累加 height+固定 gap 导致误判；
   并做首页合并：若第一页只有一个很矮的块（如 export-header），尝试与下一页首块合并，消除首页大半空白。 */
function pageUnits(units, usablePx) {
  const pages = [];
  let cur = [];
  units.forEach(u => {
    if (cur.length) {
      const firstTop = cur[0].top;
      const newBottom = u.top + u.height;
      if (newBottom - firstTop > usablePx) { pages.push(cur); cur = []; }
    }
    cur.push(u);
  });
  if (cur.length) pages.push(cur);

  /* 首页合并优化：第一页仅 1 块且高度不足半页时，尝试并入第二页首块 */
  if (pages.length >= 2 && pages[0].length === 1) {
    const first = pages[0][0];
    if (first.height < usablePx * 0.5) {
      const second = pages[1];
      const mergedBottom = second[second.length - 1].top + second[second.length - 1].height;
      if (mergedBottom - first.top <= usablePx) {
        pages[1] = [first, ...second];
        pages.shift();
      }
    }
  }
  return pages;
}

async function exportReport(customFileName) {
  closeExportMenu();
  /* 学习目标标签下，PDF 导出走目标模块 */
  if (state.topTab === 'goals') {
    if (!goalsInstance || !goalsInstance.hasData || !goalsInstance.hasData()) { alert('暂无目标数据可导出'); return; }
    await goalsInstance.exportPdf();
    return;
  }
  if (!hasData()) { alert('暂无数据'); return; }
  const btn = $('exportBtn');
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '导出中...';

  const area = $('contentArea');
  const head = document.createElement('div');
  head.className = 'export-header';
  head.style.display = 'block';
  head.innerHTML = exportHeaderHtml();

  const prevAreaWidth = area.style.width;
  const prevBodyOverflow = document.body.style.overflow;
  const prevHtmlOverflow = document.documentElement.style.overflow;
  const widened = [];

  try {
    document.body.classList.add('exporting');
    area.insertBefore(head, area.firstChild);

    /* 宽表完整导出：把内容区临时放宽到表格真实宽度 */
    let needW = 0;
    area.querySelectorAll('.grid-table-scroll').forEach(sc => {
      if (sc.scrollWidth > needW) needW = sc.scrollWidth;
    });
    needW = needW ? needW + 70 : 0;
    if (needW > area.clientWidth) {
      document.body.style.overflow = 'visible';
      document.documentElement.style.overflow = 'visible';
      area.style.width = needW + 'px';
      area.querySelectorAll('.grid-table-scroll').forEach(sc => {
        widened.push([sc, sc.style.overflow]);
        sc.style.overflow = 'visible';
      });
      await new Promise(r => setTimeout(r, 380));
    }

    /* 排版：先量尺寸分页，再一次性截图裁切 */
    const areaRect = area.getBoundingClientRect();
    const imgW = 297 - 16;                       // A4 横向版心
    const k0 = 2;                                // 与下方 html2canvas scale 保持一致
    const bandMm = 9;                            // 页首标题条高度
    const title = CAMPUS_CONFIG.name + ' · ' + getExportPageName();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    /* 无布局环境（如部分测试容器）回退为整图等比缩放单页 */
    if (!(areaRect.width > 0)) {
      const canvas0 = await html2canvas(area, { scale: k0, backgroundColor: '#ffffff', useCORS: true });
      const hMm0 = canvas0.height * imgW / canvas0.width;
      pdf.addImage(canvas0.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, imgW, hMm0);
      pdf.save(buildExportFileName('pdf'));
      return;
    }

    const mmPerPx = imgW / areaRect.width;
    const usablePx = (210 - 8 - 8 - bandMm) / mmPerPx;

    let bins = [];
    blockRects(area).forEach(r => flattenRect(r, usablePx).forEach(u => bins.push(u)));
    bins.sort((a, b) => a.top - b.top);
    /* 去重：摊平后可能出现单元互相包含（如外层卡片与内部表格段），
       保留较大的单元，删除完全被包含的小单元，避免同一内容被多页重复裁切 */
    const dedup = [];
    bins.forEach(u => {
      const uTop = u.top, uBot = u.top + u.height;
      const contained = dedup.some(d => d.top - 1 <= uTop && d.top + d.height + 1 >= uBot);
      if (!contained) {
        /* 同时移除已收录但被当前单元包含的旧单元 */
        for (let i = dedup.length - 1; i >= 0; i--) {
          const d = dedup[i];
          if (uTop - 1 <= d.top && uBot + 1 >= d.top + d.height) dedup.splice(i, 1);
        }
        dedup.push(u);
      }
    });
    /* 直接用去重后的单元分页，不再经过 binUnits 二次装箱（二次装箱会把 header 与高内容块拆开，导致首页空白） */
    const pages = pageUnits(dedup, usablePx);
    if (!pages.length) { alert('当前页面没有可导出的内容。'); return; }

    const bandPx = Math.round(bandMm / mmPerPx * k0);
    const titleFont = Math.round(11 * k0);

    /* 逐页分块截图：不再一次性把整页渲染成一张超高画布。
       浏览器画布高度超过约 32767px 时会把下方内容整段截断（导致「导出内容不全」），
       改为每页只截取当前页范围，任何超长表格/多卡片都能完整导出、分页准确。 */
    let prevBottom = 0;  /* 防重叠：上一页裁切底部，当前页顶部不得低于此值 */
    const pagesCount = pages.length;
    for (let i = 0; i < pagesCount; i++) {
      const pg = pages[i];
      const rawTop = Math.max(0, pg[0].top - 3);
      const topCss = Math.max(rawTop, prevBottom);  /* 与上一页不重叠 */
      const last = pg[pg.length - 1];
      const bottomCss = Math.min(areaRect.height, Math.max(topCss + 1, last.top + last.height + 3));
      prevBottom = bottomCss;
      const hCss = Math.max(1, bottomCss - topCss);

      /* 只渲染 y=topCss 起、高 hCss+标题条 的区域，画布高度始终受控 */
      const canvas = await html2canvas(area, {
        scale: k0,
        backgroundColor: '#ffffff',
        useCORS: true,
        windowWidth: Math.max(needW, areaRect.width),
        x: 0,
        y: topCss,
        width: areaRect.width,
        height: hCss + bandPx / k0
      });
      const contentH = Math.max(1, Math.round(hCss * k0));

      /* 页首标题条用 canvas 绘制，中文不会乱码 */
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width;
      tmp.height = Math.min(canvas.height, contentH + bandPx);
      const tctx = tmp.getContext('2d');
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.fillStyle = '#312e81';
      tctx.font = '700 ' + titleFont + 'px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
      tctx.textBaseline = 'middle';
      tctx.fillText(title + (pagesCount > 1 ? '　(' + (i + 1) + '/' + pagesCount + ')' : ''),
        Math.round(6 * k0), Math.round(bandPx * 0.52));
      tctx.strokeStyle = 'rgba(79,70,229,.35)';
      tctx.lineWidth = Math.max(1, k0);
      tctx.beginPath();
      tctx.moveTo(0, bandPx - Math.max(1, k0));
      tctx.lineTo(tmp.width, bandPx - Math.max(1, k0));
      tctx.stroke();
      tctx.drawImage(canvas, 0, 0, canvas.width, contentH, 0, bandPx, canvas.width, contentH);

      if (i > 0) pdf.addPage();
      const hMm = (contentH + bandPx) / k0 * mmPerPx;
      pdf.addImage(tmp.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, imgW, hMm);
    }
    pdf.save(customFileName || buildExportFileName('pdf'));
  } catch (e) {
    console.error(e);
    alert('PDF 导出失败，可使用浏览器打印另存为 PDF');
  } finally {
    widened.forEach(item => { item[0].style.overflow = item[1]; });
    area.style.width = prevAreaWidth;
    document.body.style.overflow = prevBodyOverflow;
    document.documentElement.style.overflow = prevHtmlOverflow;
    document.body.classList.remove('exporting');
    if (head.parentNode) head.parentNode.removeChild(head);
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* ============================================================
 *  分值对齐引擎
 *  背景：同一科目在不同考试里满分可能不同（实测睿智 1类：物理
 *        入学测 245 → 周测 105，地理 105 → 45）。不折算就会把
 *        「满分缩水」误判成「成绩暴跌」。
 *  规则：以每个「班级 × 科目」历次考试中出现过的最高满分为基准，
 *        把其余考试的成绩按 最高满分 / 当次满分 等比放大。
 *        选「最高」而非「最新」：放大到最大尺度不丢分辨率，
 *        且满分最高的那次成绩保持原样不动。
 *  总分：表里常不标满分（如睿智只有「总分」而无「总分（450）」），
 *        此时按该次考试各科满分之和推导，保证单科满分一变、总分
 *        也跟着对齐。
 *  安全：解析完先存原始快照 RAW_CLASSES，开关切换都从快照重算，
 *        反复开关不会累积误差；且只影响页面计算，不改 Excel 原文件。
 * ============================================================ */
function snapshotRaw() {
  RAW_CLASSES.data = JSON.parse(JSON.stringify(state.classes));
}

/* 某班某科目在某次考试的标注满分（未标注返回 null） */
const markedFullMark = (cls, exam, sub) => getClassSubjectMark(cls, exam, sub);

/* 某班某次考试各科标注满分之和，用于推导「总分」的满分 */
function derivedTotalMark(cls, exam) {
  const em = classExamSubjectMark.get(cls);
  if (!em) return null;
  const sm = em.get(exam);
  if (!sm) return null;
  let sum = 0, n = 0;
  sm.forEach((fm, sub) => { if (!isTotal(sub) && fm > 0) { sum += fm; n++; } });
  return n ? sum : null;
}

/* 取某班某科目某次考试的有效满分：优先标注值，总分可回退到推导值 */
function effectiveFullMark(cls, exam, sub) {
  const m = markedFullMark(cls, exam, sub);
  if (m != null) return { value: m, derived: false };
  if (isTotal(sub)) {
    const d = derivedTotalMark(cls, exam);
    if (d != null) return { value: d, derived: true };
  }
  return { value: null, derived: false };
}

/* 某班某科目在所有考试中出现过的最高满分（对齐目标）
   按最高那次对齐：历次成绩都放大到同一最大尺度，任何一次都不丢分辨率 */
function targetFullMarkFor(cls, sub) {
  let fm = null;
  for (const ex of state.examList) {
    const v = effectiveFullMark(cls, ex, sub).value;
    if (v != null && (fm == null || v > fm)) fm = v;
  }
  return fm;
}

function rebuildScores() {
  if (!RAW_CLASSES.data) return;
  state.classes = JSON.parse(JSON.stringify(RAW_CLASSES.data));
  if (!state.alignEnabled) return;
  for (const cls in state.classes) {
    const students = state.classes[cls].students || {};
    for (const name in students) {
      const stu = students[name];
      for (const ex in stu) {
        for (const sub in stu[ex]) {
          const v = stu[ex][sub];
          if (typeof v !== 'number') continue;
          const cur = effectiveFullMark(cls, ex, sub).value;
          if (cur == null || cur <= 0) continue;
          const target = targetFullMarkFor(cls, sub);
          if (target == null || Math.abs(target - cur) < 1e-9) continue;
          stu[ex][sub] = Math.round(v * target / cur * 10) / 10;
        }
      }
    }
  }
}

/* 汇总发生过满分变动的 班级 × 科目，用于顶栏一句话提示 */
function collectAlignDiff() {
  const out = [];
  const pushIfChanged = (cls, sub, marks) => {
    marks.sort((a, b) => state.examList.indexOf(a.ex) - state.examList.indexOf(b.ex));
    const uniq = [];
    marks.forEach(x => { if (!uniq.some(u => Math.abs(u - x.fm) < 1e-9)) uniq.push(x.fm); });
    if (uniq.length < 2) return;
    out.push({
      cls: cls, sub: sub, marks: marks,
      derived: marks.some(m => m.derived),
      to: Math.max.apply(null, uniq)
    });
  };

  state.classList.forEach(cls => {
    /* 单科：直接用表里标注的满分 */
    const perSub = new Map();
    const em = classExamSubjectMark.get(cls);
    if (em) {
      em.forEach((sm, ex) => {
        sm.forEach((fm, sub) => {
          if (isTotal(sub)) return;
          if (!perSub.has(sub)) perSub.set(sub, []);
          perSub.get(sub).push({ ex: ex, fm: fm, derived: false });
        });
      });
    }
    perSub.forEach((list, sub) => pushIfChanged(cls, sub, list));

    /* 总分：优先用标注值，缺失时用各科满分之和推导 */
    const totalKey = state.subjectList.find(isTotal);
    if (totalKey) {
      const tMarks = [];
      state.examList.forEach(ex => {
        const eff = effectiveFullMark(cls, ex, totalKey);
        if (eff.value != null) tMarks.push({ ex: ex, fm: eff.value, derived: eff.derived });
      });
      if (tMarks.length >= 2) pushIfChanged(cls, totalKey, tMarks);
    }
  });

  out.sort((a, b) => a.cls.localeCompare(b.cls, 'zh') || a.sub.localeCompare(b.sub, 'zh'));
  return out;
}

/* 顶栏一句话对齐状态：不再在正文铺大表格 */
function updateAlignStatus() {
  const el = $('alignStatus');
  if (!el) return;
  if (!state.alignEnabled) { el.textContent = '分值对齐已关闭，显示原始分'; el.style.color = '#b45309'; return; }
  const diffs = collectAlignDiff();
  if (!diffs.length) { el.textContent = '满分一致，无需对齐'; el.style.color = '#15803d'; return; }
  const examples = diffs.slice(0, 2).map(d => d.cls + ' ' + d.sub + '→' + d.to).join('、');
  el.textContent = '已对齐最高满分 · ' + diffs.length + ' 项满分变动（' + examples +
    (diffs.length > 2 ? ' 等' : '') + '）';
  el.style.color = '#0e7490';
}

/* 星耀校区的表存在上万个空列，先收缩范围再解析，避免明显卡顿 */
function shrinkSheetRange(ws) {
  if (!ws || !ws['!ref'] || typeof XLSX === 'undefined') return;
  try {
    const r = XLSX.utils.decode_range(ws['!ref']);
    let lastC = r.s.c;
    const headEnd = Math.min(r.s.r + 1, r.e.r);
    for (let R = r.s.r; R <= headEnd; R++) {
      for (let C = r.e.c; C >= r.s.c; C--) {
        const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
        if (cell && cell.v !== null && cell.v !== undefined && String(cell.v).trim() !== '') {
          if (C > lastC) lastC = C;
          break;
        }
      }
    }
    if (lastC < r.e.c) { r.e.c = lastC; ws['!ref'] = XLSX.utils.encode_range(r); }
  } catch (e) { /* 收缩失败不影响正常解析 */ }
}

/* 多文件上传时先逐个解析进 state，全部读完再统一做快照与对齐 */
function ingestPart(wb) {
  wb.SheetNames.forEach(sheetName => {
    const className = String(sheetName).trim();
    if (!className) return;
    const ws = wb.Sheets[sheetName];
    shrinkSheetRange(ws);
    const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    parseSheet(json, className);
  });
}

/* 解析工作簿的统一入口：自动加载与手动上传共用 */
function ingestWorkbook(wb) {
  ingestPart(wb);
  sortSubjects();
  snapshotRaw();
  rebuildScores();
}

function finishLoad(label) {
  state.loadedFile = label || '';
  initUIAfterLoad();
  const sw = $('alignSwitch');
  if (sw) sw.classList.toggle('on', state.alignEnabled);
  updateAlignStatus();
  const stu = Object.keys(state.classes).reduce(
    (n, c) => n + Object.keys(state.classes[c].students || {}).length, 0);
  setLoadStatus('已加载 ' + (label || '数据') + ' · ' + state.classList.length + ' 个班级 · ' +
    state.examList.length + ' 次考试 · ' + stu + ' 名学生', true);
}

/* 内嵌成绩：双击本地文件打开时 fetch 不可用，改用内嵌 base64 解析；
   HTTP / GitHub Pages 下仍优先读取 data/ 目录里的最新成绩文件 */
function loadEmbeddedGrade() {
  if (!window.__GRADE_XLSX_B64) return false;
  try {
    showLoading('正在解析内嵌成绩数据...');
    const wb = XLSX.read(window.__GRADE_XLSX_B64, { type: 'base64' });
    resetAll();
    ingestWorkbook(wb);
    LAST_WORKBOOK = wb;
    hideLoading();
    finishLoad('内嵌成绩（平行世界版）');
    return true;
  } catch (e) {
    hideLoading();
    console.error('内嵌成绩解析失败', e);
    return false;
  }
}

/* 自动加载：按候选文件名依次尝试，便于以后换文件名或放进 data/ 目录 */
function autoLoadData() {
  const cands = (CAMPUS_CONFIG.dataCandidates && CAMPUS_CONFIG.dataCandidates.length)
    ? CAMPUS_CONFIG.dataCandidates : [CAMPUS_CONFIG.dataFile].filter(Boolean);
  if (window.__GRADE_XLSX_B64 && (location.protocol === 'file:' || !cands.length)) {
    if (loadEmbeddedGrade()) return;
  }

  if (!cands.length) {
    renderTabs();
    $('contentArea').innerHTML = emptyTip('请点击右上角「上传 Excel」选择成绩文件。');
    return;
  }

  let i = 0;
  let retryCount = 0;
  const MAX_RETRY = 2;        /* 每个 URL 最多重试 2 次（共 3 次尝试） */
  const TIMEOUT_MS = 15000;   /* 单次请求 15 秒超时 */
  const RETRY_DELAY = 800;    /* 重试间隔 800ms */

  const tryNext = () => {
    if (i >= cands.length) {
      hideLoading();
      if (loadEmbeddedGrade()) return;
      setLoadStatus('未找到「' + CAMPUS_CONFIG.dataFile + '」，请手动上传', false);
      $('alignStatus').textContent = '';
      renderTabs();
      $('contentArea').innerHTML = emptyTip(
        '未能加载成绩文件 ' + esc(CAMPUS_CONFIG.dataFile) +
        '。<br>可能原因：文件尚未部署、网络波动或 CDN 缓存未刷新。' +
        '<br><br><button onclick="autoLoadData()" style="padding:8px 20px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">重新尝试加载</button>' +
        '　或点击右上角「上传 Excel」手动选择文件。');
      return;
    }
    const url = cands[i];
    /* 加时间戳绕过 GitHub Pages CDN 缓存，确保刚上传的文件能立即取到 */
    const urlWithTs = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    setLoadStatus('正在加载（' + (i + 1) + '/' + cands.length + '）' + (retryCount ? '· 第' + (retryCount + 1) + '次重试' : '') + '…');

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(urlWithTs, { cache: 'no-store', signal: controller.signal })
      .then(res => {
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(buf => {
        showLoading('正在解析成绩数据...');
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        resetAll();
        ingestWorkbook(wb);
        LAST_WORKBOOK = wb;
        hideLoading();
        finishLoad(url.split('/').pop());
      })
      .catch(err => {
        clearTimeout(timer);
        const isNetError = err.name === 'AbortError' || !err.message || !err.message.startsWith('HTTP');
        if (isNetError && retryCount < MAX_RETRY) {
          /* 超时或网络错误才重试；HTTP 404 说明文件不存在，不重试 */
          retryCount++;
          setTimeout(tryNext, RETRY_DELAY);
        } else {
          retryCount = 0;
          i++;
          tryNext();
        }
      });
  };
  setLoadStatus('正在尝试自动加载…');
  tryNext();
}

<script>
(function () {
  const canvas = document.getElementById('particleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
  }
  function initParticles() {
    particles = [];
    const count = Math.min(Math.floor((canvas.width * canvas.height) / 14000), 110);
    for (let i = 0; i < count; i++) particles.push(createParticle());
  }
  function createParticle() {
    return {
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      size:Math.random()*2.6+0.5,
      speedX:(Math.random()-0.5)*0.45, speedY:(Math.random()-0.5)*0.45,
      opacity:Math.random()*0.45+0.12,
      hue:Math.random()*40+200,
      saturation:Math.random()*50+50,
      lightness:Math.random()*30+50,
      pulse:Math.random()*Math.PI*2
    };
  }
  function drawParticle(p) {
    p.pulse += 0.02;
    const op = p.opacity * (0.7 + Math.sin(p.pulse) * 0.3);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + op + ')';
    ctx.fill();
    if (p.size > 1.5) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + (op * 0.15) + ')';
      ctx.fill();
    }
  }
  function connectParticles() {
    const maxDist = 145;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(59,130,246,' + ((1 - dist / maxDist) * 0.15) + ')';
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.speedX; p.y += p.speedY;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      drawParticle(p);
    });
    connectParticles();
    requestAnimationFrame(animate);
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  resize();
  animate();
})();
</script>
