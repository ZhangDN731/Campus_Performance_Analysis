/* ============================================================
 *  F4b 分数段分布（下拉默认不选）
 * ============================================================ */
const SEG_LEVELS = [
  {key:'s',label:'卓越',min:0.90,cls:'seg-s'},
  {key:'a',label:'优秀',min:0.80,cls:'seg-a'},
  {key:'b',label:'良好',min:0.70,cls:'seg-b'},
  {key:'c',label:'及格',min:0.60,cls:'seg-c'},
  {key:'d',label:'待提高',min:0,cls:'seg-d'}
];
function classifyScore(score, fullMark) {
  if (fullMark == null || fullMark <= 0 || score == null) return null;
  const r = score / fullMark;
  for (const lv of SEG_LEVELS) if (r >= lv.min) return lv.key;
  return 'd';
}
function renderF4b(root) {
  root.innerHTML =
    '<div id="segSummary"></div>' +
    '<div class="card">' +
      '<div class="page-title">分数段分布</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>考试</label><select id="segExam">' +
          state.examList.map((ex,i,a)=>'<option value="'+i+'"'+(i===a.length-1?' selected':'')+'>'+esc(ex)+(i===a.length-1?'（最新）':'')+'</option>').join('') +
        '</select></div>' +
        '<div class="filter-group"><label>统计方式</label><select id="segMode">' +
          '<option value="count" selected>人数</option><option value="ratio">占比</option>' +
        '</select></div>' +
        '<span class="info-text">使用顶部已加载班级与已加载科目</span>' +
      '</div>' +
      '<div id="segChartWrap" class="chart-grid" style="margin-top:14px"></div>' +
      '<div id="segTable"></div>' +
    '</div>';
  $('segExam').addEventListener('change', drawF4b);
  $('segMode').addEventListener('change', drawF4b);
  drawF4b();
}
function drawF4b() {
  const summaryWrap = $('segSummary');
  const tableWrap = $('segTable');
  const chartWrap = $('segChartWrap');
  if (!summaryWrap) return;
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  chartWrap.innerHTML = '';
  const examVal = $('segExam').value;
  const mode = $('segMode').value;
  if (!examVal || !mode) { tableWrap.innerHTML = '<div class="empty-hint">请先选择考试和统计方式</div>'; return; }
  const examIdx = parseInt(examVal, 10);
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  if (!exams.length || Number.isNaN(examIdx)) { tableWrap.innerHTML = '<div class="empty-hint">暂无考试数据</div>'; return; }
  const exam = exams[examIdx];
  if (!classes.length || !subs.length) { tableWrap.innerHTML = '<div class="empty-hint">请先在顶部勾选班级和科目</div>'; return; }
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const fullMark = repFullMark(cls, exam, sub).value;
      const students = state.classes[cls]?.students || {};
      const listByLevel = {};
      SEG_LEVELS.forEach(lv => listByLevel[lv.key] = []);
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) listByLevel[k].push({name,value:v+' 分'});
        }
      }
      const total = SEG_LEVELS.reduce((a,lv)=>a+listByLevel[lv.key].length,0);
      if (!total) return;
      rows.push({sub,cls,fullMark,total,listByLevel});
    });
  });
  if (!rows.length) { tableWrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0;
  const sumCounts = {}; SEG_LEVELS.forEach(lv => sumCounts[lv.key] = 0);
  const nameList = {}; SEG_LEVELS.forEach(lv => nameList[lv.key] = []);
  rows.forEach(r => {
    totalRef += r.total;
    SEG_LEVELS.forEach(lv => {
      sumCounts[lv.key] += r.listByLevel[lv.key].length;
      r.listByLevel[lv.key].forEach(x => nameList[lv.key].push({name:r.cls+' · '+x.name,value:x.value}));
    });
  });
  const items = [
    {label:'统计考试',value:esc(exam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'参考人次',value:totalRef+' 次'}
  ];
  SEG_LEVELS.forEach(lv => {
    const c = sumCounts[lv.key];
    const ratio = totalRef ? c/totalRef : 0;
    items.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      value:mode === 'ratio' ? pct(ratio) : c+' 人次',
      cls: lv.key === 's' || lv.key === 'a' ? 'font-up' : lv.key === 'd' ? 'font-down' : '',
      tipItems:nameList[lv.key]
    });
  });
  const rateTop = totalRef ? (sumCounts.s + sumCounts.a)/totalRef : 0;
  const rateWeak = totalRef ? sumCounts.d/totalRef : 0;
  const paras = [
    '卓越+优秀率 <b class="hl">' + pct(rateTop) + '</b>，' + (rateTop >= 0.5 ? '整体水平较高。' : rateTop >= 0.25 ? '仍有提升空间。' : '建议加强尖子生培养。'),
    '待提高占比 <b class="warn">' + pct(rateWeak) + '</b>，' + (rateWeak >= 0.3 ? '建议重点关注基础薄弱学生。' : rateWeak >= 0.15 ? '可针对性补弱。' : '整体达标情况良好。')
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'分数段综合统计',items,paras}]);
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + ' 分数段分布</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    chartWrap.appendChild(card);
    const labels = classes.slice();
    const countsByLevel = {}; SEG_LEVELS.forEach(lv => countsByLevel[lv.key] = []);
    classes.forEach(cls => {
      const fullMark = repFullMark(cls, exam, sub).value;
      const students = state.classes[cls]?.students || {};
      const counts = {}; SEG_LEVELS.forEach(lv => counts[lv.key] = 0);
      let total = 0;
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) counts[k]++;
          total++;
        }
      }
      SEG_LEVELS.forEach(lv => countsByLevel[lv.key].push(mode === 'ratio' ? (total ? Math.round(counts[lv.key]/total*1000)/10 : 0) : counts[lv.key]));
    });
    const colors = {
      s:{bg:'rgba(22,163,74,.8)',border:'#166534'},
      a:{bg:'rgba(34,197,94,.75)',border:'#16a34a'},
      b:{bg:'rgba(59,130,246,.75)',border:'#2563eb'},
      c:{bg:'rgba(245,158,11,.75)',border:'#d97706'},
      d:{bg:'rgba(239,68,68,.75)',border:'#dc2626'}
    };
    const datasets = SEG_LEVELS.map(lv => ({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      data:countsByLevel[lv.key],
      backgroundColor:colors[lv.key].bg,
      borderColor:colors[lv.key].border,
      borderWidth:1
    }));
    addChart(makeBarChart(id, labels, datasets));
  });
  const isRatio = mode === 'ratio';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'满分',width:80,sortable:true,getValue:r=>r.fullMark,render:r=>'<td>'+r.fullMark+'</td>'},
    {label:'参考人数',width:100,sortable:true,getValue:r=>r.total,render:r=>'<td><span class="count-cell" data-tip-title="参考学生名单" data-tip-items=\''+JSON.stringify(SEG_LEVELS.flatMap(lv=>r.listByLevel[lv.key])).replace(/'/g,"&#39;")+'\'>'+r.total+'</span></td>'}
  ];
  SEG_LEVELS.forEach(lv => {
    cols.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',width:120,sortable:true,
      getValue:r=>r.listByLevel[lv.key].length,
      render:r=>{
        const c = r.listByLevel[lv.key].length;
        const val = isRatio ? pct(r.total?c/r.total:0) : c+' 人';
        return '<td><span class="seg-badge '+lv.cls+' count-cell" data-tip-title="'+esc(lv.label)+'（'+c+' 人）" data-tip-items=\''+JSON.stringify(r.listByLevel[lv.key]).replace(/'/g,"&#39;")+'\'>'+val+'</span></td>';
      }
    });
  });
  renderGridTable(cols, rows, 'seg', tableWrap, drawF4b);
}

/* ============================================================
 *  F5 数据明细表（维度下拉默认不选）

function renderF5(root) {
  root.innerHTML =
    '<div id="dataTableSummary"></div>' +

      '<div class="page-title">各科目成绩明细对比表</div>' +

        '<div class="filter-group"><label>维度</label><select id="tableMode">' +

      '</div>' +
      '<div id="dataTable"></div>' +
    '</div>';
  $('tableMode').addEventListener('change', drawF5);
  drawF5();
}
function drawF5() {
  const wrap = $('dataTable');
  const summaryWrap = $('dataTableSummary');
  const mode = $('tableMode').value;
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  summaryWrap.innerHTML = '';
  if (!mode) { wrap.innerHTML = '<div class="empty-hint">请先选择统计维度</div>'; return; }
  if (!classes.length || !subs.length || !exams.length) { wrap.innerHTML = '<div class="empty-hint">请先在顶部勾选班级和科目</div>'; return; }
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const scores = exams.map(e=>getStat(cls,e,sub,mode));
      if (scores.every(s=>s===null)) return;
      rows.push({sub,cls,scores});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  const last = exams[exams.length-1];
  const prev = exams.length >= 2 ? exams[exams.length-2] : null;
  const cells = [];
  subs.forEach(sub => classes.forEach(cls => {
    const lv = getStat(cls, last, sub, mode);
    if (lv == null) return;
    const pv = prev ? getStat(cls, prev, sub, mode) : null;
    cells.push({sub,cls,last:lv,delta:(lv!=null&&pv!=null)?Math.round((lv-pv)*10)/10:null});
  }));
  const withDelta = cells.filter(c=>c.delta!=null);
  const upCells = withDelta.filter(c=>c.delta>0);
  const downCells = withDelta.filter(c=>c.delta<0);
  const topCell = [...cells].sort((a,b)=>b.last-a.last)[0];
  const bottomCell = [...cells].sort((a,b)=>a.last-b.last)[0];
  const items = [
    {label:'统计维度',value:modeLabel(mode)},
    {label:'统计组合',value:cells.length+' 项'},
    {label:'进步项',value:upCells.length+' 项',cls:upCells.length?'font-up':''},
    {label:'退步项',value:downCells.length+' 项',cls:downCells.length?'font-down':''}
  ];
  if (topCell) items.push({label:'最高项',value:esc(topCell.cls)+' · '+esc(topCell.sub),cls:'font-up'});
  if (bottomCell) items.push({label:'最低项',value:esc(bottomCell.cls)+' · '+esc(bottomCell.sub),cls:'font-down'});
  const paras = [];
  if (topCell) paras.push('最高「' + modeLabel(mode) + '」为 <b class="hl">' + esc(topCell.cls) + ' · ' + esc(topCell.sub) + '</b>（' + topCell.last + ' 分）。');
  if (bottomCell) paras.push('最低项为 <b class="hl">' + esc(bottomCell.cls) + ' · ' + esc(bottomCell.sub) + '</b>（' + bottomCell.last + ' 分）。');
  summaryWrap.innerHTML = analysisPanel([{title:'明细数据综合对比',items,paras}]);
  rows.forEach(r => { r._streaks = computeStreaks(r.scores); });
  const rankValsByCol = exams.map((_, i) => rows.map(rr => rr.scores[i]).filter(v => v != null).sort((a,b)=>b-a));
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'}
  ];
  exams.forEach((ex,i) => {
    cols.push({
      label:ex,width:120,sortable:true,
      getValue:r=>r.scores[i]==null?-Infinity:r.scores[i],
      render:r=>{
        const val = r.scores[i];
        const { up, down } = r._streaks;
        let cellCls = '';
        if (up[i]) cellCls = 'cell-streak-up';
        else if (down[i]) cellCls = 'cell-streak-down';
        let diffHtml = '';
        if (i > 0 && val !== null && r.scores[i-1] !== null) {
          const d = Math.round((val - r.scores[i-1]) * 10) / 10;
          diffHtml = d > 0 ? '<span class="score-diff diff-up">↑ +' + d + '</span>'
            : d < 0 ? '<span class="score-diff diff-down">↓ ' + d + '</span>'
            : '<span class="score-diff diff-flat">— 0</span>';
        }
        const rank = val != null ? rankValsByCol[i].indexOf(val) + 1 : null;
        return '<td class="' + cellCls + '"><span class="score-main">' + (val != null ? val : '—') + '</span>' +
          diffHtml + (rank ? '<span class="score-diff">(排名' + rank + ')</span>' : '') + '</td>';
      }
    });
  });
  renderGridTable(cols, rows, 'detail', wrap, drawF5);
}

function renderF6(root) {

    '<div class="card">' +
      '<div class="page-title">成绩达标率统计</div>' +

        '<div class="filter-group"><label>考试</label><select id="rateExam">' +

        '</select></div>' +
        '<span class="info-text">最低线 = 满分 × <b id="rateMinTip">60</b>%；标准线 = 满分 × <b id="rateStdTip">80</b>%。点击表头可排序</span>' +
      '</div>' +
      '<div id="rateTable"></div>' +
    '</div>';
  $('rateExam').addEventListener('change', drawF6);

function drawF6() {
  const wrap = $('rateTable');
  const summaryWrap = $('rateSummary');
  if (!wrap) return;
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  summaryWrap.innerHTML = '';
  const examVal = $('rateExam').value;
  if (!examVal) { wrap.innerHTML = '<div class="empty-hint">请先选择考试</div>'; return; }
  if (!classes.length || !subs.length || !exams.length) { wrap.innerHTML = '<div class="empty-hint">请先在顶部勾选班级和科目</div>'; return; }
  const examIdx = parseInt(examVal, 10);
  if (Number.isNaN(examIdx)) { wrap.innerHTML = '<div class="empty-hint">暂无可选考试</div>'; return; }
  const curExam = exams[examIdx];
  const prevExam = examIdx > 0 ? exams[examIdx-1] : null;
  const minPct = getRateMin(), stdPct = getRateStd();
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const students = state.classes[cls]?.students || {};
      const globalFm = getSubjectFullMark(sub);
      /* 对齐开启时 state.classes 里的分数已放大到「最高满分」，分数线必须同尺度，否则原卷满分小的考试（如物理 8.8周测 105）达标率会被虚高 */
      const fmInfoCur = repFullMark(cls, curExam, sub);
      const curFm = fmInfoCur.value;
      const rawFmCur = fmInfoCur.raw != null ? fmInfoCur.raw : curFm;
      if (curFm == null) return;
      const minLineCur = Math.round(curFm * minPct * 10) / 10;
      const stdLineCur = Math.round(curFm * stdPct * 10) / 10;
      const scores = [], minPassList = [], stdPassList = [];
      for (const name in students) {
        const v = students[name]?.[curExam]?.[sub];
        if (typeof v === 'number') {
          scores.push(v);
          if (v >= minLineCur) minPassList.push({name,value:v+' 分'});
          if (v >= stdLineCur) stdPassList.push({name,value:v+' 分'});
        }
      }
      if (!scores.length) return;
      const total = scores.length;
      const minPass = minPassList.length;
      const stdPass = stdPassList.length;
      let prevMinRate = null, prevStdRate = null, prevTotal = 0, prevFm = null;
      if (prevExam) {
        prevFm = repFullMark(cls, prevExam, sub).value;
        const prevMinLine = prevFm != null ? Math.round(prevFm * minPct * 10) / 10 : null;
        const prevStdLine = prevFm != null ? Math.round(prevFm * stdPct * 10) / 10 : null;
        const ps = [];
        for (const name in students) {
          const v = students[name]?.[prevExam]?.[sub];
          if (typeof v === 'number') ps.push(v);
        }
        if (ps.length && prevMinLine != null) {
          prevTotal = ps.length;
          prevMinRate = ps.filter(s=>s>=prevMinLine).length / ps.length;
          prevStdRate = ps.filter(s=>s>=prevStdLine).length / ps.length;
        }
      }
      /* 分班进退步与缺考：本次 vs 上一次（同科目同班，分数已按对齐口径存放） */
      const absentNames = [];
      for (const name in students) {
        const v = students[name] ? students[name][curExam] ? students[name][curExam][sub] : null : null;
        if (typeof v !== 'number') absentNames.push(name);
      }
      let mvUp = 0, mvDown = 0, mvFlat = 0;
      const upNames = [], downNames = [];
      /* 总分/职测总分：按学生逐个核对两次考试的科目覆盖，覆盖不同的人不参与总分对比 */
      const totalLike = sub === '总分' || sub === '职测总分';
      const keySet = (rec) => {
        if (!rec) return '';
        const arr = [];
        for (const s in rec) if (s !== '总分' && s !== '职测总分' && typeof rec[s] === 'number') arr.push(s);
        return arr.sort().join('|');
      };
      let mvSkipStudent = 0;
      if (prevExam) {
        for (const name in students) {
          const a = students[name] ? students[name][curExam] ? students[name][curExam][sub] : null : null;
          const b = students[name] ? students[name][prevExam] ? students[name][prevExam][sub] : null : null;
          if (typeof a !== 'number' || typeof b !== 'number') continue;
          if (totalLike) {
            const ka = keySet(students[name][curExam]), kb = keySet(students[name][prevExam]);
            if (ka !== kb) { mvSkipStudent++; continue; }
          }
          const d = a - b;
          if (Math.abs(d) < 0.05) mvFlat++;
          else if (d > 0) { mvUp++; upNames.push({ name: name, d: d }); }
          else { mvDown++; downNames.push({ name: name, d: d }); }
        }
      }
      upNames.sort((x, y) => y.d - x.d);
      downNames.sort((x, y) => x.d - y.d);
      rows.push({sub,cls,fullMark:curFm,rawMark:rawFmCur,minLine:minLineCur,stdLine:stdLineCur,total,minPass,stdPass,minPassList,stdPassList,
        minRate:minPass/total,stdRate:stdPass/total,prevMinRate,prevStdRate,prevTotal,prevFullMark:prevFm,
        absent:absentNames.length,absentNames,roster:Object.keys(students).length,mvUp,mvDown,mvFlat,upNames,downNames,
        mvSkip:totalLike && !!prevExam && (mvUp + mvDown + mvFlat) === 0 && mvSkipStudent > 0,
        mvSkipStudent:mvSkipStudent});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0, totalMinPass = 0, totalStdPass = 0;
  const allMinPass = [], allStdPass = [];
  rows.forEach(r => {
    totalRef += r.total; totalMinPass += r.minPass; totalStdPass += r.stdPass;
    r.minPassList.forEach(x => allMinPass.push({name:r.cls+' · '+x.name,value:x.value}));
    r.stdPassList.forEach(x => allStdPass.push({name:r.cls+' · '+x.name,value:x.value}));
  });
  const avgMin = totalRef ? totalMinPass/totalRef : 0;
  const avgStd = totalRef ? totalStdPass/totalRef : 0;
  const items = [
    {label:'统计考试',value:esc(curExam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'最低达标率均值',value:pct(avgMin),tipItems:allMinPass},
    {label:'标准达标率均值',value:pct(avgStd),tipItems:allStdPass}
  ];
  const paras = [];
  if (avgMin >= 0.8) paras.push('整体最低达标率表现良好。');
  else if (avgMin >= 0.5) paras.push('整体最低达标率处于中等水平。');
  else paras.push('整体最低达标率偏低，建议加强基础教学。');
  const fmSet = new Set(rows.map(r=>r.fullMark));
  if (fmSet.size > 1) paras.push('所选范围存在多种科目满分，已按各班实际满分独立计算。');

  /* 分班进退步与缺考（针对当前勾选的班级、本次考试） */
  let mvUpAll = 0, mvDownAll = 0, mvFlatAll = 0, absentAll = 0, rosterAll = 0, mvSkipped = 0;
  rows.forEach(r => {
    if (r.mvSkip) { mvSkipped++; return; }
    mvUpAll += r.mvUp; mvDownAll += r.mvDown; mvFlatAll += r.mvFlat;
    absentAll += r.absent; rosterAll += r.roster;
  });
  const mvItems = [
    {label:'本次考试',value:esc(curExam)},
    {label:'对比考试',value:prevExam ? esc(prevExam) : '无（首次）'},
    {label:'进步',value:prevExam ? mvUpAll+' 人次' : '-',cls:'font-up'},
    {label:'退步',value:prevExam ? mvDownAll+' 人次' : '-',cls:'font-down'},
    {label:'持平',value:prevExam ? mvFlatAll+' 人次' : '-',cls:'font-flat'},
    {label:'缺考',value:absentAll+' 人（'+pct(rosterAll?absentAll/rosterAll:0)+'）',cls:absentAll?'font-down':''}
  ];
  const mvParas = [];
  if (prevExam) {
    mvParas.push('两次考试都有「' + subs.join('、') + '」成绩的共 ' + (mvUpAll+mvDownAll+mvFlatAll) + ' 人次：进步 ' + mvUpAll +
      ' 人次、退步 ' + mvDownAll + ' 人次、持平 ' + mvFlatAll + ' 人次。');
    const topUp = rows.filter(r=>r.upNames.length).map(r=>({cls:r.cls,sub:r.sub,n:r.upNames[0].name,d:r.upNames[0].d}))
      .sort((a,b)=>b.d-a.d).slice(0,3);
    const topDown = rows.filter(r=>r.downNames.length).map(r=>({cls:r.cls,sub:r.sub,n:r.downNames[0].name,d:r.downNames[0].d}))
      .sort((a,b)=>a.d-b.d).slice(0,3);
    if (topUp.length) mvParas.push('进步最大：' + topUp.map(x=>x.cls+'·'+x.n+'（+'+repFmt(x.d,1)+' 分）').join('；') + '。');
    if (topDown.length) mvParas.push('退步最大：' + topDown.map(x=>x.cls+'·'+x.n+'（'+repFmt(x.d,1)+' 分）').join('；') + '。');
  } else {
    mvParas.push('本次是该科目第一次录入成绩，暂无可比的上一次考试，后续考试会自动统计进步与退步。');
  }
  const mvSkipStu = rows.reduce((s, r) => s + (r.mvSkipStudent || 0), 0);
  if (mvSkipped) {
    mvParas.push('「总分」两次考试的科目覆盖不一致，总分不可直接比较，已跳过总分的进退步统计，只按单科做进退步判断。');
  } else if (mvSkipStu) {
    mvParas.push('总分对比中，有 ' + mvSkipStu + ' 人次因两次考试录入的科目不一致（部分科目缺录）未参与比较，避免把缺科误算成退步。');
  }
  const zeroNames = (list) => list.length ? list.join('、') : '无';
  if (absentAll) mvParas.push('本次缺考 ' + absentAll + ' 人（缺考率 ' + pct(rosterAll?absentAll/rosterAll:0) + '），名单：' +
    zeroNames(rows.filter(r=>r.absentNames.length).map(r=>r.cls+'·'+r.sub+'：'+r.absentNames.join('、')))) ;
  else mvParas.push('本次所选班级全部到考，无缺考。');

  summaryWrap.innerHTML = analysisPanel([
    {title:'达标率综合统计',items,paras},
    {title:'分班进退步与缺考',items:mvItems,paras:mvParas}
  ]);
  const rateCls = r => r>=0.8?'rate-good':r>=0.5?'rate-mid':'rate-low';
  const deltaHtml = (cur,prev) => {
    if (prev == null) return '<span class="rate-delta flat">—</span>';
    const d = (cur-prev)*100;
    if (Math.abs(d) < 0.05) return '<span class="rate-delta flat">0.0pp</span>';
    return '<span class="rate-delta ' + (d>0?'up':'down') + '">' + (d>0?'+':'') + d.toFixed(1) + 'pp</span>';
  };
  const fmLabelHtml = (curFm,rawFm) => {
    if (rawFm == null || Math.abs(rawFm - curFm) < 0.001) return String(curFm);
    return curFm + ' <span class="fullmark-changed">(原卷 ' + rawFm + ')</span>';
  };
  const minPctText = Math.round(minPct*100) + '%';
  const stdPctText = Math.round(stdPct*100) + '%';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'参考人数',width:90,sortable:true,getValue:r=>r.total,render:r=>'<td>'+r.total+'</td>'},
    {label:'本次满分',width:110,sortable:true,getValue:r=>r.fullMark,render:r=>'<td>'+fmLabelHtml(r.fullMark,r.rawMark)+'</td>'},
    {label:'最低线('+minPctText+')',width:120,sortable:true,getValue:r=>r.minLine,render:r=>'<td>'+r.minLine+'</td>'},
    {label:'最低达标人数',width:120,sortable:true,getValue:r=>r.minPass,render:r=>'<td><span class="count-cell" data-tip-title="最低达标名单（'+r.minPass+' 人）" data-tip-items=\''+JSON.stringify(r.minPassList).replace(/'/g,"&#39;")+'\'>'+r.minPass+'</span></td>'},
    {label:'最低达标率',width:110,sortable:true,getValue:r=>r.minRate,render:r=>'<td class="rate-cell '+rateCls(r.minRate)+'">'+pct(r.minRate)+'</td>'},
    {label:'最低·对比',width:110,sortable:true,getValue:r=>(r.prevMinRate==null?-99999:r.minRate-r.prevMinRate),render:r=>'<td>'+deltaHtml(r.minRate,r.prevMinRate)+'</td>'},
    {label:'标准线('+stdPctText+')',width:120,sortable:true,getValue:r=>r.stdLine,render:r=>'<td>'+r.stdLine+'</td>'},
    {label:'标准达标人数',width:120,sortable:true,getValue:r=>r.stdPass,render:r=>'<td><span class="count-cell" data-tip-title="标准达标名单（'+r.stdPass+' 人）" data-tip-items=\''+JSON.stringify(r.stdPassList).replace(/'/g,"&#39;")+'\'>'+r.stdPass+'</span></td>'},
    {label:'标准达标率',width:110,sortable:true,getValue:r=>r.stdRate,render:r=>'<td class="rate-cell '+rateCls(r.stdRate)+'">'+pct(r.stdRate)+'</td>'},
    {label:'标准·对比',width:110,sortable:true,getValue:r=>(r.prevStdRate==null?-99999:r.stdRate-r.prevStdRate),render:r=>'<td>'+deltaHtml(r.stdRate,r.prevStdRate)+'</td>'}
  ];
  renderGridTable(cols, rows, 'rate', wrap, drawF6);
}

/* ============================================================
 *  F7 四线达标率：按班级对照所属大类的预制四线
 *  （控制线 / 民办线 / 公办线 / 预估线）及各线 +50，
 *  统计每个班级的达标人数与达标率。
 * ============================================================ */
const F7_LINE_DEFS = [
  { key: 'control',  label: '控制线' },
  { key: 'private',  label: '民办线' },
  { key: 'public',   label: '公办线' },
  { key: 'estimate', label: '预估线' }
];
function renderF7(root) {
  root.innerHTML =
    '<div id="f7Summary"></div>' +
    '<div class="card">' +
      '<div class="page-title">四线达标率（按班级）</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>考试</label><select id="f7Exam">' +
          state.examList.map((ex,i,a)=>'<option value="'+i+'"'+(i===a.length-1?' selected':'')+'>'+esc(ex)+(i===a.length-1?'（最新）':'')+'</option>').join('') +
        '</select></div>' +
        '<span class="info-text">每个班级对照其所属大类的预制四线（控制线 / 民办线 / 公办线 / 预估线）统计总分达标率；下方为各线 +50 的达标率。点击表头可排序</span>' +
      '</div>' +
      '<div id="f7TableBase"></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px">' +
      '<div class="page-title">四线+50达标率（按班级）</div>' +
      '<div id="f7TablePlus"></div>' +
    '</div>';
  $('f7Exam').addEventListener('change', drawF7);
  drawF7();
}
function drawF7() {
  const summaryWrap = $('f7Summary');
  const baseWrap = $('f7TableBase');
  const plusWrap = $('f7TablePlus');
  if (!baseWrap) return;
  const examVal = $('f7Exam').value;
  const clearAll = msg => {
    baseWrap.innerHTML = '<div class="empty-hint">' + msg + '</div>';
    if (plusWrap) plusWrap.innerHTML = '';
    if (summaryWrap) summaryWrap.innerHTML = '';
  };
  if (examVal === '' || examVal == null) { clearAll('请先选择考试'); return; }
  const examIdx = parseInt(examVal, 10);
  if (Number.isNaN(examIdx)) { clearAll('暂无可选考试'); return; }
  const curExam = state.examList[examIdx];
  const totalSub = state.subjectList.find(isTotal);
  if (!totalSub) { clearAll('未找到总分科目'); return; }
  const classes = getGlobalClasses();
  if (!classes.length) { clearAll('请先在顶部勾选班级'); return; }

  /* 逐班级收集本次总分，同时记录所属大类 */
  const rows = [];
  classes.forEach(cls => {
    const type = getClassType(cls);
    if (!type) return;
    const students = state.classes[cls]?.students || {};
    const scores = [];
    for (const name in students) {
      const v = students[name]?.[curExam]?.[totalSub];
      if (typeof v === 'number') scores.push(v);
    }
    if (!scores.length) return;
    const preset = CLASS_LINE_MAP[type] || {};
    const row = { type, cls, total: scores.length, scores };
    F7_LINE_DEFS.forEach(d => {
      const lv = preset[d.key];
      row[d.key + 'Line'] = lv;
      row[d.key + 'Pass'] = lv != null ? scores.filter(s => s >= lv).length : null;
      row[d.key + 'Rate'] = lv != null ? row[d.key + 'Pass'] / scores.length : null;
      row[d.key + 'Pass50'] = lv != null ? scores.filter(s => s >= lv + 50).length : null;
      row[d.key + 'Rate50'] = lv != null ? row[d.key + 'Pass50'] / scores.length : null;
    });
    rows.push(row);
  });
  /* 按大类号 → 班级名排序 */
  rows.sort((a, b) => {
    const ta = parseInt(a.type), tb = parseInt(b.type);
    if (!Number.isNaN(ta) && !Number.isNaN(tb) && ta !== tb) return ta - tb;
    return a.cls.localeCompare(b.cls, 'zh');
  });
  if (!rows.length) { clearAll('所选班级未匹配到考试大类（CLASS_LINE_MAP 中无对应配置）'); return; }

  /* 全班级加权汇总 */
  let allTotal = 0;
  const aggPass = {}, aggPass50 = {};
  F7_LINE_DEFS.forEach(d => { aggPass[d.key] = 0; aggPass50[d.key] = 0; });
  rows.forEach(r => {
    allTotal += r.total;
    F7_LINE_DEFS.forEach(d => {
      if (r[d.key + 'Pass'] != null) aggPass[d.key] += r[d.key + 'Pass'];
      if (r[d.key + 'Pass50'] != null) aggPass50[d.key] += r[d.key + 'Pass50'];
    });
  });
  const typeSet = new Set(rows.map(r => r.type));

  /* 摘要面板：分三个小区，避免 11 个指标挤成一团 */
  const baseItems = F7_LINE_DEFS.map(d => ({
    label: d.label, value: pct(allTotal ? aggPass[d.key] / allTotal : 0)
  }));
  const plusItems = F7_LINE_DEFS.map(d => ({
    label: d.label + '+50', value: pct(allTotal ? aggPass50[d.key] / allTotal : 0)
  }));
  const paras = [];
  const withPublic = rows.filter(r => r.publicRate != null);
  if (withPublic.length) {
    const lowest = withPublic.reduce((a, b) => a.publicRate < b.publicRate ? a : b);
    paras.push('公办线达标率最低的班级：<b>' + esc(classLabel(lowest.cls)) + '</b>（' + pct(lowest.publicRate) + '），建议重点关注。');
  }
  const withCtrl = rows.filter(r => r.controlRate != null);
  if (withCtrl.length) {
    const belowHalf = withCtrl.filter(r => r.controlRate < 0.5);
    if (belowHalf.length) paras.push('控制线达标率低于 50% 的班级：' + belowHalf.map(r => esc(classLabel(r.cls))).join('、') + '。');
  }
  if (summaryWrap) summaryWrap.innerHTML = analysisPanel([
    { title: '基础信息', items: [
      { label: '统计考试', value: esc(curExam) },
      { label: '覆盖班级', value: rows.length + ' 个' },
      { label: '覆盖大类', value: typeSet.size + ' 类' },
      { label: '参考人数', value: String(allTotal) }
    ]},
    { title: '四线达标率（整体）', items: baseItems },
    { title: '四线+50达标率（整体）', items: plusItems, paras: paras }
  ]);

  /* 表格列构造 */
  const rateCls = r => r >= 0.8 ? 'rate-good' : r >= 0.5 ? 'rate-mid' : 'rate-low';
  const buildLineCols = plus => F7_LINE_DEFS.map(d => {
    const passKey = d.key + (plus ? 'Pass50' : 'Pass');
    const rateKey = d.key + (plus ? 'Rate50' : 'Rate');
    const lineKey = d.key + 'Line';
    return [
      { label: d.label + (plus ? '+50' : ''), width: 100, sortable: true,
        getValue: r => r[lineKey] == null ? -99999 : r[lineKey] + (plus ? 50 : 0),
        render: r => '<td>' + (r[lineKey] != null ? (r[lineKey] + (plus ? 50 : 0)) : '-') + '</td>' },
      { label: '达标人数', width: 90, sortable: true,
        getValue: r => r[passKey] == null ? -99999 : r[passKey],
        render: r => '<td>' + (r[passKey] != null ? r[passKey] : '-') + '</td>' },
      { label: '达标率', width: 90, sortable: true,
        getValue: r => r[rateKey] == null ? -99999 : r[rateKey],
        render: r => { const v = r[rateKey]; return '<td class="rate-cell ' + (v == null ? '' : rateCls(v)) + '">' + (v == null ? '-' : pct(v)) + '</td>'; } }
    ];
  }).flat();

  const leadingCols = [
    { label: '大类', width: 70, sticky: true, sortable: true, getValue: r => r.type,
      render: r => '<td class="cell-class" style="font-weight:700">' + esc(r.type) + '</td>' },
    { label: '班级', width: 110, sticky: true, sortable: true, getValue: r => r.cls,
      render: r => '<td class="cell-subject">' + esc(classLabel(r.cls)) + '</td>' },
    { label: '参考人数', width: 86, sortable: true, getValue: r => r.total,
      render: r => '<td>' + r.total + '</td>' }
  ];

  renderGridTable(leadingCols.concat(buildLineCols(false)), rows, 'f7line', baseWrap, drawF7);
  if (plusWrap) renderGridTable(leadingCols.concat(buildLineCols(true)), rows, 'f7linePlus', plusWrap, drawF7);
}

/* ============================================================
 *  F8 单科成绩分析报告
 *  —— 以《成绩分析脚本2.2（多班级）.xlsm》「按钮1」的报告口径为基准重建，
 *     并针对原 VBA 的缺陷做了修正与增强
 *  原 VBA 报告结构：基本信息 / 分数段人数 / 及格率·优秀率·不及格率 /
 *      最高分·最低分（同分合并）/ 综合评语 / 难度评估
 *  本页保留上述结构，并补充：名册-参考-缺考三口径、中位数、标准差、极差、
 *      得分率、校区位次、临界生、与上一次考试同比、进退步名单、
 *      评语按「班级|科目|考试」稳定抽取（同一份报告不会每次变）
 * ============================================================ */

/* 任课教师名录：科目 → 教师（同一科目多位教师时按班级对应，报告里可选） */
const REPORT_TEACHERS = {
  '物理': ['周景辉'],
  '历史': ['颜立营'],
  '政治': ['吴恩乐'],
  '英语': ['陈莹哲'],
  '信息技术': ['杜翠花', '张迪楠'],
  '计算机': ['杜翠花', '张迪楠'],
  '数学': ['王玄烨', '杜得京', '丁然'],
  '语文': ['徐静娜', '尹雅蕾', '杜佳雯', '赵晓亚'],

/* 报告选择状态：跨重绘保留，避免勾选班级后跳回默认值 */
const repState = { cls: '', sub: '', exam: '' };
const REP_TEACHER_KEY = 'pw_lq_teacher_';

function repFmt(n, d) {
  if (n == null || Number.isNaN(n)) return '-';
  const p = Math.pow(10, d == null ? 2 : d);
  return String(Math.round(n * p) / p);
}
function repPct(n) { return n == null ? '-' : (n * 100).toFixed(1) + '%'; }
function repMean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }
function repMedian(arr) {
  if (!arr.length) return null;
  const s = arr.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function repStd(arr, avg) {
  if (!arr.length || avg == null) return null;
  const v = arr.reduce((a, x) => a + (x - avg) * (x - avg), 0) / arr.length;
  return Math.sqrt(v);
}
/* 稳定散列：同一份报告每次打开取到同一条评语，不同报告之间自然分散
   （原 VBA 在循环内反复 Randomize，同一批报告常抽到同一条评语） */
function repHashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function repComment(seed) { return REPORT_COMMENTS[repHashSeed(seed) % REPORT_COMMENTS.length]; }

/* 报告满分口径：对齐最高满分开启时用「对齐后满分」，否则用本次标注满分。
   原 VBA 只有“本次总分”一个口径；这里显式区分，避免不同次考试满分不同时分数线算错 */
function repFullMark(cls, exam, sub) {
  const raw = getClassSubjectMark(cls, exam, sub);
  const globalFm = getSubjectFullMark(sub);
  const target = targetFullMarkFor(cls, sub);
  let fm = raw != null ? raw : globalFm;
  if (state.alignEnabled && target != null) fm = target;
  return { value: fm, raw: raw, scaled: (raw != null && fm != null && Math.abs(fm - raw) > 1e-9) };
}

function repScores(cls, exam, sub) {
  const students = (state.classes[cls] || {}).students || {};
  const names = Object.keys(students);
  const list = [];
  names.forEach(n => {
    const v = students[n] && students[n][exam] ? students[n][exam][sub] : null;
    if (typeof v === 'number' && !Number.isNaN(v)) list.push({ name: n, score: v });
  });
  return { names, list };
}

/* 单个「班级 × 科目 × 考试」的全部统计量；fmOverride 用于快速报表手填的总分（满分） */
function repStats(cls, exam, sub, fmOverride) {
  const { names, list } = repScores(cls, exam, sub);
  const fmInfo = repFullMark(cls, exam, sub);
  let fm = fmInfo.value;
  const hasOverride = !(fmOverride == null || fmOverride === '' || Number.isNaN(Number(fmOverride)) || Number(fmOverride) <= 0);
  if (hasOverride) fm = Number(fmOverride);
  const total = names.length;
  const ref = list.length;
  const absentNames = names.filter(n => !list.some(x => x.name === n));
  const minPct = getRateMin(), stdPct = getRateStd();
  const minLine = fm != null ? Math.round(fm * minPct * 10) / 10 : null;
  const stdLine = fm != null ? Math.round(fm * stdPct * 10) / 10 : null;
  const base = {
    cls: cls, exam: exam, sub: sub, fullMark: fm, rawFullMark: fmInfo.raw,
    scaled: hasOverride ? false : fmInfo.scaled,
    total: total, ref: ref, absent: total - ref, absentNames: absentNames,
    minPct: minPct, stdPct: stdPct, minLine: minLine, stdLine: stdLine,
    empty: true
  };
  if (!ref || fm == null || fm <= 0) return base;

  const scores = list.map(x => x.score);
  const sorted = scores.slice().sort((a, b) => a - b);
  const avg = repMean(scores);
  const max = sorted[sorted.length - 1];
  const min = sorted[0];
  const maxNames = list.filter(x => x.score === max).map(x => x.name);
  const minNames = list.filter(x => x.score === min).map(x => x.name);
  const passList = list.filter(x => x.score >= minLine);
  const stdPassList = list.filter(x => x.score >= stdLine);
  const levels = {};
  SEG_LEVELS.forEach(lv => { levels[lv.key] = { count: 0, names: [] }; });
  list.forEach(x => {
    const k = classifyScore(x.score, fm);
    if (k) { levels[k].count++; levels[k].names.push(x.name); }
  });
  /* 临界生：距及格线 ±5% 满分范围内，最需要盯的一批人 */
  const band = fm * 0.05;
  const borderline = list.filter(x => Math.abs(x.score - minLine) <= band)
    .sort((a, b) => a.score - b.score)
    .map(x => ({ name: x.name, score: x.score }));

  return Object.assign(base, {
    empty: false,
    avg: avg, median: repMedian(scores), std: repStd(scores, avg),
    max: max, min: min, maxNames: maxNames, minNames: minNames,
    range: max - min, passList: passList, stdPassList: stdPassList,
    passRate: passList.length / ref, stdRate: stdPassList.length / ref,
    failRate: 1 - passList.length / ref,
    levels: levels, scoreRate: avg / fm, borderline: borderline
  });
}

/* 同科目在全校区的位次（按平均得分率排，避免不同班满分不同影响可比性） */
function repCampusRank(cls, exam, sub) {
  const arr = [];
  state.classList.forEach(c => {
    const st = repStats(c, exam, sub);
    if (!st.empty) arr.push({ cls: c, rate: st.scoreRate, avg: st.avg });
  });
  if (!arr.length) return null;
  arr.sort((a, b) => b.rate - a.rate);
  const idx = arr.findIndex(x => x.cls === cls);
  return {
    rank: idx >= 0 ? idx + 1 : null, count: arr.length,
    campusAvgRate: repMean(arr.map(x => x.rate)),
    best: arr[0]
  };
}

/* 与上一次考试同比 */
function repPrevCompare(cls, exam, sub) {
  const idx = state.examList.indexOf(exam);
  if (idx <= 0) return null;
  const prevExam = state.examList[idx - 1];
  const prev = repStats(cls, prevExam, sub);
  if (!prev.empty) {
    const { list: curList } = repScores(cls, exam, sub);
    const prevMap = {};
    repScores(cls, prevExam, sub).list.forEach(x => { prevMap[x.name] = x.score; });
    const moved = { up: 0, down: 0, flat: 0, upList: [], downList: [], maxUp: null, maxDown: null };
    curList.forEach(x => {
      if (!(x.name in prevMap)) return;
      const d = Math.round((x.score - prevMap[x.name]) * 10) / 10;
      if (d > 0) {
        moved.up++;
        moved.upList.push({ name: x.name, value: '+' + repFmt(d, 1), d: d });
        if (!moved.maxUp || d > moved.maxUp.d) moved.maxUp = { name: x.name, d: d };
      } else if (d < 0) {
        moved.down++;
        moved.downList.push({ name: x.name, value: repFmt(d, 1), d: d });
        if (!moved.maxDown || d < moved.maxDown.d) moved.maxDown = { name: x.name, d: d };
      } else {
        moved.flat++;
      }
    });
    return { prevExam: prevExam, prev: prev, moved: moved };
  }
  return null;
}

/* 难度评估：沿用原 VBA 的「平均分 / 满分」比例分档 */
function repDifficulty(scoreRate) {
  if (scoreRate == null) return { level: '-', mix: '-' };
  if (scoreRate < 0.6) return { level: '困难', mix: '简单题 20% · 中等题 40% · 困难题 40%' };
  if (scoreRate < 0.7) return { level: '中等偏难', mix: '简单题 30% · 中等题 40% · 困难题 30%' };
  if (scoreRate < 0.8) return { level: '中等难度', mix: '简单题 50% · 中等题 30% · 困难题 20%' };
  if (scoreRate < 0.9) return { level: '中等容易', mix: '简单题 60% · 中等题 30% · 困难题 10%' };
  return { level: '容易', mix: '简单题 70% · 中等题 30% · 困难题 0%' };
}
/* 与 VBA 写入 C12 的原句一致，导出 xlsx 时逐字使用 */
function repDifficultyText(scoreRate) {
  if (scoreRate == null) return '-';

  if (scoreRate < 0.9) return '本次考试中等容易，其中简单题占有60%，中等题占有30%，困难题占有10%';

}

function repPreferSubject(subs) {
  const order = SUBJECT_FIXED_ORDER.filter(s => !isTotal(s));
  for (let i = 0; i < order.length; i++) if (subs.includes(order[i])) return order[i];
  const first = subs.find(s => !isTotal(s));
  return first || subs[0] || '';
}
function repTeacherList(sub) {
  return REPORT_TEACHERS[sub] || REPORT_TEACHERS[normalizeSubjectKey(sub)] || [];
}
function repLoadTeacher(cls, sub) {
  try { return localStorage.getItem(REP_TEACHER_KEY + cls + '_' + sub) || ''; } catch (e) { return ''; }
}
function repSaveTeacher(cls, sub, name) {
  try {
    if (name) localStorage.setItem(REP_TEACHER_KEY + cls + '_' + sub, name);
    else localStorage.removeItem(REP_TEACHER_KEY + cls + '_' + sub);
  } catch (e) {}
}
function fillRepTeachers() {

          clsList.map(c => '<option value="' + esc(c) + '"' + (c === repState.cls ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
        '</select></div>' +
        '<div class="filter-group"><label>科目</label><select id="repSubject">' +
          subs.map(s => '<option value="' + esc(s) + '"' + (s === repState.sub ? ' selected' : '') + '>' + esc(subjectLabel(s)) + '</option>').join('') +
        '</select></div>' +
        '<div class="filter-group"><label>考试</label><select id="repExam">' +
          state.examList.map(ex => '<option value="' + esc(ex) + '"' + (ex === repState.exam ? ' selected' : '') + '>' + esc(ex) + '</option>').join('') +
        '</select></div>' +
        '<div class="filter-group"><label>任课教师</label><select id="repTeacher"></select></div>' +
      '</div>' +
      '<div class="rep-inputs">' +
        '<div class="rep-input-card">' +
          '<div class="rep-input-head"><label>考点</label><span class="rep-count" id="repExamPointCount">最多 100 字 · 当前 0 字</span></div>' +
          '<textarea id="repExamPoint" rows="3" maxlength="100" placeholder="试卷主要考核的知识点，如 进制转换、IP 地址与子网划分"></textarea>' +
          '<div class="rep-input-hint">最多 100 字（含标点），导出时写入模板 C6 单元格</div>' +
        '</div>' +
        '<div class="rep-input-card">' +
          '<div class="rep-input-head"><label>失分模块</label><span class="rep-count" id="repLoseModuleCount">最多 100 字 · 当前 0 字</span></div>' +
          '<textarea id="repLoseModule" rows="3" maxlength="100" placeholder="学生主要失分的模块，如 计算机网络组成"></textarea>' +
          '<div class="rep-input-hint">最多 100 字（含标点），导出时写入模板 I12 单元格</div>' +
        '</div>' +
      '</div>' +
      '<div class="rep-actions">' +
        '<button class="btn btn-primary" id="repExportOne">导出 XLSX（本份）</button>' +
        '<span class="info-text">按「按钮1」口径逐格填入《成绩分析模板》，导出的 xlsx 与模板版式一致</span>' +
      '</div>' +
    '</div>' +
    '<div id="repBody"></div>';

  $('repClass').addEventListener('change', () => {
    repState.cls = $('repClass').value;
    repState.sub = '';
    renderCurrentPage();
  });
  $('repSubject').addEventListener('change', () => { repState.sub = $('repSubject').value; fillRepTeachers(); fillRepExtra(); drawF8(); });
  $('repExam').addEventListener('change', () => { repState.exam = $('repExam').value; drawF8(); });
  $('repTeacher').addEventListener('change', () => {
    repSaveTeacher(repState.cls, repState.sub, $('repTeacher').value);
    drawF8();
  });
  ['repExamPoint', 'repLoseModule'].forEach(id => {
    const el = $(id);
    el.addEventListener('input', () => {
      if (el.value.length > 100) el.value = el.value.slice(0, 100);
      updateRepCounts();
      repSaveExtra(repState.cls, repState.sub, $('repExamPoint').value, $('repLoseModule').value);
    });
  });
  $('repExportOne').addEventListener('click', exportCurrentReport);

  fillRepTeachers();
  fillRepExtra();
  drawF8();
}

/* 考点 / 失分模块：按「班级 + 科目」记忆，对应 xlsm 控制面板 E/F 列 */
const REP_EXTRA_KEY = 'pw_lq_extra_';
function repLoadExtra(cls, sub) {
  try { return JSON.parse(localStorage.getItem(REP_EXTRA_KEY + cls + '_' + sub) || '{}'); } catch (e) { return {}; }
}
function repSaveExtra(cls, sub, point, lose) {
  try { localStorage.setItem(REP_EXTRA_KEY + cls + '_' + sub, JSON.stringify({ point: point || '', lose: lose || '' })); } catch (e) {}
}
function fillRepExtra() {
  if (!$('repExamPoint')) return;
  const ex = repLoadExtra(repState.cls, repState.sub);
  $('repExamPoint').value = ex.point || '';
  $('repLoseModule').value = ex.lose || '';
  updateRepCounts();
}
function updateRepCounts() {
  const p = $('repExamPoint'), l = $('repLoseModule');
  if ($('repExamPointCount')) $('repExamPointCount').textContent = '最多 100 字 · 当前 ' + (p ? p.value.length : 0) + ' 字';
  if ($('repLoseModuleCount')) $('repLoseModuleCount').textContent = '最多 100 字 · 当前 ' + (l ? l.value.length : 0) + ' 字';
}

function repCell(k, v) {
  return '<div class="rep-cell"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>';
}
function repNow() {
  const d = new Date();
  const p2 = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function repChips(title, arr, emptyText, tone) {
  const cls = tone === 'bad' ? ' rep-chip bad' : tone === 'good' ? ' rep-chip good' : ' rep-chip';
  const body = arr.length
    ? arr.map(x => '<span class="name-chip' + cls + '">' + esc(x) + '</span>').join('')
    : '<span class="rep-muted">' + esc(emptyText || '无') + '</span>';
  return '<div class="rep-chip-row"><span class="label">' + esc(title) + '</span>' + body + '</div>';
}
function repDeltaNum(d, unit, reverse) {
  if (d == null || Number.isNaN(d)) return '-';
  const v = Math.round(d * 10) / 10;
  if (Math.abs(v) < 0.05) return '<span class="rate-delta flat">0' + (unit || '') + '</span>';
  const good = reverse ? v < 0 : v > 0;
  return '<span class="rate-delta ' + (good ? 'up' : 'down') + '">' + (v > 0 ? '+' : '') + v + (unit || '') + '</span>';
}
function repDeltaPct(d) {
  if (d == null || Number.isNaN(d)) return '-';
  const v = d * 100;
  if (Math.abs(v) < 0.05) return '<span class="rate-delta flat">0.0pp</span>';
  return '<span class="rate-delta ' + (v > 0 ? 'up' : 'down') + '">' + (v > 0 ? '+' : '') + v.toFixed(1) + 'pp</span>';
}
/* 与原 VBA「b16Text」同结构的班级速览段 */
function repNarrative(st) {
  return st.cls + '总人数' + st.total + '，其中本次考试参加考试的人数为' + st.ref + '，平均分为' + repFmt(st.avg) +
    '分；最高分为' + repFmt(st.max, 1) + '，共' + st.maxNames.length + '人，名单为' + (st.maxNames.join('、') || '无') +
    '；最低分为' + repFmt(st.min, 1) + '，共' + st.minNames.length + '人，名单为' + (st.minNames.join('、') || '无') +
    '，这些人要额外特殊的关注一下。';
}

/* 综合成绩分析评价：先给结论性数字，再给进步/退步各 5 人，最后接评语 */
function repTopMoved(cmp, dir, n) {
  if (!cmp) return [];
  const list = (dir === 'up' ? cmp.moved.upList : cmp.moved.downList).slice();
  list.sort((a, b) => dir === 'up' ? b.d - a.d : a.d - b.d);
  return list.slice(0, n);
}
function repEvalCard(st, cmp, rank, diff, comment) {
  const paras = [];
  paras.push('本次「' + st.cls + '」' + st.exam + '「' + st.sub + '」参考 ' + st.ref + ' 人（名册 ' + st.total + ' 人，缺考 ' +
    st.absent + ' 人），及格率 ' + repPct(st.passRate) + '（及格线 ' + repFmt(st.minLine, 1) + ' 分）、优秀率 ' +
    repPct(st.stdRate) + '（优秀线 ' + repFmt(st.stdLine, 1) + ' 分）、不及格率 ' + repPct(st.failRate) +
    '，平均分 ' + repFmt(st.avg) + ' 分，得分率 ' + repPct(st.scoreRate) + '（难度判定：' + diff.level + '）。');

  if (cmp) {
    const dp = cmp.prev;
    const avgD = st.avg - dp.avg;
    const rateD = (st.scoreRate - dp.scoreRate) * 100;
    const passD = (st.passRate - dp.passRate) * 100;
    const stdD = (st.stdRate - dp.stdRate) * 100;
    const sign = v => (v >= 0 ? '+' : '') + repFmt(v, 1);
    const refTxt = st.ref === dp.ref ? '持平（' + st.ref + ' 人）'
      : (st.ref > dp.ref ? '增加 ' + (st.ref - dp.ref) + ' 人' : '减少 ' + (dp.ref - st.ref) + ' 人');
    paras.push('与上一次「' + cmp.prevExam + '」相比：平均分 ' + sign(avgD) + ' 分，得分率 ' + sign(rateD) + ' 个百分点，及格率 ' +
      sign(passD) + ' 个百分点，优秀率 ' + sign(stdD) + ' 个百分点；参考人数 ' + refTxt + '。');

    const up5 = repTopMoved(cmp, 'up', 5);
    const down5 = repTopMoved(cmp, 'down', 5);
    const upAll = cmp.moved.up, downAll = cmp.moved.down;
    const peak = cmp.moved.maxUp ? '，进步幅度最大的是 ' + cmp.moved.maxUp.name + '（+' + repFmt(cmp.moved.maxUp.d, 1) + ' 分）' : '';
    const drop = cmp.moved.maxDown ? '，退步幅度最大的是 ' + cmp.moved.maxDown.name + '（' + repFmt(cmp.moved.maxDown.d, 1) + ' 分）' : '';
    paras.push('本次进步 ' + upAll + ' 人、退步 ' + downAll + ' 人、持平 ' + cmp.moved.flat + ' 人' + peak + drop +
      '；下面按分差排出进步明显与退步明显各 ' + Math.min(5, Math.max(upAll, downAll)) + ' 人。');
  } else {
    paras.push('本次是该科第一次录入成绩，暂无可比的上一次考试，后续考试会自动生成平均分、及格率与进退步对比。');
  }

  if (rank && rank.rank) {
    const gap = (st.scoreRate - rank.campusAvgRate) * 100;
    paras.push('校区同科目共 ' + rank.count + ' 个班，本班得分率排第 ' + rank.rank + '，校区均值 ' + repPct(rank.campusAvgRate) +
      (gap >= 0 ? '，高出 ' + repFmt(gap, 1) + ' 个百分点。' : '，低于 ' + repFmt(-gap, 1) + ' 个百分点。'));
  }

  paras.push('本班缺考 ' + st.absent + ' 人（名册 ' + st.total + ' 人，参考率 ' + repPct(st.total ? st.ref / st.total : 0) +
    '）：' + (st.absentNames.length ? st.absentNames.join('、') : '无') + '。');
  if (cmp) {
    paras.push('本班进退步（仅算两次都有「' + st.sub + '」成绩的学生）：进步 ' + cmp.moved.up + ' 人、退步 ' + cmp.moved.down +
      ' 人、持平 ' + cmp.moved.flat + ' 人。');
  }

  const up5 = repTopMoved(cmp, 'up', 5).map(x => x.name + ' ' + x.value + ' 分');
  const down5 = repTopMoved(cmp, 'down', 5).map(x => x.name + ' ' + x.value + ' 分');
  const brief = [
    { label: '及格率（60%）', value: repPct(st.passRate), cls: st.passRate >= 0.8 ? 'font-up' : st.passRate < 0.6 ? 'font-down' : '' },
    { label: '优秀率（80%）', value: repPct(st.stdRate), cls: st.stdRate >= 0.3 ? 'font-up' : '' },
    { label: '不及格率', value: repPct(st.failRate), cls: st.failRate >= 0.4 ? 'font-down' : '' },
    { label: '平均分变化', value: cmp ? (st.avg - cmp.prev.avg >= 0 ? '+' : '') + repFmt(st.avg - cmp.prev.avg, 1) : '-',
      cls: cmp && st.avg - cmp.prev.avg > 0 ? 'font-up' : cmp && st.avg - cmp.prev.avg < 0 ? 'font-down' : '' },
    { label: '校区位次', value: rank && rank.rank ? '第 ' + rank.rank + ' / ' + rank.count : '-', cls: '' },
    { label: '参考率', value: st.total ? repPct(st.ref / st.total) : '-', cls: st.total && st.ref / st.total >= 0.95 ? 'font-up' : '' },
    { label: '缺考', value: st.absent + ' 人（' + repPct(st.total ? st.absent / st.total : 0) + '）', cls: st.absent ? 'font-down' : '' },
    { label: '进步人数', value: cmp ? cmp.moved.up + ' 人' : '-', cls: cmp && cmp.moved.up ? 'font-up' : '' },
    { label: '退步人数', value: cmp ? cmp.moved.down + ' 人' : '-', cls: cmp && cmp.moved.down ? 'font-down' : '' },
    { label: '持平人数', value: cmp ? cmp.moved.flat + ' 人' : '-' }
  ];

  return '<div class="card rep-eval">' +
    '<div class="page-title">综合成绩分析评价</div>' +
    analysisPanel([{ title: '本次考试数据结论', items: brief, paras: paras }]) +
    (cmp ? repChips('进步明显 ' + up5.length + ' 人', up5, '本次没有进步的学生', 'good') +
      repChips('退步明显 ' + down5.length + ' 人', down5, '本次没有退步的学生', 'bad') : '') +
    '<div class="rep-quote">“' + esc(comment) + '”</div>' +
    '<div class="rep-note">评语按「班级 + 科目 + 考试」稳定抽取，同一份报告每次打开都是同一条；进退步只统计两次考试都有成绩的学生。</div>' +
  '</div>';
}

function drawF8() {
  const body = $('repBody');
  if (!body) return;
  destroyCharts();
  const cls = repState.cls, exam = repState.exam, sub = repState.sub;
  const teacher = ($('repTeacher') && $('repTeacher').value) || '';
  if (!cls || !exam || !sub) { body.innerHTML = emptyTip('请选择班级、科目和考试'); return; }

  const st = repStats(cls, exam, sub);
  const fullMarkText = st.fullMark != null ? repFmt(st.fullMark, 1) : '-';

  const headHtml =
    '<div class="card rep-card">' +
      '<div class="rep-head">' +
        '<div>' +
          '<div class="rep-kicker">' + esc(CAMPUS_CONFIG.name) + ' · 27届</div>' +
          '<div class="rep-title">' + esc(cls) + ' · ' + esc(sub) + ' 单科成绩分析报告</div>' +
          '<div class="rep-sub">考试：' + esc(exam) + (teacher ? ' ｜ 任课教师：' + esc(teacher) : ' ｜ 任课教师：未指定') +
            ' ｜ 生成时间：' + repNow() + '</div>' +
        '</div>' +
        '<div class="rep-stamp"><span>本次满分</span><b>' + fullMarkText + '</b>' +
          (st.scaled ? '<em>原始 ' + repFmt(st.rawFullMark, 1) + '</em>' : '') + '</div>' +
      '</div>' +
      '<div class="rep-grid">' +
        repCell('班级', esc(cls)) + repCell('科目', esc(sub)) + repCell('考试', esc(exam)) +
        repCell('任课教师', teacher ? esc(teacher) : '未指定') +
        repCell('名册人数', st.total + ' 人') + repCell('参考人数', st.ref + ' 人') +
        repCell('缺考人数', st.absent + ' 人') + repCell('满分口径', st.scaled ? '对齐最高满分' : '本次标注满分') +
      '</div>' +
    '</div>';

  if (st.empty) {
    body.innerHTML = headHtml +
      '<div class="card"><div class="empty-hint">该班本次考试没有「' + esc(sub) + '」的有效成绩（可能整场未录入或缺考）</div></div>';
    return;
  }

  const rank = repCampusRank(cls, exam, sub);
  const diff = repDifficulty(st.scoreRate);
  const cmp = repPrevCompare(cls, exam, sub);
  const seed = cls + '|' + sub + '|' + exam;

  /* 1) 核心指标 */
  const items = [
    { label: '平均分', value: repFmt(st.avg) },
    { label: '中位数', value: repFmt(st.median) },
    { label: '标准差', value: repFmt(st.std) },
    { label: '得分率', value: repPct(st.scoreRate), cls: st.scoreRate >= 0.8 ? 'font-up' : st.scoreRate < 0.6 ? 'font-down' : '' },
    { label: '最高分', value: repFmt(st.max, 1) + '（' + st.maxNames.length + '人）', cls: 'font-up',
      tipItems: st.maxNames.map(n => ({ name: n, value: repFmt(st.max, 1) + ' 分' })) },
    { label: '最低分', value: repFmt(st.min, 1) + '（' + st.minNames.length + '人）', cls: 'font-down',
      tipItems: st.minNames.map(n => ({ name: n, value: repFmt(st.min, 1) + ' 分' })) },
    { label: '极差', value: repFmt(st.range) },
    { label: '及格率（' + repFmt(st.minLine, 1) + '分）', value: repPct(st.passRate),
      cls: st.passRate >= 0.8 ? 'font-up' : st.passRate < 0.6 ? 'font-down' : '',
      tipItems: st.passList.map(x => ({ name: x.name, value: repFmt(x.score, 1) + ' 分' })) },
    { label: '优秀率（' + repFmt(st.stdLine, 1) + '分）', value: repPct(st.stdRate),
      cls: st.stdRate >= 0.3 ? 'font-up' : st.stdRate <= 0.05 ? 'font-flat' : '',
      tipItems: st.stdPassList.map(x => ({ name: x.name, value: repFmt(x.score, 1) + ' 分' })) },
    { label: '不及格率', value: repPct(st.failRate), cls: st.failRate >= 0.4 ? 'font-down' : '' },
    { label: '校区位次', value: rank && rank.rank ? '第 ' + rank.rank + ' / ' + rank.count : '-',
      tipItems: rank ? [{ name: rank.best.cls, value: '得分率 ' + repPct(rank.best.rate) }] : null },
    { label: '校区得分率均值', value: rank ? repPct(rank.campusAvgRate) : '-' }
  ];
  const paras = [repNarrative(st)];
  if (rank && rank.rank) {
    const gap = (st.scoreRate - rank.campusAvgRate) * 100;
    paras.push('全校同科目共 ' + rank.count + ' 个班参与统计，本班平均得分率排第 ' + rank.rank + '，校区均值为 ' + repPct(rank.campusAvgRate) +
      (gap >= 0 ? '，高出校区均值 ' + repFmt(gap, 1) + ' 个百分点。' : '，低于校区均值 ' + repFmt(-gap, 1) + ' 个百分点。'));
  }
  const metricsHtml = analysisPanel([{ title: '核心指标', items: items, paras: paras }]);

  /* 2) 分数段分布 */
  const segOrder = ['d', 'c', 'b', 'a', 's'];
  const segLabels = { d: '不及格（<60%）', c: '及格（60%~70%）', b: '中等（70%~80%）', a: '良好（80%~90%）', s: '优秀（≥90%）' };
  const segRows = segOrder.map(k => {
    const c = st.levels[k];
    return { key: k, label: segLabels[k], count: c.count, ratio: st.ref ? c.count / st.ref : 0, names: c.names };
  });
  const segCols = [
    { label: '分数段', width: 200, sticky: true, sortable: false, render: r => '<td class="cell-subject">' + esc(r.label) + '</td>' },
    { label: '人数', width: 100, sortable: false, render: r => '<td><span class="count-cell" data-tip-title="' + esc(r.label) + '（' + r.count + ' 人）" data-tip-items=\'' + JSON.stringify(r.names.map(n => ({ name: n, value: '—' }))).replace(/'/g, '&#39;') + '\'>' + r.count + '</span></td>' },
    { label: '占比', width: 120, sortable: false, render: r => '<td class="rate-cell ' + (r.ratio >= 0.8 ? 'rate-good' : r.ratio >= 0.5 ? 'rate-mid' : 'rate-low') + '">' + repPct(r.ratio) + '</td>' },
    { label: '对应分数线', width: 180, sortable: false, render: r => {
        const fm = st.fullMark;
        const line = { d: fm * 0.6, c: fm * 0.6, b: fm * 0.7, a: fm * 0.8, s: fm * 0.9 }[r.key];
        return '<td>' + (r.key === 'd' ? '< ' + repFmt(line, 1) : '≥ ' + repFmt(line, 1)) + '</td>';
      } }
  ];
  const segHtml =
    '<div class="card">' +
      '<div class="page-title">分数段分布</div>' +
      '<div class="chart-grid-2" style="margin-bottom:14px">' +
        '<div class="chart-card"><h4>分数段人数</h4><div class="chart-box"><canvas id="repSegChart"></canvas></div></div>' +
        '<div class="chart-card"><h4>分数段占比（%）</h4><div class="chart-box"><canvas id="repSegRatioChart"></canvas></div></div>' +
      '</div>' +
      '<div id="repSegTable"></div>' +
    '</div>';

  /* 3) 难度与试卷结构 */
  const diffHtml =
    '<div class="card">' +
      '<div class="page-title">考试难度评估</div>' +
      '<div class="rep-grid rep-grid-3">' +
        repCell('平均得分率', repPct(st.scoreRate)) +
        repCell('难度判定', '<span class="rep-diff">' + esc(diff.level) + '</span>') +
        repCell('试卷结构推断', esc(repDifficultyText(st.scoreRate))) +
      '</div>' +
      '<div class="rep-note">判定规则同 xlsm「按钮1」：平均分 ÷ 满分 &lt; 60% 记困难，60%~70% 中等偏难，70%~80% 中等难度，80%~90% 中等容易，≥90% 容易。难度只反映本次试卷与学生水平的匹配度，不作为教学评价依据。</div>' +
    '</div>';

  /* 4) 与上一次考试对比 */
  let cmpHtml = '';
  let cmpRows = null, cmpCols = null;
  if (cmp) {
    const p = cmp.prev;
    cmpRows = [
      { name: '参考人数', cur: st.ref + ' 人', prev: p.ref + ' 人', delta: repDeltaNum(st.ref - p.ref, ' 人') },
      { name: '平均分', cur: repFmt(st.avg), prev: repFmt(p.avg), delta: repDeltaNum(st.avg - p.avg) },
      { name: '得分率', cur: repPct(st.scoreRate), prev: repPct(p.scoreRate), delta: repDeltaPct(st.scoreRate - p.scoreRate) },
      { name: '及格率', cur: repPct(st.passRate), prev: repPct(p.passRate), delta: repDeltaPct(st.passRate - p.passRate) },

        '<div class="rep-note">对比采用当前「分值对齐」口径：两次满分不同时已按最高满分折算，因此分差可直接比较。</div>' +
      '</div>';
  } else {

      '<div class="empty-hint">本次是该科第一次录入成绩，暂无可比的上一次考试</div></div>';

  /* 5) 重点关注学生 */
  const focusHtml =

      repChips('最高分（' + st.maxNames.length + ' 人）', st.maxNames, '', 'good') +

        st.borderline.map(x => x.name + ' ' + repFmt(x.score, 1)), '无') +

  /* 6) 综合评语 —— 已并入「综合成绩分析评价」，这里只保留落地顺序 */

  if (cmp && cmpRows) {

/* ---------- 导出：按《成绩分析模板》逐格填入，生成 xlsx ---------- */
const REP_TPL_PART = 'xl/worksheets/sheet1.xml';

function repLineNum(v) {
  if (v == null || Number.isNaN(v)) return '';
  const r = Math.round(v * 10) / 10;
  return String(r);
}
/* 报告日期：取考试日期（表头形如「8.8周测」→ 2026年08月08日，同 VBA 的 yyyy年mm月dd日 格式） */
function repExamDate(exam) {
  const m = String(exam || '').match(/^\s*(\d{1,2})\.(\d{1,2})/);
  const p2 = n => String(n).padStart(2, '0');
  if (m) return '2026年' + p2(+m[1]) + '月' + p2(+m[2]) + '日';
  const d = new Date();
  return d.getFullYear() + '年' + p2(d.getMonth() + 1) + '月' + p2(d.getDate()) + '日';
}
function repExamKind(exam) {
  return /入学/.test(String(exam || '')) ? '入学测' : '周测';
}
function repB64ToU8(b64) {
  const s = atob(b64);
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
function repXmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function repColIndex(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n;
}

/* 换掉某个单元格的值（保留模板原有样式 s；文字用 inlineStr，数字用 v） */
function repSetCell(xml, ref, value, isNum) {
  const row = ref.replace(/\D+/g, '');
  const cellRe = new RegExp('<c r="' + ref + '"[^>]*?(?:/>|>[\\s\\S]*?</c>)');
  const m = xml.match(cellRe);
  const sMatch = m && m[0].match(/\ss="\d+"/);
  const sAttr = sMatch ? sMatch[0] : '';
  let cell;
  if (isNum) {
    const num = Number(value);
    cell = '<c r="' + ref + '"' + sAttr + ' t="n"><v>' + (Number.isFinite(num) ? num : 0) + '</v></c>';
  } else {
    cell = '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' +
      repXmlEsc(value) + '</t></is></c>';
  }
  if (m) return xml.replace(cellRe, cell);
  /* 模板里没有这一格：插进对应行，并按列顺序重排 */
  const rowRe = new RegExp('<row r="' + row + '"[^>]*>([\\s\\S]*?)</row>');
  const rm = xml.match(rowRe);
  if (!rm) return xml;
  const rowOpen = rm[0].match(/<row r="\d+"[^>]*>/)[0];
  const cells = [];
  const cRe = /<c r="([A-Z]+)\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g;
  let cm;
  const inner = rm[1] + cell;
  while ((cm = cRe.exec(inner))) cells.push({ col: repColIndex(cm[1]), x: cm[0] });
  cells.sort((a, b) => a.col - b.col);
  return xml.replace(rowRe, rowOpen + cells.map(c => c.x).join('') + '</row>');
}

/* 生成一份报告 xlsx 的字节流 */
function repBuildReportXlsx(st, meta) {
  if (!window.__REPORT_TPL_B64) throw new Error('缺少《成绩分析模板》数据，请重新构建页面');
  if (!window.fflate) throw new Error('缺少打包组件 fflate');
  const files = fflate.unzipSync(repB64ToU8(window.__REPORT_TPL_B64));
  if (!files[REP_TPL_PART]) throw new Error('模板结构异常：缺少工作表 XML');
  let xml = fflate.strFromU8(files[REP_TPL_PART]);

  const fm = st.fullMark;
  const a1 = fm * 0.9, a2 = fm * 0.8, a3 = fm * 0.7, a4 = fm * 0.6;   /* 同 VBA A(1..4) */
  const cnt = {
    d: st.levels.d.count, c: st.levels.c.count, b: st.levels.b.count,
    a: st.levels.a.count, s: st.levels.s.count
  };
  const ref = st.ref;
  const passN = cnt.c + cnt.b + cnt.a + cnt.s;     /* VBA: cnt2+cnt3+cnt4+cnt5 */
  const stdN = cnt.a + cnt.s;                      /* VBA: cnt4+cnt5 */

  const rows = [
    ['C4', meta.date, 0],
    ['C5', st.sub, 0],
    ['F5', meta.teacher || '未指定', 0],
    ['I5', st.cls, 0],
    ['L5', st.total, 1],
    ['M5', ref, 1],
    ['C6', meta.point || '', 0],
    ['C11', meta.kind || repExamKind(st.exam), 0],
    ['D8', repLineNum(a4) + '以下（不及格）', 0],
    ['F8', repLineNum(a4) + '-' + repLineNum(a3) + '（及格）', 0],
    ['H8', repLineNum(a3) + '-' + repLineNum(a2) + '（中等）', 0],
    ['J8', repLineNum(a2) + '-' + repLineNum(a1) + '（良好）', 0],
    ['L8', repLineNum(a1) + '以上（优秀）', 0],
    ['D9', cnt.d, 1],
    ['F9', cnt.c, 1],
    ['H9', cnt.b, 1],
    ['J9', cnt.a, 1],
    ['L9', cnt.s, 1],
    ['H10', '及格率（' + repLineNum(a4) + '分）', 0],
    ['J10', '优秀率（' + repLineNum(a2) + '分）', 0],
    ['L10', '不及格率（' + repLineNum(a4) + '分）', 0],
    ['D11', fm, 1],
    ['F11', Math.round(st.avg * 100) / 100, 1],
    ['H11', passN / ref, 1],
    ['J11', stdN / ref, 1],
    ['L11', cnt.d / ref, 1],
    ['C12', repDifficultyText(st.scoreRate), 0],
    ['I12', meta.lose || '', 0],
    ['B16', repNarrative(st) + (meta.comment || ''), 0]
  ];
  rows.forEach(r => { xml = repSetCell(xml, r[0], r[1], !!r[2]); });

  files[REP_TPL_PART] = fflate.strToU8(xml);
  return fflate.zipSync(files, { level: meta.fast ? 1 : 6 });
}

function repXlsxName(st, meta) {
  const compact = String(meta.date || '').replace(/[年月日]/g, '');
  return sanitizeFileName(compact + st.cls + st.sub + '成绩分析') + '.xlsx';
}
function repDownload(name, bytes) {
  const blob = new Blob([bytes], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}
function repDownloadZip(name, bytes) {
  const blob = new Blob([bytes], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}

/* 当前这份报告的元信息（教师 / 考点 / 失分模块 / 日期 / 评语） */
function repMetaNow(st) {
  const date = repExamDate(st.exam);
  return {
    teacher: ($('repTeacher') && $('repTeacher').value) || '',
    point: $('repExamPoint') ? $('repExamPoint').value.trim().slice(0, 100) : '',
    lose: $('repLoseModule') ? $('repLoseModule').value.trim().slice(0, 100) : '',
    date: date,
    kind: repExamKind(st.exam),
    comment: repComment(st.cls + '|' + st.sub + '|' + st.exam)
  };
}
function repMetaFor(cls, sub, exam) {
  const ex = repLoadExtra(cls, sub);
  return {
    teacher: repLoadTeacher(cls, sub) ||
      (window.Auth && Auth.teacherDefault ? Auth.teacherDefault(cls, sub) : ''),
    point: (ex.point || '').slice(0, 100),
    lose: (ex.lose || '').slice(0, 100),
    date: repExamDate(exam),
    kind: repExamKind(exam),
    comment: repComment(cls + '|' + sub + '|' + exam),
    fast: true
  };
}

function exportCurrentReport() {
  if (!repState.cls || !repState.sub || !repState.exam) { alert('请先选择班级、科目和考试'); return; }
  const st = repStats(repState.cls, repState.exam, repState.sub);
  if (st.empty) { alert('该班本次考试没有「' + repState.sub + '」的有效成绩，无法导出'); return; }
  try {
    const meta = repMetaNow(st);
    const bytes = repBuildReportXlsx(st, meta);
    repDownload(repXlsxName(st, meta), bytes);
  } catch (e) {
    console.error(e);
    alert('导出失败：' + e.message);
  }
}

function repSetBusy(btn, text) {
  if (!btn) return;
  if (!btn.dataset.oldText) btn.dataset.oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = text;
}
function repClearBusy(btn) {
  if (!btn) return;
  btn.disabled = false;
  btn.textContent = btn.dataset.oldText || '批量导出';
  delete btn.dataset.oldText;
}
const repSleep = ms => new Promise(r => setTimeout(r, ms));

async function repRunBatch(pairs, btn) {
  if (!pairs.length) { alert('没有可导出的报告'); return; }
  if (!confirm('将按《成绩分析模板》生成 ' + pairs.length +
    ' 份 xlsx 报告（每份约 0.9MB），并打包成一个 zip 下载。是否继续？')) return;
  repSetBusy(btn, '准备中…');
  const zipFiles = {};
  let done = 0;
  try {
    for (let i = 0; i < pairs.length; i++) {
      const p = pairs[i];
      repSetBusy(btn, '生成中 ' + (i + 1) + '/' + pairs.length + '：' + p.cls + ' · ' + p.sub);
      const st = repStats(p.cls, p.exam, p.sub);
      if (!st.empty) {
        const meta = repMetaFor(p.cls, p.sub, p.exam);
        zipFiles[repXlsxName(st, meta)] = repBuildReportXlsx(st, meta);
        done++;
      }
      if (i % 5 === 4) await repSleep(20);
    }
    if (!done) { alert('没有可导出的有效成绩'); repClearBusy(btn); return; }
    const zipBytes = fflate.zipSync(zipFiles, { level: 0 });
    const zipName = sanitizeFileName((repState.exam || '考试') + '单科成绩分析-xlsx') + '.zip';
    repDownloadZip(zipName, zipBytes);
    fillRepExtra();
    btn.textContent = '已导出 ' + done + ' 份 ✓';
    setTimeout(() => repClearBusy(btn), 2600);
  } catch (e) {
    console.error(e);
    alert('批量导出中断：' + e.message);
    repClearBusy(btn);
  }
}

function exportReportsByClassSubjects() {

  const subs = getClassSubjects(cls).filter(s => !repStats(cls, repState.exam, s).empty);

/* ==========================================================================
 * 快速报表（F9）：一次配多个模块，每模块可放多个班级，一键生成 xlsx
 * 模块数量可变，卡片按网格自动重排（窄屏自动单列）
 * ========================================================================== */
const QR_KEY = 'pw_lq_quick_v1';
const qrState = { sub: '', exam: '', modules: [], autoKey: '' };

function qrSave() {
  try { localStorage.setItem(QR_KEY, JSON.stringify(qrState)); } catch (e) {}
}
function qrLoad() {
  try {
    const o = JSON.parse(localStorage.getItem(QR_KEY) || '{}');
    if (o && Array.isArray(o.modules) && o.modules.length) {
      qrState.sub = o.sub || '';
      qrState.exam = o.exam || '';
      qrState.owner = o.owner || '';
      qrState.autoKey = o.autoKey || '';
      qrState.modules = o.modules.map(m => ({
        classes: Array.isArray(m.classes) ? m.classes.slice() : [],
        fm: m.fm == null ? '' : String(m.fm),
        teacher: m.teacher || '',
        point: m.point || '',
        lose: m.lose || ''
      }));
    }
  } catch (e) {}
}
function qrIsTotal(s) { return /^总分/.test(String(s || '')); }
function qrPool(sub) {
  if (!sub) return [];
  return state.classList.filter(c => getClassSubjects(c).indexOf(sub) >= 0);
}
function qrDefaultTeacher() {
  const u = (window.Auth && Auth.currentUser) ? Auth.currentUser() : null;
  return u && u.role === 'teacher' ? u.name : '';
}
/* 任课老师下拉备选：全校区教师名单（可手填，也可以从下拉里选别的老师） */
function qrTeacherNames() {
  try {
    if (window.Auth && Auth.teacherNames) {
      const list = Auth.teacherNames();
      if (list && list.length) return list;
    }
  } catch (e) {}
  const names = [];
  state.classList.forEach(c => {
    const n = repLoadTeacher(c, qrState.sub);
    if (n && names.indexOf(n) < 0) names.push(n);
  });
  const d = qrDefaultTeacher();
  if (d && names.indexOf(d) < 0) names.push(d);
  return names;
}
function qrNewModule(classes) {
  return { classes: classes || [], fm: '', teacher: qrDefaultTeacherFor(classes || []), point: '', lose: '' };
}
/* 本模块的任课老师：优先取这些班已保存的任课老师，取不到再回落到当前登录人 */
function qrDefaultTeacherFor(classes) {
  for (let k = 0; k < classes.length; k++) {
    const n = repLoadTeacher(classes[k], qrState.sub);
    if (n) return n;
  }
  return qrDefaultTeacher();
}
/* 单个班级在「当前科目 + 当前考试」下的满分（与导出同口径：开了对齐就用对齐后的满分） */
function qrClassFm(cls) {
  try {
    const fm = repFullMark(cls, qrState.exam, qrState.sub).value;
    return (fm == null || Number.isNaN(Number(fm))) ? null : Number(fm);
  } catch (e) { return null; }
}
function qrFmText(fm) { return fm == null ? '未标注' : String(Number(fm)); }
/* 把本科目全部班级按「本次满分」分组，用于自动划分模块 */
function qrPoolGroups(sub, exam) {
  const pool = qrPool(sub);
  const map = {};
  pool.forEach(c => {
    let fm = null;
    try {
      const v = repFullMark(c, exam, sub).value;
      fm = (v == null || Number.isNaN(Number(v))) ? null : Number(v);
    } catch (e) { fm = null; }
    const key = fm == null ? '?' : String(fm);
    if (!map[key]) map[key] = { fm: fm, classes: [] };
    map[key].classes.push(c);
  });
  return Object.keys(map).map(k => map[k]).sort((a, b) => (b.fm || 0) - (a.fm || 0));
}
/* 科目 / 考试一变就重新按满分分组；同科目同考试内已有的考点、失分、老师文字尽量保留 */
function qrAutoModules(sub, exam, prev, samePaper) {
  const groups = qrPoolGroups(sub, exam);
  const kept = (samePaper && prev && prev.length) ? prev : [];
  if (!groups.length) {
    return [{ classes: [], fm: '', teacher: qrDefaultTeacher(), point: '', lose: '' }];
  }
  return groups.map((g, idx) => {
    const old = kept.filter(m => String(m.fm) === String(g.fm))[0] || (groups.length === kept.length ? kept[idx] : null) || {};
    return {
      classes: g.classes.slice(),
      fm: g.fm == null ? '' : String(g.fm),
      teacher: old.teacher || qrDefaultTeacherFor(g.classes),
      point: old.point || '',
      lose: old.lose || ''
    };
  });
}
function qrDefaultFmTip(sub, exam, cls) {
  try {
    const st = repStats(cls, exam, sub);
    return st && st.fullMark ? '留空自动取本次满分 ' + repLineNum(st.fullMark) : '留空自动取数据里的满分';
  } catch (e) { return '留空自动取数据里的满分'; }
}
function qrEnsure() {
  const u = (window.Auth && Auth.currentUser) ? Auth.currentUser() : null;
  const mode = (window.Auth && Auth.mode) ? Auth.mode() : 'self';
  const leader = mode === 'leader';
  /* 换人 / 换身份：模块配置按「谁在用」隔离，避免上一个人的班级串到这个人界面 */
  const owner = (u ? u.u : '') + '|' + mode;
  if (qrState.owner !== owner) {
    qrState.owner = owner;
    qrState.sub = '';
    qrState.exam = '';
    qrState.modules = [];
    qrState.autoKey = '';
  }
  if (!qrState.sub || state.subjectList.indexOf(qrState.sub) < 0) {
    const ts = (window.Auth && Auth.teacherSubject) ? Auth.teacherSubject() : '';
    const totalSub = state.subjectList.filter(qrIsTotal)[0];
    if (leader && totalSub) qrState.sub = totalSub;
    else qrState.sub = (ts && state.subjectList.indexOf(ts) >= 0) ? ts : (totalSub || repPreferSubject(state.subjectList) || state.subjectList[0]);
  }
  if (!qrState.exam || state.examList.indexOf(qrState.exam) < 0) qrState.exam = state.examList[state.examList.length - 1];

  /* 关键：科目 / 考试 / 满分规则一变，就按分值重新划分模块（不同满分各成一个模块） */
  const align = state.alignEnabled ? '1' : '0';
  const key = qrState.sub + '|' + qrState.exam + '|' + align;
  if (qrState.autoKey !== key) {
    const samePaper = !!qrState.autoKey && qrState.autoKey.split('|')[0] === qrState.sub;
    qrState.modules = qrAutoModules(qrState.sub, qrState.exam, qrState.modules, samePaper);
    qrState.autoKey = key;
  }
  if (!qrState.modules.length) qrState.modules = qrAutoModules(qrState.sub, qrState.exam, null, false);
  /* 科目/数据变了：把已选班级里不存在的清掉 */
  const pool = qrPool(qrState.sub);
  qrState.modules.forEach(m => { m.classes = m.classes.filter(c => pool.indexOf(c) >= 0); });
}

function qrModuleHtml(m, i) {
  const pool = qrPool(qrState.sub);
  const first = m.classes[0] || '';
  /* 班级选择：本科目班级全部列成开关，点一下加入 / 再点一下移除，后面灰字是该班本次满分；
     已选的排在前面，一眼能看出这个模块拿了哪些班 */
  const ordered = pool.filter(c => m.classes.indexOf(c) >= 0).concat(pool.filter(c => m.classes.indexOf(c) < 0));
  const chips = pool.length ? ordered.map(c => {
    const on = m.classes.indexOf(c) >= 0;
    const fm = qrClassFm(c);
    return '<span class="qr-pchip' + (on ? ' on' : '') + '" data-qr="cls" data-i="' + i + '" data-cls="' + esc(c) +
      '" title="' + (on ? '点击移除 ' : '点击加入 ') + esc(c) + '"><b>' + esc(c) + '</b><em>' + esc(qrFmText(fm)) + '</em></span>';
  }).join('') : '<span class="qr-allin">本科目暂无可选班级</span>';
  const tools = pool.length ? '<div class="qr-cls-tools">' +
    '<span class="qr-tip qr-tip-full">点班级加入 / 移除，灰数字是本次满分；已选 ' + m.classes.length + ' / ' + pool.length + ' 班</span>' +
    '<button class="qr-mini" type="button" data-qr="allcls" data-i="' + i + '">全部加入</button>' +
    '<button class="qr-mini" type="button" data-qr="clear" data-i="' + i + '">清空</button>' +
    '</div>' : '';
  const headFm = m.fm ? '<span class="qr-mod-fm">满分 ' + esc(qrFmText(Number(m.fm))) + '</span>' : '';
  /* 手加进别的分值的班时给出提示，避免分数线算错还以为没提醒 */
  let mixed = [];
  if (m.fm) {
    m.classes.forEach(c => {
      const fm = qrClassFm(c);
      if (fm != null && String(fm) !== String(Number(m.fm))) mixed.push(c + '（' + qrFmText(fm) + ' 分）');
    });
  }
  const warn = mixed.length
    ? '<div class="qr-warn">注意：' + esc(mixed.join('、')) + ' 的实际满分与模块满分 ' + esc(qrFmText(Number(m.fm))) +
      ' 不一致，本模块导出统一按 ' + esc(qrFmText(Number(m.fm))) + ' 分算（要按原分值请单独建模块）</div>'
    : '';
  return '<div class="qr-mod" data-mod="' + i + '">' +
    '<div class="qr-mod-head"><span class="qr-mod-no">第 ' + (i + 1) + ' 模块</span>' + headFm +
      (qrState.modules.length > 1 ? '<button class="qr-del" type="button" data-qr="del" data-i="' + i + '">删除模块</button>' : '') +
    '</div>' +
    '<div class="qr-row"><span class="qr-lb">班级列表</span>' +
      '<div class="qr-field"><div class="qr-pool">' + chips + '</div>' + tools + warn + '</div></div>' +
    '<div class="qr-row"><span class="qr-lb">总分</span>' +
      '<input class="qr-input" type="number" min="1" step="1" data-qr="fm" data-i="' + i + '" value="' + esc(m.fm) + '" placeholder="' +
        esc(qrDefaultFmTip(qrState.sub, qrState.exam, first)) + '"></div>' +
    '<div class="qr-row"><span class="qr-lb">任课老师</span>' +
      '<input class="qr-input" type="text" list="qrTeacherList" data-qr="teacher" data-i="' + i + '" value="' + esc(m.teacher) +
        '" placeholder="默认当前登录用户，可直接改或从下拉选"></div>' +
    '<div class="qr-row"><span class="qr-lb">相关考点</span><div class="qr-field">' +
      '<span class="qr-count" id="qrPointCount' + i + '">最多 100 字 · 当前 ' + (m.point || '').length + ' 字</span>' +
      '<textarea class="qr-ta" rows="3" maxlength="100" data-qr="point" data-i="' + i + '" placeholder="试卷主要考核的知识点">' + esc(m.point) + '</textarea>' +
    '</div></div>' +
    '<div class="qr-row"><span class="qr-lb">失分模块</span><div class="qr-field">' +
      '<span class="qr-count" id="qrLoseCount' + i + '">最多 100 字 · 当前 ' + (m.lose || '').length + ' 字</span>' +
      '<textarea class="qr-ta" rows="3" maxlength="100" data-qr="lose" data-i="' + i + '" placeholder="学生主要失分的模块">' + esc(m.lose) + '</textarea>' +
    '</div></div>' +
    '<div class="qr-mod-foot"><button class="btn btn-primary qr-one" type="button" data-qr="one" data-i="' + i + '">一键生成第 ' + (i + 1) + ' 模块</button></div>' +
  '</div>';
}

function renderF9(root) {

  $('qrExam').addEventListener('change', () => {
    qrState.exam = $('qrExam').value;

    qrSave(); renderCurrentPage();
  });
  $('qrAdd').addEventListener('click', () => {
    qrState.modules.push(qrNewModule([]));

  root.querySelectorAll('[data-qr]').forEach(node => {
    const act = node.dataset.qr;
    const i = Number(node.dataset.i);
    if (act === 'del') {
      node.addEventListener('click', () => {
        if (qrState.modules.length <= 1) return;
        qrState.modules.splice(i, 1);
        qrSave(); renderCurrentPage();
      });
    } else if (act === 'cls') {
      node.addEventListener('click', () => {
        const cls = node.dataset.cls;
        const list = qrState.modules[i].classes;
        const at = list.indexOf(cls);
        if (at >= 0) list.splice(at, 1);
        else {
          list.push(cls);
          /* 新加入的班如果和模块满分不一致，提示而不是强改（满分仍可手填） */
        }
        if (!qrState.modules[i].teacher) qrState.modules[i].teacher = qrDefaultTeacherFor(list);
        qrSave(); renderCurrentPage();
      });
    } else if (act === 'allcls') {
      node.addEventListener('click', () => {

        if (!qrState.modules[i].teacher) qrState.modules[i].teacher = qrDefaultTeacherFor(qrState.modules[i].classes);
        qrSave(); renderCurrentPage();
      });
    } else if (act === 'clear') {
      node.addEventListener('click', () => {
        qrState.modules[i].classes = [];
        qrSave(); renderCurrentPage();
      });
    } else if (act === 'point' || act === 'lose') {
      node.addEventListener('input', () => {
        if (node.value.length > 100) node.value = node.value.slice(0, 100);
        qrState.modules[i][act] = node.value;

        if (cnt) cnt.textContent = '最多 100 字 · 当前 ' + node.value.length + ' 字';
        qrSave();

      node.addEventListener('input', () => { qrState.modules[i][act] = node.value; qrSave(); });
    } else if (act === 'one') {
      node.addEventListener('click', () => qrGenerate([i], node));
    }
  });

  $('qrAll').addEventListener('click', () => qrGenerate(qrState.modules.map((m, i) => i), $('qrAll')));
}

/* 生成指定模块：每班一份 xlsx，多份打包 */
async function qrGenerate(indexes, btn) {
  const sub = qrState.sub, exam = qrState.exam;
  if (!sub || !exam) { alert('请先选择科目和考试'); return; }
  const pairs = [];
  indexes.forEach(i => {
    const m = qrState.modules[i];
    if (!m) return;
    m.classes.forEach(c => pairs.push({ mod: i, cls: c, m: m }));
  });
  if (!pairs.length) { alert('所选模块还没有班级，请先在「班级列表」里添加'); return; }
  if (!window.__REPORT_TPL_B64) { alert('缺少《成绩分析模板》数据，请重新构建页面'); return; }

  const oldText = btn.textContent;
  btn.disabled = true;
  const files = {};
  let done = 0, skip = 0;
  try {
    for (let k = 0; k < pairs.length; k++) {
      const p = pairs[k];
      btn.textContent = '生成中 ' + (k + 1) + '/' + pairs.length + '：' + p.cls;
      const st = repStats(p.cls, exam, sub, p.m.fm ? Number(p.m.fm) : null);
      if (st.empty) { skip++; continue; }
      const meta = {
        teacher: p.m.teacher || qrDefaultTeacher(),
        point: (p.m.point || '').slice(0, 100),
        lose: (p.m.lose || '').slice(0, 100),
        date: repExamDate(exam),
        kind: repExamKind(exam),
        comment: repComment(p.cls + '|' + sub + '|' + exam),
        fast: true
      };
      let name = repXlsxName(st, meta);
      while (files[name]) name = name.replace(/\.xlsx$/, ' (2).xlsx');
      files[name] = repBuildReportXlsx(st, meta);
      done++;
      if (k % 3 === 2) await repSleep(20);
    }
    if (!done) { alert('这些班级在本次考试里没有「' + sub + '」的有效成绩，无法生成'); btn.disabled = false; btn.textContent = oldText; return; }
    if (done === 1) {
      const only = Object.keys(files)[0];
      repDownload(only, files[only]);
    } else {
      const zipBytes = fflate.zipSync(files, { level: 0 });
      repDownloadZip(sanitizeFileName(exam + '快速报表-xlsx') + '.zip', zipBytes);
    }
    const hint = $('qrHint');
    if (hint) hint.textContent = '已生成 ' + done + ' 份' + (skip ? '，跳过 ' + skip + ' 个无成绩的班' : '');
    btn.textContent = '已生成 ' + done + ' 份 ✓';
    setTimeout(() => { btn.disabled = false; btn.textContent = oldText; }, 2400);
  } catch (e) {
    console.error(e);
    alert('生成失败：' + e.message);
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* 身份切换钩子：组长身份默认落到「总分 + 全部班级」，个人身份回到自己的科目 */
window.__REP_MODE_SYNC = function (mode) {

    } else {
      repState.cls = '';
      repState.sub = '';
    }
