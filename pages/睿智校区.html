<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>睿智校区成绩分析</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>if(!window.Chart){document.write('<script src="https://fastly.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>');}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>if(!window.XLSX){document.write('<script src="https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>if(!window.html2canvas){document.write('<script src="https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"><\/script>');}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>if(!window.jspdf){document.write('<script src="https://fastly.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>');}</script>
<style>
:root{
  --primary:#4f46e5;--primary-dark:#4338ca;--primary-darker:#3730a3;
  --accent:#06b6d4;--accent-dark:#0891b2;
  --text-main:#0f172a;--text-sub:#334155;--text-muted:#64748b;
  --up:#16a34a;--down:#dc2626;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  --glass-soft:rgba(255,255,255,.5);
  --stroke:rgba(255,255,255,.72);
  --stroke-soft:rgba(15,23,42,.07);
  --shadow-s:0 2px 10px rgba(15,23,42,.05);
  --shadow-m:0 8px 30px rgba(15,23,42,.08);
  --shadow-l:0 18px 50px rgba(15,23,42,.12);
  --radius:18px;--radius-s:12px;
  --blur:saturate(180%) blur(20px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-main);
  background:#eef2f9;
  min-height:100vh;line-height:1.6;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
/* ===== 背景光斑：柔和、低饱和、固定 ===== */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% 8%, rgba(99,102,241,.20), transparent 62%),
    radial-gradient(820px 560px at 88% 12%, rgba(6,182,212,.18), transparent 60%),
    radial-gradient(760px 700px at 70% 92%, rgba(168,85,247,.14), transparent 62%),
    radial-gradient(700px 520px at 20% 88%, rgba(59,130,246,.14), transparent 60%),
    linear-gradient(160deg,#f4f7fd 0%,#eaeff8 45%,#f2f5fb 100%);
  background-attachment:fixed;
}
#particleCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.34}

/* ===== 顶栏：毛玻璃吸顶 ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-bottom:1px solid var(--stroke-soft);
  box-shadow:0 4px 24px rgba(15,23,42,.07);
}
.topbar-inner{max-width:1800px;margin:0 auto;padding:0 24px}
.topbar-main{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0}
.topbar-main h1{
  font-size:1.24rem;font-weight:800;color:var(--primary-darker);letter-spacing:-.4px;
  white-space:nowrap;display:flex;align-items:center;gap:10px;margin:0;
}
.topbar-main h1::before{
  content:'';display:inline-block;width:5px;height:22px;border-radius:3px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--accent),var(--primary));
}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topbar-settings{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 0 13px;border-top:1px solid var(--stroke-soft);
}
.setting-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setting-group-title{
  font-size:.72rem;font-weight:800;color:var(--primary-dark);letter-spacing:1.1px;
  padding:3px 10px;border-radius:99px;background:rgba(79,70,229,.10);
  border:1px solid rgba(79,70,229,.14);white-space:nowrap;flex:0 0 auto;
}
.setting-group.rate .setting-group-title{color:#15803d;background:rgba(22,163,74,.11);border-color:rgba(22,163,74,.16)}
.setting-group.align .setting-group-title{color:#0e7490;background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.2)}
.setting-fields{display:flex;gap:6px;flex-wrap:wrap}
.setting-divider{width:1px;height:24px;background:rgba(15,23,42,.10);flex:0 0 auto}
.line-setting{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:10px;
  background:var(--glass-strong);border:1px solid var(--stroke-soft);font-size:.78rem;
  box-shadow:var(--shadow-s);transition:border-color .18s,box-shadow .18s;
}
.line-setting:hover{border-color:rgba(79,70,229,.32)}
.line-setting:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
.line-setting .setting-label{font-weight:700;color:var(--text-muted);white-space:nowrap;font-size:.75rem}
.line-setting input{
  width:48px;padding:2px 4px;border:none;outline:none;background:transparent;
  font-size:.86rem;font-weight:800;color:var(--primary-darker);text-align:center;
  font-family:inherit;font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.line-setting input::-webkit-outer-spin-button,.line-setting input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.line-setting .unit{font-size:.72rem;color:var(--text-muted);font-weight:700}
.line-setting.rate-setting{background:rgba(240,253,244,.9);border-color:rgba(22,163,74,.18)}
.line-setting.rate-setting:hover{border-color:rgba(22,163,74,.42)}
.line-setting.rate-setting input{color:#15803d}

/* ===== 开关 ===== */
.switch{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  padding:4px 12px 4px 6px;border-radius:99px;background:var(--glass-strong);
  border:1px solid var(--stroke-soft);box-shadow:var(--shadow-s);
  font-size:.78rem;font-weight:700;color:var(--text-sub);transition:all .2s;
}
.switch:hover{border-color:rgba(6,182,212,.42)}
.switch input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.switch .track{
  position:relative;width:34px;height:19px;border-radius:99px;flex:0 0 auto;
  background:rgba(15,23,42,.16);transition:background .22s;
}
.switch .track::after{
  content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.28);transition:transform .22s;
}
.switch input:checked + .track{background:linear-gradient(135deg,var(--accent),var(--primary))}
.switch input:checked + .track::after{transform:translateX(15px)}
.switch.on{color:#0e7490;border-color:rgba(6,182,212,.4);background:rgba(236,254,255,.9)}

/* ===== 按钮 ===== */
.btn{
  padding:8px 15px;border-radius:11px;font-size:.85rem;font-weight:700;
  border:1px solid var(--stroke-soft);background:var(--glass-strong);color:var(--text-sub);
  cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;font-family:inherit;box-shadow:var(--shadow-s);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.btn:hover{border-color:rgba(79,70,229,.36);color:var(--primary-dark);background:#fff;box-shadow:var(--shadow-m);transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(79,70,229,.30);
}
.btn-primary:hover{color:#fff;background:linear-gradient(135deg,#4f46e5,#3730a3);box-shadow:0 10px 26px rgba(79,70,229,.38)}
.btn-success{
  background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(22,163,74,.28);
}
.btn-success:hover{color:#fff;background:linear-gradient(135deg,#16a34a,#166534);box-shadow:0 10px 26px rgba(22,163,74,.34)}
.btn-cyan{
  background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(6,182,212,.28);
}
.btn-cyan:hover{color:#fff;background:linear-gradient(135deg,#06b6d4,#0e7490);box-shadow:0 10px 26px rgba(6,182,212,.34)}
.btn:disabled{opacity:.45;pointer-events:none;box-shadow:none}
.btn-mini{
  padding:4px 11px;font-size:.74rem;border-radius:8px;border:1px solid var(--stroke-soft);
  background:var(--glass-strong);color:var(--primary-dark);cursor:pointer;font-weight:700;
  transition:all .18s;font-family:inherit;
}
.btn-mini:hover{background:rgba(79,70,229,.10);border-color:rgba(79,70,229,.34)}

.container{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:18px 24px 44px}

/* ===== 全局筛选条 ===== */
.status-bar{
  display:flex;flex-direction:column;gap:11px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:var(--radius);
  padding:14px 20px;margin-bottom:14px;box-shadow:var(--shadow-m);
}
.global-select-block{display:flex;gap:10px;align-items:flex-start;width:100%}
.global-select-label{
  flex:0 0 auto;font-weight:800;font-size:.82rem;color:var(--primary-dark);
  white-space:nowrap;padding-top:7px;letter-spacing:.4px;
}
.global-checkbox-group{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.global-select-block .group-actions{flex:0 0 auto;display:flex;gap:6px;padding-top:1px}

/* ===== 页签 ===== */
.tabs-row{
  display:flex;gap:10px;align-items:stretch;padding:6px;margin-bottom:16px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--shadow-m);
}
.main-tabs{display:flex;gap:6px;flex:0 0 auto}
.main-tab{
  padding:9px 22px;border:none;border-radius:11px;background:transparent;
  color:var(--text-muted);font-size:.9rem;font-weight:800;cursor:pointer;
  transition:all .2s;white-space:nowrap;font-family:inherit;letter-spacing:.3px;
}
.main-tab:hover{background:rgba(79,70,229,.09);color:var(--primary-dark)}
.main-tab.active{
  background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;
  box-shadow:0 6px 18px rgba(79,70,229,.32);
}
.sub-tabs{
  display:flex;gap:6px;padding:5px;flex:1 1 auto;min-width:0;
  background:rgba(255,255,255,.5);border:1px solid var(--stroke-soft);border-radius:12px;
  flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.sub-tabs::-webkit-scrollbar{height:4px}
.sub-tabs::-webkit-scrollbar-thumb{background:rgba(79,70,229,.28);border-radius:2px}
.sub-tab{
  padding:7px 16px;border:none;border-radius:8px;background:transparent;
  color:var(--text-sub);font-size:.83rem;font-weight:700;cursor:pointer;
  transition:all .2s;white-space:nowrap;font-family:inherit;flex:0 0 auto;
}
.sub-tab:hover{background:rgba(79,70,229,.11);color:var(--primary-dark)}
.sub-tab.active{
  background:linear-gradient(135deg,#22d3ee,#4f46e5);color:#fff;
  box-shadow:0 4px 14px rgba(79,70,229,.30);
}

/* ===== 卡片：毛玻璃 ===== */
.card{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:var(--radius);
  padding:22px;margin-bottom:16px;box-shadow:var(--shadow-m);
}
.card h3{font-size:1.04rem;margin-bottom:13px;color:var(--primary-darker);font-weight:800;letter-spacing:-.2px}
.card h4{font-size:.95rem;margin-bottom:10px;color:var(--primary-darker);font-weight:800}

/* ===== 合并页小节切换 ===== */
.merged-nav{padding:12px 14px;margin-bottom:14px}
.seg-switch{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{
  padding:9px 20px;border:1px solid var(--stroke-soft);border-radius:11px;
  background:rgba(255,255,255,.62);color:var(--text-muted);
  font-size:.86rem;font-weight:800;cursor:pointer;transition:all .2s;
  font-family:inherit;letter-spacing:.3px;white-space:nowrap;
}
.seg-btn:hover{background:#fff;color:var(--primary-dark);border-color:rgba(79,70,229,.3);transform:translateY(-1px)}
.seg-btn.active{
  background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(79,70,229,.30);
}
.merged-hint{
  margin-left:auto;font-size:.78rem;color:var(--text-muted);font-weight:600;
  align-self:center;white-space:nowrap;
}

/* ===== 图表 ===== */
.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.chart-grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.chart-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.chart-card{
  background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--stroke);border-radius:var(--radius-s);padding:13px;min-width:0;
  box-shadow:var(--shadow-s);transition:box-shadow .22s,border-color .22s,transform .22s;
}
.chart-card:hover{box-shadow:var(--shadow-m);border-color:rgba(79,70,229,.26);transform:translateY(-2px)}
.chart-card h4{
  text-align:center;font-size:.9rem;font-weight:800;color:var(--primary-darker);margin-bottom:9px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chart-box{position:relative;width:100%;height:clamp(240px,32vh,400px);min-width:0}
.chart-grid-5 .chart-box{height:clamp(180px,24vh,280px)}
.chart-grid-2 .chart-box{height:clamp(260px,36vh,420px)}
.big-chart-wrap{
  position:relative;width:100%;height:clamp(560px,78vh,960px);margin-top:16px;
  background:rgba(255,255,255,.86);border:1px solid var(--stroke);border-radius:var(--radius-s);padding:22px;
}
.big-chart-wrap canvas{width:100%!important;height:100%!important;display:block}
.chart-empty-overlay{
  position:absolute;inset:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);color:var(--text-muted);font-size:.92rem;font-weight:700;
  border-radius:10px;text-align:center;padding:16px;pointer-events:none;
}
.triple-chart-card .chart-box{height:clamp(280px,40vh,460px)}

/* ===== 分析面板：突出数据 ===== */
.analysis-panel{
  margin-bottom:18px;padding:22px 24px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(238,242,255,.86),rgba(236,254,255,.72));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow-m);
}
.analysis-panel-title{
  font-size:1.05rem;font-weight:800;color:var(--primary-darker);margin-bottom:18px;
  display:flex;align-items:center;gap:10px;padding-bottom:12px;
  border-bottom:1px solid rgba(79,70,229,.16);letter-spacing:-.2px;
}
.analysis-panel-title::before{
  content:'';display:inline-block;width:5px;height:20px;border-radius:3px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--accent),var(--primary));
}
.analysis-panel-title .tip{font-size:.7rem;font-weight:700;color:var(--text-muted);letter-spacing:1.2px;margin-left:auto;text-transform:uppercase}
.analysis-section{margin-bottom:18px}
.analysis-section:last-child{margin-bottom:0}
.analysis-section-title{
  font-size:.9rem;font-weight:800;color:var(--primary-dark);margin-bottom:12px;
  padding-left:12px;position:relative;letter-spacing:.2px;
}
.analysis-section-title::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#22d3ee,#4f46e5);
}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px;margin-bottom:14px}
.analysis-metric{
  padding:13px 14px;border-radius:14px;text-align:center;min-width:0;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow-s);transition:transform .2s,box-shadow .2s,border-color .2s;
}
.analysis-metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:rgba(79,70,229,.24)}
.analysis-metric.has-info{cursor:help}
.analysis-metric.has-info:hover{border-color:rgba(6,182,212,.44)}
.analysis-metric-label{
  font-size:.7rem;color:var(--text-muted);font-weight:800;margin-bottom:6px;
  letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.analysis-metric-value{
  font-size:1.5rem;font-weight:800;color:var(--primary-darker);line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.analysis-metric-value.font-up{color:var(--up)}
.analysis-metric-value.font-down{color:var(--down)}
.analysis-metric-value.font-flat{color:var(--text-muted)}

.analysis-text p{font-size:.87rem;color:var(--text-sub);line-height:2;padding-left:17px;position:relative;margin-bottom:5px}
.analysis-text p:last-child{margin-bottom:0}
.analysis-text p::before{
  content:'';position:absolute;left:2px;top:.85em;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--primary));opacity:.7;
}
.analysis-text b{color:var(--primary-darker);font-weight:800}
.analysis-text b.font-up{color:var(--up)}
.analysis-text b.font-down{color:var(--down)}
.analysis-text b.hl{
  display:inline-block;padding:0 7px;border-radius:6px;font-weight:800;line-height:1.55;
  background:rgba(79,70,229,.12);color:var(--primary-darker);
}
.analysis-text b.warn{
  display:inline-block;padding:0 7px;border-radius:6px;font-weight:800;line-height:1.55;
  background:rgba(220,38,38,.11);color:#b91c1c;
}

/* ===== 导出临时样式：仅在导出快照中生效 ===== */
.export-header{display:none}
body.exporting .export-header{display:block;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid rgba(79,70,229,.25)}
body.exporting .export-header .eh-title{font-size:1.15rem;font-weight:800;color:#312e81;letter-spacing:-.2px}
body.exporting .export-header .eh-meta{font-size:.8rem;color:#64748b;margin-top:4px;font-weight:600}
body.exporting .status-bar,body.exporting .tabs-row,body.exporting .merged-nav{display:none!important}
body.exporting #particleCanvas{display:none!important}
body.exporting .card,body.exporting .chart-card,body.exporting .grid-table-scroll,
body.exporting .analysis-panel,body.exporting .stu-row-card{
  background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  box-shadow:none!important;border-color:#e2e8f0!important;
}
.align-status{font-weight:700}

.absent-list{
  margin-top:8px;padding:12px 14px;border-radius:var(--radius-s);
  background:rgba(254,242,242,.85);border:1px dashed rgba(220,38,38,.34);
  font-size:.83rem;color:#7f1d1d;line-height:1.9;
}
.absent-list .label{font-weight:800;color:#b91c1c;margin-right:6px;display:inline-block}
.absent-list .name-chip{
  display:inline-block;padding:2px 10px;margin:2px 3px 2px 0;border-radius:99px;
  background:rgba(255,255,255,.9);color:#b91c1c;font-weight:800;
  border:1px solid rgba(220,38,38,.26);font-size:.77rem;
}

/* ===== 筛选控件 ===== */
.filter-row{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--stroke-soft);
}
.filter-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.filter-group{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.filter-group>label{font-size:.84rem;font-weight:800;color:var(--text-sub);white-space:nowrap}
.filter-group select,.filter-group input{
  padding:7px 13px;border:1px solid var(--stroke-soft);border-radius:10px;
  background:rgba(255,255,255,.9);font-size:.85rem;color:var(--text-main);
  cursor:pointer;font-family:inherit;min-width:132px;font-weight:600;
  box-shadow:var(--shadow-s);transition:border-color .18s,box-shadow .18s;
}
.filter-group select:focus,.filter-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.filter-block{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(15,23,42,.09)}
.filter-block:last-child{border-bottom:none}
.filter-block-label{flex:0 0 auto;font-size:.85rem;font-weight:800;color:var(--text-sub);padding-top:5px;white-space:nowrap;min-width:44px}
.filter-block-body{flex:1 1 auto;min-width:0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}

.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;min-width:0}
.checkbox-item{
  display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;
  border:1px solid rgba(15,23,42,.10);background:rgba(255,255,255,.72);color:var(--text-sub);
  font-size:.81rem;font-weight:700;cursor:pointer;transition:all .18s;user-select:none;
  white-space:nowrap;flex:0 0 auto;
}
.checkbox-item:hover{border-color:rgba(79,70,229,.36);background:#fff}
.checkbox-item.checked{
  background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(79,70,229,.30);
}
.checkbox-item input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.checkbox-item::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;flex:0 0 auto}
.checkbox-item.checked::before{opacity:1;background:#fff}
.group-actions{display:flex;gap:6px;flex:0 0 auto;align-self:flex-start;padding-top:1px}

/* ===== 数据表格 ===== */
.grid-table-scroll{
  overflow-x:auto;overflow-y:visible;margin-top:4px;border-radius:var(--radius-s);
  border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.86);
  -webkit-overflow-scrolling:touch;position:relative;box-shadow:var(--shadow-s);
}
table.data-table{table-layout:fixed;border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.data-table th,table.data-table td{
  box-sizing:border-box;height:44px;padding:2px 10px;text-align:center;vertical-align:middle;
  font-size:.84rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-right:1px solid rgba(15,23,42,.06);border-bottom:1px solid rgba(15,23,42,.06);
  background:rgba(255,255,255,.9);
}
table.data-table th:last-child,table.data-table td:last-child{border-right:none}
table.data-table thead th{
  position:relative;z-index:3;height:48px;padding:2px 8px;
  background:linear-gradient(135deg,#4f46e5,#3730a3);color:#fff;
  font-weight:800;font-size:.84rem;letter-spacing:.2px;
  border-right:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.24);
}
table.data-table thead th.sortable{cursor:pointer;user-select:none}
table.data-table thead th.sortable::after{content:'⇅';display:inline-block;margin-left:5px;font-size:.7rem;opacity:.6;vertical-align:1px}
table.data-table thead th.sortable:hover{background:linear-gradient(135deg,#4338ca,#312e81)}
table.data-table thead th.sort-asc::after{content:'▲';opacity:1}
table.data-table thead th.sort-desc::after{content:'▼';opacity:1}
table.data-table th.sticky-col,table.data-table td.sticky-col{position:sticky;z-index:2;box-shadow:6px 0 8px -6px rgba(15,23,42,.18)}
table.data-table thead th.sticky-col{z-index:4}
table.data-table tbody tr:nth-child(even) td{background:rgba(244,247,253,.92)}
table.data-table tbody tr:hover td{background:rgba(224,231,255,.85)}
table.data-table td.cell-subject{font-weight:800;background:rgba(238,242,255,.95)!important}
table.data-table td.cell-class{font-weight:800;background:rgba(241,245,249,.95)!important}
table.data-table td.cell-streak-up{background:rgba(220,252,231,.9)!important}
table.data-table td.cell-streak-down{background:rgba(254,226,226,.9)!important}
table.data-table td.grid-empty{height:110px;color:var(--text-muted);font-size:.9rem;background:rgba(255,255,255,.9)!important;border-right:none}

.score-main{display:block;font-size:.94rem;font-weight:800;line-height:1.25;color:var(--text-main);font-variant-numeric:tabular-nums}
.score-diff{display:inline-block;font-size:.7rem;font-weight:700;line-height:1.2;margin:0 2px;vertical-align:middle}
.diff-up{color:var(--up)}.diff-down{color:var(--down)}.diff-flat{color:var(--text-muted)}
.font-up{color:var(--up);font-weight:800}
.font-down{color:var(--down);font-weight:800}
.font-flat{color:var(--text-muted)}
.text-green{color:var(--up);font-weight:800}
.text-red{color:var(--down);font-weight:800}
.text-warn{color:#d97706;font-weight:800}

.rate-cell{font-weight:800;font-size:.94rem;font-variant-numeric:tabular-nums}
.rate-good{color:#15803d}
.rate-mid{color:#d97706}
.rate-low{color:#dc2626}
.rate-delta{font-weight:800;font-size:.8rem;display:inline-block;padding:2px 7px;border-radius:6px;line-height:1.4;font-variant-numeric:tabular-nums}
.rate-delta.up{color:#15803d;background:rgba(220,252,231,.9)}
.rate-delta.down{color:#b91c1c;background:rgba(254,226,226,.9)}
.rate-delta.flat{color:var(--text-muted);background:rgba(241,245,249,.9)}
.fullmark-changed{color:#b45309;font-weight:800;font-size:.76rem}

.count-cell{cursor:help;display:inline-block;padding:2px 7px;border-radius:6px;font-weight:800;transition:all .15s}
.count-cell:hover{background:rgba(79,70,229,.13);color:var(--primary-darker)}

.seg-badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:800;font-variant-numeric:tabular-nums}
.seg-s{background:rgba(220,252,231,.95);color:#166534}
.seg-a{background:rgba(219,234,254,.95);color:#1e40af}
.seg-b{background:rgba(224,231,255,.95);color:#3730a3}
.seg-c{background:rgba(254,243,199,.95);color:#92400e}
.seg-d{background:rgba(254,226,226,.95);color:#991b1b}

.rank-up{color:#15803d;font-weight:800}
.rank-down{color:#dc2626;font-weight:800}
.rank-flat{color:var(--text-muted);font-weight:700}
.rank-new{color:#7c3aed;font-weight:800}
.stability-good{color:#15803d;font-weight:800}
.stability-mid{color:#d97706;font-weight:800}
.stability-poor{color:#dc2626;font-weight:800}

.stu-row-card{
  padding:17px;border:1px solid var(--stroke);border-radius:var(--radius-s);
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  margin-bottom:16px;box-shadow:var(--shadow-s);
}
.stu-row-header{
  font-weight:800;font-size:1.02rem;color:var(--primary-darker);margin-bottom:13px;
  padding-left:11px;border-left:4px solid var(--primary);line-height:1.2;letter-spacing:-.2px;
}

.empty-hint{text-align:center;padding:62px 10px;color:var(--text-muted);font-size:.9rem;font-weight:600}
.info-text{font-size:.79rem;color:var(--text-muted);white-space:nowrap;flex:0 0 auto;font-weight:600}
.hidden{display:none!important}
.page-title{
  font-size:1.04rem;font-weight:800;color:var(--primary-darker);margin-bottom:15px;
  display:flex;align-items:center;gap:9px;letter-spacing:-.2px;
}
.page-title::before{
  content:'';display:inline-block;width:4px;height:17px;border-radius:2px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--accent),var(--primary));
}

/* ===== 悬浮提示 ===== */
.hover-tip{
  position:fixed;z-index:9999;max-width:340px;max-height:60vh;overflow-y:auto;
  background:rgba(15,23,42,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#fff;border-radius:12px;padding:11px 13px;font-size:.8rem;line-height:1.7;
  box-shadow:0 14px 40px rgba(15,23,42,.34);border:1px solid rgba(255,255,255,.12);
  pointer-events:none;opacity:0;transition:opacity .15s;font-family:inherit;
}
.hover-tip.show{opacity:1}
.hover-tip-title{font-weight:800;font-size:.83rem;padding-bottom:6px;margin-bottom:7px;border-bottom:1px dashed rgba(255,255,255,.24);color:#a5b4fc}
.hover-tip-item{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:.78rem}
.hover-tip-item .nm{color:#fff;font-weight:600}
.hover-tip-item .val{color:#a5b4fc;font-weight:800;font-size:.76rem;font-variant-numeric:tabular-nums}
.hover-tip-item.good .val{color:#86efac}
.hover-tip-item.bad .val{color:#fca5a5}
.hover-tip-empty{color:#94a3b8;font-style:italic;font-size:.76rem}

/* ===== 加载 ===== */
.loading-overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(238,242,249,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  justify-content:center;align-items:center;flex-direction:column;gap:16px;
}
.loading-overlay.show{display:flex}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(79,70,229,.16);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.92rem;color:var(--text-sub);font-weight:700}

/* ===== 导出菜单 ===== */
.export-wrap{position:relative;display:inline-flex}
.export-menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:200;min-width:186px;
  padding:6px;border-radius:13px;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke-soft);box-shadow:var(--shadow-l);
  display:none;flex-direction:column;gap:3px;
}
.export-menu.show{display:flex}
.export-menu button{
  padding:9px 12px;border:none;border-radius:9px;background:transparent;cursor:pointer;
  font-size:.83rem;font-weight:700;color:var(--text-sub);text-align:left;
  font-family:inherit;transition:all .16s;display:flex;align-items:center;gap:8px;
}
.export-menu button:hover{background:rgba(79,70,229,.10);color:var(--primary-dark)}
.export-menu .menu-hint{
  padding:7px 12px 4px;font-size:.68rem;font-weight:800;letter-spacing:.8px;
  color:var(--text-muted);text-transform:uppercase;
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(15,23,42,.04)}
::-webkit-scrollbar-thumb{background:rgba(79,70,229,.30);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(79,70,229,.52)}

/* ===== F8 单科成绩分析报告 ===== */
.rep-actions{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding-top:14px;border-top:1px dashed rgba(15,23,42,.10);
}
.rep-actions .info-text{white-space:normal;flex:1 1 240px}
/* 报告里的指标卡：标签和数值都允许换行，避免“及格线（61.0分）”被截断 */
#repBody .analysis-grid{grid-template-columns:repeat(auto-fit,minmax(142px,1fr))}
#repBody .analysis-metric-label{
  white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;
}
#repBody .analysis-metric-value{
  white-space:normal;overflow:visible;text-overflow:clip;
  font-size:1.12rem;line-height:1.32;letter-spacing:-.2px;
}
.rep-card{padding:0;overflow:hidden}
.rep-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:20px 24px 18px;color:#fff;
  background:linear-gradient(135deg,#4338ca,#4f46e5 55%,#0891b2);
}
.rep-kicker{font-size:.73rem;letter-spacing:.14em;font-weight:700;opacity:.86;text-transform:uppercase}
.rep-title{font-size:1.32rem;font-weight:800;letter-spacing:-.3px;margin-top:5px;line-height:1.36}
.rep-sub{font-size:.79rem;opacity:.92;margin-top:6px;font-weight:600;line-height:1.6}
.rep-stamp{
  flex:0 0 auto;text-align:center;padding:8px 16px 7px;border-radius:12px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
}
.rep-stamp span{display:block;font-size:.7rem;font-weight:700;opacity:.9}
.rep-stamp b{display:block;font-size:1.46rem;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.rep-stamp em{display:block;font-size:.68rem;font-style:normal;opacity:.84}
.rep-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.rep-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rep-cell{
  display:flex;flex-direction:column;gap:3px;padding:12px 20px;
  border-right:1px solid rgba(15,23,42,.06);border-bottom:1px solid rgba(15,23,42,.06);min-width:0;
}
.rep-grid > .rep-cell:nth-child(4n){border-right:none}
.rep-cell .k{font-size:.73rem;color:var(--text-muted);font-weight:700;letter-spacing:.02em}
.rep-cell .v{
  font-size:.97rem;color:var(--text-main);font-weight:800;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
}
.rep-diff{display:inline-block;padding:1px 10px;border-radius:99px;background:rgba(79,70,229,.13);color:var(--primary-dark)}
.rep-note{
  margin-top:12px;font-size:.76rem;line-height:1.75;color:var(--text-muted);font-weight:600;
}
.rep-quote{
  margin-top:4px;padding:15px 18px;border-left:4px solid var(--primary);
  background:rgba(238,242,255,.72);border-radius:0 12px 12px 0;
  font-size:.92rem;line-height:1.9;color:var(--text-sub);font-weight:600;
}
.rep-chip-row{

}
.rep-chip-row:last-child{border-bottom:none}
.rep-chip-row .label{font-weight:800;color:var(--text-sub);font-size:.84rem;margin-right:2px}
.rep-chip-row .name-chip{
  display:inline-block;padding:2px 10px;border-radius:99px;

}
.rep-chip.bad{border-color:rgba(220,38,38,.28);color:#b91c1c;background:rgba(254,242,242,.95)}

.rep-muted{color:var(--text-muted);font-size:.8rem;font-weight:600}
@media (max-width:900px){
  .rep-grid,.rep-grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ===== 考点 / 失分模块 输入区（v2） ===== */
.rep-inputs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:14px;margin-top:16px;
}
.rep-input-card{
  background:#f8fafc;border:1px solid rgba(15,23,42,.08);
  border-radius:12px;padding:12px 14px 10px;
  display:flex;flex-direction:column;gap:8px;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.rep-input-card:focus-within{
  background:#fff;border-color:rgba(79,70,229,.45);box-shadow:0 0 0 3px rgba(79,70,229,.10);
}
.rep-input-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rep-input-head label{
  font-size:.84rem;font-weight:800;color:#334155;letter-spacing:.02em;margin:0;
  display:flex;align-items:center;gap:6px;
}
.rep-input-head label::before{
  content:"";width:3px;height:12px;border-radius:2px;background:#4f46e5;display:inline-block;
}
.rep-input-card textarea{

function renderGridTable(cols, rows, sortKey, wrapEl, onSort) {
  const st = sortState[sortKey] || (sortState[sortKey] = { col: -1, asc: true });

  let sortedRows = rows.slice();
  if (st.col >= 0) {
    const col = cols[st.col];
    if (col && col.getValue) {
      sortedRows.sort((a, b) => {
        const va = col.getValue(a), vb = col.getValue(b);
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'string' || typeof vb === 'string') {
          const cmp = String(va).localeCompare(String(vb), 'zh');
          return st.asc ? cmp : -cmp;
        }
        return st.asc ? va - vb : vb - va;
      });
    }
  }

  let leftOffset = 0;
  const stickyLeft = cols.map(c => {
    if (c.sticky) { const v = leftOffset; leftOffset += c.width; return v; }
    return null;
  });

  const totalWidth = cols.reduce((sum, c) => sum + (c.width || 100), 0);

  function parseCell(html) {
    if (html == null) return { content: '', cls: '' };
    const s = String(html);
    const m = s.match(/^<td([^>]*)>([\s\S]*)<\/td>$/);
    if (!m) return { content: s, cls: '' };
    const clsMatch = m[1].match(/class="([^"]*)"/);
    return { content: m[2], cls: clsMatch ? clsMatch[1] : '' };
  }

  let html = '<div class="grid-table-scroll">';
  html += '<table class="data-table" style="min-width:' + totalWidth + 'px">';
  html += '<colgroup>' + cols.map(c => '<col style="width:' + (c.width || 100) + 'px">').join('') + '</colgroup>';

  html += '<thead><tr>';
  cols.forEach((c, i) => {
    const cls = [];
    if (c.sortable !== false) cls.push('sortable');
    if (st.col === i) cls.push(st.asc ? 'sort-asc' : 'sort-desc');
    if (c.sticky) cls.push('sticky-col');
    const styleAttr = c.sticky ? ' style="left:' + stickyLeft[i] + 'px"' : '';
    html += '<th class="' + cls.join(' ') + '" data-col="' + i + '"' + styleAttr + '>' + (c.label || '') + '</th>';
  });
  html += '</tr></thead><tbody>';

  if (!sortedRows.length) {
    html += '<tr><td class="grid-empty" colspan="' + cols.length + '">无数据</td></tr>';
  } else {
    sortedRows.forEach((row, ri) => {
      html += '<tr>';
      cols.forEach((c, ci) => {
        const parsed = c.render ? parseCell(c.render(row, ri)) : { content: '', cls: '' };
        const cls = [];
        if (c.sticky) cls.push('sticky-col');
        if (parsed.cls) cls.push(parsed.cls);
        const styleAttr = c.sticky ? ' style="left:' + stickyLeft[ci] + 'px"' : '';
        html += '<td class="' + cls.join(' ') + '"' + styleAttr + '>' + parsed.content + '</td>';
      });
      html += '</tr>';
    });
  }

  html += '</tbody></table></div>';
  wrapEl.innerHTML = html;

  wrapEl.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const idx = parseInt(th.dataset.col, 10);
      if (st.col === idx) st.asc = !st.asc;
      else { st.col = idx; st.asc = true; }
      onSort();
    });
  });

  setTimeout(bindHoverTips, 10);
}

/* ============ 数据解析 ============ */
function parseSheet(rows, className) {
  if (!rows || rows.length < 3) return;
  const row0 = rows[0] || [], row1 = rows[1] || [];
  const h00 = String(row0[0] ?? '').trim();
  const h01 = String(row1[0] ?? '').trim();
  if (h00 === '学生' && h01 === '考试') parseVertical(rows, className);
  else parseHorizontal(rows, className);
}
function parseVertical(rows, className) {
  const headers = (rows[0] || []).map(h => String(h ?? '').trim());
  const rawSubjects = headers.slice(2).filter(Boolean);
  if (!rawSubjects.length) return;
  rawSubjects.forEach(registerSubject);
  const baseKeys = rawSubjects.map(normalizeSubjectKey);
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length < 3) continue;
    const name = String(row[0] ?? '').trim();
    const exam = String(row[1] ?? '').trim();
    if (!name || !exam) continue;
    registerExam(exam);
    const scores = {};
    baseKeys.forEach((baseKey, j) => {
      const rawSub = rawSubjects[j];
      const v = toNum(row[2 + j]);
      recordClassSubjectMark(className, exam, baseKey, rawSub);
      if (v === null) { if (!(baseKey in scores)) scores[baseKey] = null; }
      else { if (scores[baseKey] == null || v > scores[baseKey]) scores[baseKey] = v; }
    });
    setScore(className, name, exam, scores);
  }
}
function parseHorizontal(rows, className) {
  const row0 = rows[0] || [], row1 = rows[1] || [];
  const groups = [];
  let cur = null;
  for (let c = 1; c < row1.length; c++) {
    const examName = String(row0[c] ?? '').trim();
    const subName = String(row1[c] ?? '').trim();
    if (examName) {
      if (cur && cur.subjects.length) groups.push(cur);
      cur = { exam: examName, subjects: [], start: c };
    }
    if (cur && subName) cur.subjects.push(subName);
  }
  if (cur && cur.subjects.length) groups.push(cur);
  if (!groups.length) return;
  groups.forEach(g => g.subjects.forEach(registerSubject));
  for (let r = 2; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const name = String(row[0] ?? '').trim();
    if (!name) continue;
    groups.forEach(g => {
      registerExam(g.exam);
      const scores = {};
      g.subjects.forEach((rawSub, i) => {
        const baseKey = normalizeSubjectKey(rawSub);
        const v = toNum(row[g.start + i]);
        recordClassSubjectMark(className, g.exam, baseKey, rawSub);
        if (v === null) { if (!(baseKey in scores)) scores[baseKey] = null; }
        else { if (scores[baseKey] == null || v > scores[baseKey]) scores[baseKey] = v; }
      });
      setScore(className, name, g.exam, scores);
    });
  }
}
const registerExam = e => { if (e && !state.examList.includes(e)) state.examList.push(e); };
function registerSubject(orig) {
  if (!orig) return;
  const b = normalizeSubjectKey(orig);
  if (!b) return;
  if (!state.subjectList.includes(b)) state.subjectList.push(b);
  if (!subjectFullMarks.has(b)) subjectFullMarks.set(b, new Set());
  if (!subjectOriginals.has(b)) subjectOriginals.set(b, new Set());
  subjectOriginals.get(b).add(orig);
  const fm = extractFullMark(orig);
  if (fm != null) subjectFullMarks.get(b).add(fm);
}
function registerClass(c) {
  if (!state.classList.includes(c)) state.classList.push(c);
  if (!state.classes[c]) state.classes[c] = { students: {} };
}
function setScore(cls, name, exam, scores) {

}
/* 科目强制排序：按指定顺序排列，未在列表中的科目放最后（按拼音） */
const SUBJECT_FIXED_ORDER = ['总分','语文','数学','英语','物理','化学','生物','历史','地理','政治','信息技术','美术','职测总分'];
function sortSubjects() {
  const orderMap = new Map(SUBJECT_FIXED_ORDER.map((s, i) => [s, i]));
  const fallback = SUBJECT_FIXED_ORDER.length;
  state.subjectList.sort((a, b) => {
    const ia = orderMap.has(a) ? orderMap.get(a) : fallback;
    const ib = orderMap.has(b) ? orderMap.get(b) : fallback;
    if (ia !== ib) return ia - ib;
    return a.localeCompare(b, 'zh-CN');
  });
}

/* ============ 统计计算 ============ */
function getStat(cls, exam, sub, mode) {
  const key = cls + '|' + exam + '|' + sub + '|' + mode;
  if (statCache.has(key)) return statCache.get(key);
  const students = state.classes[cls]?.students || {};
  const vals = [];
  for (const name in students) {
    const v = students[name]?.[exam]?.[sub];
    if (typeof v === 'number' && !Number.isNaN(v)) vals.push(v);
  }
  let res = null;
  if (vals.length) {
    if (mode === 'avg') res = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
    else if (mode === 'max') res = Math.max(...vals);
    else if (mode === 'min') res = Math.min(...vals);
  }
  statCache.set(key, res);
  return res;
}
function getStatStudents(cls, exam, sub, mode) {
  const students = state.classes[cls]?.students || {};
  const arr = [];
  for (const name in students) {
    const v = students[name]?.[exam]?.[sub];
    if (typeof v === 'number' && !Number.isNaN(v)) arr.push({ name, score: v });
  }
  if (!arr.length) return [];
  if (mode === 'max') { const mx = Math.max(...arr.map(x=>x.score)); return arr.filter(x=>x.score===mx).map(x=>({name:x.name,value:x.score+' 分',tone:'good'})); }
  if (mode === 'min') { const mn = Math.min(...arr.map(x=>x.score)); return arr.filter(x=>x.score===mn).map(x=>({name:x.name,value:x.score+' 分',tone:'bad'})); }

}
function computeRanks(values) {
  const sorted = values.filter(v=>v!==null&&!Number.isNaN(v)).sort((a,b)=>b-a);
  return values.map(v=>(v===null||Number.isNaN(v))?null:sorted.indexOf(v)+1);
}
function computeStreaks(scores) {
  const n = scores.length;
  const up = new Array(n).fill(false), down = new Array(n).fill(false);
  let cu = 0, cd = 0;
  for (let i = 0; i < n; i++) {
    if (i === 0 || scores[i] === null || scores[i-1] === null) { cu=0; cd=0; }
    else if (scores[i] > scores[i-1]) { cu++; cd=0; }
    else if (scores[i] < scores[i-1]) { cd++; cu=0; }
    else { cu=0; cd=0; }
    up[i] = cu >= 3; down[i] = cd >= 3;
  }
  return { up, down };
}
function getStudentTotal(stu, exam) {
  const t = stu[exam]?.['总分'];
  if (typeof t === 'number') return t;
  let sum = 0, has = false;
  for (const sub in stu[exam]) {
    if (isTotal(sub)) continue;
    const v = stu[exam][sub];
    if (typeof v === 'number') { sum += v; has = true; }
  }
  return has ? sum : null;
}
const hasAttended = (stu, exam) => {

  return false;

function getStudentAbsence(stu, exams) {
  const flags = exams.map(ex=>hasAttended(stu,ex));
  const absent = exams.filter((_,i)=>!flags[i]);
  return { attendedCount: flags.filter(Boolean).length, total: exams.length, absent, flags };
}
function getAbsenteeInfo(cls) {
  const students = Object.keys(state.classes[cls]?.students || {});
  const exams = state.examList;
  if (!exams.length || !students.length) return null;
  const neverTested = [], multiAbsent = [], consecutiveAbsent = [];
  students.forEach(name => {
    const stu = state.classes[cls].students[name];
    const flags = exams.map(ex=>hasAttended(stu,ex));
    const attendCount = flags.filter(Boolean).length;
    if (attendCount === 0) { neverTested.push(name); return; }
    const segs = []; let cur = 0;
    flags.forEach(f => { if (!f) cur++; else { if (cur>0) segs.push(cur); cur=0; } });
    if (cur > 0) segs.push(cur);
    const maxSeg = segs.length ? Math.max(...segs) : 0;
    const absentCount = exams.length - attendCount;
    if (absentCount >= 2 || maxSeg >= 2) {
      multiAbsent.push({name,absentCount,maxSeg,total:exams.length});
      if (maxSeg >= 2) consecutiveAbsent.push({name,maxSeg,total:exams.length});
    }
  });
  return { neverTested, multiAbsent, consecutiveAbsent, totalStudents: students.length, totalExams: exams.length };
}

function makeBarChart(canvasId, labels, datasets, opts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  opts = opts || {};
  const multi = datasets.length > 1;
  /* 横向条形图：条厚与间距固定，条目多时自动加高画布，
     保证每根条的高度始终一致，不会被压得粗细不一 */
  const BAR_PX = 15, GAP_PX = 9, TOP_PX = 14, BOTTOM_PX = 26;
  if (opts.horizontal) {
    const n = Math.max(labels ? labels.length : 0, 1);
    const hCss = TOP_PX + n * (BAR_PX + GAP_PX) + BOTTOM_PX;
    canvas.style.height = hCss + 'px';
    const holder = canvas.parentNode;
    if (holder && holder.classList.contains('chart-box')) holder.style.height = hCss + 'px';
  }
  return new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:320},
      layout:{padding:{top:8,right:10,bottom:4,left:4}},
      plugins:{
        legend:{display:multi,position:'bottom',labels:{boxWidth:12,boxHeight:8,font:{size:11},padding:8,usePointStyle:true,pointStyle:'rect'}},
        tooltip:{mode:'index',intersect:false,padding:10}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,autoSkip:false}},
        y:{beginAtZero:true,grace:'5%',ticks:{font:{size:10}}}
      },
      datasets: opts.horizontal ? { bar: { barThickness: BAR_PX, categoryPercentage: 0.9, barPercentage: 1 } } : {},
      indexAxis: opts.horizontal ? 'y' : 'x'
    }
  });
}

/* ============ 分析面板 ============ */
function analysisPanel(sections) {
  if (!sections || !sections.length) return '';
  let html = '<div class="analysis-panel"><div class="analysis-panel-title">综合分析总结<span class="tip">教学洞察</span></div>';
  sections.forEach(sec => {
    if (!sec) return;
    const hasItems = sec.items && sec.items.length;
    const hasParas = sec.paras && sec.paras.filter(Boolean).length;
    const hasExtra = !!sec.extra;
    if (!hasItems && !hasParas && !hasExtra) return;
    html += '<div class="analysis-section">';
    if (sec.title) html += '<div class="analysis-section-title">' + sec.title + '</div>';
    if (hasItems) {
      html += '<div class="analysis-grid">';
      sec.items.forEach(it => {
        const tipAttr = it.tipItems && it.tipItems.length
          ? ' data-tip-title="' + esc(it.label) + '" data-tip-items=\'' + JSON.stringify(it.tipItems).replace(/'/g,"&#39;") + '\''
          : '';
        html += '<div class="analysis-metric"' + tipAttr + '>' +
          '<div class="analysis-metric-label">' + esc(it.label) + '</div>' +
          '<div class="analysis-metric-value ' + (it.cls||'') + '">' + it.value + '</div>' +
          '</div>';
      });
      html += '</div>';
    }
    if (hasParas) html += '<div class="analysis-text">' + sec.paras.filter(Boolean).map(p=>'<p>'+p+'</p>').join('') + '</div>';
    if (hasExtra) html += sec.extra;
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function subjectLabel(baseKey) {
  /* 不显示括号内的满分，满分由独立列（如"本次满分"）展示 */
  return baseKey;
}
function renderAbsentBlock(info) {
  if (!info) return '';
  if (!info.neverTested.length && !info.multiAbsent.length) return '';
  let html = '<div class="absent-list">';
  if (info.neverTested.length) {
    html += '<div><span class="label">从未参加任何考试：</span>';
    html += info.neverTested.map(n=>'<span class="name-chip">'+esc(n)+'</span>').join('');
    html += '（共 ' + info.neverTested.length + ' 人）</div>';
  }
  const consec = info.consecutiveAbsent || [];
  if (consec.length) {
    html += '<div><span class="label">连续缺考 ≥ 2 次：</span>';
    html += consec.map(x=>'<span class="name-chip">'+esc(x.name)+'（连续 '+x.maxSeg+' 次）</span>').join('');
    html += '</div>';
  }
  const multiOnly = info.multiAbsent.filter(x=>!consec.some(c=>c.name===x.name));
  if (multiOnly.length) {
    html += '<div><span class="label">多次缺考（含不连续）：</span>';
    html += multiOnly.map(x=>'<span class="name-chip">'+esc(x.name)+'（共 '+x.absentCount+'/'+x.total+' 次）</span>').join('');
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function drawF1a() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const exams = state.examList;
  const stuEl = $('studentSelect');
  if (!stuEl) return;
  const studentName = stuEl.value;
  const summaryWrap = $('p1Summary');
  const container = $('p1Charts');
  summaryWrap.innerHTML = '';
  container.innerHTML = '';
  if (!studentName) {
    container.innerHTML = '<div class="empty-hint">请先选择学生</div>';
    return;
  }
  const stu = state.classes[cls].students[studentName];
  const enabledSubs = getGlobalSubjects();
  const classSubs = getClassSubjects(cls).filter(s => enabledSubs.includes(s));
  const subs = classSubs;
  const last = exams[exams.length - 1];
  const totLast = getStudentTotal(stu, last);
  const absence = getStudentAbsence(stu, exams);
  const items = [
    {label:'学生',value:esc(studentName)},
    {label:'当前班级',value:esc(cls)},
    {label:'最近考试',value:esc(last)},
    {label:'最新总分',value:totLast!=null?totLast:'-'}
  ];
  let absentHtml = '';
  if (absence.absent.length) {
    absentHtml = '<div class="absent-list"><div><span class="label">该生缺考考试：</span>' +
      absence.absent.map(e=>'<span class="name-chip">'+esc(e)+'</span>').join('') +
      '（缺席 ' + absence.absent.length + ' / ' + absence.total + ' 次）</div></div>';
  }
  if (exams.length >= 2 && absence.attendedCount >= 2) {
    const validExams = exams.filter(ex=>hasAttended(stu,ex));
    const lastV = validExams[validExams.length - 1];
    const prevV = validExams[validExams.length - 2];
    const totPrev = getStudentTotal(stu, prevV);
    const totDelta = (totLast!=null&&totPrev!=null)?totLast-totPrev:null;
    let upCount = 0, downCount = 0, bestUp = null, bestDown = null;
    let highestSub = null, lowestSub = null;
    subs.filter(s=>!isTotal(s)).forEach(sub => {
      const b = stu[lastV]?.[sub];
      if (typeof b === 'number') {
        if (!highestSub || b > highestSub.v) highestSub = {sub,v:b};
        if (!lowestSub || b < lowestSub.v) lowestSub = {sub,v:b};
      }
      const a = stu[prevV]?.[sub];
      if (typeof a === 'number' && typeof b === 'number') {
        const d = Math.round((b-a)*10)/10;
        if (d > 0) upCount++; else if (d < 0) downCount++;
        if (!bestUp || d > bestUp.delta) bestUp = {sub,delta:d};
        if (!bestDown || d < bestDown.delta) bestDown = {sub,delta:d};
      }
    });
    items.push(
      {label:'较上次总分',value:fmtDelta(totDelta),cls:totDelta>0?'font-up':totDelta<0?'font-down':'font-flat'},
      {label:'进步科目',value:upCount+' 科',cls:upCount?'font-up':''},
      {label:'退步科目',value:downCount+' 科',cls:downCount?'font-down':''}
    );
    const paras = [];
    if (highestSub) paras.push('最强科目：<b class="hl">' + esc(highestSub.sub) + '</b>（' + highestSub.v + ' 分）。');
    if (lowestSub && highestSub && lowestSub.sub !== highestSub.sub) paras.push('最薄弱科目：<b class="hl">' + esc(lowestSub.sub) + '</b>（' + lowestSub.v + ' 分）。');
    if (bestUp && bestUp.delta > 0) paras.push('进步最明显：<b>' + esc(bestUp.sub) + '</b>，<b class="font-up">+' + bestUp.delta + '</b> 分。');
    if (bestDown && bestDown.delta < 0) paras.push('退步最明显：<b>' + esc(bestDown.sub) + '</b>，<b class="font-down">' + bestDown.delta + '</b> 分。');
    summaryWrap.innerHTML = analysisPanel([
      {title:'个人综合表现',items,paras},
      absence.absent.length ? {title:'缺考记录',extra:absentHtml} : null
    ]);
  } else {
    items.push({label:'有效考试',value:absence.attendedCount + ' 次'});
    summaryWrap.innerHTML = analysisPanel([
      {title:'基础信息',items,paras:['有效考试不足 2 次，无法生成完整进退步分析。']},
      absence.absent.length ? {title:'缺考记录',extra:absentHtml} : null
    ]);
  }
  if (!subs.length) { container.innerHTML = '<div class="empty-hint">当前班级暂无有效成绩科目，请在顶部勾选科目</div>'; return; }
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + ' 成绩趋势</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    container.appendChild(card);
    const data = exams.map(ex => {
      const v = stu[ex]?.[sub];
      return typeof v === 'number' ? v : null;
    });
    addChart(makeLineChart(id, exams, [{
      label: sub, data,
      borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.15)',
      tension: .4, fill: true, pointRadius: 3, pointHoverRadius: 5,
      borderWidth: 2, spanGaps: true
    }], isTotal(sub)));
  });
  setTimeout(bindHoverTips, 10);
}

function drawF1b() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const sub = $('rankSubject').value;
  const compareMode = $('rankCompare').value;
  const summaryWrap = $('rankSummary');
  const tableWrap = $('rankTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  if (!sub || !compareMode) {
    tableWrap.innerHTML = '<div class="empty-hint">请先选择科目和对比方式</div>';
    return;
  }
  const exams = state.examList;
  if (exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const last = exams[exams.length-1], first = exams[0], prev = exams[exams.length-2];
  const examA = compareMode === 'first' ? first : prev;
  const examB = last;
  const students = state.classes[cls].students;
  const names = Object.keys(students);
  const sA = {}, sB = {};
  names.forEach(n => {
    const a = students[n]?.[examA]?.[sub];
    const b = students[n]?.[examB]?.[sub];
    if (typeof a === 'number') sA[n] = a;
    if (typeof b === 'number') sB[n] = b;
  });
  const rA = computeRanks(names.map(n=>sA[n]??null));
  const rB = computeRanks(names.map(n=>sB[n]??null));
  const rows = names.map((n,i)=>({
    name:n, scoreA:sA[n]??null, scoreB:sB[n]??null,
    rankA:rA[i], rankB:rB[i], delta:(rA[i]!=null&&rB[i]!=null)?rA[i]-rB[i]:null
  })).filter(r=>r.scoreB!=null||r.scoreA!=null);
  let upCnt = 0, downCnt = 0, flatCnt = 0;
  const upNames = [], downNames = [];
  rows.forEach(r => {
    if (r.delta == null) return;
    if (r.delta > 0) { upCnt++; upNames.push({name:r.name,value:'+'+r.delta,tone:'good'}); }
    else if (r.delta < 0) { downCnt++; downNames.push({name:r.name,value:r.delta+'',tone:'bad'}); }
    else flatCnt++;
  });
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'对比区间',value:esc(examA)+' → '+esc(examB)},
    {label:'进步人数',value:upCnt+' 人',cls:upCnt?'font-up':'',tipItems:upNames},
    {label:'退步人数',value:downCnt+' 人',cls:downCnt?'font-down':'',tipItems:downNames},
    {label:'名次持平',value:flatCnt+' 人'}
  ];
  const valid = rows.filter(r=>r.delta!=null);
  const bestUp = [...valid].sort((a,b)=>b.delta-a.delta)[0];
  const bestDown = [...valid].sort((a,b)=>a.delta-b.delta)[0];
  const paras = [];
  if (bestUp && bestUp.delta > 0) paras.push('进步最大：<b class="hl">' + esc(bestUp.name) + '</b>，上升 <b class="font-up">' + bestUp.delta + ' 名</b>。');
  if (bestDown && bestDown.delta < 0) paras.push('退步最大：<b class="warn">' + esc(bestDown.name) + '</b>，下降 <b class="font-down">' + Math.abs(bestDown.delta) + ' 名</b>。');
  summaryWrap.innerHTML = analysisPanel([{title:'名次变化综合统计',items,paras}]);
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'姓名',width:110,sticky:true,sortable:true,getValue:r=>r.name,render:r=>'<td style="font-weight:700">'+esc(r.name)+'</td>'},
    {label:examA+' 分数',width:100,sortable:true,getValue:r=>r.scoreA,render:r=>'<td>'+(r.scoreA??'—')+'</td>'},
    {label:examA+' 名次',width:100,sortable:true,getValue:r=>r.rankA,render:r=>'<td>'+(r.rankA??'—')+'</td>'},
    {label:examB+' 分数',width:100,sortable:true,getValue:r=>r.scoreB,render:r=>'<td>'+(r.scoreB??'—')+'</td>'},
    {label:examB+' 名次',width:100,sortable:true,getValue:r=>r.rankB,render:r=>'<td>'+(r.rankB??'—')+'</td>'},
    {label:'名次变化',width:110,sortable:true,getValue:r=>r.delta==null?-99999:r.delta,render:r=>{
      let h = '<span class="rank-flat">—</span>';
      if (r.delta != null) {
        if (r.delta > 0) h = '<span class="rank-up">↑ ' + r.delta + '</span>';
        else if (r.delta < 0) h = '<span class="rank-down">↓ ' + Math.abs(r.delta) + '</span>';
        else h = '<span class="rank-flat">持平</span>';
      } else if (r.rankA == null && r.rankB != null) h = '<span class="rank-new">新入榜</span>';
      return '<td>' + h + '</td>';
    }}
  ];
  renderGridTable(cols, rows, 'rank', tableWrap, drawF1b);
}

function renderF1c(root) {

  if (!cls || !state.classes[cls]) {

        '</select></div>' +

      '</div>' +
      '<div id="stabilityTable"></div>' +
    '</div>';
  $('stabilitySubject').addEventListener('change', drawF1c);
  drawF1c();
}
function drawF1c() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const sub = $('stabilitySubject').value;
  const summaryWrap = $('stabilitySummary');
  const tableWrap = $('stabilityTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  if (!sub) {
    tableWrap.innerHTML = '<div class="empty-hint">请先选择科目</div>';
    return;
  }
  const exams = state.examList;
  if (exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const students = state.classes[cls].students;
  const rows = [];
  for (const name in students) {
    const scores = [];
    exams.forEach(ex => {
      const v = students[name]?.[ex]?.[sub];
      if (typeof v === 'number') scores.push(v);
    });
    if (scores.length < 2) continue;
    const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
    const variance = scores.reduce((a,b)=>a+(b-avg)**2,0)/scores.length;
    const std = Math.round(Math.sqrt(variance)*10)/10;
    rows.push({name,scores,count:scores.length,avg:Math.round(avg*10)/10,std,range:Math.max(...scores)-Math.min(...scores)});
  }
  if (!rows.length) { tableWrap.innerHTML = '<div class="empty-hint">该科目数据不足</div>'; return; }
  const stabCls = s => s<=5?'stability-good':s<=12?'stability-mid':'stability-poor';
  const stabLabel = s => s<=5?'非常稳定':s<=12?'较稳定':'波动较大';
  const avgStd = rows.reduce((a,r)=>a+r.std,0)/rows.length;
  const very = rows.filter(r=>r.std<=5);
  const mid = rows.filter(r=>r.std>5&&r.std<=12);
  const poor = rows.filter(r=>r.std>12);
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'学生数',value:rows.length+' 人'},
    {label:'标准差均值',value:avgStd.toFixed(1)},
    {label:'非常稳定',value:very.length+' 人',cls:very.length?'font-up':'',tipItems:very.map(r=>({name:r.name,value:'±'+r.std,tone:'good'}))},
    {label:'波动较大',value:poor.length+' 人',cls:poor.length?'font-down':'',tipItems:poor.map(r=>({name:r.name,value:'±'+r.std,tone:'bad'}))}
  ];
  const paras = [
    '班级标准差均值 <b class="hl">' + avgStd.toFixed(1) + '</b>，' + (avgStd<=5?'非常稳定。':avgStd<=12?'相对稳定。':'波动较大。'),
    '非常稳定 <b class="font-up">' + very.length + '</b> 人，较稳定 <b>' + mid.length + '</b> 人，波动较大 <b class="warn">' + poor.length + '</b> 人。'
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'稳定性综合统计',items,paras}]);
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'姓名',width:110,sticky:true,sortable:true,getValue:r=>r.name,render:r=>'<td style="font-weight:700">'+esc(r.name)+'</td>'},
    {label:'参考次数',width:90,sortable:true,getValue:r=>r.count,render:r=>'<td>'+r.count+'</td>'},
    {label:'平均分',width:90,sortable:true,getValue:r=>r.avg,render:r=>'<td>'+r.avg+'</td>'},
    {label:'标准差',width:90,sortable:true,getValue:r=>r.std,render:r=>'<td class="'+stabCls(r.std)+'">'+r.std+'</td>'},
    {label:'波动幅度',width:100,sortable:true,getValue:r=>r.range,render:r=>'<td>'+r.range+'</td>'},
    {label:'稳定性',width:100,sortable:true,getValue:r=>r.std,render:r=>'<td class="'+stabCls(r.std)+'">'+stabLabel(r.std)+'</td>'},
    {label:'成绩序列',width:300,sortable:false,render:r=>'<td style="font-size:.78rem;color:#475569">'+r.scores.join(' → ')+'</td>'}
  ];
  renderGridTable(cols, rows, 'stability', tableWrap, drawF1c);
}

/* ============================================================
 *  F2a 班级整体
 * ============================================================ */
function renderF2a(root) {
  const cls = getPrimaryClass();
  if (!cls || !state.classes[cls]) {
    root.innerHTML = emptyTip('请先在顶部选择至少一个班级');
    return;
  }
  const exams = state.examList;
  const enabledSubs = getGlobalSubjects();
  const subs = getClassSubjects(cls).filter(s => enabledSubs.includes(s));
  const students = Object.keys(state.classes[cls].students);
  root.innerHTML = '<div id="classSummary"></div>' +
    '<div class="card"><h3>各科目班级统计趋势（' + esc(cls) + '）</h3><div id="subjectChartWrap" class="chart-grid"></div></div>';
  const items = [
    {label:'当前班级',value:esc(cls)},
    {label:'考试次数',value:exams.length+' 次'},
    {label:'科目数',value:subs.length+' 科'},
    {label:'学生人数',value:students.length+' 人',tipItems:students.map(n=>({name:n,value:''}))}
  ];
  const paras = [];
  if (exams.length >= 2) {
    const last = exams[exams.length-1], prev = exams[exams.length-2];
    let upSubs = 0, downSubs = 0, bestUpSub = null, bestDownSub = null, bestSubAvg = null, worstSubAvg = null;
    subs.forEach(sub => {
      const lv = getStat(cls, last, sub, 'avg');
      const pv = getStat(cls, prev, sub, 'avg');
      if (lv != null) {
        if (!bestSubAvg || lv > bestSubAvg.v) bestSubAvg = {sub,v:lv};
        if (!worstSubAvg || lv < worstSubAvg.v) worstSubAvg = {sub,v:lv};
      }
      if (lv == null || pv == null) return;
      const d = Math.round((lv-pv)*10)/10;
      if (d > 0) upSubs++; else if (d < 0) downSubs++;
      if (!bestUpSub || d > bestUpSub.delta) bestUpSub = {sub,delta:d};
      if (!bestDownSub || d < bestDownSub.delta) bestDownSub = {sub,delta:d};
    });
    items.push(
      {label:'进步科目',value:upSubs+' 科',cls:upSubs?'font-up':''},
      {label:'退步科目',value:downSubs+' 科',cls:downSubs?'font-down':''}
    );
    if (bestSubAvg) paras.push('最强科目：<b class="hl">' + esc(bestSubAvg.sub) + '</b>（平均 ' + bestSubAvg.v + ' 分）。');
    if (worstSubAvg && bestSubAvg && worstSubAvg.sub !== bestSubAvg.sub) paras.push('薄弱科目：<b class="hl">' + esc(worstSubAvg.sub) + '</b>（平均 ' + worstSubAvg.v + ' 分）。');
    if (bestUpSub && bestUpSub.delta > 0) paras.push('平均提升最大：<b>' + esc(bestUpSub.sub) + '</b>，<b class="font-up">+' + bestUpSub.delta + '</b> 分。');
    if (bestDownSub && bestDownSub.delta < 0) paras.push('平均下降最大：<b>' + esc(bestDownSub.sub) + '</b>，<b class="font-down">' + bestDownSub.delta + '</b> 分。');
  }
  const absentee = getAbsenteeInfo(cls);
  const sections = [{title:'班级整体表现',items,paras}];
  if (absentee) sections.push({title:'缺考名单记录',extra:renderAbsentBlock(absentee)});
  $('classSummary').innerHTML = analysisPanel(sections);
  const wrap = $('subjectChartWrap');
  wrap.innerHTML = '';
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + '</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    wrap.appendChild(card);
    addChart(makeLineChart(id, exams, [
      {label:'平均分',data:exams.map(ex=>getStat(cls,ex,sub,'avg')),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.15)',tension:.4,fill:true,pointRadius:2,borderWidth:2},
      {label:'最高分',data:exams.map(ex=>getStat(cls,ex,sub,'max')),borderColor:'#22c55e',borderDash:[5,4],tension:.4,fill:false,pointRadius:2,borderWidth:2},
      {label:'最低分',data:exams.map(ex=>getStat(cls,ex,sub,'min')),borderColor:'#ef4444',borderDash:[5,4],tension:.4,fill:false,pointRadius:2,borderWidth:2}
    ], isTotal(sub)));
  });
  setTimeout(bindHoverTips, 10);
}

/* ============================================================
 *  F2b 三分对比图（整体分析，统计类型下拉默认不选）
 * ============================================================ */
function renderF2b(root) {
  root.innerHTML =
    '<div id="tripleSummary"></div>' +
    '<div class="card">' +
      '<div class="page-title">三分对比图</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>统计类型</label><select id="tripleMode">' +
          '<option value="avg" selected>平均分</option><option value="max">最高分</option><option value="min">最低分</option>' +
        '</select></div>' +
        '<span class="info-text">使用顶部已加载班级与已加载科目</span>' +
      '</div>' +
      '<div id="tripleChartWrap" class="chart-grid" style="margin-top:16px"></div>' +
    '</div>';
  $('tripleMode').addEventListener('change', drawF2b);
  drawF2b();
}
function drawF2b() {
  const wrap = $('tripleChartWrap');
  const summaryWrap = $('tripleSummary');
  if (!wrap || !summaryWrap) return;
  wrap.innerHTML = '';
  summaryWrap.innerHTML = '';
  const mode = $('tripleMode').value;
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  if (!mode) { summaryWrap.innerHTML = '<div class="card"><div class="empty-hint">请先选择统计类型</div></div>'; return; }
  if (!classes.length || !subs.length) {
    summaryWrap.innerHTML = '<div class="card"><div class="empty-hint">请先在顶部选择班级和科目</div></div>';
    return;
  }
  const validSubs = subs.filter(sub => classes.some(c => exams.some(e => getStat(c, e, sub, mode) != null)));
  if (!validSubs.length) {
    summaryWrap.innerHTML = '<div class="card"><div class="empty-hint">所选条件下暂无数据</div></div>';
    return;
  }
  const last = exams[exams.length-1];
  const classScores = {};
  classes.forEach(cls => classScores[cls] = {total:0,count:0});
  validSubs.forEach(sub => classes.forEach(cls => {
    const v = getStat(cls, last, sub, mode);
    if (v != null) { classScores[cls].total += v; classScores[cls].count++; }
  }));
  const ranking = Object.entries(classScores).filter(([_,v])=>v.count>0)
    .map(([cls,v])=>({cls,avg:v.total/v.count})).sort((a,b)=>b.avg-a.avg);
  const items = [
    {label:'参与班级',value:classes.length+' 个'},
    {label:'科目数',value:validSubs.length+' 科'},
    {label:'统计维度',value:modeLabel(mode)}
  ];
  if (ranking.length) {
    items.push({label:'领先班级',value:esc(ranking[0].cls),cls:'font-up'});
    if (ranking.length > 1) items.push({label:'末位班级',value:esc(ranking[ranking.length-1].cls),cls:'font-down'});
  }
  const paras = [];
  if (ranking.length >= 2) {
    const gap = (ranking[0].avg - ranking[ranking.length-1].avg).toFixed(1);
    paras.push('<b class="hl">' + esc(ranking[0].cls) + '</b> 领先，<b class="hl">' + esc(ranking[ranking.length-1].cls) + '</b> 落后，差距约 <b>' + gap + '</b> 分。');
  }
  summaryWrap.innerHTML = analysisPanel([{title:'多班级综合对比',items,paras}]);

  validSubs.forEach(sub => {
    const datasets = [];
    let colorIdx = 0;
    classes.forEach(cls => {
      const data = exams.map(e => getStat(cls, e, sub, mode));
      if (data.every(v => v == null)) return;
      const c = colorPool[colorIdx++ % colorPool.length];
      datasets.push({label:cls, data, borderColor:c.border, backgroundColor:c.bg, tension:.4, fill:false, pointRadius:3, borderWidth:2});
    });
    if (!datasets.length) return;
    const card = document.createElement('div');
    card.className = 'chart-card triple-chart-card';
    const id = uid();
    const prevExam = exams.length >= 2 ? exams[exams.length-2] : null;
    const list = classes.map(cls => {
      const s = getStat(cls, last, sub, mode);
      const p = prevExam ? getStat(cls, prevExam, sub, mode) : null;
      return {cls,s,delta:(s!=null&&p!=null)?Math.round((s-p)*10)/10:null};
    });
    const valid = list.filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
    const best = valid.length ? valid[0].cls+'( '+valid[0].s+')' : '—';
    const worst = valid.length ? valid[valid.length-1].cls+'('+valid[valid.length-1].s+')' : '—';
    const withDelta = list.filter(x=>x.delta!=null);
    let bestUp = '—', worstDown = '—';
    if (withDelta.length) {
      const a = [...withDelta].sort((x,y)=>y.delta-x.delta)[0];
      const b = [...withDelta].sort((x,y)=>x.delta-y.delta)[0];
      bestUp = '<span class="text-green">' + esc(a.cls) + ' ↑+' + a.delta + '</span>';
      worstDown = '<span class="text-red">' + esc(b.cls) + ' ↓' + b.delta + '</span>';
    }
    const fmList = getSubjectFullMarkList(sub);
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + '｜' + modeLabel(mode) + '对比</h4>' +
      '<div class="chart-box"><canvas id="' + id + '"></canvas></div>' +
      '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:#f8fbff;border:1px dashed rgba(59,130,246,.25);font-size:.78rem;line-height:1.75">' +
      '<div style="font-weight:800;color:var(--primary-darker);margin-bottom:4px">' + esc(sub) + '｜' + modeLabel(mode) + '【' + esc(last) + '】</div>' +
      '<div>最优：' + esc(best) + ' &nbsp;|&nbsp; 最差：' + esc(worst) + '</div>' +
      '<div>进步最大：' + bestUp + ' &nbsp;|&nbsp; 退步最大：' + worstDown + '</div>' +
      (fmList.length ? '<div>科目满分：' + fmList.join(' / ') + '</div>' : '') +
      '</div>';
    wrap.appendChild(card);
    addChart(makeLineChart(id, exams, datasets, isTotal(sub)));
  });
}

/* ============================================================
 *  F3a 全班成绩（加科目下拉，默认不选）
 * ============================================================ */
function renderF3a(root) {
  const cls = getPrimaryClass();
  if (!cls || !state.classes[cls]) {
    root.innerHTML = emptyTip('请先在顶部选择至少一个班级');
    return;
  }
  const enabledSubs = getGlobalSubjects();
  const classSubs = getClassSubjects(cls).filter(s => enabledSubs.includes(s));
  root.innerHTML =
    '<div id="singleClassSummary"></div>' +
    '<div class="card">' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>科目</label><select id="clsSub">' +
          '<option value="">请选择科目</option>' +
          classSubs.map(s=>'<option value="'+esc(s)+'"'+(isTotal(s)?' selected':'')+'>'+esc(subjectLabel(s))+'</option>').join('') +
        '</select></div>' +
        '<span class="info-text">当前班级：' + esc(cls) + '；点击考试列表头可排序</span>' +
      '</div>' +
      '<div id="classTable"></div>' +
    '</div>';
  $('clsSub').addEventListener('change', drawF3a);
  drawF3a();
}
function drawF3a() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const sub = $('clsSub').value;
  const summaryWrap = $('singleClassSummary');
  const tableWrap = $('classTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  if (!sub) {
    tableWrap.innerHTML = '<div class="empty-hint">请先选择科目</div>';
    return;
  }
  const students = state.classes[cls].students;
  const exams = state.examList;
  const last = exams[exams.length-1];
  const scores = [];
  for (const name in students) {
    const v = students[name]?.[last]?.[sub];
    if (typeof v === 'number') scores.push(v);
  }
  if (!scores.length) { tableWrap.innerHTML = '<div class="empty-hint">该科目暂无有效成绩</div>'; return; }
  scores.sort((a,b)=>b-a);
  const max = scores[0], min = scores[scores.length-1];
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  const total = scores.length;
  const t1 = Math.ceil(total/3), t2 = Math.ceil((total-t1)/2), t3 = total-t1-t2;
  const fullMark = getClassSubjectMark(cls, last, sub) || getSubjectFullMark(sub);
  const allStudents = [];
  for (const name in students) {
    const v = students[name]?.[last]?.[sub];
    if (typeof v === 'number') allStudents.push({name,value:v+' 分'});
  }
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'参考人数',value:total+' 人',tipItems:allStudents},
    {label:'班级平均',value:avg.toFixed(1)},
    {label:'最高分',value:max,tipItems:getStatStudents(cls,last,sub,'max')},
    {label:'最低分',value:min,tipItems:getStatStudents(cls,last,sub,'min')}
  ];
  if (fullMark != null) items.push({label:'科目满分',value:fullMark});
  if (exams.length >= 2) {
    const prev = exams[exams.length-2];
    const upNames = [], downNames = [];
    let upCnt = 0, downCnt = 0;
    const prevScores = [];
    for (const name in students) {
      const a = students[name]?.[prev]?.[sub];
      const b = students[name]?.[last]?.[sub];
      if (typeof a === 'number' && typeof b === 'number') {
        if (b > a) { upCnt++; upNames.push({name,value:'+'+(Math.round((b-a)*10)/10),tone:'good'}); }
        else if (b < a) { downCnt++; downNames.push({name,value:(Math.round((b-a)*10)/10)+'',tone:'bad'}); }
      }
      if (typeof a === 'number') prevScores.push(a);
    }
    if (prevScores.length) {
      const prevAvg = prevScores.reduce((a,b)=>a+b,0)/prevScores.length;
      const d = Math.round((avg-prevAvg)*10)/10;
      items.push({label:'平均变化',value:fmtDelta(d),cls:d>0?'font-up':d<0?'font-down':'font-flat'});
    }
    items.push({label:'进步人数',value:upCnt+' 人',cls:upCnt?'font-up':'',tipItems:upNames});
    items.push({label:'退步人数',value:downCnt+' 人',cls:downCnt?'font-down':'',tipItems:downNames});
  }
  const paras = [
    '末次考试平均 <b class="hl">' + avg.toFixed(1) + '</b> 分，最高 <b>' + max + '</b>，最低 <b>' + min + '</b>。',
    '分数分布：前 1/3 段 <b>' + t1 + '</b> 人，中间段 <b>' + t2 + '</b> 人，后 1/3 段 <b>' + Math.max(t3,0) + '</b> 人。'
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'单科全班综合表现',items,paras}]);
  const rows = Object.keys(students).map(name => {
    const scores = exams.map(ex => {
      const v = students[name]?.[ex]?.[sub];
      return typeof v === 'number' ? v : null;
    });
    const valid = scores.filter(s=>s!==null);
    return {name,scores,last:valid.length?valid[valid.length-1]:-Infinity};
  });
  rows.sort((a,b)=>b.last-a.last);
  rows.forEach(r => { r._streaks = computeStreaks(r.scores); });
  const rankValsByCol = exams.map((_, i) => rows.map(rr => rr.scores[i]).filter(v => v != null).sort((a,b)=>b-a));
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'姓名',width:100,sticky:true,sortable:true,getValue:r=>r.name,render:r=>'<td style="font-weight:700">'+esc(r.name)+'</td>'}
  ];
  exams.forEach((ex,i) => {
    cols.push({
      label:ex,width:110,sortable:true,
      getValue:r=>r.scores[i]==null?-Infinity:r.scores[i],
      render:r => {
        const s = r.scores[i];
        const prevS = i > 0 ? r.scores[i-1] : null;
        const { up, down } = r._streaks;
        let cellCls = '';
        if (up[i]) cellCls = 'cell-streak-up';
        else if (down[i]) cellCls = 'cell-streak-down';
        let diffHtml = '';
        if (i > 0 && s !== null && prevS !== null) {
          const d = Math.round((s - prevS) * 10) / 10;
          diffHtml = d > 0 ? '<span class="score-diff diff-up">↑+' + d + '</span>'
            : d < 0 ? '<span class="score-diff diff-down">↓' + d + '</span>'
            : '<span class="score-diff diff-flat">—0</span>';
        }
        const rank = s != null ? rankValsByCol[i].indexOf(s) + 1 : null;
        return '<td class="' + cellCls + '"><span class="score-main">' + (s != null ? s : '—') + '</span>' +
          diffHtml + (rank ? '<span class="score-diff">(排名' + rank + ')</span>' : '') + '</td>';
      }
    });
  });
  renderGridTable(cols, rows, 'classTable', tableWrap, drawF3a);
}

function renderF3b(root) {

    '</div>';
  $('progressSub').addEventListener('change', drawF3b);
  $('progressCompare').addEventListener('change', drawF3b);

}
function drawF3b() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const sub = $('progressSub').value;
  const compareMode = $('progressCompare').value;
  const limitStr = $('progressLimit').value;
  const limit = parseInt(limitStr, 10) || 20;
  const summaryWrap = $('progressSummary');
  const tableWrap = $('progressTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  const upCanvas = $('progressUpCanvas'), downCanvas = $('progressDownCanvas');
  if (upCanvas) { const oU = Chart.getChart(upCanvas); if (oU) { try{oU.destroy();}catch(e){} } }
  if (downCanvas) { const oD = Chart.getChart(downCanvas); if (oD) { try{oD.destroy();}catch(e){} } }
  if (!sub || !compareMode || !limitStr) {
    tableWrap.innerHTML = '<div class="empty-hint">请先选择科目、对比方式和展示数量</div>';
    return;
  }
  const exams = state.examList;
  if (exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const last = exams[exams.length-1], first = exams[0], prev = exams[exams.length-2];
  const examA = compareMode === 'first' ? first : prev;
  const examB = last;
  const students = state.classes[cls].students;
  const list = [];
  for (const name in students) {
    const a = students[name]?.[examA]?.[sub];
    const b = students[name]?.[examB]?.[sub];
    if (typeof a === 'number' && typeof b === 'number') list.push({name,a,b,delta:Math.round((b-a)*10)/10});
  }
  if (!list.length) { tableWrap.innerHTML = '<div class="empty-hint">暂无可对比数据</div>'; return; }
  const upList = list.filter(x=>x.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,limit);
  const downList = list.filter(x=>x.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,limit);
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'对比区间',value:esc(examA)+' → '+esc(examB)},
    {label:'进步人数',value:upList.length+' 人',cls:'font-up',tipItems:upList.map(x=>({name:x.name,value:'+'+x.delta,tone:'good'}))},
    {label:'退步人数',value:downList.length+' 人',cls:'font-down',tipItems:downList.map(x=>({name:x.name,value:x.delta+'',tone:'bad'}))}
  ];
  const paras = [];
  if (upList.length) paras.push('进步状元：<b class="hl">' + esc(upList[0].name) + '</b>，<b class="font-up">+' + upList[0].delta + '</b> 分。');
  if (downList.length) paras.push('重点关注：<b class="warn">' + esc(downList[0].name) + '</b>，<b class="font-down">' + downList[0].delta + '</b> 分。');
  summaryWrap.innerHTML = analysisPanel([{title:'单科进步榜综合统计',items,paras}]);
  if (upList.length) addChart(makeBarChart(upCanvas.id, upList.map(x=>x.name), [{label:'进步分',data:upList.map(x=>x.delta),backgroundColor:'rgba(34,197,94,.75)',borderColor:'#16a34a',borderWidth:1}], {horizontal:true}));
  if (downList.length) addChart(makeBarChart(downCanvas.id, downList.map(x=>x.name), [{label:'退步分',data:downList.map(x=>x.delta),backgroundColor:'rgba(239,68,68,.75)',borderColor:'#dc2626',borderWidth:1}], {horizontal:true}));
  const merged = [];
  const maxLen = Math.max(upList.length, downList.length);

    {label:'退步姓名',width:100,sortable:true,getValue:r=>r.down?r.down.name:'',render:r=>'<td>'+(r.down?esc(r.down.name):'—')+'</td>'},
