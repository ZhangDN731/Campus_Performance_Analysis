function drawF3b() {
  const cls = getPrimaryClass();
  if (!cls) return;
  const sub = $('progressSub').value;
  const compareMode = $('progressCompare').value;
  const limitStr = $('progressLimit').value;
  const limit = parseInt(limitStr, 10) || 20;
  const summaryWrap = $('progressSummary');
  const tableWrap = $('progressTable');
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  const upCanvas = $('progressUpCanvas'), downCanvas = $('progressDownCanvas');
  if (upCanvas) { const oU = Chart.getChart(upCanvas); if (oU) { try{oU.destroy();}catch(e){} } }
  if (downCanvas) { const oD = Chart.getChart(downCanvas); if (oD) { try{oD.destroy();}catch(e){} } }
  if (!sub || !compareMode || !limitStr) {
    tableWrap.innerHTML = '<div class="empty-hint">请先选择科目、对比方式和展示数量</div>';
    return;
  }
  const exams = state.examList;
  if (exams.length < 2) { tableWrap.innerHTML = '<div class="empty-hint">数据不足，至少需要 2 次考试</div>'; return; }
  const last = exams[exams.length-1], first = exams[0], prev = exams[exams.length-2];
  const examA = compareMode === 'first' ? first : prev;
  const examB = last;
  const students = state.classes[cls].students;
  const list = [];
  for (const name in students) {
    const a = students[name]?.[examA]?.[sub];
    const b = students[name]?.[examB]?.[sub];
    if (typeof a === 'number' && typeof b === 'number') list.push({name,a,b,delta:Math.round((b-a)*10)/10});
  }
  if (!list.length) { tableWrap.innerHTML = '<div class="empty-hint">暂无可对比数据</div>'; return; }
  const upList = list.filter(x=>x.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,limit);
  const downList = list.filter(x=>x.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,limit);
  const items = [
    {label:'科目',value:esc(sub)},
    {label:'对比区间',value:esc(examA)+' → '+esc(examB)},
    {label:'进步人数',value:upList.length+' 人',cls:'font-up',tipItems:upList.map(x=>({name:x.name,value:'+'+x.delta,tone:'good'}))},
    {label:'退步人数',value:downList.length+' 人',cls:'font-down',tipItems:downList.map(x=>({name:x.name,value:x.delta+'',tone:'bad'}))}
  ];
  const paras = [];
  if (upList.length) paras.push('进步状元：<b class="hl">' + esc(upList[0].name) + '</b>，<b class="font-up">+' + upList[0].delta + '</b> 分。');
  if (downList.length) paras.push('重点关注：<b class="warn">' + esc(downList[0].name) + '</b>，<b class="font-down">' + downList[0].delta + '</b> 分。');
  summaryWrap.innerHTML = analysisPanel([{title:'单科进步榜综合统计',items,paras}]);
  if (upList.length) addChart(makeBarChart(upCanvas.id, upList.map(x=>x.name), [{label:'进步分',data:upList.map(x=>x.delta),backgroundColor:'rgba(34,197,94,.75)',borderColor:'#16a34a',borderWidth:1}], {horizontal:true}));
  if (downList.length) addChart(makeBarChart(downCanvas.id, downList.map(x=>x.name), [{label:'退步分',data:downList.map(x=>x.delta),backgroundColor:'rgba(239,68,68,.75)',borderColor:'#dc2626',borderWidth:1}], {horizontal:true}));
  const merged = [];
  const maxLen = Math.max(upList.length, downList.length);
  for (let i = 0; i < maxLen; i++) merged.push({up:upList[i]||null, down:downList[i]||null});
  const cols = [
    {label:'#',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'进步姓名',width:100,sortable:true,getValue:r=>r.up?r.up.name:'',render:r=>'<td>'+(r.up?esc(r.up.name):'—')+'</td>'},
    {label:'进步·上次',width:90,sortable:true,getValue:r=>r.up?r.up.a:null,render:r=>'<td>'+(r.up?r.up.a:'—')+'</td>'},
    {label:'进步·本次',width:110,sortable:true,getValue:r=>r.up?r.up.b:null,render:r=>'<td>'+(r.up?'<span class="font-up">'+r.up.b+' (+'+r.up.delta+')</span>':'—')+'</td>'},
    {label:'退步姓名',width:100,sortable:true,getValue:r=>r.down?r.down.name:'',render:r=>'<td>'+(r.down?esc(r.down.name):'—')+'</td>'},
    {label:'退步·上次',width:90,sortable:true,getValue:r=>r.down?r.down.a:null,render:r=>'<td>'+(r.down?r.down.a:'—')+'</td>'},
    {label:'退步·本次',width:110,sortable:true,getValue:r=>r.down?r.down.b:null,render:r=>'<td>'+(r.down?'<span class="font-down">'+r.down.b+' ('+r.down.delta+')</span>':'—')+'</td>'}
  ];
  renderGridTable(cols, merged, 'progress', tableWrap, drawF3b);

/* ============================================================
 *  F4b 分数段分布（下拉默认不选）
 * ============================================================ */
const SEG_LEVELS = [
  {key:'s',label:'卓越',min:0.90,cls:'seg-s'},
  {key:'a',label:'优秀',min:0.80,cls:'seg-a'},
  {key:'b',label:'良好',min:0.70,cls:'seg-b'},
  {key:'c',label:'及格',min:0.60,cls:'seg-c'},
  {key:'d',label:'待提高',min:0,cls:'seg-d'}
];
function classifyScore(score, fullMark) {
  if (fullMark == null || fullMark <= 0 || score == null) return null;
  const r = score / fullMark;
  for (const lv of SEG_LEVELS) if (r >= lv.min) return lv.key;
  return 'd';
}
function renderF4b(root) {
  root.innerHTML =
    '<div id="segSummary"></div>' +
    '<div class="card">' +
      '<div class="page-title">分数段分布</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>考试</label><select id="segExam">' +
          state.examList.map((ex,i,a)=>'<option value="'+i+'"'+(i===a.length-1?' selected':'')+'>'+esc(ex)+(i===a.length-1?'（最新）':'')+'</option>').join('') +
        '</select></div>' +
        '<div class="filter-group"><label>统计方式</label><select id="segMode">' +
          '<option value="count" selected>人数</option><option value="ratio">占比</option>' +
        '</select></div>' +
        '<span class="info-text">使用顶部已加载班级与已加载科目</span>' +
      '</div>' +
      '<div id="segChartWrap" class="chart-grid" style="margin-top:14px"></div>' +
      '<div id="segTable"></div>' +
    '</div>';
  $('segExam').addEventListener('change', drawF4b);
  $('segMode').addEventListener('change', drawF4b);
  drawF4b();
}
function drawF4b() {
  const summaryWrap = $('segSummary');
  const tableWrap = $('segTable');
  const chartWrap = $('segChartWrap');
  if (!summaryWrap) return;
  summaryWrap.innerHTML = '';
  tableWrap.innerHTML = '';
  chartWrap.innerHTML = '';
  const examVal = $('segExam').value;
  const mode = $('segMode').value;
  if (!examVal || !mode) { tableWrap.innerHTML = '<div class="empty-hint">请先选择考试和统计方式</div>'; return; }
  const examIdx = parseInt(examVal, 10);
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  if (!exams.length || Number.isNaN(examIdx)) { tableWrap.innerHTML = '<div class="empty-hint">暂无考试数据</div>'; return; }
  const exam = exams[examIdx];
  if (!classes.length || !subs.length) { tableWrap.innerHTML = '<div class="empty-hint">请先在顶部勾选班级和科目</div>'; return; }
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const fullMark = getClassSubjectMark(cls, exam, sub) || getSubjectFullMark(sub);
      const students = state.classes[cls]?.students || {};
      const listByLevel = {};
      SEG_LEVELS.forEach(lv => listByLevel[lv.key] = []);
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) listByLevel[k].push({name,value:v+' 分'});
        }
      }
      const total = SEG_LEVELS.reduce((a,lv)=>a+listByLevel[lv.key].length,0);
      if (!total) return;
      rows.push({sub,cls,fullMark,total,listByLevel});
    });
  });
  if (!rows.length) { tableWrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0;
  const sumCounts = {}; SEG_LEVELS.forEach(lv => sumCounts[lv.key] = 0);
  const nameList = {}; SEG_LEVELS.forEach(lv => nameList[lv.key] = []);
  rows.forEach(r => {
    totalRef += r.total;
    SEG_LEVELS.forEach(lv => {
      sumCounts[lv.key] += r.listByLevel[lv.key].length;
      r.listByLevel[lv.key].forEach(x => nameList[lv.key].push({name:r.cls+' · '+x.name,value:x.value}));
    });
  });
  const items = [
    {label:'统计考试',value:esc(exam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'参考人次',value:totalRef+' 次'}
  ];
  SEG_LEVELS.forEach(lv => {
    const c = sumCounts[lv.key];
    const ratio = totalRef ? c/totalRef : 0;
    items.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      value:mode === 'ratio' ? pct(ratio) : c+' 人次',
      cls: lv.key === 's' || lv.key === 'a' ? 'font-up' : lv.key === 'd' ? 'font-down' : '',
      tipItems:nameList[lv.key]
    });
  });
  const rateTop = totalRef ? (sumCounts.s + sumCounts.a)/totalRef : 0;
  const rateWeak = totalRef ? sumCounts.d/totalRef : 0;
  const paras = [
    '卓越+优秀率 <b class="hl">' + pct(rateTop) + '</b>，' + (rateTop >= 0.5 ? '整体水平较高。' : rateTop >= 0.25 ? '仍有提升空间。' : '建议加强尖子生培养。'),
    '待提高占比 <b class="warn">' + pct(rateWeak) + '</b>，' + (rateWeak >= 0.3 ? '建议重点关注基础薄弱学生。' : rateWeak >= 0.15 ? '可针对性补弱。' : '整体达标情况良好。')
  ];
  summaryWrap.innerHTML = analysisPanel([{title:'分数段综合统计',items,paras}]);
  subs.forEach(sub => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const id = uid();
    card.innerHTML = '<h4 title="' + esc(subjectLabel(sub)) + '">' + esc(sub) + ' 分数段分布</h4><div class="chart-box"><canvas id="' + id + '"></canvas></div>';
    chartWrap.appendChild(card);
    const labels = classes.slice();
    const countsByLevel = {}; SEG_LEVELS.forEach(lv => countsByLevel[lv.key] = []);
    classes.forEach(cls => {
      const fullMark = getClassSubjectMark(cls, exam, sub) || getSubjectFullMark(sub);
      const students = state.classes[cls]?.students || {};
      const counts = {}; SEG_LEVELS.forEach(lv => counts[lv.key] = 0);
      let total = 0;
      for (const name in students) {
        const v = students[name]?.[exam]?.[sub];
        if (typeof v === 'number' && fullMark != null) {
          const k = classifyScore(v, fullMark);
          if (k) counts[k]++;
          total++;
        }
      }
      SEG_LEVELS.forEach(lv => countsByLevel[lv.key].push(mode === 'ratio' ? (total ? Math.round(counts[lv.key]/total*1000)/10 : 0) : counts[lv.key]));
    });
    const colors = {
      s:{bg:'rgba(22,163,74,.8)',border:'#166534'},
      a:{bg:'rgba(34,197,94,.75)',border:'#16a34a'},
      b:{bg:'rgba(59,130,246,.75)',border:'#2563eb'},
      c:{bg:'rgba(245,158,11,.75)',border:'#d97706'},
      d:{bg:'rgba(239,68,68,.75)',border:'#dc2626'}
    };
    const datasets = SEG_LEVELS.map(lv => ({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',
      data:countsByLevel[lv.key],
      backgroundColor:colors[lv.key].bg,
      borderColor:colors[lv.key].border,
      borderWidth:1
    }));
    addChart(makeBarChart(id, labels, datasets));
  });
  const isRatio = mode === 'ratio';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'满分',width:80,sortable:true,getValue:r=>r.fullMark,render:r=>'<td>'+r.fullMark+'</td>'},
    {label:'参考人数',width:100,sortable:true,getValue:r=>r.total,render:r=>'<td><span class="count-cell" data-tip-title="参考学生名单" data-tip-items=\''+JSON.stringify(SEG_LEVELS.flatMap(lv=>r.listByLevel[lv.key])).replace(/'/g,"&#39;")+'\'>'+r.total+'</span></td>'}
  ];
  SEG_LEVELS.forEach(lv => {
    cols.push({
      label:lv.label+'('+(lv.min*100).toFixed(0)+'%+)',width:120,sortable:true,
      getValue:r=>r.listByLevel[lv.key].length,
      render:r=>{
        const c = r.listByLevel[lv.key].length;
        const val = isRatio ? pct(r.total?c/r.total:0) : c+' 人';
        return '<td><span class="seg-badge '+lv.cls+' count-cell" data-tip-title="'+esc(lv.label)+'（'+c+' 人）" data-tip-items=\''+JSON.stringify(r.listByLevel[lv.key]).replace(/'/g,"&#39;")+'\'>'+val+'</span></td>';
      }
    });
  });
  renderGridTable(cols, rows, 'seg', tableWrap, drawF4b);
}

function drawF5() {

  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;

  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const scores = exams.map(e=>getStat(cls,e,sub,mode));
      if (scores.every(s=>s===null)) return;
      rows.push({sub,cls,scores});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  const last = exams[exams.length-1];
  const prev = exams.length >= 2 ? exams[exams.length-2] : null;
  const cells = [];
  subs.forEach(sub => classes.forEach(cls => {
    const lv = getStat(cls, last, sub, mode);
    if (lv == null) return;
    const pv = prev ? getStat(cls, prev, sub, mode) : null;
    cells.push({sub,cls,last:lv,delta:(lv!=null&&pv!=null)?Math.round((lv-pv)*10)/10:null});
  }));
  const withDelta = cells.filter(c=>c.delta!=null);
  const upCells = withDelta.filter(c=>c.delta>0);
  const downCells = withDelta.filter(c=>c.delta<0);
  const topCell = [...cells].sort((a,b)=>b.last-a.last)[0];
  const bottomCell = [...cells].sort((a,b)=>a.last-b.last)[0];
  const items = [
    {label:'统计维度',value:modeLabel(mode)},
    {label:'统计组合',value:cells.length+' 项'},
    {label:'进步项',value:upCells.length+' 项',cls:upCells.length?'font-up':''},
    {label:'退步项',value:downCells.length+' 项',cls:downCells.length?'font-down':''}
  ];
  if (topCell) items.push({label:'最高项',value:esc(topCell.cls)+' · '+esc(topCell.sub),cls:'font-up'});
  if (bottomCell) items.push({label:'最低项',value:esc(bottomCell.cls)+' · '+esc(bottomCell.sub),cls:'font-down'});
  const paras = [];
  if (topCell) paras.push('最高「' + modeLabel(mode) + '」为 <b class="hl">' + esc(topCell.cls) + ' · ' + esc(topCell.sub) + '</b>（' + topCell.last + ' 分）。');
  if (bottomCell) paras.push('最低项为 <b class="hl">' + esc(bottomCell.cls) + ' · ' + esc(bottomCell.sub) + '</b>（' + bottomCell.last + ' 分）。');
  summaryWrap.innerHTML = analysisPanel([{title:'明细数据综合对比',items,paras}]);
  rows.forEach(r => { r._streaks = computeStreaks(r.scores); });
  const rankValsByCol = exams.map((_, i) => rows.map(rr => rr.scores[i]).filter(v => v != null).sort((a,b)=>b-a));
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'}
  ];
  exams.forEach((ex,i) => {
    cols.push({
      label:ex,width:120,sortable:true,
      getValue:r=>r.scores[i]==null?-Infinity:r.scores[i],
      render:r=>{
        const val = r.scores[i];
        const { up, down } = r._streaks;
        let cellCls = '';
        if (up[i]) cellCls = 'cell-streak-up';
        else if (down[i]) cellCls = 'cell-streak-down';
        let diffHtml = '';
        if (i > 0 && val !== null && r.scores[i-1] !== null) {
          const d = Math.round((val - r.scores[i-1]) * 10) / 10;
          diffHtml = d > 0 ? '<span class="score-diff diff-up">↑ +' + d + '</span>'
            : d < 0 ? '<span class="score-diff diff-down">↓ ' + d + '</span>'
            : '<span class="score-diff diff-flat">— 0</span>';
        }
        const rank = val != null ? rankValsByCol[i].indexOf(val) + 1 : null;
        return '<td class="' + cellCls + '"><span class="score-main">' + (val != null ? val : '—') + '</span>' +
          diffHtml + (rank ? '<span class="score-diff">(排名' + rank + ')</span>' : '') + '</td>';
      }
    });
  });
  renderGridTable(cols, rows, 'detail', wrap, drawF5);
}

/* ============================================================
 *  F6 达标率（考试下拉默认不选）
 * ============================================================ */
function renderF6(root) {
  root.innerHTML =
    '<div id="rateSummary"></div>' +
    '<div class="card">' +
      '<div class="page-title">成绩达标率统计</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>考试</label><select id="rateExam">' +
          state.examList.map((ex,i,a)=>'<option value="'+i+'"'+(i===a.length-1?' selected':'')+'>'+esc(ex)+(i===a.length-1?'（最新）':'')+'</option>').join('') +
        '</select></div>' +
        '<span class="info-text">最低线 = 满分 × <b id="rateMinTip">60</b>%；标准线 = 满分 × <b id="rateStdTip">80</b>%。点击表头可排序</span>' +
      '</div>' +
      '<div id="rateTable"></div>' +
    '</div>';
  $('rateExam').addEventListener('change', drawF6);
  updateRateTips();
  drawF6();
}
function drawF6() {
  const wrap = $('rateTable');
  const summaryWrap = $('rateSummary');
  if (!wrap) return;
  const classes = getGlobalClasses();
  const subs = getGlobalSubjects();
  const exams = state.examList;
  summaryWrap.innerHTML = '';
  const examVal = $('rateExam').value;
  if (!examVal) { wrap.innerHTML = '<div class="empty-hint">请先选择考试</div>'; return; }
  if (!classes.length || !subs.length || !exams.length) { wrap.innerHTML = '<div class="empty-hint">请先在顶部勾选班级和科目</div>'; return; }
  const examIdx = parseInt(examVal, 10);
  if (Number.isNaN(examIdx)) { wrap.innerHTML = '<div class="empty-hint">暂无可选考试</div>'; return; }
  const curExam = exams[examIdx];
  const prevExam = examIdx > 0 ? exams[examIdx-1] : null;
  const minPct = getRateMin(), stdPct = getRateStd();
  const rows = [];
  subs.forEach(sub => {
    classes.forEach(cls => {
      const students = state.classes[cls]?.students || {};
      const globalFm = getSubjectFullMark(sub);
      const curFm = getClassSubjectMark(cls, curExam, sub) || globalFm;
      if (curFm == null) return;
      const minLineCur = Math.round(curFm * minPct * 10) / 10;
      const stdLineCur = Math.round(curFm * stdPct * 10) / 10;
      const scores = [], minPassList = [], stdPassList = [];
      for (const name in students) {
        const v = students[name]?.[curExam]?.[sub];
        if (typeof v === 'number') {
          scores.push(v);
          if (v >= minLineCur) minPassList.push({name,value:v+' 分'});
          if (v >= stdLineCur) stdPassList.push({name,value:v+' 分'});
        }
      }
      if (!scores.length) return;
      const total = scores.length;
      const minPass = minPassList.length;
      const stdPass = stdPassList.length;
      let prevMinRate = null, prevStdRate = null, prevTotal = 0, prevFm = null;
      if (prevExam) {
        prevFm = getClassSubjectMark(cls, prevExam, sub) || globalFm;
        const prevMinLine = prevFm != null ? Math.round(prevFm * minPct * 10) / 10 : null;
        const prevStdLine = prevFm != null ? Math.round(prevFm * stdPct * 10) / 10 : null;
        const ps = [];
        for (const name in students) {
          const v = students[name]?.[prevExam]?.[sub];
          if (typeof v === 'number') ps.push(v);
        }
        if (ps.length && prevMinLine != null) {
          prevTotal = ps.length;
          prevMinRate = ps.filter(s=>s>=prevMinLine).length / ps.length;
          prevStdRate = ps.filter(s=>s>=prevStdLine).length / ps.length;
        }
      }
      rows.push({sub,cls,fullMark:curFm,minLine:minLineCur,stdLine:stdLineCur,total,minPass,stdPass,minPassList,stdPassList,
        minRate:minPass/total,stdRate:stdPass/total,prevMinRate,prevStdRate,prevTotal,prevFullMark:prevFm});
    });
  });
  if (!rows.length) { wrap.innerHTML = '<div class="empty-hint">所选条件下暂无数据</div>'; return; }
  let totalRef = 0, totalMinPass = 0, totalStdPass = 0;
  const allMinPass = [], allStdPass = [];
  rows.forEach(r => {
    totalRef += r.total; totalMinPass += r.minPass; totalStdPass += r.stdPass;
    r.minPassList.forEach(x => allMinPass.push({name:r.cls+' · '+x.name,value:x.value}));
    r.stdPassList.forEach(x => allStdPass.push({name:r.cls+' · '+x.name,value:x.value}));
  });
  const avgMin = totalRef ? totalMinPass/totalRef : 0;
  const avgStd = totalRef ? totalStdPass/totalRef : 0;
  const items = [
    {label:'统计考试',value:esc(curExam)},
    {label:'统计项',value:rows.length+' 项'},
    {label:'最低达标率均值',value:pct(avgMin),tipItems:allMinPass},
    {label:'标准达标率均值',value:pct(avgStd),tipItems:allStdPass}
  ];
  const paras = [];
  if (avgMin >= 0.8) paras.push('整体最低达标率表现良好。');
  else if (avgMin >= 0.5) paras.push('整体最低达标率处于中等水平。');
  else paras.push('整体最低达标率偏低，建议加强基础教学。');
  const fmSet = new Set(rows.map(r=>r.fullMark));
  if (fmSet.size > 1) paras.push('所选范围存在多种科目满分，已按各班实际满分独立计算。');
  summaryWrap.innerHTML = analysisPanel([{title:'达标率综合统计',items,paras}]);
  const rateCls = r => r>=0.8?'rate-good':r>=0.5?'rate-mid':'rate-low';
  const deltaHtml = (cur,prev) => {
    if (prev == null) return '<span class="rate-delta flat">—</span>';
    const d = (cur-prev)*100;
    if (Math.abs(d) < 0.05) return '<span class="rate-delta flat">0.0pp</span>';
    return '<span class="rate-delta ' + (d>0?'up':'down') + '">' + (d>0?'+':'') + d.toFixed(1) + 'pp</span>';
  };
  const fmLabelHtml = (curFm,prevFm) => (prevFm == null || Math.abs(prevFm-curFm) < 0.001) ? String(curFm) : curFm + ' <span class="fullmark-changed">(上次 ' + prevFm + ')</span>';
  const minPctText = Math.round(minPct*100) + '%';
  const stdPctText = Math.round(stdPct*100) + '%';
  const cols = [
    {label:'序号',width:56,sticky:true,sortable:false,render:(r,i)=>'<td style="font-weight:700">'+(i+1)+'</td>'},
    {label:'科目',width:170,sticky:true,sortable:true,getValue:r=>r.sub,render:r=>'<td class="cell-subject" title="'+esc(subjectLabel(r.sub))+'">'+esc(subjectLabel(r.sub))+'</td>'},
    {label:'班级',width:86,sticky:true,sortable:true,getValue:r=>r.cls,render:r=>'<td class="cell-class">'+esc(r.cls)+'</td>'},
    {label:'参考人数',width:90,sortable:true,getValue:r=>r.total,render:r=>'<td>'+r.total+'</td>'},
    {label:'本次满分',width:110,sortable:true,getValue:r=>r.fullMark,render:r=>'<td>'+fmLabelHtml(r.fullMark,r.prevFullMark)+'</td>'},
    {label:'最低线('+minPctText+')',width:120,sortable:true,getValue:r=>r.minLine,render:r=>'<td>'+r.minLine+'</td>'},
    {label:'最低达标人数',width:120,sortable:true,getValue:r=>r.minPass,render:r=>'<td><span class="count-cell" data-tip-title="最低达标名单（'+r.minPass+' 人）" data-tip-items=\''+JSON.stringify(r.minPassList).replace(/'/g,"&#39;")+'\'>'+r.minPass+'</span></td>'},
    {label:'最低达标率',width:110,sortable:true,getValue:r=>r.minRate,render:r=>'<td class="rate-cell '+rateCls(r.minRate)+'">'+pct(r.minRate)+'</td>'},
    {label:'最低·对比',width:110,sortable:true,getValue:r=>(r.prevMinRate==null?-99999:r.minRate-r.prevMinRate),render:r=>'<td>'+deltaHtml(r.minRate,r.prevMinRate)+'</td>'},
    {label:'标准线('+stdPctText+')',width:120,sortable:true,getValue:r=>r.stdLine,render:r=>'<td>'+r.stdLine+'</td>'},
    {label:'标准达标人数',width:120,sortable:true,getValue:r=>r.stdPass,render:r=>'<td><span class="count-cell" data-tip-title="标准达标名单（'+r.stdPass+' 人）" data-tip-items=\''+JSON.stringify(r.stdPassList).replace(/'/g,"&#39;")+'\'>'+r.stdPass+'</span></td>'},
    {label:'标准达标率',width:110,sortable:true,getValue:r=>r.stdRate,render:r=>'<td class="rate-cell '+rateCls(r.stdRate)+'">'+pct(r.stdRate)+'</td>'},
    {label:'标准·对比',width:110,sortable:true,getValue:r=>(r.prevStdRate==null?-99999:r.stdRate-r.prevStdRate),render:r=>'<td>'+deltaHtml(r.stdRate,r.prevStdRate)+'</td>'}
  ];
  renderGridTable(cols, rows, 'rate', wrap, drawF6);
}

/* ============================================================
 *  F7 四线达标率：按班级对照所属大类的预制四线
 *  （控制线 / 民办线 / 公办线 / 预估线）及各线 +50，
 *  统计每个班级的达标人数与达标率。
 * ============================================================ */
const F7_LINE_DEFS = [
  { key: 'control',  label: '控制线' },
  { key: 'private',  label: '民办线' },
  { key: 'public',   label: '公办线' },
  { key: 'estimate', label: '预估线' }
];
function renderF7(root) {
  root.innerHTML =
    '<div id="f7Summary"></div>' +
    '<div class="card">' +
      '<div class="page-title">四线达标率（按班级）</div>' +
      '<div class="filter-row">' +
        '<div class="filter-group"><label>考试</label><select id="f7Exam">' +
          state.examList.map((ex,i,a)=>'<option value="'+i+'"'+(i===a.length-1?' selected':'')+'>'+esc(ex)+(i===a.length-1?'（最新）':'')+'</option>').join('') +
        '</select></div>' +
        '<span class="info-text">每个班级对照其所属大类的预制四线（控制线 / 民办线 / 公办线 / 预估线）统计总分达标率；下方为各线 +50 的达标率。点击表头可排序</span>' +
      '</div>' +
      '<div id="f7TableBase"></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px">' +
      '<div class="page-title">四线+50达标率（按班级）</div>' +
      '<div id="f7TablePlus"></div>' +
    '</div>';
  $('f7Exam').addEventListener('change', drawF7);
  drawF7();
}
function drawF7() {
  const summaryWrap = $('f7Summary');
  const baseWrap = $('f7TableBase');
  const plusWrap = $('f7TablePlus');
  if (!baseWrap) return;
  const examVal = $('f7Exam').value;
  const clearAll = msg => {
    baseWrap.innerHTML = '<div class="empty-hint">' + msg + '</div>';
    if (plusWrap) plusWrap.innerHTML = '';
    if (summaryWrap) summaryWrap.innerHTML = '';
  };
  if (examVal === '' || examVal == null) { clearAll('请先选择考试'); return; }
  const examIdx = parseInt(examVal, 10);
  if (Number.isNaN(examIdx)) { clearAll('暂无可选考试'); return; }
  const curExam = state.examList[examIdx];
  const totalSub = state.subjectList.find(isTotal);
  if (!totalSub) { clearAll('未找到总分科目'); return; }
  const classes = getGlobalClasses();
  if (!classes.length) { clearAll('请先在顶部勾选班级'); return; }

  /* 逐班级收集本次总分，同时记录所属大类 */
  const rows = [];
  classes.forEach(cls => {
    const type = getClassType(cls);
    if (!type) return;
    const students = state.classes[cls]?.students || {};
    const scores = [];
    for (const name in students) {
      const v = students[name]?.[curExam]?.[totalSub];
      if (typeof v === 'number') scores.push(v);
    }
    if (!scores.length) return;
    const preset = CLASS_LINE_MAP[type] || {};
    const row = { type, cls, total: scores.length, scores };
    F7_LINE_DEFS.forEach(d => {
      const lv = preset[d.key];
      row[d.key + 'Line'] = lv;
      row[d.key + 'Pass'] = lv != null ? scores.filter(s => s >= lv).length : null;
      row[d.key + 'Rate'] = lv != null ? row[d.key + 'Pass'] / scores.length : null;
      row[d.key + 'Pass50'] = lv != null ? scores.filter(s => s >= lv + 50).length : null;
      row[d.key + 'Rate50'] = lv != null ? row[d.key + 'Pass50'] / scores.length : null;
    });
    rows.push(row);
  });
  /* 按大类号 → 班级名排序 */
  rows.sort((a, b) => {
    const ta = parseInt(a.type), tb = parseInt(b.type);
    if (!Number.isNaN(ta) && !Number.isNaN(tb) && ta !== tb) return ta - tb;
    return a.cls.localeCompare(b.cls, 'zh');
  });
  if (!rows.length) { clearAll('所选班级未匹配到考试大类（CLASS_LINE_MAP 中无对应配置）'); return; }

  /* 全班级加权汇总 */
  let allTotal = 0;
  const aggPass = {}, aggPass50 = {};
  F7_LINE_DEFS.forEach(d => { aggPass[d.key] = 0; aggPass50[d.key] = 0; });
  rows.forEach(r => {
    allTotal += r.total;
    F7_LINE_DEFS.forEach(d => {
      if (r[d.key + 'Pass'] != null) aggPass[d.key] += r[d.key + 'Pass'];
      if (r[d.key + 'Pass50'] != null) aggPass50[d.key] += r[d.key + 'Pass50'];
    });
  });
  const typeSet = new Set(rows.map(r => r.type));

  /* 摘要面板：分三个小区，避免 11 个指标挤成一团 */
  const baseItems = F7_LINE_DEFS.map(d => ({
    label: d.label, value: pct(allTotal ? aggPass[d.key] / allTotal : 0)
  }));
  const plusItems = F7_LINE_DEFS.map(d => ({
    label: d.label + '+50', value: pct(allTotal ? aggPass50[d.key] / allTotal : 0)
  }));
  const paras = [];
  const withPublic = rows.filter(r => r.publicRate != null);
  if (withPublic.length) {
    const lowest = withPublic.reduce((a, b) => a.publicRate < b.publicRate ? a : b);
    paras.push('公办线达标率最低的班级：<b>' + esc(classLabel(lowest.cls)) + '</b>（' + pct(lowest.publicRate) + '），建议重点关注。');
  }
  const withCtrl = rows.filter(r => r.controlRate != null);
  if (withCtrl.length) {
    const belowHalf = withCtrl.filter(r => r.controlRate < 0.5);
    if (belowHalf.length) paras.push('控制线达标率低于 50% 的班级：' + belowHalf.map(r => esc(classLabel(r.cls))).join('、') + '。');
  }
  if (summaryWrap) summaryWrap.innerHTML = analysisPanel([
    { title: '基础信息', items: [
      { label: '统计考试', value: esc(curExam) },
      { label: '覆盖班级', value: rows.length + ' 个' },
      { label: '覆盖大类', value: typeSet.size + ' 类' },
      { label: '参考人数', value: String(allTotal) }
    ]},
    { title: '四线达标率（整体）', items: baseItems },
    { title: '四线+50达标率（整体）', items: plusItems, paras: paras }
  ]);

  /* 表格列构造 */
  const rateCls = r => r >= 0.8 ? 'rate-good' : r >= 0.5 ? 'rate-mid' : 'rate-low';
  const buildLineCols = plus => F7_LINE_DEFS.map(d => {
    const passKey = d.key + (plus ? 'Pass50' : 'Pass');
    const rateKey = d.key + (plus ? 'Rate50' : 'Rate');
    const lineKey = d.key + 'Line';
    return [
      { label: d.label + (plus ? '+50' : ''), width: 100, sortable: true,
        getValue: r => r[lineKey] == null ? -99999 : r[lineKey] + (plus ? 50 : 0),
        render: r => '<td>' + (r[lineKey] != null ? (r[lineKey] + (plus ? 50 : 0)) : '-') + '</td>' },
      { label: '达标人数', width: 90, sortable: true,
        getValue: r => r[passKey] == null ? -99999 : r[passKey],
        render: r => '<td>' + (r[passKey] != null ? r[passKey] : '-') + '</td>' },
      { label: '达标率', width: 90, sortable: true,
        getValue: r => r[rateKey] == null ? -99999 : r[rateKey],
        render: r => { const v = r[rateKey]; return '<td class="rate-cell ' + (v == null ? '' : rateCls(v)) + '">' + (v == null ? '-' : pct(v)) + '</td>'; } }
    ];
  }).flat();

  const leadingCols = [
    { label: '大类', width: 70, sticky: true, sortable: true, getValue: r => r.type,
      render: r => '<td class="cell-class" style="font-weight:700">' + esc(r.type) + '</td>' },
    { label: '班级', width: 110, sticky: true, sortable: true, getValue: r => r.cls,
      render: r => '<td class="cell-subject">' + esc(classLabel(r.cls)) + '</td>' },
    { label: '参考人数', width: 86, sortable: true, getValue: r => r.total,
      render: r => '<td>' + r.total + '</td>' }
  ];

  renderGridTable(leadingCols.concat(buildLineCols(false)), rows, 'f7line', baseWrap, drawF7);
  if (plusWrap) renderGridTable(leadingCols.concat(buildLineCols(true)), rows, 'f7linePlus', plusWrap, drawF7);
}

/* ============ 批量导出：按学科 / 按班级逐个导出 PDF ============ */
function setCheckboxSelection(wrapId, values) {
  const set = new Set(values);
  document.querySelectorAll('#' + wrapId + ' input[type="checkbox"]').forEach(cb => {
    cb.checked = set.has(cb.value);
    cb.closest('.checkbox-item')?.classList.toggle('checked', cb.checked);
  });
}
async function exportBatch(pageId, mode, labelPrefix) {
  closeExportMenu();
  if (!hasData()) { alert('暂无数据'); return; }
  const savedPage = state.currentPage;
  const savedClasses = getGlobalClasses();
  const savedSubjects = getGlobalSubjects();
  const allClasses = Array.from(document.querySelectorAll('#globalClassWrap input[type="checkbox"]')).map(i => i.value);
  const allSubjects = Array.from(document.querySelectorAll('#globalSubjectWrap input[type="checkbox"]')).map(i => i.value);
  const items = (mode === 'class') ? allClasses : allSubjects;
  if (!items.length) { alert('没有可导出的' + (mode === 'class' ? '班级' : '学科')); return; }
  const btn = $('exportBtn');
  const oldText = btn.textContent;
  btn.disabled = true;
  try {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      btn.textContent = '导出中 ' + (i + 1) + '/' + items.length + '：' + item;
      if (mode === 'subject') {
        setCheckboxSelection('globalSubjectWrap', [item]);
        setCheckboxSelection('globalClassWrap', allClasses);
      } else {
        setCheckboxSelection('globalClassWrap', [item]);
        setCheckboxSelection('globalSubjectWrap', allSubjects);
      }
      state.currentPage = pageId;
      renderTabs();
      renderCurrentPage();
      await new Promise(r => setTimeout(r, 250));
      const fileName = sanitizeFileName(labelPrefix + '-' + item) + '.pdf';
      await exportReport(fileName);
      await new Promise(r => setTimeout(r, 600));
    }
    btn.textContent = '批量导出完成 ✓';
    setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 2500);
  } catch (e) {
    console.error(e);
    alert('批量导出失败：' + e.message);
    btn.textContent = oldText;
    btn.disabled = false;
  } finally {
    setCheckboxSelection('globalClassWrap', savedClasses);
    setCheckboxSelection('globalSubjectWrap', savedSubjects);
    state.currentPage = savedPage;
    renderTabs();
    renderCurrentPage();
  }
}

/* ============ 文件上传 ============ */
function readOneFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        ingestPart(wb);
        LAST_WORKBOOK = wb;
        resolve();
      } catch (err) { reject(new Error('【' + file.name + '】解析失败：' + err.message)); }
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsArrayBuffer(file);
  });
}
async function handleFileUpload(event) {
  const files = event.target.files;
  if (!files || !files.length) return;
  if (typeof XLSX === 'undefined') { alert('Excel 解析库尚未加载完成，请刷新页面后重试。'); return; }
  showLoading('正在读取文件，请稍候...');
  $('uploadBtn').disabled = true;
  try {
    resetAll();
    let success = 0;
    for (const f of files) {
      const ext = f.name.split('.').pop().toLowerCase();
      if (ext !== 'xlsx' && ext !== 'xls') { alert('不支持的文件格式：' + f.name + '（仅支持 .xlsx / .xls）'); continue; }
      await readOneFile(f);
      success++;
    }
    if (!success) { alert('未成功读取任何文件，请检查文件格式。'); return; }
    sortSubjects();
    snapshotRaw();
    rebuildScores();
    finishLoad(files.length > 1 ? files.length + ' 个文件' : files[0].name);
  } catch (err) {
    console.error(err);
    showToast('上传失败', err.message, 'error');
  } finally {
    event.target.value = '';
    $('uploadBtn').disabled = false;
    hideLoading();
  }
}

function sanitizeFileName(s) {
  return String(s == null ? '' : s)
    .replace(/[\\/:*?"<>|\r\n\t]/g, '-')
    .replace(/\s+/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 80);
}
/* 导出文件名：功能-班级/姓名（合并页取当前子功能名） */
function getExportPageName() {
  const page = state.currentPage;
  const cfg = MERGED_PAGES[page];
  if (cfg) {
    const seg = cfg.segments.find(s => s.id === state.mergedSeg[page]);
    if (seg) return seg.label;
  }
  return PAGE_NAMES[page] || '成绩分析';
}
function buildExportFileName(ext) {
  ext = ext || 'pdf';
  const parts = [getExportPageName()];

  // 只有个人类功能（个人趋势）才把姓名写入文件名，其余按班级
  const stuEl = $('studentSelect');
  if (state.currentPage === 'f1a' && stuEl && stuEl.value) {
    parts.push(stuEl.value);
  } else {
    const clsList = getGlobalClasses();
    if (clsList.length === 1) parts.push(clsList[0]);
    else if (clsList.length > 1) {
      parts.push(clsList.slice(0, 3).join('+') + (clsList.length > 3 ? '等' + clsList.length + '班' : ''));
    }
  }

  const name = parts.filter(Boolean).map(sanitizeFileName).filter(Boolean).join('-');
  return (name || '成绩分析') + '.' + ext;
}

/* ============================================================
 *  PDF 导出：A4 横向 + 按内容块安全分页
 *  · 横向页宽 297mm，比纵向多约 40% 横向空间
 *  · 以「内容块」（导出抬头 / 分析面板 / 卡片 / 图表卡 / 学生卡 / 表格）
 *    为最小单位排版：当前页剩余空间放不下时整块移到下一页，
 *    不再把一张图表或一行表格从中间切断
 *  · 超过一整页的长表格，再按行边界切成多段，段与段不跨页割裂
 *  · 每一页顶部自动加标题条（校区 · 功能 · 页码），中文由 canvas 绘制，不乱码
 * ============================================================ */
function exportHeaderHtml() {

  const p2 = n => String(n).padStart(2, '0');
  return '<div class="eh-title">' + esc(CAMPUS_CONFIG.name) + ' · ' + esc(getExportPageName()) + '</div>' +
    '<div class="eh-meta">导出时间 ' + now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) +
    ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) +
    ' ｜ 成绩文件 ' + esc(state.loadedFile || '-') +
    ' ｜ ' + (state.alignEnabled ? '分值已对齐最高满分' : '原始分（未对齐）') + '</div>';
}

const EXPORT_BLOCK_SEL = ['.export-header', '.analysis-panel', '.card', '.chart-card', '.stu-row-card', '.grid-table-scroll'];

/* 收集内容块：只保留最外层，避免卡片与其内部图表卡重复计数 */
function blockRects(area) {
  const base = area.getBoundingClientRect();
  const els = [];
  EXPORT_BLOCK_SEL.forEach(s => area.querySelectorAll(s).forEach(el => els.push(el)));
  /* 去重：同一元素可能匹配多个选择器（如同时有 .card 和 .analysis-panel），必须先去重，否则会重复导出 */
  const uniqueEls = Array.from(new Set(els));
  const outer = uniqueEls.filter(el => !uniqueEls.some(o => o !== el && o.contains(el)));
  return outer.map(el => {
    const r = el.getBoundingClientRect();
    return { el: el, top: r.top - base.top, height: r.height };
  }).filter(r => r.height > 0).sort((a, b) => a.top - b.top);
}

/* 递归把过高的块按子元素边界摊平成「不超过一页」的小段 */
function flattenRect(rect, usablePx) {
  if (rect.height <= usablePx) return [rect];
  const parentTop = rect.top;
  const kids = Array.from(rect.el.children)
    .filter(el => { const t = el.tagName; return t !== 'COLGROUP' && t !== 'COL'; })  /* 隐藏的列占位元素会误报整表高度，跳过 */
    .map(el => {
      const r = el.getBoundingClientRect();
      const b = rect.el.getBoundingClientRect();
      return { el: el, top: (r.top - b.top) + parentTop, height: r.height };
    })
    .filter(k => k.height > 0);
  if (!kids.length) return [rect];          // 原子块（如单个画布），无法再切
  const flat = [];
  kids.forEach(k => flattenRect(k, usablePx).forEach(u => flat.push(u)));
  return flat;
}

/* 纯函数：把摊平后的小段装箱，每箱不超过一页（用于测试） */
function binUnits(flat, usablePx) {
  const bins = [];
  let cur = null, curSpan = 0, curBottom = 0;
  flat.forEach(u => {
    const gap = cur ? Math.max(0, u.top - curBottom) : 0;
    const nextSpan = curSpan + u.height + gap;
    if (cur && nextSpan <= usablePx) { cur.push(u); curSpan = nextSpan; curBottom = u.top + u.height; }
    else { cur = [u]; curSpan = u.height; curBottom = u.top + u.height; bins.push(cur); }
  });
  return bins.map(b => {
    const top = b[0].top;
    const bottom = b[b.length - 1].top + b[b.length - 1].height;
    return { el: b[0].el, top: top, height: bottom - top, parts: b.length };
  });
}

/* 纯函数：把单元顺序排到页上，页内放不下就开新页。
   用「页首元素 top → 当前元素 bottom」的实际跨度判断，避免累加 height+固定 gap 导致误判；
   并做首页合并：若第一页只有一个很矮的块（如 export-header），尝试与下一页首块合并，消除首页大半空白。 */
function pageUnits(units, usablePx) {
  const pages = [];
  let cur = [];
  units.forEach(u => {
    if (cur.length) {
      const firstTop = cur[0].top;
      const newBottom = u.top + u.height;
      if (newBottom - firstTop > usablePx) { pages.push(cur); cur = []; }
    }
    cur.push(u);
  });
  if (cur.length) pages.push(cur);

  /* 首页合并优化：第一页仅 1 块且高度不足半页时，尝试并入第二页首块 */
  if (pages.length >= 2 && pages[0].length === 1) {
    const first = pages[0][0];
    if (first.height < usablePx * 0.5) {
      const second = pages[1];
      const mergedBottom = second[second.length - 1].top + second[second.length - 1].height;
      if (mergedBottom - first.top <= usablePx) {
        pages[1] = [first, ...second];
        pages.shift();
      }
    }
  }
  return pages;
}

async function exportReport(customFileName) {
  closeExportMenu();
  if (!hasData()) { alert('暂无数据'); return; }
  const btn = $('exportBtn');
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '导出中...';

  const area = $('contentArea');
  const head = document.createElement('div');
  head.className = 'export-header';
  head.style.display = 'block';
  head.innerHTML = exportHeaderHtml();

  const prevAreaWidth = area.style.width;
  const prevBodyOverflow = document.body.style.overflow;
  const prevHtmlOverflow = document.documentElement.style.overflow;
  const widened = [];

  try {
    document.body.classList.add('exporting');
    area.insertBefore(head, area.firstChild);

    /* 宽表完整导出：把内容区临时放宽到表格真实宽度 */
    let needW = 0;
    area.querySelectorAll('.grid-table-scroll').forEach(sc => {
      if (sc.scrollWidth > needW) needW = sc.scrollWidth;
    });
    needW = needW ? needW + 70 : 0;
    if (needW > area.clientWidth) {
      document.body.style.overflow = 'visible';
      document.documentElement.style.overflow = 'visible';
      area.style.width = needW + 'px';
      area.querySelectorAll('.grid-table-scroll').forEach(sc => {
        widened.push([sc, sc.style.overflow]);
        sc.style.overflow = 'visible';
      });
      await new Promise(r => setTimeout(r, 380));
    }

    /* 排版：先量尺寸分页，再一次性截图裁切 */
    const areaRect = area.getBoundingClientRect();
    const imgW = 297 - 16;                       // A4 横向版心
    const k0 = 2;                                // 与下方 html2canvas scale 保持一致
    const bandMm = 9;                            // 页首标题条高度
    const title = CAMPUS_CONFIG.name + ' · ' + getExportPageName();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    /* 无布局环境（如部分测试容器）回退为整图等比缩放单页 */
    if (!(areaRect.width > 0)) {
      const canvas0 = await html2canvas(area, { scale: k0, backgroundColor: '#ffffff', useCORS: true });
      const hMm0 = canvas0.height * imgW / canvas0.width;
      pdf.addImage(canvas0.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, imgW, hMm0);
      pdf.save(buildExportFileName('pdf'));
      return;
    }

    const mmPerPx = imgW / areaRect.width;
    const usablePx = (210 - 8 - 8 - bandMm) / mmPerPx;

    let bins = [];
    blockRects(area).forEach(r => flattenRect(r, usablePx).forEach(u => bins.push(u)));
    bins.sort((a, b) => a.top - b.top);
    /* 去重：摊平后可能出现单元互相包含（如外层卡片与内部表格段），
       保留较大的单元，删除完全被包含的小单元，避免同一内容被多页重复裁切 */
    const dedup = [];
    bins.forEach(u => {
      const uTop = u.top, uBot = u.top + u.height;
      const contained = dedup.some(d => d.top - 1 <= uTop && d.top + d.height + 1 >= uBot);
      if (!contained) {
        /* 同时移除已收录但被当前单元包含的旧单元 */
        for (let i = dedup.length - 1; i >= 0; i--) {
          const d = dedup[i];
          if (uTop - 1 <= d.top && uBot + 1 >= d.top + d.height) dedup.splice(i, 1);
        }
        dedup.push(u);
      }
    });
    /* 直接用去重后的单元分页，不再经过 binUnits 二次装箱（二次装箱会把 header 与高内容块拆开，导致首页空白） */
    const pages = pageUnits(dedup, usablePx);
    if (!pages.length) { alert('当前页面没有可导出的内容。'); return; }

    const bandPx = Math.round(bandMm / mmPerPx * k0);
    const titleFont = Math.round(11 * k0);

    /* 逐页分块截图：不再一次性把整页渲染成一张超高画布。
       浏览器画布高度超过约 32767px 时会把下方内容整段截断（导致「导出内容不全」），
       改为每页只截取当前页范围，任何超长表格/多卡片都能完整导出、分页准确。 */
    let prevBottom = 0;  /* 防重叠：上一页裁切底部，当前页顶部不得低于此值 */
    const pagesCount = pages.length;
    for (let i = 0; i < pagesCount; i++) {
      const pg = pages[i];
      const rawTop = Math.max(0, pg[0].top - 3);
      const topCss = Math.max(rawTop, prevBottom);  /* 与上一页不重叠 */
      const last = pg[pg.length - 1];
      const bottomCss = Math.min(areaRect.height, Math.max(topCss + 1, last.top + last.height + 3));
      prevBottom = bottomCss;
      const hCss = Math.max(1, bottomCss - topCss);

      /* 只渲染 y=topCss 起、高 hCss+标题条 的区域，画布高度始终受控 */
      const canvas = await html2canvas(area, {
        scale: k0,
        backgroundColor: '#ffffff',
        useCORS: true,
        windowWidth: Math.max(needW, areaRect.width),
        x: 0,
        y: topCss,
        width: areaRect.width,
        height: hCss + bandPx / k0
      });
      const contentH = Math.max(1, Math.round(hCss * k0));

      /* 页首标题条用 canvas 绘制，中文不会乱码 */
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width;
      tmp.height = Math.min(canvas.height, contentH + bandPx);
      const tctx = tmp.getContext('2d');
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.fillStyle = '#312e81';
      tctx.font = '700 ' + titleFont + 'px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
      tctx.textBaseline = 'middle';
      tctx.fillText(title + (pagesCount > 1 ? '　(' + (i + 1) + '/' + pagesCount + ')' : ''),
        Math.round(6 * k0), Math.round(bandPx * 0.52));
      tctx.strokeStyle = 'rgba(79,70,229,.35)';
      tctx.lineWidth = Math.max(1, k0);
      tctx.beginPath();
      tctx.moveTo(0, bandPx - Math.max(1, k0));
      tctx.lineTo(tmp.width, bandPx - Math.max(1, k0));
      tctx.stroke();
      tctx.drawImage(canvas, 0, 0, canvas.width, contentH, 0, bandPx, canvas.width, contentH);

      if (i > 0) pdf.addPage();
      const hMm = (contentH + bandPx) / k0 * mmPerPx;
      pdf.addImage(tmp.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, imgW, hMm);
    }
    pdf.save(customFileName || buildExportFileName('pdf'));
  } catch (e) {
    console.error(e);
    alert('PDF 导出失败，可使用浏览器打印另存为 PDF');
  } finally {
    widened.forEach(item => { item[0].style.overflow = item[1]; });
    area.style.width = prevAreaWidth;
    document.body.style.overflow = prevBodyOverflow;
    document.documentElement.style.overflow = prevHtmlOverflow;
    document.body.classList.remove('exporting');
    if (head.parentNode) head.parentNode.removeChild(head);
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* ============================================================
 *  分值对齐引擎
 *  背景：同一科目在不同考试里满分可能不同（实测龙泉 1类：物理
 *        入学测 245 → 周测 105，地理 105 → 45）。不折算就会把
 *        「满分缩水」误判成「成绩暴跌」。
 *  规则：以每个「班级 × 科目」历次考试中出现过的最高满分为基准，
 *        把其余考试的成绩按 最高满分 / 当次满分 等比放大。
 *        选「最高」而非「最新」：放大到最大尺度不丢分辨率，
 *        且满分最高的那次成绩保持原样不动。
 *  总分：表里常不标满分（如龙泉只有「总分」而无「总分（450）」），
 *        此时按该次考试各科满分之和推导，保证单科满分一变、总分
 *        也跟着对齐。
 *  安全：解析完先存原始快照 RAW_CLASSES，开关切换都从快照重算，
 *        反复开关不会累积误差；且只影响页面计算，不改 Excel 原文件。
 * ============================================================ */
function snapshotRaw() {
  RAW_CLASSES.data = JSON.parse(JSON.stringify(state.classes));
}

/* 某班某科目在某次考试的标注满分（未标注返回 null） */
const markedFullMark = (cls, exam, sub) => getClassSubjectMark(cls, exam, sub);

/* 某班某次考试各科标注满分之和，用于推导「总分」的满分 */
function derivedTotalMark(cls, exam) {
  const em = classExamSubjectMark.get(cls);
  if (!em) return null;
  const sm = em.get(exam);
  if (!sm) return null;
  let sum = 0, n = 0;
  sm.forEach((fm, sub) => { if (!isTotal(sub) && fm > 0) { sum += fm; n++; } });
  return n ? sum : null;
}

/* 取某班某科目某次考试的有效满分：优先标注值，总分可回退到推导值 */
function effectiveFullMark(cls, exam, sub) {
  const m = markedFullMark(cls, exam, sub);
  if (m != null) return { value: m, derived: false };
  if (isTotal(sub)) {
    const d = derivedTotalMark(cls, exam);
    if (d != null) return { value: d, derived: true };
  }
  return { value: null, derived: false };
}

/* 某班某科目在所有考试中出现过的最高满分（对齐目标）
   按最高那次对齐：历次成绩都放大到同一最大尺度，任何一次都不丢分辨率 */
function targetFullMarkFor(cls, sub) {
  let fm = null;
  for (const ex of state.examList) {
    const v = effectiveFullMark(cls, ex, sub).value;
    if (v != null && (fm == null || v > fm)) fm = v;
  }
  return fm;
}

function rebuildScores() {
  if (!RAW_CLASSES.data) return;
  state.classes = JSON.parse(JSON.stringify(RAW_CLASSES.data));
  if (!state.alignEnabled) return;
  for (const cls in state.classes) {
    const students = state.classes[cls].students || {};
    for (const name in students) {
      const stu = students[name];
      for (const ex in stu) {
        for (const sub in stu[ex]) {
          const v = stu[ex][sub];
          if (typeof v !== 'number') continue;
          const cur = effectiveFullMark(cls, ex, sub).value;
          if (cur == null || cur <= 0) continue;
          const target = targetFullMarkFor(cls, sub);
          if (target == null || Math.abs(target - cur) < 1e-9) continue;
          stu[ex][sub] = Math.round(v * target / cur * 10) / 10;
        }
      }
    }
  }
}

/* 汇总发生过满分变动的 班级 × 科目，用于顶栏一句话提示 */
function collectAlignDiff() {
  const out = [];
  const pushIfChanged = (cls, sub, marks) => {
    marks.sort((a, b) => state.examList.indexOf(a.ex) - state.examList.indexOf(b.ex));
    const uniq = [];
    marks.forEach(x => { if (!uniq.some(u => Math.abs(u - x.fm) < 1e-9)) uniq.push(x.fm); });
    if (uniq.length < 2) return;
    out.push({
      cls: cls, sub: sub, marks: marks,
      derived: marks.some(m => m.derived),
      to: Math.max.apply(null, uniq)
    });
  };

  state.classList.forEach(cls => {
    /* 单科：直接用表里标注的满分 */
    const perSub = new Map();
    const em = classExamSubjectMark.get(cls);
    if (em) {
      em.forEach((sm, ex) => {
        sm.forEach((fm, sub) => {
          if (isTotal(sub)) return;
          if (!perSub.has(sub)) perSub.set(sub, []);
          perSub.get(sub).push({ ex: ex, fm: fm, derived: false });
        });
      });
    }
    perSub.forEach((list, sub) => pushIfChanged(cls, sub, list));

    /* 总分：优先用标注值，缺失时用各科满分之和推导 */
    const totalKey = state.subjectList.find(isTotal);
    if (totalKey) {
      const tMarks = [];
      state.examList.forEach(ex => {
        const eff = effectiveFullMark(cls, ex, totalKey);
        if (eff.value != null) tMarks.push({ ex: ex, fm: eff.value, derived: eff.derived });
      });
      if (tMarks.length >= 2) pushIfChanged(cls, totalKey, tMarks);
    }
  });

  out.sort((a, b) => a.cls.localeCompare(b.cls, 'zh') || a.sub.localeCompare(b.sub, 'zh'));
  return out;
}

/* 顶栏一句话对齐状态：不再在正文铺大表格 */

/* 星耀校区的表存在上万个空列，先收缩范围再解析，避免明显卡顿 */
function shrinkSheetRange(ws) {
  if (!ws || !ws['!ref'] || typeof XLSX === 'undefined') return;
  try {
    const r = XLSX.utils.decode_range(ws['!ref']);
    let lastC = r.s.c;
    const headEnd = Math.min(r.s.r + 1, r.e.r);
    for (let R = r.s.r; R <= headEnd; R++) {
      for (let C = r.e.c; C >= r.s.c; C--) {
        const cell = ws[XLSX.utils.encode_cell({ r: R, c: C })];
        if (cell && cell.v !== null && cell.v !== undefined && String(cell.v).trim() !== '') {
          if (C > lastC) lastC = C;
          break;
        }
      }
    }
    if (lastC < r.e.c) { r.e.c = lastC; ws['!ref'] = XLSX.utils.encode_range(r); }
  } catch (e) { /* 收缩失败不影响正常解析 */ }
}

/* 多文件上传时先逐个解析进 state，全部读完再统一做快照与对齐 */
function ingestPart(wb) {
  wb.SheetNames.forEach(sheetName => {
    const className = String(sheetName).trim();
    if (!className) return;
    const ws = wb.Sheets[sheetName];
    shrinkSheetRange(ws);
    const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    parseSheet(json, className);
  });
}

/* 自动加载：按候选文件名依次尝试，便于以后换文件名或放进 data/ 目录 */
function autoLoadData() {
  const cands = (CAMPUS_CONFIG.dataCandidates && CAMPUS_CONFIG.dataCandidates.length)
    ? CAMPUS_CONFIG.dataCandidates : [CAMPUS_CONFIG.dataFile].filter(Boolean);
  if (!cands.length) {
    renderTabs();
    $('contentArea').innerHTML = emptyTip('请点击右上角「上传 Excel」选择成绩文件。');
    return;
  }

  let i = 0;
  let retryCount = 0;
  const MAX_RETRY = 2;        /* 每个 URL 最多重试 2 次（共 3 次尝试） */
  const TIMEOUT_MS = 15000;   /* 单次请求 15 秒超时 */
  const RETRY_DELAY = 800;    /* 重试间隔 800ms */

  const tryNext = () => {
    if (i >= cands.length) {
      hideLoading();
      setLoadStatus('未找到「' + CAMPUS_CONFIG.dataFile + '」，请手动上传', false);
      $('alignStatus').textContent = '';
      renderTabs();
      $('contentArea').innerHTML = emptyTip(
        '未能加载成绩文件 ' + esc(CAMPUS_CONFIG.dataFile) +
        '。<br>可能原因：文件尚未部署、网络波动或 CDN 缓存未刷新。' +
        '<br><br><button onclick="autoLoadData()" style="padding:8px 20px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">重新尝试加载</button>' +
        '　或点击右上角「上传 Excel」手动选择文件。');
      return;
    }
    const url = cands[i];
    /* 加时间戳绕过 GitHub Pages CDN 缓存，确保刚上传的文件能立即取到 */
    const urlWithTs = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    setLoadStatus('正在加载（' + (i + 1) + '/' + cands.length + '）' + (retryCount ? '· 第' + (retryCount + 1) + '次重试' : '') + '…');

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(urlWithTs, { cache: 'no-store', signal: controller.signal })
      .then(res => {
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(buf => {
        showLoading('正在解析成绩数据...');
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        resetAll();
        ingestWorkbook(wb);
        LAST_WORKBOOK = wb;
        hideLoading();
        finishLoad(url.split('/').pop());
      })
      .catch(err => {
        clearTimeout(timer);
        const isNetError = err.name === 'AbortError' || !err.message || !err.message.startsWith('HTTP');
        if (isNetError && retryCount < MAX_RETRY) {
          /* 超时或网络错误才重试；HTTP 404 说明文件不存在，不重试 */
          retryCount++;
          setTimeout(tryNext, RETRY_DELAY);
        } else {
          retryCount = 0;
          i++;
          tryNext();
        }
      });
  };
  setLoadStatus('正在尝试自动加载…');
  tryNext();
}

<script>
(function () {
  const canvas = document.getElementById('particleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
  }
  function initParticles() {
    particles = [];
    const count = Math.min(Math.floor((canvas.width * canvas.height) / 14000), 110);
    for (let i = 0; i < count; i++) particles.push(createParticle());
  }
  function createParticle() {
    return {
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      size:Math.random()*2.6+0.5,
      speedX:(Math.random()-0.5)*0.45, speedY:(Math.random()-0.5)*0.45,
      opacity:Math.random()*0.45+0.12,
      hue:Math.random()*40+200,
      saturation:Math.random()*50+50,
      lightness:Math.random()*30+50,
      pulse:Math.random()*Math.PI*2
    };
  }
  function drawParticle(p) {
    p.pulse += 0.02;
    const op = p.opacity * (0.7 + Math.sin(p.pulse) * 0.3);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + op + ')';
    ctx.fill();
    if (p.size > 1.5) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',' + p.saturation + '%,' + p.lightness + '%,' + (op * 0.15) + ')';
      ctx.fill();
    }
  }
  function connectParticles() {
    const maxDist = 145;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(59,130,246,' + ((1 - dist / maxDist) * 0.15) + ')';
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.speedX; p.y += p.speedY;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      drawParticle(p);
    });
    connectParticles();
    requestAnimationFrame(animate);
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  resize();
  animate();
})();
</script>
</body>
