<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/css/auth.css">
<title>成绩上传 - 校区成绩分析系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;--primary-dark:#3730a3;--primary-light:#eef2ff;
  --text-main:#0f172a;--text-sub:#475569;--text-muted:#94a3b8;
  --bg:#f1f5f9;--card:#ffffff;--stroke:#e2e8f0;--stroke-soft:#f1f5f9;
  --success:#16a34a;--danger:#dc2626;--warning:#ca8a04;
  --radius:14px;--shadow:0 4px 24px rgba(15,23,42,.08);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text-main);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 50%,#fdf4ff 100%);
}
.container{width:100%;max-width:720px}
.card{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:28px 32px;border:1px solid var(--stroke-soft);
}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{
  width:56px;height:56px;margin:0 auto 12px;border-radius:16px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.logo h1{font-size:1.3rem;font-weight:800;color:var(--text-main)}
.logo p{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.82rem;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.form-group input{
  width:100%;padding:11px 14px;border:1px solid var(--stroke);border-radius:10px;
  font-size:.9rem;color:var(--text-main);background:#f8fafc;transition:border .2s,box-shadow .2s;
}
.form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:#fff}
.btn{
  width:100%;padding:12px;border:none;border-radius:10px;font-size:.92rem;font-weight:700;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}
.btn-secondary:hover{background:#e0e7ff}
.btn-danger{background:#fef2f2;color:var(--danger)}
.error-msg{color:var(--danger);font-size:.8rem;margin-top:8px;text-align:center;min-height:18px}
.hint{font-size:.72rem;color:var(--text-muted);text-align:center;margin-top:16px;line-height:1.6}
/* 上传页面 */
.upload-container{max-width:880px}
.upload-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--stroke-soft)}
.upload-header h2{font-size:1.1rem;font-weight:800}
.user-info{font-size:.8rem;color:var(--text-sub)}
.user-info b{color:var(--primary)}
.upload-zone{
  border:2px dashed var(--stroke);border-radius:12px;padding:22px 16px;text-align:center;
  background:#fafbfc;transition:all .2s;cursor:pointer;margin-bottom:14px;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone .icon{font-size:22px;margin-bottom:3px}
.upload-zone .title{font-size:.85rem;font-weight:700;color:var(--text-main)}
.upload-zone .desc{font-size:.7rem;color:var(--text-muted);margin-top:2px}
.file-info{
  background:var(--primary-light);border-radius:10px;padding:12px 14px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;font-size:.82rem;
}
.file-info .name{font-weight:700;color:var(--primary-dark)}
.file-info .size{color:var(--text-muted)}
.progress-wrap{margin-bottom:16px}
.progress-bar{height:8px;background:var(--stroke-soft);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:4px;transition:width .3s;width:0%}
.progress-text{font-size:.76rem;color:var(--text-muted);margin-top:6px;text-align:center}
.result-box{padding:14px;border-radius:10px;margin-bottom:16px;font-size:.84rem;line-height:1.6}
.result-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.result-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
/* 上下两段：上半部分成绩文件上传，下半部分目标文件上传；列内纵向自然堆叠，内容在区内整体滚动 */
.upload-cols{
  display:grid;grid-template-columns:minmax(0,1fr);row-gap:8px;
  margin-top:8px;
  min-height:0;overflow:auto;
}
.up-col{
  min-width:0;display:flex;flex-direction:column;gap:8px;
  background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px 12px 12px;
}
.target-col{background:#fffdf7}
/* 教师单校区视图：成绩块、目标块左右并排一行，各自保留自己的状态/预览/进度格；管理端仍上下两段 */
body.role-campus .upload-cols{grid-template-columns:1fr 1fr;column-gap:10px}
body.role-campus .campus-grid{grid-template-columns:1fr 1fr}
.col-header{
  display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:800;color:#1e293b;
  padding-bottom:6px;border-bottom:1px solid #e5e7eb;
}
.ch-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none}
.target-col .ch-dot{background:#f59e0b}
.block-title{font-size:.76rem;font-weight:700;color:#475569;margin:0 0 8px}
.dl-block{display:flex;flex-direction:column;padding-top:0}
.dl-block .block-title{display:none}
.ul-block .block-title{display:none}
/* 图1：每校区一列（上下载卡、下独立拖拽区）+ 右侧状态/文件列 */
.campus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:stretch}
.campus-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.status-col{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  padding:10px 12px;border:1px dashed #e2e8f0;border-radius:12px;background:#fff;
}
.status-col .block-title{margin-bottom:0}
.campus-col .tpl-item{min-height:54px}
.campus-col .upload-zone{flex:1;min-height:74px;margin-bottom:0;padding:14px 10px}
.status-col .upload-action{height:auto;min-height:44px;margin-top:auto;width:100%}
.upload-zone.active{border-color:#6366f1;background:#eef2ff}
.target-col .upload-zone.active{border-color:#f59e0b;background:#fef3c7}

.tpl-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl-item{
  display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;min-height:60px;text-align:left;
  padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;
  cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s;background:#fff;
}
.tpl-item:hover{border-color:#c7d2fe;background:#f8faff;box-shadow:0 6px 18px rgba(79,70,229,.08)}
.tpl-item .tpl-icon{flex:none;display:flex;align-items:center;justify-content:center;color:#64748b}
.tpl-item .tpl-icon svg{width:18px;height:18px}
.tpl-text{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.tpl-item .tpl-name{font-size:.8rem;font-weight:700;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-item .tpl-desc{font-size:.68rem;color:#94a3b8;line-height:1.45;white-space:normal;word-break:break-word}
.back-link{display:inline-block;margin-top:16px;font-size:.8rem;color:var(--primary);text-decoration:none;font-weight:600}
.back-link:hover{text-decoration:underline}
.upload-action{background:#e0e7ff;color:#3730a3;border-radius:12px;padding:11px;width:100%;height:100%;min-height:56px;display:flex;align-items:center;justify-content:center}
.upload-action:hover:not(:disabled){background:#d9e2ff}
.upload-action:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
/* 上传块与按钮块 */
.ul-block .upload-zone{flex:1;min-height:52px;margin-bottom:0;padding:8px 12px}
.btn-block .muted-note{margin-top:8px}
/* 管理员：上传目标校区切换（展开式按钮组，不用下拉） */
.campus-pick{display:none;flex-direction:row;align-items:center;gap:8px;margin-bottom:4px}
body.role-admin .campus-pick{display:flex}
.pick-label{font-size:.72rem;color:#94a3b8;font-weight:700;flex:none}
.campus-chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{
  flex:1;padding:7px 6px;border:1px solid #e5e7eb;background:#fff;border-radius:9px;
  font-size:.78rem;color:#475569;cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,color .15s;white-space:nowrap;
}
.chip:hover{border-color:#c7d2fe;color:#3730a3}
.chip.active{background:#eef2ff;border-color:#6366f1;color:#3730a3;font-weight:700}
.target-col .chip:hover{border-color:#fde68a;color:#92400e}
.target-col .chip.active{background:#fef3c7;border-color:#f59e0b;color:#92400e;font-weight:700}
.target-zone{border-color:#fde68a;background:#fffdf7}
.target-zone:hover,.target-zone.dragover{border-color:#f59e0b;background:#fffbeb}
.tpl-item.has-data .tpl-desc{color:#64748b}
.tpl-item.no-data .tpl-desc{color:#94a3b8}
.tpl-item.downloading{opacity:.6;pointer-events:none}
.muted-note{font-size:.72rem;color:var(--text-muted);margin-top:8px;line-height:1.6}
.up-col .preview-grid{grid-template-columns:repeat(2,1fr)}
/* 文件预览卡片 */
.preview-card{
  background:linear-gradient(135deg,#fff 0%,var(--primary-light) 100%);
  border:1px solid rgba(79,70,229,.18);border-radius:14px;padding:16px 18px;margin-bottom:16px;
  animation:previewFadeIn .3s ease;
}
@keyframes previewFadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.preview-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(79,70,229,.1)}
.preview-header .ph-icon{
  width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
}
.preview-header .ph-title{font-size:.88rem;font-weight:800;color:var(--primary-dark)}
.preview-header .ph-sub{font-size:.7rem;color:var(--text-muted);margin-left:auto}
.preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.preview-item{text-align:center;padding:10px 4px;background:rgba(255,255,255,.7);border-radius:10px;border:1px solid rgba(79,70,229,.08)}
.preview-item .pi-num{font-size:1.35rem;font-weight:800;color:var(--primary);line-height:1.2;font-variant-numeric:tabular-nums}
.preview-item .pi-label{font-size:.68rem;color:var(--text-sub);margin-top:3px;font-weight:600}
.preview-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 0;color:var(--text-muted);font-size:.8rem}
.preview-loading .spin{
  width:16px;height:16px;border:2px solid rgba(79,70,229,.2);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:.78rem;margin-bottom:16px}
@media (max-width:760px){
  .upload-cols{grid-template-columns:1fr;grid-template-rows:none;row-gap:16px}
  .up-col{grid-row:auto;display:flex;flex-direction:column}
  .tpl-list{grid-template-columns:1fr}
  .campus-grid{grid-template-columns:1fr}
  .campus-col .upload-zone{min-height:80px}
  .campus-chips{gap:6px}
}
@media (max-width:480px){
  .card{padding:24px 18px}
  .upload-header{flex-direction:column;align-items:flex-start;gap:8px}
  .campus-col .upload-zone{min-height:80px}
  .chip{font-size:14px;padding:8px 4px}
  .preview-grid{grid-template-columns:repeat(2,1fr)}
  .preview-item .pi-num{font-size:1.15rem}
  .form-group input{font-size:16px}
}

/* ===== 教师管理页签：与三校区管理台共用同一个 admin ===== */
.admin-tabs{display:none;gap:6px;margin:0 0 18px;}
.admin-tabs button{
  padding:8px 18px;border:1px solid var(--stroke-soft,#e2e8f0);border-radius:999px;
  background:#fff;color:#64748b;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;
}
.admin-tabs button.on{background:#4f46e5;border-color:#4f46e5;color:#fff;}
.teacher-panel{display:none;}
/* 独立内嵌管理台：不再用 iframe 套校区页，管理台直接落在本页容器里 */
/* 固定整体尺寸：切换页签时外框宽高保持一致，内容变化只在卡片内部滚动 */
body.teacher-mode .teacher-panel{flex:1 1 auto;min-height:0;height:auto;}
.teacher-panel .admin-host#authMask{
  position:static;display:flex;height:100%;background:transparent;padding:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.teacher-panel .admin-host#authMask .auth-card.admin-full{
  width:100%;max-width:none;height:100%;max-height:none;flex:1 1 auto;
  border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;background:#fff;
}
.teacher-panel .admin-host .auth-body{flex:1 1 auto;overflow:auto;min-height:0}
/* 外层头部已有「退出」，管理台卡片内的退出链接隐藏，避免重复 */
.teacher-panel .admin-host .auth-link[data-act="logout"]{display:none}
#uploadPage.upload-container{max-width:none;width:100%;padding-left:16px;padding-right:16px;}
/* 上传页与管理台共用同一张卡片：固定一屏高、纵向 flex，两个页签外框完全一致 */
#uploadPage .card{padding:14px 16px 16px;display:flex;flex-direction:column;height:calc(100vh - 40px);max-height:none;}
#uploadPage .admin-tabs{flex:0 0 auto;}
#uploadPage .upload-cols{flex:1 1 auto;min-height:0;}
#uploadPage .teacher-panel{flex:1 1 auto;min-height:0;}
/* ===== 角色说明条 + 覆盖确认弹窗 ===== */
.role-hint{
  display:none;margin:0 0 10px;padding:9px 12px;border-radius:10px;
  background:#eff6ff;border:1px solid #dbeafe;color:#1e40af;font-size:.78rem;line-height:1.6;
}
body.role-homeroom .role-hint{background:#f0fdf4;border-color:#dcfce7;color:#166534}
body.role-homeroom .upload-cols{grid-template-columns:1fr}
body.role-campus .campus-grid{grid-template-columns:1fr 1fr}
body.role-homeroom .campus-grid{grid-template-columns:1fr}
.form-group select{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid #d8dee9;
  background:#fff;color:#334155;font-size:.9rem;font-family:inherit;outline:none;
}
.form-group select:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.confirm-mask{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.confirm-box{
  width:min(440px,92vw);background:#1e293b;color:#e2e8f0;border-radius:16px;padding:22px 24px;
  box-shadow:0 30px 70px rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.25);
}
.cb-title{font-size:1.02rem;font-weight:800;color:#fff;margin-bottom:8px}
.cb-text{font-size:.84rem;line-height:1.75;color:#cbd5e1}
.cb-text b{color:#fbbf24}
.cb-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.cb-btn{
  padding:9px 18px;border-radius:10px;border:1px solid rgba(148,163,184,.35);
  background:transparent;color:#e2e8f0;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit;
}
.cb-btn:hover{background:rgba(148,163,184,.14)}
.cb-btn.primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
.cb-btn.primary:hover{background:#4338ca}

/* ===== 教务「本校区账号」面板 ===== */
.dean-panel{
  flex:1 1 auto;min-height:0;overflow:auto;padding:4px 2px 8px;
}
.dean-card{background:#fff;border:1px solid #e5eaf4;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.dean-card h3{margin:0 0 4px;font-size:.92rem;color:#1e293b;display:flex;align-items:center;gap:8px}
.dean-card p.tip{margin:0 0 10px;font-size:.76rem;line-height:1.7;color:#64748b}
.dean-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dean-tools textarea{
  flex:1 1 320px;min-height:96px;border:1px solid #d8dee9;border-radius:10px;padding:9px 11px;
  font-family:inherit;font-size:.8rem;line-height:1.6;color:#0f172a;resize:vertical;
}
.dean-tools input[type=text],.dean-tools select{
  height:36px;border:1px solid #d8dee9;border-radius:9px;padding:0 10px;font-size:.8rem;background:#fff;color:#0f172a;font-family:inherit;
}
.dean-table{border:1px solid #eef2f7;border-radius:11px;overflow:hidden}
.dean-tr{display:grid;grid-template-columns:1.1fr .8fr .9fr .9fr 1fr;gap:8px;padding:8px 11px;font-size:.78rem;border-bottom:1px solid #f1f5f9;align-items:center}
.dean-tr:last-child{border-bottom:0}
.dean-tr.head{background:#f8fafc;color:#64748b;font-weight:700;font-size:.72rem}
.dean-tag{font-style:normal;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}
.dean-tag.homeroom{background:#f0fdf4;color:#15803d}
.dean-tag.teacher{background:#fefce8;color:#a16207}
.dean-tag.dean{background:#ecfeff;color:#0e7490}
.dean-sync{font-size:.74rem;color:#64748b;margin-left:auto}
.dean-sync.ok{color:#15803d}
.dean-sync.err{color:#b91c1c}
.dean-search{height:32px;border:1px solid #d8dee9;border-radius:9px;padding:0 10px;font-size:.78rem;min-width:170px}
.dean-empty{color:#94a3b8;font-size:.78rem;padding:10px 2px}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="container" id="loginPage">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📤</div>
      <h1>成绩文件上传</h1>
      <p>校区成绩分析系统 · 数据管理</p>
    </div>
    <div class="form-group">
      <label>账户</label>
      <input type="text" id="username" placeholder="管理员 admin / 教务 longquan / 班主任 龙泉三类一" autocomplete="username">
    </div>
    <div class="form-group" id="campusPickGroup" style="display:none">
      <select id="loginCampus">
        <option value="">自动识别 / 教务与管理员无需选择</option>
        <option value="龙泉校区">龙泉校区</option>
        <option value="星耀校区">星耀校区</option>
        <option value="睿智校区">睿智校区</option>
        <option value="廊坊校区">廊坊校区</option>
      </select>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="默认密码 123456" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="loginError"></div>
    <a href="../index.html" class="back-link">← 返回首页</a>
  </div>
</div>

<!-- ===== 上传页 ===== -->
<div class="container upload-container" id="uploadPage" style="display:none">
  <div class="card">
    <div class="upload-header">
      <h2>📤 数据文件上传管理</h2>
      <div class="user-info">当前用户：<b id="currentUser"></b> <button class="btn btn-danger" style="width:auto;padding:4px 10px;font-size:.75rem;margin-left:8px" onclick="doLogout()">退出</button></div>
    </div>

    <div class="admin-tabs" id="adminTabs">
      <button type="button" class="on" id="tabUploadBtn" onclick="switchAdminTab('upload')">成绩上传</button>
      <button type="button" id="tabTeacherBtn" onclick="switchAdminTab('teacher')">账号管理</button>
      <button type="button" id="tabDeanBtn" onclick="switchAdminTab('dean')" style="display:none">本校区账号</button>
    </div>

/* 大文件分块转 base64，避免扩展运算符栈溢出 */
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 8192;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

/* ==================== 工具函数 ==================== */
const $ = id => document.getElementById(id);
async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatSize(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(2)+' MB';
}

/* ==================== 四类账号（管理员/教务/班主任/任课老师）共用库 ==================== */
function sharedDB(){
  try{
    const raw = localStorage.getItem('pw_lq_db_v2');
    const d = raw ? JSON.parse(raw) : null;
    return (d && Array.isArray(d.users)) ? d : null;
  }catch(e){ return null; }
}
function roleLabel(role){
  return role === 'admin' ? '管理员' : role === 'dean' ? '教务' : role === 'homeroom' ? '班主任' : '任课老师';
}
/* 从共享库解析登录账号：管理员 / 教务 / 班主任；任课老师不在本页登录
   账号规则：班主任=校区名+班级名（龙泉三类一），任课老师=校区名+姓名；也可只输入班级名/姓名 */
function normLoginKey(v){ return String(v==null?'':v).replace(/\s+/g,'').toLowerCase(); }
function matchSharedUsers(users, user, pass, campusHint){
  if(!Array.isArray(users)) return null;
  const key = normLoginKey(user);
  let u = users.find(x => normLoginKey(x.u) === key && x.pwd === pass);
  if(!u){
    /* 不带校区前缀（如只输「三类一」）时，在全省份账号里找唯一匹配 */
    const byPrefix = users.filter(x => {
      if (x.pwd !== pass) return false;
      if (campusHint && (x.campus || '龙泉校区') !== campusHint) return false;
      const uu = normLoginKey(x.u);
      const camp = normLoginKey(String(x.campus||'龙泉校区').replace(/校区$/,''));
      return uu === camp + key;
    });
    if(byPrefix.length === 1) u = byPrefix[0];
    else if(byPrefix.length > 1) return {ambiguous:true};
  }
  if(!u) return null;
  if(u.status && u.status !== 'active') return {disabled:true, name:u.name};
  if(u.role === 'teacher') return {rejected:true};
  const f = campusFiles(u.campus);
  if(u.role === 'admin'){
    try{ localStorage.setItem('pw_lq_session_v1', u.u); }catch(e){}
    return {user:u.u, role:'admin', label:'管理员', name:u.name || '管理员', shared:true};
  }
  if(u.role === 'dean'){
    return {user:u.u, role:'dean', label:(u.campus || '') + '教务', name:u.name || '教务',
      campus:u.campus, file:f.file || u.file, targetFile:f.targetFile || u.targetFile, shared:true};
  }
  if(u.role === 'homeroom'){
    return {user:u.u, role:'homeroom', label:(u.campus || '') + ' · ' + (u.cls || '') + '班主任',
      name:u.name || '', campus:u.campus, cls:u.cls || '',
      file:f.file, targetFile:f.targetFile, shared:true};
  }
  return null;
}
function sharedAccount(user, pass, campusHint){
  const d = sharedDB();
  const hit = d ? matchSharedUsers(d.users, user, pass, campusHint) : null;
  if(hit) return hit;
  /* 首次打开上传页、本地库还没同步到远端账号时，直接读一次仓库账号表兜底 */
  return null;
}
async function sharedAccountAsync(user, pass, campusHint){
  const hit = sharedAccount(user, pass, campusHint);
  if(hit) return hit;
  try{
    const resp = await fetch(new URL('../assets/config/accounts.json?t=' + Date.now(), location.href).href, {cache:'no-store'});
    if(!resp.ok) return null;
    const d = await resp.json();
    return matchSharedUsers(d && d.users, user, pass, campusHint);
  }catch(e){ return null; }
}

async function doLogin(){
  const user = $('username').value.trim();
  const pass = $('password').value;
  const err = $('loginError');
  if(!user || !pass){err.textContent='请输入账户和密码';return;}
  $('loginBtn').disabled = true;
  err.textContent = '';
  const hash = await sha256(pass);
  /* 先查四类账号共享库（管理员 / 教务 / 班主任）；再回退到页面内置的教务账号表 */
  const shared = await sharedAccountAsync(user, pass, ($('loginCampus') && $('loginCampus').value) || '');
  const acc = ACCOUNTS[user];
  if(shared && shared.ambiguous){
    err.textContent = '「' + user + '」在多个校区都有同名班级，请在上方「校区」里选择所在校区，或直接输完整账号（如 龙泉三类一）';
    $('loginBtn').disabled = false;
    return;
  }
  if(shared && shared.rejected){
    err.textContent = '任课老师账号只能查看成绩，请到「校区成绩分析」页面登录';
    $('loginBtn').disabled = false;
    return;
  }
  if(shared && shared.disabled){
    err.textContent = '账号已被停用，请联系管理员';
    $('loginBtn').disabled = false;
    return;
  }
  if(shared){
    currentAccount = shared;
    sessionStorage.setItem('upload_user', JSON.stringify(currentAccount));
    showUploadPage();
    return;
  }
  if(acc && acc.hash === hash && acc.role !== 'teacher'){
    currentAccount = {user, ...acc};
    /* 三校区库还没建立时也能进整页教师管理：写入共享会话，校区页会初始化同一个 admin */
    if(acc.role === 'admin'){ try{ localStorage.setItem('pw_lq_session_v1', user); }catch(e){} }
    sessionStorage.setItem('upload_user', JSON.stringify(currentAccount));
    showUploadPage();
    return;
  }
  err.textContent = '账户或密码错误（教务 / 班主任默认密码 123456；任课老师请到成绩分析页登录）';
  $('loginBtn').disabled = false;
}

}

async function showUploadPage(){
  $('loginPage').style.display = 'none';

  const adminTabs = $('adminTabs');
  adminTabs.style.display = (role === 'admin' || role === 'dean') ? 'flex' : 'none';

  if(tBtn) tBtn.style.display = role === 'admin' ? '' : 'none';
  if(dBtn) dBtn.style.display = role === 'dean' ? '' : 'none';
  if(uBtn) uBtn.style.display = '';
  if(role === 'dean' && dBtn){
    /* 教务默认仍看上传页，需要时可切到「本校区账号」 */
    switchAdminTab('upload');
    uBtn.classList.add('on'); dBtn.classList.remove('on');
  }
  if(role !== 'admin'){
    /* 教务工/班主任：不显示管理台页签，并给上传区加一行身份说明 */
    switchAdminTab('upload');
    let hint = $('roleHint');
    if(!hint){
      hint = document.createElement('div');
      hint.id = 'roleHint';
      hint.className = 'role-hint';
      adminTabs.parentNode.insertBefore(hint, adminTabs.nextSibling);
    }
    hint.style.display = 'block';
    hint.innerHTML = role === 'homeroom'
      ? '班主任账号 · 只上传 <b>' + (currentAccount.cls || '本班') + '</b> 的成绩：系统会把该班工作表合并进校区成绩表，其他班保持不动；若教务已上传整份成绩，会先询问是否覆盖。'
      : '教务账号 · 上传 <b>' + (currentAccount.campus || '本校区') + '</b> 整份成绩表与目标表；若班主任已上传过成绩，会先询问是否覆盖。';
  }

  renderTargetCards();

  await loadRepoSizeMap();
  refreshGradeCards();
  refreshTargetCards();
  /* 体积出来后先显示「查询中」，再补最近更新日期，避免整块等待 */
  await loadRepoTimeMap([
    ...gradeCampusList().map(c => 'data/' + c.file),
    ...targetCampusList().map(c => c.targetFile)
  ]);
  refreshGradeCards();
  refreshTargetCards();
}

      sessionStorage.setItem('upload_user', JSON.stringify(currentAccount));

    }
  }
})();

/* ==================== 下载：优先取仓库最新已存文件，缺失时回退空白模板 ==================== */

async function loadRepoSizeMap(){
  try{
    const token = _dec();
    const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`, {
      headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
    });
    if(!resp.ok) return null;
    const d = await resp.json();
    const map = {};
    (d.tree || []).forEach(e => { if(e.type === 'blob') map[e.path] = e.size; });
    repoSizeMap = map;
    return map;
  }catch(e){ console.warn('读取仓库文件清单失败：', e); return null; }
}

/* ==================== 最近更新日期：取该文件最近一次提交时间（按北京时间显示） ==================== */

function formatRepoTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const p2 = n => String(n).padStart(2,'0');
  try{
    const parts = new Intl.DateTimeFormat('zh-CN', {
      timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false
    }).formatToParts(d);
    const o = {}; parts.forEach(p => { o[p.type] = p.value; });
    return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}`;
  }catch(e){
    const b = new Date(d.getTime() + 8 * 3600 * 1000);   /* 兜底：手工换算 UTC+8 */
    return `${b.getUTCFullYear()}-${p2(b.getUTCMonth()+1)}-${p2(b.getUTCDate())} ${p2(b.getUTCHours())}:${p2(b.getUTCMinutes())}`;
  }
}

/* 单个路径最近一次提交时间；无提交或无权限时返回空串（网络抖动重试一次） */
async function fetchRepoTime(path){
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?path=${encodeRepoPath(path)}&per_page=1`, {
        headers: {'Authorization':'token '+_dec(), 'Accept':'application/vnd.github.v3+json'}
      });
      if(!resp.ok){ if(resp.status >= 500 && attempt === 0){ continue; } return ''; }
      const arr = await resp.json();
      if(!Array.isArray(arr) || !arr.length) return '';
      const c = arr[0].commit || {};
      const iso = (c.committer && c.committer.date) || (c.author && c.author.date) || '';
      return formatRepoTime(iso);
    }catch(e){
      if(attempt === 0){ await new Promise(r => setTimeout(r, 1200)); continue; }
      console.warn('查询更新时间失败：', path, e);
    }
  }
  return '';
}

async function loadRepoTimeMap(paths){
  const uniq = Array.from(new Set(paths));
  const times = await Promise.all(uniq.map(fetchRepoTime));
  const map = {};
  uniq.forEach((p, i) => { if(times[i]) map[p] = times[i]; });
  repoTimeMap = map;
  return map;
}

/* 卡片副标题：第一行体积，第二行最近一次更新时间 + 下载提示 */
function buildCardDesc(meta){
  if(!meta || !meta.exists) return '尚未上传 · 暂无更新日期<br>点击下载空白模板';
  const line1 = '已上传 · ' + formatSize(meta.size);
  const state = meta.time === undefined ? '更新日期查询中…' : (meta.time ? meta.time + ' 更新' : '更新日期未知');
  return line1 + '<br>' + state + ' · 点击下载最新版';
}

/* 从 GitHub Contents API 拉取仓库内文件字节；不存在返回 null */
async function fetchRepoFile(repoPath){
  const token = _dec();
  const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(repoPath)}?ref=${GITHUB_BRANCH}`, {
    headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
  });
  if(!resp.ok) return null;
  const d = await resp.json();
  if(d.content){
    const bin = atob(String(d.content).replace(/\s/g,''));
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return {bytes:bytes, size:d.size || bytes.length, sha:d.sha};
  }
  if(d.download_url){
    const r2 = await fetch(d.download_url);
    if(!r2.ok) return null;
    return {bytes:new Uint8Array(await r2.arrayBuffer()), size:d.size || 0, sha:d.sha};
  }
  return null;
}

function saveBytesAs(bytes, fileName){
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* 班主任专用：只导出本班 worksheet，工作表名保持班级名，直接改分后回传即可 */
async function downloadHomeroomTemplate(fileName){
  const cls = (currentAccount && currentAccount.cls) || '';
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').replace(/班$/, '');
  try{
    const f = await fetchRepoFile('data/' + fileName);
    if(f && f.bytes){
      const old = XLSX.read(new Uint8Array(f.bytes), {type:'array'});
      const sheetName = old.SheetNames.filter(n => norm(n) === norm(cls))[0] ||
        (old.SheetNames.length === 1 ? old.SheetNames[0] : null);
      if(sheetName){
        const aoa = XLSX.utils.sheet_to_json(old.Sheets[sheetName], {header:1, raw:true, defval:''});
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), cls);
        const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        saveBytesAs(new Uint8Array(out), fileName.replace('.xlsx', '_' + cls + '.xlsx'));
        return true;
      }
    }
  }catch(e){ console.warn('导出本班模板失败：', e); }
  /* 仓库没有该校区整表 / 还没本班：给一张只有本班工作表的空白模板 */
  const wb = XLSX.utils.book_new();
  const aoa = [
    ['考号','姓名','9.19周测','','','','','',''],
    ['考号','姓名','语文（100）','数学（100）','主科（200）','信息技术（100）','副科（100）','职测总分（100）','总分（450）'],
    ['27010101','张三','85','92','177','88','76','82','335'],
    ['27010102','李四','78','85','163','72','68','75','306'],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), cls || '1类');
  XLSX.writeFile(wb, fileName.replace('.xlsx', '_' + (cls || '本班') + '_模板.xlsx'));
  return false;
}

function renderTemplates(){
  const grid = $('gradeGrid');
  const list = gradeCampusList();
  /* 重登 / 重复进入时先清掉旧列，避免成绩列重复叠加 */
  grid.querySelectorAll('.campus-col').forEach(n => n.remove());
  list.forEach(c=>{
    const col = document.createElement('div');
    col.className = 'campus-col';
    col.dataset.file = c.file; col.dataset.name = c.name;
    col.innerHTML = `
      <div class="tpl-item" data-path="data/${c.file}" data-file="${c.file}" data-name="${c.name}">
        <div class="tpl-icon">${DOC_SVG}</div>
        <div class="tpl-text">
          <div class="tpl-name">${c.name}成绩表</div>
          <div class="tpl-desc">正在查询最新文件…</div>
        </div>
      </div>
      <div class="upload-zone grade-zone" data-file="${c.file}" data-name="${c.name}">
        <div class="icon">📁</div>
        <div class="title">${currentAccount.role === 'homeroom' ? '拖拽上传本班（' + (currentAccount.cls || '') + '）成绩' : '拖拽上传' + c.name}</div>
        <div class="desc">${currentAccount.role === 'homeroom' ? '只需包含本班工作表，其他班不会被改动' : '点击选择或拖拽 .xlsx 到此处'}</div>
      </div>`;
    grid.insertBefore(col, grid.querySelector('.status-col'));
    const card = col.querySelector('.tpl-item');
    card.addEventListener('click', ()=>onGradeCardClick(card));
    const zoneEl = col.querySelector('.grade-zone');
    zoneEl.addEventListener('click', ()=>{ selectGradeCampus(c.file, c.name, zoneEl); $('fileInput').click(); });
    zoneEl.addEventListener('dragover', e=>{e.preventDefault();zoneEl.classList.add('dragover');});
    zoneEl.addEventListener('dragleave', ()=>zoneEl.classList.remove('dragover'));
    zoneEl.addEventListener('drop', e=>{
      e.preventDefault();zoneEl.classList.remove('dragover');
      selectGradeCampus(c.file, c.name, zoneEl);
      if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    if(repoSizeMap) probeGradeCard(card);
  });
}

async function probeGradeCard(card){
  const path = card.dataset.path;
  const desc = card.querySelector('.tpl-desc');
  const nameEl = card.querySelector('.tpl-name');
  let size = null;
  if(repoSizeMap){                                  /* 文件清单已就绪：直接判定，不发请求 */
    if(typeof repoSizeMap[path] === 'number') size = repoSizeMap[path];
  }else{
    try{
      const f = await fetchRepoFile(path);
      if(f) size = f.size;
    }catch(e){ console.warn('查询成绩文件失败：', e); }
  }
  if(size !== null){
    const time = repoTimeMap ? (repoTimeMap[path] || '') : undefined;
    fileMetaCache[path] = {exists:true, size, time};
    card.classList.add('has-data'); card.classList.remove('no-data');
    nameEl.textContent = card.dataset.name + '成绩表';
    desc.innerHTML = buildCardDesc(fileMetaCache[path]) +
      (currentAccount.role === 'homeroom' ? '<br>只导出本班（' + (currentAccount.cls || '') + '）工作表' : '');
    return fileMetaCache[path];
  }
  fileMetaCache[path] = {exists:false};
  card.classList.add('no-data'); card.classList.remove('has-data');
  nameEl.textContent = card.dataset.name + '成绩表';
  desc.innerHTML = buildCardDesc(fileMetaCache[path]);
  return fileMetaCache[path];
}

async function onGradeCardClick(card){
  const path = card.dataset.path, file = card.dataset.file;
  const desc = card.querySelector('.tpl-desc');
  /* 班主任：只下载本班工作表，不下载整份校区表 */
  if(currentAccount.role === 'homeroom'){
    const oldText = desc.textContent;
    card.classList.add('downloading');
    desc.textContent = '正在导出本班模板…';
    try{ await downloadHomeroomTemplate(file); }
    catch(e){ console.warn(e); }
    card.classList.remove('downloading');
    desc.textContent = oldText;
    return;
  }
  let cached = fileMetaCache[path];
  /* 状态未就绪（仍在查询/查询失败）时先补一次探测，避免误下空白模板 */
  if(!cached){ cached = await probeGradeCard(card); }
  if(cached && cached.exists){
    const oldText = desc.textContent;
    card.classList.add('downloading');
    desc.textContent = '正在下载…';
    try{
      const f = await fetchRepoFile(path);
      if(f){ saveBytesAs(f.bytes, file); return; }
    }catch(e){ console.warn('下载最新成绩失败：', e); }
    card.classList.remove('downloading');
    desc.textContent = oldText;
  }
  downloadEmptyGradeTemplate(file);
}

    showResult('error','仅支持 .xlsx 格式文件，请重新选择。');
    hidePreview();
    return;
  }
  selectedFile = file;
  $('fileInfo').style.display = 'flex';
  $('fileName').textContent = file.name;
  $('fileSize').textContent = formatSize(file.size);
  $('uploadBtn').disabled = false;
  $('resultBox').style.display = 'none';
  /* 上传前快速预览文件基本信息 */
  parseExcelPreview(file);
}

/* ==================== 文件预览解析 ==================== */
function hidePreview(){
  $('previewCard').style.display = 'none';
  $('previewError').style.display = 'none';
  ['pvClass','pvExam','pvStudent','pvSubject'].forEach(id => $(id).textContent = '—');
}

function showPreviewLoading(fileName){
  $('previewError').style.display = 'none';
  $('previewCard').style.display = 'block';
  $('previewFileName').textContent = fileName;
  $('previewGrid').style.display = 'none';
  $('previewLoading').style.display = 'flex';
}

function showPreviewError(msg){
  $('previewCard').style.display = 'none';
  $('previewError').style.display = 'block';
  $('previewError').textContent = '⚠ ' + msg;
}

async function parseExcelPreview(file){
  if(typeof XLSX === 'undefined'){ hidePreview(); return; }
  showPreviewLoading(file.name);
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    const classSet = new Set();
    const examSet = new Set();
    const studentSet = new Set();
    const subjectSet = new Set();
    const rosterErrors = [];
    let studentTotal = 0;   /* 分班去重后求和，与分析页「学生」口径一致 */

    let roster = null;
    try {
      const campus = (currentAccount && currentAccount.campus) || '';
      roster = campus && window.__AUTH_ENSURE_ROSTER__ ? await window.__AUTH_ENSURE_ROSTER__(campus) : null;
    } catch(e) {}

    wb.SheetNames.forEach(sheetName => {
      const className = String(sheetName).trim();
      if(!className) return;
      const ws = wb.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      if(!json || json.length < 3) return;
      classSet.add(className);
      const sheetNames = new Set();

      const layoutFn = (window.Roster && Roster.sheetLayout)
        ? Roster.sheetLayout : (() => ({vertical:false, nameCol:0, noCol:-1, startCol:1}));
      const row0 = json[0] || [], row1 = json[1] || [];
      const layout = layoutFn(json);

      if(layout.vertical){
        /* 纵向格式：表头 = 学生|考试|科目... */
        const headers = row0.map(h => String(h ?? '').trim());
        headers.slice(layout.startCol).filter(Boolean).forEach(s => subjectSet.add(s.replace(/[（(].*?[）)]/g,'').trim()));
        for(let i = 1; i < json.length; i++){
          const row = json[i];
          if(!row || row.length < layout.startCol + 1) continue;
          const name = String(row[layout.nameCol] ?? '').trim();
          const exam = String(row[1] ?? '').trim();
          if(name) sheetNames.add(name);
          if(exam) examSet.add(exam);
        }
      } else {
        /* 横向格式：第0行考试名（合并），第1行科目名 */
        for(let c = layout.startCol; c < row1.length; c++){
          const examName = String(row0[c] ?? '').trim();
          const subName = String(row1[c] ?? '').trim();
          if(examName) examSet.add(examName);
          if(subName) subjectSet.add(subName.replace(/[（(].*?[）)]/g,'').trim());
        }
        for(let r = 2; r < json.length; r++){
          const row = json[r];
          if(!row) continue;
          const name = String(row[layout.nameCol] ?? '').trim();
          if(name) sheetNames.add(name);
        }
      }
      /* 按「考号+姓名」核对名单，任何一处不一致都拒绝上传 */
      if(window.Roster && Roster.checkSheet){
        const ref = roster && roster.students && roster.students[className];
        if(ref && ref.length){
          const chk = Roster.checkSheet(json, ref);
          chk.errors.forEach(e => rosterErrors.push(className + '：' + e.text));
        }
      }
      sheetNames.forEach(n => studentSet.add(n));
      studentTotal += sheetNames.size;
    });

    /* 渲染预览数字 */
    $('previewGrid').style.display = 'grid';
    $('previewLoading').style.display = 'none';
    $('pvClass').textContent = classSet.size;
    $('pvExam').textContent = examSet.size;
    $('pvStudent').textContent = studentTotal;
    $('pvSubject').textContent = subjectSet.size;

    /* 基本校验：班级/学生齐全，且每班的考号+姓名都要与考号名单一致 */
    if(rosterErrors.length){
      showPreviewError('考号+姓名核对未通过，禁止上传：' + rosterErrors.slice(0, 4).join('；') +
        (rosterErrors.length > 4 ? '；等 ' + rosterErrors.length + ' 处不一致' : ''));
      $('uploadBtn').disabled = true;
    } else if(classSet.size === 0 || studentTotal === 0){
      showPreviewError('未识别到有效班级或学生数据，请确认文件格式是否符合模板要求。');
      $('uploadBtn').disabled = true;   /* 无效文件禁止上传，避免把坏数据合进校区表 */
    } else {
      $('uploadBtn').disabled = false;
    }
  }catch(e){
    console.error('预览解析失败:', e);
    showPreviewError('文件解析失败：' + (e.message || '未知错误') + '，但仍可尝试上传。');
  }
}

function showResult(type, msg){
  const box = $('resultBox');
  box.style.display = 'block';
  box.className = 'result-box result-' + type;
  box.innerHTML = msg;
}

/* ==================== 上传归属记录（教务 ↔ 班主任 互相识别） ==================== */
const UPLOAD_META_PATH = 'assets/config/upload-meta.json';
async function loadUploadMeta(){
  try{
    const f = await fetchRepoFile(UPLOAD_META_PATH);
    if(!f) return {sha:null, data:{}};
    const txt = new TextDecoder().decode(f.bytes);
    const o = JSON.parse(txt || '{}');
    return {sha:f.sha || null, data:(o && typeof o === 'object') ? o : {}};
  }catch(e){ console.warn('读取上传记录失败：', e); return {sha:null, data:{}}; }
}
async function saveUploadMeta(meta, campus, role, extra){
  try{
    const data = Object.assign({}, meta.data || {});
    data[campus] = Object.assign({role: role, user: currentAccount.user, name: currentAccount.name || '',
      cls: currentAccount.cls || '', time: formatRepoTime(new Date().toISOString())}, extra || {});
    const body = JSON.stringify(data, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(body)));
    const payload = { message: 'meta: ' + campus + ' 成绩上传记录', content: b64, branch: GITHUB_BRANCH };
    if(meta.sha) payload.sha = meta.sha;
    const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(UPLOAD_META_PATH)}`, {
      method:'PUT',
      headers:{'Authorization':'token '+_dec(),'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    return resp.ok;
  }catch(e){ console.warn('写入上传记录失败：', e); return false; }
}
function roleOfUpload(role){
  return role === 'admin' ? 'admin' : role === 'dean' ? 'dean' : 'homeroom';
}
/* 深色确认弹窗：覆盖上传 / 不上传 */
function askOverwrite(prev){
  return new Promise(resolve=>{
    const roleText = prev.role === 'dean' ? '教务' : prev.role === 'homeroom' ? '班主任' : '管理员';
    const mask = document.createElement('div');
    mask.className = 'confirm-mask';
    mask.innerHTML =
      '<div class="confirm-box" role="dialog" aria-modal="true">' +
        '<div class="cb-title">检测到已有上传</div>' +
        '<div class="cb-text">' + roleText + (prev.name ? '（' + prev.name + '）' : '') +
          (prev.cls ? '（' + prev.cls + '）' : '') + ' 已于 <b>' + (prev.time || '未知时间') + '</b> 上传过' +
          (prev.role === 'dean' ? '整份成绩表' : '本班成绩') + '。<br>' +
          (currentAccount.role === 'homeroom'
            ? '继续上传将覆盖<b>本班</b>此前成绩，其他班级不受影响。'
            : '继续上传将覆盖整份成绩表，包含班主任上传的内容。') +
        '</div>' +
        '<div class="cb-row">' +
          '<button class="cb-btn primary" type="button" data-ok>覆盖上传</button>' +
          '<button class="cb-btn" type="button" data-cancel>不上传</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    const done = ok => { mask.remove(); resolve(ok); };
    mask.querySelector('[data-ok]').addEventListener('click', ()=>done(true));
    mask.querySelector('[data-cancel]').addEventListener('click', ()=>done(false));
    mask.addEventListener('click', ev => { if(ev.target === mask) done(false); });
  });
}

/* 班主任上传：把本班工作表合并进校区现有成绩表，其他班原样保留 */
function mergeHomeroomSheet(inputBuf, cls, existBytes){
  const wbIn = XLSX.read(new Uint8Array(inputBuf), {type:'array'});
  const norm = s => String(s == null ? '' : s).replace(/\s+/g,'').replace(/班$/,'');
  let sheetName = wbIn.SheetNames.filter(n => norm(n) === norm(cls))[0];
  if(!sheetName && wbIn.SheetNames.length === 1) sheetName = wbIn.SheetNames[0];
  if(!sheetName) throw new Error('上传文件里没有「' + cls + '」工作表，请只上传本班成绩表（工作表名=班级名）');
  const aoa = XLSX.utils.sheet_to_json(wbIn.Sheets[sheetName], {header:1, raw:true, defval:''});
  if(!aoa.length) throw new Error('「' + cls + '」工作表是空的');
  const wsNew = XLSX.utils.aoa_to_sheet(aoa);
  const out = XLSX.utils.book_new();
  if(existBytes){
    const old = XLSX.read(new Uint8Array(existBytes), {type:'array'});
    let placed = false;
    old.SheetNames.forEach(n => {
      if(norm(n) === norm(cls)) {
        /* 保留原表的合并单元格与列宽，避免上传后表头排版被打散 */
        const oldWs = old.Sheets[n] || {};
        if(oldWs['!merges']) wsNew['!merges'] = oldWs['!merges'];
        if(oldWs['!cols']) wsNew['!cols'] = oldWs['!cols'];
        if(oldWs['!rows']) wsNew['!rows'] = oldWs['!rows'];
        XLSX.utils.book_append_sheet(out, wsNew, cls); placed = true;
      }
      else XLSX.utils.book_append_sheet(out, old.Sheets[n], n);
    });
    if(!placed) XLSX.utils.book_append_sheet(out, wsNew, cls);
  }else{
    XLSX.utils.book_append_sheet(out, wsNew, cls);
  }
  return XLSX.write(out, {bookType:'xlsx', type:'array'});
}

/* 上传前按「考号+姓名」核对：只校验目标班级（班主任）或整份（教务/管理员） */
async function validateUploadBytes(bytes, campus, onlyCls){
  if(!window.Roster || !Roster.checkSheet) return [];
  let roster = null;
  try { roster = window.__AUTH_ENSURE_ROSTER__ ? await window.__AUTH_ENSURE_ROSTER__(campus) : null; } catch(e) {}
  const wb = XLSX.read(bytes, {type:'array'});
  const errs = [];
  const firstTime = !roster || !roster.students || !Object.keys(roster.students).length;
  wb.SheetNames.forEach(name => {
    if(onlyCls && name !== onlyCls) return;
    const mat = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null});
    const layout = Roster.sheetLayout ? Roster.sheetLayout(mat) : {noCol:-1};
    if(firstTime){
      /* 首次上传：必须自带考号列，否则无法建立考号记录单 */
      if(layout.noCol < 0){ errs.push(name + '：缺少「考号」列'); return; }
      const start = layout.vertical ? 1 : 2;
      for(let r = start; r < mat.length; r++){
        const row = mat[r] || [];
        const nm = String(row[layout.nameCol] ?? '').trim();
        if(!nm) continue;
        if(!String(row[layout.noCol] ?? '').trim()) errs.push(name + '：' + nm + ' 缺少考号');
      }
      return;
    }
    const ref = roster.students[name];
    if(!ref){ errs.push(name + '：该班不在考号名单里'); return; }
    Roster.checkSheet(mat, ref).errors.forEach(e => errs.push(name + '：' + e.text));
  });
  return errs;
}

/* 由带考号的成绩表生成「考号记录单」并下载 */
function buildKaohaoFromBytes(bytes, campus){
  if(!window.Roster || !Roster.buildKaohaoBook) return;
  const wb = XLSX.read(bytes, {type:'array'});
  const sheets = Roster.buildKaohaoBook(wb);
  if(!sheets.length) return;
  const out = XLSX.utils.book_new();
  sheets.forEach(s => {
    const aoa = [['考号','姓名']].concat(s.rows.map(r => [r.no, r.name]));
    XLSX.utils.book_append_sheet(out, XLSX.utils.aoa_to_sheet(aoa), s.name);
  });
  XLSX.writeFile(out, '27届' + String(campus || '').replace(/校区$/, '') + '考号记录单.xlsx');
}

async function doUpload(){
  if(!selectedFile) return;
  $('uploadBtn').disabled = true;
  $('progressWrap').style.display = 'block';
  setProgress(10, '读取文件…');

  try{
    /* 确定上传目标：管理员取所选校区，教务/班主任固定本校 */
    const targetPath = gradeDest;
    const targetFile = targetPath.replace('data/','');
    if(currentAccount.role === 'admin'){
      const GUESS = [
        ['龙泉','27届龙泉周测成绩.xlsx'],['longquan','27届龙泉周测成绩.xlsx'],
        ['星耀','27届星耀周测成绩.xlsx'],['xingyao','27届星耀周测成绩.xlsx'],
        ['睿智','27届睿智周测成绩.xlsx'],['ruizhi','27届睿智周测成绩.xlsx'],
        ['廊坊','27届廊坊周测成绩.xlsx'],['langfang','27届廊坊周测成绩.xlsx']
      ];
      const hit = GUESS.find(g => selectedFile.name.includes(g[0]));
      if(hit && hit[1] !== targetFile){
        showResult('error', '文件名识别为「' + hit[0] + '」校区的成绩表，请先在左侧「目标校区」切换到对应校区，再重新上传。');
        $('uploadBtn').disabled = false;
        return;
      }
    }

    /* 目标校区名（用于上传归属记录） */
    const campusName = Object.keys(CAMPUS_FILES).filter(n => 'data/' + CAMPUS_FILES[n].file === targetPath)[0] || currentAccount.campus;
    const roleKey = roleOfUpload(currentAccount.role);
    const metaRes = await loadUploadMeta();
    const prev = metaRes.data[campusName];
    const needAsk = prev && ((roleKey === 'homeroom' && prev.role === 'dean') || (roleKey === 'dean' && prev.role === 'homeroom'));
    if(needAsk){
      setProgress(15, '等待确认是否覆盖…');
      const ok = await askOverwrite(prev);
      if(!ok){
        setProgress(0, '已取消上传');
        showResult('error', '已取消上传：保留 ' + (prev.role === 'dean' ? '教务' : '班主任') + ' 已上传的版本。');
        $('progressWrap').style.display = 'none';
        $('uploadBtn').disabled = false;
        return;
      }
    }

    setProgress(30, currentAccount.role === 'homeroom' ? '读取并合并本班成绩…' : '编码文件…');
    let buf = await selectedFile.arrayBuffer();
    let bytes = new Uint8Array(buf);
    /* 上传前按考号+姓名核对，不一致直接拒绝 */
    const hadRoster = !!(window.__CLASS_ROSTER__ && window.__CLASS_ROSTER__[campusName] &&
      window.__CLASS_ROSTER__[campusName].students && Object.keys(window.__CLASS_ROSTER__[campusName].students).length);
    const rosterErrs = await validateUploadBytes(bytes, campusName, currentAccount.role === 'homeroom' ? currentAccount.cls : '');
    if(rosterErrs.length){
      setProgress(0, '考号核对未通过');
      throw new Error('考号+姓名核对未通过，已拒绝上传：' + rosterErrs.slice(0, 4).join('；') +
        (rosterErrs.length > 4 ? '；等 ' + rosterErrs.length + ' 处不一致' : ''));
    }
    if(currentAccount.role === 'homeroom'){
      let existBytes = null;
      try{
        const f = await fetchRepoFile(targetPath);
        if(f && f.bytes) existBytes = f.bytes;
      }catch(e){}
      bytes = mergeHomeroomSheet(bytes, currentAccount.cls, existBytes);
    }
    const b64 = bufToBase64(bytes);

    setProgress(50, '连接 GitHub…');
    const token = _dec();
    const apiBase = 'https://api.github.com';

    /* 获取远程文件 SHA（用于更新） */
    let sha = null;
    try{
      const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(targetPath)}?ref=${GITHUB_BRANCH}`, {
        headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
      });
      if(resp.ok){ const data = await resp.json(); sha = data.sha; }
    }catch(e){}

    setProgress(70, sha ? '更新文件…' : '上传新文件…');
    const payload = {
      message: `upload: ${targetFile}`,
      content: b64,
      branch: GITHUB_BRANCH
    };
    if(sha) payload.sha = sha;

    const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(targetPath)}`, {
      method: 'PUT',
      headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });

    if(resp.ok){
      setProgress(100, '上传完成！');
      /* 该校区第一次上传带考号的成绩表：自动生成一份考号记录单 */
      let kaohaoNote = '';
      if(!hadRoster && (currentAccount.role === 'dean' || currentAccount.role === 'admin')){
        try{ buildKaohaoFromBytes(bytes, campusName); kaohaoNote = '<br>已生成「' + campusName.replace(/校区$/, '') + '考号记录单」，请保存归档。'; }catch(e){ console.warn('考号记录单生成失败：', e); }
      }
      /* 教务 / 管理员上传整份成绩：识别工作表班级，自动补建本校区班主任账号 */
      let autoNote = '';
      if((currentAccount.role === 'dean' || currentAccount.role === 'admin') && window.Auth && Auth.ensureHomerooms){
        try{
          const wb = XLSX.read(bytes, {type:'array'});
          const classes = wb.SheetNames.map(s => String(s).replace(/班$/, '').trim()).filter(Boolean);
          const out = Auth.ensureHomerooms(campusName, classes);
          if(out.created.length){
            autoNote = `<br>已自动创建 ${out.created.length} 个班主任账号：<b>${out.created.map(x => x.u).join('、')}</b>（默认密码 123456，正在同步到 GitHub）`;
            if(Auth.syncNow) Auth.syncNow();
          }
        }catch(e){ console.warn('自动创建班主任账号失败：', e); }
      }
      showResult('success',
        `✅ 上传成功！<br>文件：<b>${targetFile}</b>` +
        (currentAccount.role === 'homeroom' ? `<br>已合并 <b>${currentAccount.cls}</b> 本班工作表，其他班级保持原样。` : '') +
        kaohaoNote +
        autoNote +
        `<br>GitHub Pages 将在 1-2 分钟内自动更新。<br>访问地址：<a href="https://${GITHUB_OWNER}.github.io/${GITHUB_REPO}/" target="_blank">https://${GITHUB_OWNER}.github.io/${GITHUB_REPO}/</a>`
      );
      if(repoSizeMap && selectedFile) repoSizeMap[targetPath] = bytes.length || selectedFile.size;
      if(!repoTimeMap) repoTimeMap = {};
      repoTimeMap[targetPath] = formatRepoTime(new Date().toISOString());
      /* 记录这次上传由谁完成，供教务 / 班主任下次识别 */
      await saveUploadMeta(metaRes, campusName, roleKey);
      resetUpload();
      refreshGradeCards();
    } else {
      const err = await resp.json().catch(()=>({message:'HTTP '+resp.status}));
      throw new Error(err.message || '上传失败');
    }
  }catch(e){
    console.error(e);
    setProgress(0, '上传失败');
    showResult('error', '❌ 上传失败：' + e.message + '<br>请检查网络连接或 Token 权限。');
    $('uploadBtn').disabled = false;
  }
}

async function probeTargetCard(card){
  const path = card.dataset.path, label = card.dataset.label;
  const desc = card.querySelector('.tpl-desc'), nameEl = card.querySelector('.tpl-name');
  let size = null;
  if(repoSizeMap){                                  /* 文件清单已就绪：直接判定，不发请求 */
    if(typeof repoSizeMap[path] === 'number') size = repoSizeMap[path];
  }else{
    try{
      const f = await fetchRepoFile(path);
      if(f) size = f.size;
    }catch(e){ console.warn('查询目标文件失败：', e); }
  }
  if(size !== null){
    const time = repoTimeMap ? (repoTimeMap[path] || '') : undefined;
    targetMetaCache[path] = {exists:true, size, time};
    card.classList.add('has-data'); card.classList.remove('no-data');
    nameEl.textContent = label + '目标表';
    desc.innerHTML = buildCardDesc(targetMetaCache[path]);
    return targetMetaCache[path];
  }
  targetMetaCache[path] = {exists:false};
  card.classList.add('no-data'); card.classList.remove('has-data');
  nameEl.textContent = label + '空白目标模板';
  desc.innerHTML = buildCardDesc(targetMetaCache[path]);
  return targetMetaCache[path];
}

async function onTargetCardClick(card){
  const path = card.dataset.path, label = card.dataset.label;
  const fileName = path.split('/').pop();
  const desc = card.querySelector('.tpl-desc');
  let meta = targetMetaCache[path];
  /* 状态未就绪时先补一次探测，避免误下空白模板 */
  if(!meta){ meta = await probeTargetCard(card); }
  if(meta && meta.exists){
    const oldText = desc.textContent;
    card.classList.add('downloading');
    desc.textContent = '正在下载…';
    try{
      const f = await fetchRepoFile(path);
      if(f){ saveBytesAs(f.bytes, fileName); return; }
    }catch(e){ console.warn('下载最新目标表失败：', e); }
    card.classList.remove('downloading');
    desc.textContent = oldText;
  }
  const a = document.createElement('a');
  a.href = '../assets/templates/目标院校填写模板.xlsx';
  a.download = label + '空白目标模板.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function parseTargetPreview(file){
  if(typeof XLSX === 'undefined'){ hideTargetPreview(); return; }
  showTargetPreviewLoading(file.name);
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    let filled = 0;
    wb.SheetNames.forEach(sn=>{
      const ws = wb.Sheets[sn];
      if(!ws) return;
      const mat = XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
      if(!mat.length) return;
      const first = mat[0]||[];
      const a=String(first[0]??'').trim(), b=String(first[1]??'').trim();
      const start = (a.indexOf('姓名')>=0||b.indexOf('院校')>=0||b.indexOf('目标')>=0)?1:0;
      for(let r=start;r<mat.length;r++){
        const row=mat[r]||[];
        const name=String(row[0]??'').trim(), target=String(row[1]??'').trim();
        if(name && target) filled++;
      }
    });
    $('targetPreviewGrid').style.display='grid';
    $('targetPreviewLoading').style.display='none';
    $('tpvClass').textContent = wb.SheetNames.length;
    $('tpvFilled').textContent = filled;
    if(wb.SheetNames.length === 0){
      showTargetPreviewError('文件里没有工作表，请用「下载当前文件」得到的空白目标模板填写后再上传。');
    } else if(filled === 0){
      showTargetPreviewError('该文件还没有填写任何目标院校（空白模板请先按「姓名 + 目标院校」填好再上传）。');
    }
  }catch(e){
    console.error('目标文件预览解析失败:', e);
    showTargetPreviewError('文件解析失败：' + (e.message||'未知错误') + '，但仍可尝试上传。');
  }
}

    const payload={ message:`upload: ${targetDest}`, content:b64, branch:GITHUB_BRANCH };
    if(sha) payload.sha=sha;
    const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    if(resp.ok){
      setTargetProgress(100,'上传完成！');
      showTargetResult('success',
        `✅ 目标院校表上传成功！<br>文件：<b>${targetDest}</b><br>对应校区「学习目标」页刷新后即可看到最新目标，GitHub Pages 约 1-2 分钟生效。`
      );
      if(repoSizeMap && selectedTargetFile) repoSizeMap[targetDest] = selectedTargetFile.size;
      if(!repoTimeMap) repoTimeMap = {};
      repoTimeMap[targetDest] = formatRepoTime(new Date().toISOString());
      resetTarget();
      refreshTargetCards();
    } else {
      const err = await resp.json().catch(()=>({message:'HTTP '+resp.status}));
      throw new Error(err.message||'上传失败');
    }
  }catch(e){
    console.error(e);
    setTargetProgress(0,'上传失败');
    showTargetResult('error','❌ 目标表上传失败：' + e.message + '<br>请检查网络连接或 Token 权限。');
    $('targetUploadBtn').disabled=false;
  }
}

/* ==================== 教务：本校区账号管理 ==================== */
let deanQuery = '';
function deanAccounts(role){
  try{ return (window.Auth && Auth.listAccounts) ? (Auth.listAccounts(currentAccount.campus, role) || []) : []; }
  catch(e){ return []; }
}
function deanRoleTag(r){
  return r === 'homeroom' ? '<em class="dean-tag homeroom">班主任</em>' :
    r === 'teacher' ? '<em class="dean-tag teacher">任课老师</em>' : '<em class="dean-tag dean">教务</em>';
}
function renderDeanPanel(){
  const panel = $('deanPanel');
  if(!panel || !currentAccount || currentAccount.role !== 'dean') return;
  const campus = currentAccount.campus || '';
  const q = deanQuery.trim().toLowerCase();
  const match = a => !q || [a.u, a.name, a.cls, a.subject].some(v => String(v || '').toLowerCase().indexOf(q) >= 0);
  const homerooms = deanAccounts('homeroom').filter(match);
  const teachers = deanAccounts('teacher').filter(match);
  const st = (window.Auth && Auth.syncState) ? Auth.syncState() : {status:'idle'};
  const syncText = st.status === 'pushing' ? '正在同步到 GitHub…' :
    st.status === 'ok' ? '已同步到 GitHub' + (st.time ? '（' + st.time + '）' : '') :
    st.status === 'err' ? '同步失败：' + (st.error || '网络异常') : '修改后会自动同步到 GitHub';
  panel.innerHTML =
    '<div class="dean-card">' +
      '<h3>' + campus + ' · 账号维护 <span class="dean-sync ' + st.status + '">' + syncText + '</span></h3>' +
      '<p class="tip">班主任账号＝校区名+班级名（如 龙泉三类一），任课老师账号＝校区名+姓名（如 龙泉张迪楠），密码默认 123456。新增账号会自动写进 GitHub 共享账号库。</p>' +
      '<div class="dean-tools">' +
        '<input class="dean-search" id="deanSearch" value="" placeholder="搜索姓名 / 账号 / 班级 / 科目">' +
        '<button class="btn" type="button" style="width:auto" onclick="deanReload()">刷新</button>' +
        '<button class="btn" type="button" style="width:auto" onclick="deanForceSync()">立即同步</button>' +
      '</div>' +
    '</div>' +
    '<div class="dean-card">' +
      '<h3>班主任账号 <b style="color:#15803d">' + homerooms.length + '</b></h3>' +
      '<p class="tip">上传整份成绩后，系统会按识别到的班级自动建班主任账号；也可以点下面按钮补建缺失的班级。</p>' +
      '<div class="dean-tools" style="margin-bottom:10px">' +
        '<button class="btn btn-primary" type="button" style="width:auto" onclick="deanEnsureHomerooms()">按成绩表班级补建班主任</button>' +
      '</div>' +
      (homerooms.length ? '<div class="dean-table"><div class="dean-tr head"><span>姓名</span><span>账号</span><span>班级</span><span>密码</span><span>状态</span></div>' +
        homerooms.map(a => '<div class="dean-tr"><span>' + esc2(a.name) + ' ' + deanRoleTag(a.role) + '</span><span><b>' + esc2(a.u) + '</b></span><span>' + esc2(a.cls || '-') + '</span><span>' + (a.pwd === '123456' || a.defaultPwd ? '123456' : '已改') + '</span><span>' + (a.status === 'active' ? '正常' : a.status) + '</span></div>').join('') + '</div>'
        : '<div class="dean-empty">还没有班主任账号，上传成绩后会自动创建。</div>') +
    '</div>' +
    '<div class="dean-card">' +
      '<h3>任课老师账号 <b style="color:#a16207">' + teachers.length + '</b></h3>' +
      '<p class="tip">每行一位老师，可写成「姓名」或「姓名,科目」。账号自动生成为「' + campus.replace('校区','') + '姓名」，密码 123456；重名会跳过。</p>' +
      '<div class="dean-tools" style="margin-bottom:10px">' +
        '<textarea id="deanTeacherNames" placeholder="张迪楠&#10;周红,数学&#10;陈莹哲,英语"></textarea>' +
        '<button class="btn btn-primary" type="button" style="width:auto;align-self:flex-start" onclick="deanCreateTeachers()">批量创建</button>' +
      '</div>' +
      (teachers.length ? '<div class="dean-table"><div class="dean-tr head"><span>姓名</span><span>账号</span><span>科目</span><span>密码</span><span>状态</span></div>' +
        teachers.map(a => '<div class="dean-tr"><span>' + esc2(a.name) + ' ' + deanRoleTag(a.role) + '</span><span><b>' + esc2(a.u) + '</b></span><span>' + esc2(a.subject || '-') + '</span><span>' + (a.pwd === '123456' || a.defaultPwd ? '123456' : '已改') + '</span><span>' + (a.status === 'active' ? '正常' : a.status) + '</span></div>').join('') + '</div>'
        : '<div class="dean-empty">还没有任课老师账号，可在上方批量创建。</div>') +
    '</div>' +
    '<div id="deanMsg" class="dean-empty" style="display:none"></div>';
  const inp = $('deanSearch');
  if(inp){
    inp.value = deanQuery;
    inp.addEventListener('input', () => {
      deanQuery = inp.value;
      clearTimeout(window.__DEAN_T);
      window.__DEAN_T = setTimeout(() => {
        renderDeanPanel();
        const nx = $('deanSearch');
        if(nx){ nx.focus(); try{ nx.setSelectionRange(nx.value.length, nx.value.length); }catch(e){} }
      }, 260);
    });
  }
}
function esc2(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function deanMsg(text, type){
  const box = $('deanMsg');
  if(!box) return;
  box.style.display = 'block';
  box.style.color = type === 'err' ? '#b91c1c' : type === 'ok' ? '#15803d' : '#475569';
  box.innerHTML = text;
}
function deanReload(){ renderDeanPanel(); deanMsg('已刷新本校区账号列表。'); }
async function deanForceSync(){
  if(!window.Auth || !Auth.syncNow){ deanMsg('管理模块未就绪，请稍后刷新页面。', 'err'); return; }
  deanMsg('正在同步到 GitHub…');
  const st = await Auth.syncNow();
  renderDeanPanel();
  deanMsg(st.status === 'ok' ? '已同步到 GitHub' + (st.time ? '（' + st.time + '）' : '') + '，其他设备打开页面即可拉到最新账号。'
    : '同步失败：' + (st.error || '网络异常') + '（本地修改已保留，可稍后再试）', st.status === 'ok' ? 'ok' : 'err');
}
function deanCreateTeachers(){
  const box = $('deanTeacherNames');
  const txt = box ? box.value : '';
  const rows = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/[，,\t]/).map(x => x.trim());
    return { name: p[0], subject: p[1] || '' };
  });
  if(!rows.length){ deanMsg('请先填写老师姓名，每行一位。', 'err'); return; }
  if(!window.Auth || !Auth.ensureTeachers){ deanMsg('管理模块未就绪，请稍后重试。', 'err'); return; }
  const out = Auth.ensureTeachers(currentAccount.campus, rows);
  deanQuery = '';
  renderDeanPanel();
  deanMsg('已创建 ' + out.created.length + ' 个账号：' + (out.created.map(x => x.u).join('、') || '无') +
    (out.skipped.length ? '<br>跳过：' + esc2(out.skipped.join('；')) : '') +
    '<br>正在同步到 GitHub…', 'ok');
  Auth.syncNow().then(st => { renderDeanPanel(); deanMsg(deanMsgText(out, st), st.status === 'ok' ? 'ok' : 'err'); });
}
function deanMsgText(out, st){
  return '已创建 ' + out.created.length + ' 个账号：' + (out.created.map(x => x.u).join('、') || '无') +
    (out.skipped.length ? '<br>跳过：' + esc2(out.skipped.join('；')) : '') +
    '<br>' + (st.status === 'ok' ? '已同步到 GitHub' : '同步失败：' + (st.error || '网络异常'));
}
async function deanEnsureHomerooms(){
  if(!window.Auth || !Auth.ensureHomerooms){ deanMsg('管理模块未就绪，请稍后重试。', 'err'); return; }
  const campus = currentAccount.campus;
  const file = currentAccount.file;
  deanMsg('正在读取成绩表的班级名单…');
  let classes = [];
  try{
    const f = await fetchRepoFile('data/' + file);
    if(f && f.bytes){
      const wb = XLSX.read(new Uint8Array(f.bytes), {type:'array'});
      classes = wb.SheetNames.map(s => String(s).replace(/班$/, '').trim()).filter(Boolean);
    }
  }catch(e){ console.warn(e); }
  if(!classes.length){
    deanMsg('仓库里还没有「' + campus + '」的成绩表，先上传整份成绩后再补建；也可让班主任用班级名首次登录自动建号。', 'err');
    return;
  }
  const out = Auth.ensureHomerooms(campus, classes);
  renderDeanPanel();
  deanMsg('识别到 ' + classes.length + ' 个班级，新建 ' + out.created.length + ' 个班主任账号' +
    (out.created.length ? '：' + out.created.map(x => x.u).join('、') : '') + '<br>正在同步到 GitHub…', 'ok');
  const st = await Auth.syncNow();
  renderDeanPanel();
  deanMsg('识别到 ' + classes.length + ' 个班级，新建 ' + out.created.length + ' 个班主任账号' +
    (out.created.length ? '：' + out.created.map(x => x.u).join('、') : '') +
    '<br>' + (st.status === 'ok' ? '已同步到 GitHub' : '同步失败：' + (st.error || '网络异常')), st.status === 'ok' ? 'ok' : 'err');
}

<script>
/* 管理台默认班级：在本页直接解析成绩表，生成班级名单与班级-科目映射（无需内嵌校区页） */
window.__CLASS_ROSTER__ = {};
window.__ROSTER_PENDING = {};
window.__AUTH_ENSURE_ROSTER__ = async function (campus) {
  if (!window.Roster) return;
  campus = campus || '龙泉校区';
  if (window.__CLASS_ROSTER__[campus]) return window.__CLASS_ROSTER__[campus];
  if (window.__ROSTER_PENDING[campus]) return window.__ROSTER_PENDING[campus];
  var file = null;
  Object.keys(ACCOUNTS).forEach(function (k) {
    var a = ACCOUNTS[k];
    if (a && a.role !== 'admin' && a.campus === campus && a.file) file = a.file;
  });
  var job = (async function () {
    var roster = null;
    /* 1) 优先仓库内最新成绩表 */
    if (file) {
      try { var f = await fetchRepoFile('data/' + file); if (f && f.bytes) roster = Roster.rosterFromBytes(f.bytes); } catch (e) { /* 回退内嵌 */ }
    }
    /* 2) 回退内嵌 base64 成绩表 */
    if (!roster) {
      var short = String(campus).replace(/校区$/, '');
      try {
        var resp = await fetch('../assets/data/grade-embed-' + short + '.js');
        if (resp.ok) {
          var txt = await resp.text();
          var m = txt.match(/"([A-Za-z0-9+/=\s]+)"\s*;?\s*$/m);
          if (m) roster = Roster.rosterFromB64(m[1].replace(/\s+/g, ''));
        }
      } catch (e) { /* 忽略 */ }
    }
    window.__CLASS_ROSTER__[campus] = roster || { classes: [], map: {} };
    return window.__CLASS_ROSTER__[campus];
  })();
  window.__ROSTER_PENDING[campus] = job;
  return job;
};
</script>
