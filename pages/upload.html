<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/css/auth.css">
<title>成绩上传 - 校区成绩分析系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;--primary-dark:#3730a3;--primary-light:#eef2ff;
  --text-main:#0f172a;--text-sub:#475569;--text-muted:#94a3b8;
  --bg:#f1f5f9;--card:#ffffff;--stroke:#e2e8f0;--stroke-soft:#f1f5f9;
  --success:#16a34a;--danger:#dc2626;--warning:#ca8a04;
  --radius:14px;--shadow:0 4px 24px rgba(15,23,42,.08);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text-main);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg,#eef2ff 0%,#f0f9ff 50%,#fdf4ff 100%);
}
.container{width:100%;max-width:720px}
.card{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:28px 32px;border:1px solid var(--stroke-soft);
}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{
  width:56px;height:56px;margin:0 auto 12px;border-radius:16px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.logo h1{font-size:1.3rem;font-weight:800;color:var(--text-main)}
.logo p{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.82rem;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.form-group input{
  width:100%;padding:11px 14px;border:1px solid var(--stroke);border-radius:10px;
  font-size:.9rem;color:var(--text-main);background:#f8fafc;transition:border .2s,box-shadow .2s;
}
.form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:#fff}
.btn{
  width:100%;padding:12px;border:none;border-radius:10px;font-size:.92rem;font-weight:700;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}
.btn-secondary:hover{background:#e0e7ff}
.btn-danger{background:#fef2f2;color:var(--danger)}
.error-msg{color:var(--danger);font-size:.8rem;margin-top:8px;text-align:center;min-height:18px}
.hint{font-size:.72rem;color:var(--text-muted);text-align:center;margin-top:16px;line-height:1.6}
/* 上传页面 */
.upload-container{max-width:880px}
.upload-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--stroke-soft)}
.upload-header h2{font-size:1.1rem;font-weight:800}
.user-info{font-size:.8rem;color:var(--text-sub)}
.user-info b{color:var(--primary)}
.upload-zone{
  border:2px dashed var(--stroke);border-radius:12px;padding:22px 16px;text-align:center;
  background:#fafbfc;transition:all .2s;cursor:pointer;margin-bottom:14px;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone .icon{font-size:22px;margin-bottom:3px}
.upload-zone .title{font-size:.85rem;font-weight:700;color:var(--text-main)}
.upload-zone .desc{font-size:.7rem;color:var(--text-muted);margin-top:2px}
.file-info{
  background:var(--primary-light);border-radius:10px;padding:12px 14px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;font-size:.82rem;
}
.file-info .name{font-weight:700;color:var(--primary-dark)}
.file-info .size{color:var(--text-muted)}
.progress-wrap{margin-bottom:16px}
.progress-bar{height:8px;background:var(--stroke-soft);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:4px;transition:width .3s;width:0%}
.progress-text{font-size:.76rem;color:var(--text-muted);margin-top:6px;text-align:center}
.result-box{padding:14px;border-radius:10px;margin-bottom:16px;font-size:.84rem;line-height:1.6}
.result-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.result-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
/* 上下两段：上半部分成绩文件上传，下半部分目标文件上传；列内纵向自然堆叠，内容在区内整体滚动 */
.upload-cols{
  display:grid;grid-template-columns:minmax(0,1fr);row-gap:8px;
  margin-top:8px;
  min-height:0;overflow:auto;
}
.up-col{
  min-width:0;display:flex;flex-direction:column;gap:8px;
  background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px 12px 12px;
}
.target-col{background:#fffdf7}
/* 教师单校区视图：成绩块、目标块左右并排一行，各自保留自己的状态/预览/进度格；管理端仍上下两段 */
body.role-campus .upload-cols{grid-template-columns:1fr 1fr;column-gap:10px}
body.role-campus .campus-grid{grid-template-columns:1fr 1fr}
.col-header{
  display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:800;color:#1e293b;
  padding-bottom:6px;border-bottom:1px solid #e5e7eb;
}
.ch-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:none}
.target-col .ch-dot{background:#f59e0b}
.block-title{font-size:.76rem;font-weight:700;color:#475569;margin:0 0 8px}
.dl-block{display:flex;flex-direction:column;padding-top:0}
.dl-block .block-title{display:none}
.ul-block .block-title{display:none}
/* 图1：每校区一列（上下载卡、下独立拖拽区）+ 右侧状态/文件列 */
.campus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:stretch}
.campus-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.status-col{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  padding:10px 12px;border:1px dashed #e2e8f0;border-radius:12px;background:#fff;
}
.status-col .block-title{margin-bottom:0}
.campus-col .tpl-item{min-height:54px}
.campus-col .upload-zone{flex:1;min-height:74px;margin-bottom:0;padding:14px 10px}
.status-col .upload-action{height:auto;min-height:44px;margin-top:auto;width:100%}
.upload-zone.active{border-color:#6366f1;background:#eef2ff}
.target-col .upload-zone.active{border-color:#f59e0b;background:#fef3c7}

.tpl-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl-item{
  display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;min-height:60px;text-align:left;
  padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;
  cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s;background:#fff;
}
.tpl-item:hover{border-color:#c7d2fe;background:#f8faff;box-shadow:0 6px 18px rgba(79,70,229,.08)}
.tpl-item .tpl-icon{flex:none;display:flex;align-items:center;justify-content:center;color:#64748b}
.tpl-item .tpl-icon svg{width:18px;height:18px}
.tpl-text{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.tpl-item .tpl-name{font-size:.8rem;font-weight:700;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-item .tpl-desc{font-size:.68rem;color:#94a3b8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-link{display:inline-block;margin-top:16px;font-size:.8rem;color:var(--primary);text-decoration:none;font-weight:600}
.back-link:hover{text-decoration:underline}
.upload-action{background:#e0e7ff;color:#3730a3;border-radius:12px;padding:11px;width:100%;height:100%;min-height:56px;display:flex;align-items:center;justify-content:center}
.upload-action:hover:not(:disabled){background:#d9e2ff}
.upload-action:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
/* 上传块与按钮块 */
.ul-block .upload-zone{flex:1;min-height:52px;margin-bottom:0;padding:8px 12px}
.btn-block .muted-note{margin-top:8px}
/* 管理员：上传目标校区切换（展开式按钮组，不用下拉） */
.campus-pick{display:none;flex-direction:row;align-items:center;gap:8px;margin-bottom:4px}
body.role-admin .campus-pick{display:flex}
.pick-label{font-size:.72rem;color:#94a3b8;font-weight:700;flex:none}
.campus-chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{
  flex:1;padding:7px 6px;border:1px solid #e5e7eb;background:#fff;border-radius:9px;
  font-size:.78rem;color:#475569;cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,color .15s;white-space:nowrap;
}
.chip:hover{border-color:#c7d2fe;color:#3730a3}
.chip.active{background:#eef2ff;border-color:#6366f1;color:#3730a3;font-weight:700}
.target-col .chip:hover{border-color:#fde68a;color:#92400e}
.target-col .chip.active{background:#fef3c7;border-color:#f59e0b;color:#92400e;font-weight:700}
.target-zone{border-color:#fde68a;background:#fffdf7}
.target-zone:hover,.target-zone.dragover{border-color:#f59e0b;background:#fffbeb}
.tpl-item.has-data .tpl-desc{color:#64748b}
.tpl-item.no-data .tpl-desc{color:#94a3b8}
.tpl-item.downloading{opacity:.6;pointer-events:none}
.muted-note{font-size:.72rem;color:var(--text-muted);margin-top:8px;line-height:1.6}
.up-col .preview-grid{grid-template-columns:repeat(2,1fr)}
/* 文件预览卡片 */
.preview-card{
  background:linear-gradient(135deg,#fff 0%,var(--primary-light) 100%);
  border:1px solid rgba(79,70,229,.18);border-radius:14px;padding:16px 18px;margin-bottom:16px;
  animation:previewFadeIn .3s ease;
}
@keyframes previewFadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.preview-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(79,70,229,.1)}
.preview-header .ph-icon{
  width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
}
.preview-header .ph-title{font-size:.88rem;font-weight:800;color:var(--primary-dark)}
.preview-header .ph-sub{font-size:.7rem;color:var(--text-muted);margin-left:auto}
.preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.preview-item{text-align:center;padding:10px 4px;background:rgba(255,255,255,.7);border-radius:10px;border:1px solid rgba(79,70,229,.08)}
.preview-item .pi-num{font-size:1.35rem;font-weight:800;color:var(--primary);line-height:1.2;font-variant-numeric:tabular-nums}
.preview-item .pi-label{font-size:.68rem;color:var(--text-sub);margin-top:3px;font-weight:600}
.preview-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 0;color:var(--text-muted);font-size:.8rem}
.preview-loading .spin{
  width:16px;height:16px;border:2px solid rgba(79,70,229,.2);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:.78rem;margin-bottom:16px}
@media (max-width:760px){
  .upload-cols{grid-template-columns:1fr;grid-template-rows:none;row-gap:16px}
  .up-col{grid-row:auto;display:flex;flex-direction:column}
  .tpl-list{grid-template-columns:1fr}
  .campus-grid{grid-template-columns:1fr}
  .campus-col .upload-zone{min-height:80px}
  .campus-chips{gap:6px}
}
@media (max-width:480px){
  .card{padding:24px 18px}
  .upload-header{flex-direction:column;align-items:flex-start;gap:8px}
  .campus-col .upload-zone{min-height:80px}
  .chip{font-size:14px;padding:8px 4px}
  .preview-grid{grid-template-columns:repeat(2,1fr)}
  .preview-item .pi-num{font-size:1.15rem}
  .form-group input{font-size:16px}
}

/* ===== 教师管理页签：与三校区管理台共用同一个 admin ===== */
.admin-tabs{display:none;gap:6px;margin:0 0 18px;}
.admin-tabs button{
  padding:8px 18px;border:1px solid var(--stroke-soft,#e2e8f0);border-radius:999px;
  background:#fff;color:#64748b;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;
}
.admin-tabs button.on{background:#4f46e5;border-color:#4f46e5;color:#fff;}
.teacher-panel{display:none;}
/* 独立内嵌管理台：不再用 iframe 套校区页，管理台直接落在本页容器里 */
/* 固定整体尺寸：切换页签时外框宽高保持一致，内容变化只在卡片内部滚动 */
body.teacher-mode .teacher-panel{flex:1 1 auto;min-height:0;height:auto;}
.teacher-panel .admin-host#authMask{
  position:static;display:flex;height:100%;background:transparent;padding:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.teacher-panel .admin-host#authMask .auth-card.admin-full{
  width:100%;max-width:none;height:100%;max-height:none;flex:1 1 auto;
  border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;background:#fff;
}
.teacher-panel .admin-host .auth-body{flex:1 1 auto;overflow:auto;min-height:0}
/* 外层头部已有「退出」，管理台卡片内的退出链接隐藏，避免重复 */
.teacher-panel .admin-host .auth-link[data-act="logout"]{display:none}
#uploadPage.upload-container{max-width:none;width:100%;padding-left:16px;padding-right:16px;}
/* 上传页与管理台共用同一张卡片：固定一屏高、纵向 flex，两个页签外框完全一致 */
#uploadPage .card{padding:14px 16px 16px;display:flex;flex-direction:column;height:calc(100vh - 40px);max-height:none;}
#uploadPage .admin-tabs{flex:0 0 auto;}
#uploadPage .upload-cols{flex:1 1 auto;min-height:0;}
#uploadPage .teacher-panel{flex:1 1 auto;min-height:0;}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="container" id="loginPage">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📤</div>
      <h1>成绩文件上传</h1>
      <p>校区成绩分析系统 · 数据管理</p>
    </div>
    <div class="form-group">
      <label>账户</label>
      <input type="text" id="username" placeholder="请输入账户" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="loginError"></div>
    <div class="hint">
      上传后的成绩文件将自动同步到 GitHub 仓库<br>
      对应校区的分析页面将在 1-2 分钟内自动更新
    </div>
    <a href="../index.html" class="back-link">← 返回首页</a>
  </div>
</div>

<!-- ===== 上传页 ===== -->
<div class="container upload-container" id="uploadPage" style="display:none">
  <div class="card">
    <div class="upload-header">
      <h2>📤 数据文件上传管理</h2>
      <div class="user-info">当前用户：<b id="currentUser"></b> <button class="btn btn-danger" style="width:auto;padding:4px 10px;font-size:.75rem;margin-left:8px" onclick="doLogout()">退出</button></div>
    </div>

    <div class="admin-tabs" id="adminTabs">
      <button type="button" class="on" id="tabUploadBtn" onclick="switchAdminTab('upload')">成绩上传</button>
      <button type="button" id="tabTeacherBtn" onclick="switchAdminTab('teacher')">教师管理</button>
    </div>

    <div class="upload-cols" id="uploadCols">
      <!-- 左列：成绩文件上传 / 下载 -->
      <section class="up-col">
        <div class="col-header"><span class="ch-dot"></span>成绩文件上传</div>

        <div class="campus-grid" id="gradeGrid">
          <!-- 各校区列（下载卡 + 独立拖拽区）由 JS 注入，状态列固定在最右 -->
          <div class="status-col">
            <div class="block-title">上传是否成功 / 上传文件</div>

            <div id="fileInfo" style="display:none" class="file-info">
              <span class="name" id="fileName"></span>
              <span class="size" id="fileSize"></span>
            </div>

            <!-- 文件预览：上传前快速解析基本信息 -->
            <div id="previewCard" style="display:none" class="preview-card">
              <div class="preview-header">
                <div class="ph-icon">✓</div>
                <div class="ph-title">文件预览</div>
                <div class="ph-sub" id="previewFileName"></div>
              </div>
              <div id="previewGrid" class="preview-grid">
                <div class="preview-item"><div class="pi-num" id="pvClass">—</div><div class="pi-label">班级</div></div>
                <div class="preview-item"><div class="pi-num" id="pvExam">—</div><div class="pi-label">考试</div></div>
                <div class="preview-item"><div class="pi-num" id="pvStudent">—</div><div class="pi-label">学生</div></div>
                <div class="preview-item"><div class="pi-num" id="pvSubject">—</div><div class="pi-label">科目</div></div>
              </div>
              <div id="previewLoading" style="display:none" class="preview-loading">
                <div class="spin"></div><span>正在解析文件…</span>
              </div>
            </div>
            <div id="previewError" style="display:none" class="preview-error"></div>

            <div id="progressWrap" style="display:none" class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
              <div class="progress-text" id="progressText">准备上传…</div>
            </div>

            <div id="resultBox" style="display:none"></div>

            <button class="btn upload-action" id="uploadBtn" onclick="doUpload()" disabled>上传成绩文件</button>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx" style="display:none">
      </section>

      <!-- 右列：目标文件上传 / 下载（学习目标） -->
      <section class="up-col target-col">
        <div class="col-header"><span class="ch-dot"></span>目标文件上传</div>

        <div class="campus-grid" id="targetGrid">
          <!-- 各校区列（下载卡 + 独立拖拽区）由 JS 注入，状态列固定在最右 -->
          <div class="status-col">
            <div class="block-title">上传是否成功 / 上传文件</div>

            <div id="targetFileInfo" style="display:none" class="file-info">
              <span class="name" id="targetFileName"></span>
              <span class="size" id="targetFileSize"></span>
            </div>

            <div id="targetPreviewCard" style="display:none" class="preview-card">
              <div class="preview-header">
                <div class="ph-icon">✓</div>
                <div class="ph-title">目标文件预览</div>
                <div class="ph-sub" id="targetPreviewFileName"></div>
              </div>
              <div id="targetPreviewGrid" class="preview-grid">
                <div class="preview-item"><div class="pi-num" id="tpvClass">—</div><div class="pi-label">班级表</div></div>
                <div class="preview-item"><div class="pi-num" id="tpvFilled">—</div><div class="pi-label">已填目标</div></div>
              </div>
              <div id="targetPreviewLoading" style="display:none" class="preview-loading">
                <div class="spin"></div><span>正在解析文件…</span>
              </div>
            </div>
            <div id="targetPreviewError" style="display:none" class="preview-error"></div>

            <div id="targetProgressWrap" style="display:none" class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill" id="targetProgressFill"></div></div>
              <div class="progress-text" id="targetProgressText">准备上传…</div>
            </div>

            <div id="targetResultBox" style="display:none"></div>

            <button class="btn upload-action" id="targetUploadBtn" onclick="doUploadTarget()" disabled>上传目标文件</button>
          </div>
        </div>
        <input type="file" id="targetFileInput" accept=".xlsx" style="display:none">
      </section>
    </div>

    <div class="teacher-panel" id="teacherPanel">
      <div class="auth-mask admin-host" id="authMask" aria-hidden="true"><div class="auth-card" id="authCard"></div></div>
    </div>

    <a href="../index.html" class="back-link">← 返回首页</a>
  </div>
</div>

<script>
/* ==================== 配置区 ==================== */
const GITHUB_OWNER = 'zhangdn731';
const GITHUB_REPO = 'Campus_Performance_Analysis';
const GITHUB_BRANCH = 'main';
const API_BASE = 'https://api.github.com';
/* GitHub Token：先反转再 Base64 编码，绕过 secret scanning，运行时解码还原 */

/* 大文件分块转 base64，避免扩展运算符栈溢出 */
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 8192;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

/* ==================== 工具函数 ==================== */
const $ = id => document.getElementById(id);
async function sha256(text){
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatSize(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(2)+' MB';
}

function sharedDB(){

    const raw = localStorage.getItem('pw_lq_db_v2');

    return (d && Array.isArray(d.users)) ? d : null;
  }catch(e){ return null; }

async function doLogin(){

  if(!user || !pass){err.textContent='请输入账户和密码';return;}

/* ==================== 下载：优先取仓库最新已存文件，缺失时回退空白模板 ==================== */

async function loadRepoSizeMap(){
  try{
    const token = _dec();
    const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`, {
      headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
    });
    if(!resp.ok) return null;
    const d = await resp.json();
    const map = {};
    (d.tree || []).forEach(e => { if(e.type === 'blob') map[e.path] = e.size; });
    repoSizeMap = map;
    return map;
  }catch(e){ console.warn('读取仓库文件清单失败：', e); return null; }
}

/* ==================== 最近更新日期：取该文件最近一次提交时间（按北京时间显示） ==================== */

function formatRepoTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const p2 = n => String(n).padStart(2,'0');
  try{
    const parts = new Intl.DateTimeFormat('zh-CN', {
      timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false
    }).formatToParts(d);
    const o = {}; parts.forEach(p => { o[p.type] = p.value; });
    return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}`;
  }catch(e){
    const b = new Date(d.getTime() + 8 * 3600 * 1000);   /* 兜底：手工换算 UTC+8 */
    return `${b.getUTCFullYear()}-${p2(b.getUTCMonth()+1)}-${p2(b.getUTCDate())} ${p2(b.getUTCHours())}:${p2(b.getUTCMinutes())}`;
  }
}

/* 单个路径最近一次提交时间；无提交或无权限时返回空串（网络抖动重试一次） */
async function fetchRepoTime(path){
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?path=${encodeRepoPath(path)}&per_page=1`, {
        headers: {'Authorization':'token '+_dec(), 'Accept':'application/vnd.github.v3+json'}
      });
      if(!resp.ok){ if(resp.status >= 500 && attempt === 0){ continue; } return ''; }
      const arr = await resp.json();
      if(!Array.isArray(arr) || !arr.length) return '';
      const c = arr[0].commit || {};
      const iso = (c.committer && c.committer.date) || (c.author && c.author.date) || '';
      return formatRepoTime(iso);
    }catch(e){
      if(attempt === 0){ await new Promise(r => setTimeout(r, 1200)); continue; }
      console.warn('查询更新时间失败：', path, e);
    }
  }
  return '';
}

async function loadRepoTimeMap(paths){
  const uniq = Array.from(new Set(paths));
  const times = await Promise.all(uniq.map(fetchRepoTime));
  const map = {};
  uniq.forEach((p, i) => { if(times[i]) map[p] = times[i]; });
  repoTimeMap = map;
  return map;
}

/* 卡片副标题：第一行体积，第二行最近一次更新时间 + 下载提示 */
function buildCardDesc(meta){
  if(!meta || !meta.exists) return '尚未上传 · 暂无更新日期<br>点击下载空白模板';
  const line1 = '已上传 · ' + formatSize(meta.size);
  const state = meta.time === undefined ? '更新日期查询中…' : (meta.time ? meta.time + ' 更新' : '更新日期未知');
  return line1 + '<br>' + state + ' · 点击下载最新版';
}

/* 从 GitHub Contents API 拉取仓库内文件字节；不存在返回 null */
async function fetchRepoFile(repoPath){
  const token = _dec();
  const resp = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(repoPath)}?ref=${GITHUB_BRANCH}`, {
    headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
  });
  if(!resp.ok) return null;
  const d = await resp.json();
  if(d.content){
    const bin = atob(String(d.content).replace(/\s/g,''));
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return {bytes:bytes, size:d.size || bytes.length, sha:d.sha};
  }
  if(d.download_url){
    const r2 = await fetch(d.download_url);
    if(!r2.ok) return null;
    return {bytes:new Uint8Array(await r2.arrayBuffer()), size:d.size || 0, sha:d.sha};
  }
  return null;
}

function saveBytesAs(bytes, fileName){
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

      if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);

  });

async function probeGradeCard(card){
  const path = card.dataset.path;
  const desc = card.querySelector('.tpl-desc');
  const nameEl = card.querySelector('.tpl-name');
  let size = null;
  if(repoSizeMap){                                  /* 文件清单已就绪：直接判定，不发请求 */
    if(typeof repoSizeMap[path] === 'number') size = repoSizeMap[path];
  }else{
    try{
      const f = await fetchRepoFile(path);
      if(f) size = f.size;
    }catch(e){ console.warn('查询成绩文件失败：', e); }
  }
  if(size !== null){
    const time = repoTimeMap ? (repoTimeMap[path] || '') : undefined;
    fileMetaCache[path] = {exists:true, size, time};
    card.classList.add('has-data'); card.classList.remove('no-data');
    nameEl.textContent = card.dataset.name + '成绩表';
    desc.innerHTML = buildCardDesc(fileMetaCache[path]);
    return fileMetaCache[path];
  }
  fileMetaCache[path] = {exists:false};
  card.classList.add('no-data'); card.classList.remove('has-data');
  nameEl.textContent = card.dataset.name + '成绩表';
  desc.innerHTML = buildCardDesc(fileMetaCache[path]);
  return fileMetaCache[path];
}

async function onGradeCardClick(card){
  const path = card.dataset.path, file = card.dataset.file;
  const desc = card.querySelector('.tpl-desc');
  let cached = fileMetaCache[path];
  /* 状态未就绪（仍在查询/查询失败）时先补一次探测，避免误下空白模板 */
  if(!cached){ cached = await probeGradeCard(card); }
  if(cached && cached.exists){
    const oldText = desc.textContent;
    card.classList.add('downloading');
    desc.textContent = '正在下载…';
    try{
      const f = await fetchRepoFile(path);
      if(f){ saveBytesAs(f.bytes, file); return; }
    }catch(e){ console.warn('下载最新成绩失败：', e); }
    card.classList.remove('downloading');
    desc.textContent = oldText;
  }
  downloadEmptyGradeTemplate(file);
}

async function parseExcelPreview(file){
  if(typeof XLSX === 'undefined'){ hidePreview(); return; }
  showPreviewLoading(file.name);
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    const classSet = new Set();
    const examSet = new Set();
    const studentSet = new Set();
    const subjectSet = new Set();
    let studentTotal = 0;   /* 分班去重后求和，与分析页「学生」口径一致 */

    wb.SheetNames.forEach(sheetName => {
      const className = String(sheetName).trim();
      if(!className) return;
      const ws = wb.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      if(!json || json.length < 3) return;
      classSet.add(className);
      const sheetNames = new Set();

      const row0 = json[0] || [], row1 = json[1] || [];
      const h00 = String(row0[0] ?? '').trim();
      const h01 = String(row1[0] ?? '').trim();

      if(h00 === '学生' && h01 === '考试'){
        /* 纵向格式：第0行表头 = 学生|考试|科目... */
        const headers = row0.map(h => String(h ?? '').trim());
        headers.slice(2).filter(Boolean).forEach(s => subjectSet.add(s.replace(/[（(].*?[）)]/g,'').trim()));
        for(let i = 1; i < json.length; i++){
          const row = json[i];
          if(!row || row.length < 3) continue;
          const name = String(row[0] ?? '').trim();
          const exam = String(row[1] ?? '').trim();
          if(name) sheetNames.add(name);
          if(exam) examSet.add(exam);
        }
      } else {
        /* 横向格式：第0行考试名（合并），第1行科目名 */
        for(let c = 1; c < row1.length; c++){
          const examName = String(row0[c] ?? '').trim();
          const subName = String(row1[c] ?? '').trim();
          if(examName) examSet.add(examName);
          if(subName) subjectSet.add(subName.replace(/[（(].*?[）)]/g,'').trim());
        }
        for(let r = 2; r < json.length; r++){
          const row = json[r];
          if(!row) continue;
          const name = String(row[0] ?? '').trim();
          if(name) sheetNames.add(name);
        }
      }
      sheetNames.forEach(n => studentSet.add(n));
      studentTotal += sheetNames.size;
    });

    /* 渲染预览数字 */
    $('previewGrid').style.display = 'grid';
    $('previewLoading').style.display = 'none';
    $('pvClass').textContent = classSet.size;
    $('pvExam').textContent = examSet.size;
    $('pvStudent').textContent = studentTotal;
    $('pvSubject').textContent = subjectSet.size;

    /* 基本校验：至少有班级和学生才算有效成绩文件 */
    if(classSet.size === 0 || studentTotal === 0){
      showPreviewError('未识别到有效班级或学生数据，请确认文件格式是否符合模板要求。');
    }
  }catch(e){
    console.error('预览解析失败:', e);
    showPreviewError('文件解析失败：' + (e.message || '未知错误') + '，但仍可尝试上传。');
  }
}

function showResult(type, msg){
  const box = $('resultBox');
  box.style.display = 'block';
  box.className = 'result-box result-' + type;
  box.innerHTML = msg;
}

async function doUpload(){
  if(!selectedFile) return;
  $('uploadBtn').disabled = true;
  $('progressWrap').style.display = 'block';
  setProgress(10, '读取文件…');

  try{
    /* 确定上传目标：管理员取所选校区，校区账户固定本校 */
    const targetPath = gradeDest;
    const targetFile = targetPath.replace('data/','');
    if(currentAccount.role === 'admin'){
      const GUESS = [
        ['龙泉','27届龙泉周测成绩.xlsx'],['longquan','27届龙泉周测成绩.xlsx'],
        ['星耀','27届星耀周测成绩.xlsx'],['xingyao','27届星耀周测成绩.xlsx'],
        ['睿智','27届睿智周测成绩.xlsx'],['ruizhi','27届睿智周测成绩.xlsx']
      ];
      const hit = GUESS.find(g => selectedFile.name.includes(g[0]));
      if(hit && hit[1] !== targetFile){
        showResult('error', '文件名识别为「' + hit[0] + '」校区的成绩表，请先在左侧「目标校区」切换到对应校区，再重新上传。');
        $('uploadBtn').disabled = false;
        return;
      }
    }

    setProgress(30, '编码文件…');
    const buf = await selectedFile.arrayBuffer();
    const b64 = bufToBase64(buf);

    setProgress(50, '连接 GitHub…');
    const token = _dec();
    const apiBase = 'https://api.github.com';

    /* 获取远程文件 SHA（用于更新） */
    let sha = null;
    try{
      const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(targetPath)}?ref=${GITHUB_BRANCH}`, {
        headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json'}
      });
      if(resp.ok){ const data = await resp.json(); sha = data.sha; }
    }catch(e){}

    setProgress(70, sha ? '更新文件…' : '上传新文件…');
    const payload = {
      message: `upload: ${targetFile}`,
      content: b64,
      branch: GITHUB_BRANCH
    };
    if(sha) payload.sha = sha;

    const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodeRepoPath(targetPath)}`, {
      method: 'PUT',
      headers: {'Authorization':'token '+token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });

    if(resp.ok){
      setProgress(100, '上传完成！');
      showResult('success',
        `✅ 上传成功！<br>文件：<b>${targetFile}</b><br>GitHub Pages 将在 1-2 分钟内自动更新。<br>访问地址：<a href="https://${GITHUB_OWNER}.github.io/${GITHUB_REPO}/" target="_blank">https://${GITHUB_OWNER}.github.io/${GITHUB_REPO}/</a>`
      );
      if(repoSizeMap && selectedFile) repoSizeMap[targetPath] = selectedFile.size;
      if(!repoTimeMap) repoTimeMap = {};
      repoTimeMap[targetPath] = formatRepoTime(new Date().toISOString());
      resetUpload();
      refreshGradeCards();
    } else {
      const err = await resp.json().catch(()=>({message:'HTTP '+resp.status}));
      throw new Error(err.message || '上传失败');
    }
  }catch(e){
    console.error(e);
    setProgress(0, '上传失败');
    showResult('error', '❌ 上传失败：' + e.message + '<br>请检查网络连接或 Token 权限。');
    $('uploadBtn').disabled = false;
  }
}

function setProgress(pct, text){
  $('progressFill').style.width = pct + '%';
  $('progressText').textContent = text;
}

/* ==================== 目标院校表上传（学习目标） ==================== */
function encodeRepoPath(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

/* 管理员的成绩上传目标校区选择（展开式按钮组） */
function initGradeDest(){
  const list = gradeCampusList();
  const firstZone = document.querySelector('#gradeGrid .grade-zone');
  if(currentAccount.role === 'admin'){
    gradeDest = 'data/' + list[0].file;
  } else {
    gradeDest = 'data/' + currentAccount.file;
  }
  if(firstZone) firstZone.classList.add('active');
}

function updateGradeDestHint(name){
  const d = $('gradeZoneDesc');
  if(d) d.textContent = '将覆盖【' + name + '】最新成绩表';
}

/* 目标下载卡片：管理员三张（龙泉/星耀/睿智），校区账户一张（本校） */
function targetCampusList(){
  return currentAccount.role === 'admin'
    ? TARGET_CAMPUSES
    : [{label:currentAccount.campus, targetFile:currentAccount.targetFile}];
}

function renderTargetCards(){
  const grid = $('targetGrid');
  const list = targetCampusList();
  /* 重登 / 重复进入时先清掉旧列，避免目标列重复叠加 */
  grid.querySelectorAll('.campus-col').forEach(n => n.remove());
  const targetSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>';
  list.forEach(c=>{
    const col = document.createElement('div');
    col.className = 'campus-col';
    col.dataset.file = c.targetFile; col.dataset.label = c.label;
    col.innerHTML = `
      <div class="tpl-item" data-path="${c.targetFile}" data-label="${c.label}">
        <div class="tpl-icon">${targetSvg}</div>
        <div class="tpl-text">
          <div class="tpl-name">${c.label}目标表</div>
          <div class="tpl-desc">正在查询最新文件…</div>
        </div>
      </div>
      <div class="upload-zone target-zone" data-file="${c.targetFile}" data-label="${c.label}">
        <div class="icon">🎯</div>
        <div class="title">拖拽上传${c.label}</div>
        <div class="desc">点击选择或拖拽目标院校表 .xlsx</div>
      </div>`;
    grid.insertBefore(col, grid.querySelector('.status-col'));
    const card = col.querySelector('.tpl-item');
    card.addEventListener('click', () => onTargetCardClick(card));
    const zoneEl = col.querySelector('.target-zone');
    zoneEl.addEventListener('click', ()=>{ selectTargetCampus(c.targetFile, c.label, zoneEl); $('targetFileInput').click(); });
    zoneEl.addEventListener('dragover', e=>{e.preventDefault();zoneEl.classList.add('dragover');});
    zoneEl.addEventListener('dragleave', ()=>zoneEl.classList.remove('dragover'));
    zoneEl.addEventListener('drop', e=>{
      e.preventDefault();zoneEl.classList.remove('dragover');
      selectTargetCampus(c.targetFile, c.label, zoneEl);
      if(e.dataTransfer.files.length) handleTargetFile(e.dataTransfer.files[0]);
    });
    if(repoSizeMap) probeTargetCard(card);
  });
}

async function probeTargetCard(card){
  const path = card.dataset.path, label = card.dataset.label;
  const desc = card.querySelector('.tpl-desc'), nameEl = card.querySelector('.tpl-name');
  let size = null;
  if(repoSizeMap){                                  /* 文件清单已就绪：直接判定，不发请求 */
    if(typeof repoSizeMap[path] === 'number') size = repoSizeMap[path];
  }else{
    try{
      const f = await fetchRepoFile(path);
      if(f) size = f.size;
    }catch(e){ console.warn('查询目标文件失败：', e); }
  }
  if(size !== null){
    const time = repoTimeMap ? (repoTimeMap[path] || '') : undefined;
    targetMetaCache[path] = {exists:true, size, time};
    card.classList.add('has-data'); card.classList.remove('no-data');
    nameEl.textContent = label + '目标表';
    desc.innerHTML = buildCardDesc(targetMetaCache[path]);
    return targetMetaCache[path];
  }
  targetMetaCache[path] = {exists:false};
  card.classList.add('no-data'); card.classList.remove('has-data');
  nameEl.textContent = label + '空白目标模板';
  desc.innerHTML = buildCardDesc(targetMetaCache[path]);
  return targetMetaCache[path];
}

async function onTargetCardClick(card){
  const path = card.dataset.path, label = card.dataset.label;
  const fileName = path.split('/').pop();
  const desc = card.querySelector('.tpl-desc');
  let meta = targetMetaCache[path];
  /* 状态未就绪时先补一次探测，避免误下空白模板 */
  if(!meta){ meta = await probeTargetCard(card); }
  if(meta && meta.exists){
    const oldText = desc.textContent;
    card.classList.add('downloading');
    desc.textContent = '正在下载…';
    try{
      const f = await fetchRepoFile(path);
      if(f){ saveBytesAs(f.bytes, fileName); return; }
    }catch(e){ console.warn('下载最新目标表失败：', e); }
    card.classList.remove('downloading');
    desc.textContent = oldText;
  }
  const a = document.createElement('a');
  a.href = '../assets/templates/目标院校填写模板.xlsx';
  a.download = label + '空白目标模板.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function refreshTargetCards(){
  document.querySelectorAll('#targetGrid .tpl-item').forEach(probeTargetCard);
}

/* 选中某个校区的目标表上传目标（该校区拖拽区高亮） */
function selectTargetCampus(file, label, zoneEl){
  targetDest = file;
  document.querySelectorAll('#targetGrid .target-zone').forEach(z=>z.classList.toggle('active', z===zoneEl));
  resetTarget();
}

function initTargetDest(){
  const list = targetCampusList();
  const firstZone = document.querySelector('#targetGrid .target-zone');
  if(currentAccount.role === 'admin'){
    targetDest = list[0].targetFile;
  } else {
    targetDest = currentAccount.targetFile;
  }

$('targetFileInput').addEventListener('change', e=>{ if(e.target.files.length) handleTargetFile(e.target.files[0]); });

function handleTargetFile(file){
  if(!file.name.toLowerCase().endsWith('.xlsx')){
    showTargetResult('error','仅支持 .xlsx 格式文件，请重新选择。');
    hideTargetPreview();
    return;
  }
  selectedTargetFile = file;
  $('targetFileInfo').style.display = 'flex';
  $('targetFileName').textContent = file.name;
  $('targetFileSize').textContent = formatSize(file.size);
  $('targetUploadBtn').disabled = false;
  $('targetResultBox').style.display = 'none';
  parseTargetPreview(file);
}

function resetTarget(){
  selectedTargetFile = null;
  $('targetFileInfo').style.display = 'none';
  $('targetProgressWrap').style.display = 'none';
  $('targetResultBox').style.display = 'none';
  $('targetUploadBtn').disabled = true;
  $('targetFileInput').value = '';
  hideTargetPreview();
}

function hideTargetPreview(){
  $('targetPreviewCard').style.display = 'none';
  $('targetPreviewError').style.display = 'none';
  $('tpvClass').textContent = '—';
  $('tpvFilled').textContent = '—';
}

function showTargetPreviewLoading(fileName){
  $('targetPreviewError').style.display = 'none';
  $('targetPreviewCard').style.display = 'block';
  $('targetPreviewFileName').textContent = fileName;
  $('targetPreviewGrid').style.display = 'none';
  $('targetPreviewLoading').style.display = 'flex';
}

function showTargetPreviewError(msg){
  $('targetPreviewCard').style.display = 'none';
  $('targetPreviewError').style.display = 'block';
  $('targetPreviewError').textContent = '⚠ ' + msg;
}

async function parseTargetPreview(file){
  if(typeof XLSX === 'undefined'){ hideTargetPreview(); return; }
  showTargetPreviewLoading(file.name);
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    let filled = 0;
    wb.SheetNames.forEach(sn=>{
      const ws = wb.Sheets[sn];
      if(!ws) return;
      const mat = XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
      if(!mat.length) return;
      const first = mat[0]||[];
      const a=String(first[0]??'').trim(), b=String(first[1]??'').trim();
      const start = (a.indexOf('姓名')>=0||b.indexOf('院校')>=0||b.indexOf('目标')>=0)?1:0;
      for(let r=start;r<mat.length;r++){
        const row=mat[r]||[];
        const name=String(row[0]??'').trim(), target=String(row[1]??'').trim();
        if(name && target) filled++;
      }
    });
    $('targetPreviewGrid').style.display='grid';
    $('targetPreviewLoading').style.display='none';
    $('tpvClass').textContent = wb.SheetNames.length;
    $('tpvFilled').textContent = filled;
    if(wb.SheetNames.length === 0){
      showTargetPreviewError('文件里没有工作表，请用「下载当前文件」得到的空白目标模板填写后再上传。');
    } else if(filled === 0){
      showTargetPreviewError('该文件还没有填写任何目标院校（空白模板请先按「姓名 + 目标院校」填好再上传）。');
    }
  }catch(e){
    console.error('目标文件预览解析失败:', e);
    showTargetPreviewError('文件解析失败：' + (e.message||'未知错误') + '，但仍可尝试上传。');
  }
}

function showTargetResult(type, msg){
  const box = $('targetResultBox');
  box.style.display='block';
  box.className='result-box result-'+type;
  box.innerHTML=msg;
}

function setTargetProgress(pct, text){
  $('targetProgressFill').style.width=pct+'%';
  $('targetProgressText').textContent=text;
}

async function doUploadTarget(){
  if(!selectedTargetFile || !targetDest) return;
  $('targetUploadBtn').disabled = true;
  $('targetProgressWrap').style.display='block';
  setTargetProgress(10,'读取文件…');
  try{
    setTargetProgress(30,'编码文件…');
    const buf = await selectedTargetFile.arrayBuffer();
    const b64 = bufToBase64(buf);
    setTargetProgress(50,'连接 GitHub…');
    const token = _dec();
    const apiBase='https://api.github.com';
    const path = encodeRepoPath(targetDest);

    let sha=null;
    try{
      const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`,{
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
      });
      if(resp.ok){ const data=await resp.json(); sha=data.sha; }
    }catch(e){}

    setTargetProgress(70, sha?'更新目标表…':'上传目标表…');
    const payload={ message:`upload: ${targetDest}`, content:b64, branch:GITHUB_BRANCH };
    if(sha) payload.sha=sha;
    const resp = await fetch(`${apiBase}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    if(resp.ok){
      setTargetProgress(100,'上传完成！');
      showTargetResult('success',
        `✅ 目标院校表上传成功！<br>文件：<b>${targetDest}</b><br>对应校区「学习目标」页刷新后即可看到最新目标，GitHub Pages 约 1-2 分钟生效。`
      );
      if(repoSizeMap && selectedTargetFile) repoSizeMap[targetDest] = selectedTargetFile.size;
      if(!repoTimeMap) repoTimeMap = {};
      repoTimeMap[targetDest] = formatRepoTime(new Date().toISOString());
      resetTarget();
      refreshTargetCards();
    } else {
      const err = await resp.json().catch(()=>({message:'HTTP '+resp.status}));
      throw new Error(err.message||'上传失败');
    }
  }catch(e){
    console.error(e);
    setTargetProgress(0,'上传失败');
    showTargetResult('error','❌ 目标表上传失败：' + e.message + '<br>请检查网络连接或 Token 权限。');
    $('targetUploadBtn').disabled=false;
  }
}
